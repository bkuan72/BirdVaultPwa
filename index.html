            </Accordion>

            <Accordion 
              title="AI Identification & Species Traits" 
              icon="sparkles" 
              defaultOpen={true}
              badge={
                aiResult && !aiResult.error ? (

            >
              <div className="space-y-3">

                {aiResult && aiResult.heatmapPoints && (
                  <div className="flex items-center justify-between pt-1">
                    <span className="text-[11px] font-medium text-slate-400">Heatmap Overlay:</span>
                    <button
                      type="button"
                      onClick={() => setShowHeatmapOverlay(!showHeatmapOverlay)}
                      className={`text-[10px] px-3 py-1.5 rounded-lg font-semibold transition touch-manipulation ${showHeatmapOverlay ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}

                    </button>

                {aiResult && !aiResult.error ? (

                    <div>
                      <h4 className="text-sm font-extrabold text-white">{aiResult.speciesName}</h4>

                    {aiResult.conservationStatus && (

    }

    function LiferVaultView({ vaultEntries, photos = [], onDeleteSighting, onDeleteSpecies, onSelectPhoto, onUpdateSpeciesNotes }) {
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [expandedSpecies, setExpandedSpecies] = useState(null);
      const [isExportingOpfs, setIsExportingOpfs] = useState(false);
      const [vaultImageUrls, setVaultImageUrls] = useState({});

      useEffect(() => {
        let isMounted = true;
        async function hydrateMissingImages() {
          for (const entry of vaultEntries) {
            for (const s of (entry.sightings || [])) {
              const opfsName = s.opfsFileName || s.photo?.opfsFileName || (s.photo ? `${s.photo.name}` : null);
              const key = `${entry.category}_${entry.speciesName}_${s.id}`;
              
              if (opfsName && !vaultImageUrls[key] && !s.photo?.thumbnailUrl) {
                const blob = await getOpfsSightingFileBlob(entry.category, entry.speciesName, opfsName);
                if (blob && isMounted) {
                  const freshUrl = URL.createObjectURL(blob);
                  setVaultImageUrls(prev => ({ ...prev, [key]: freshUrl }));
                }
              }
            }
          }
        }
        hydrateMissingImages();
        return () => { isMounted = false; };
      }, [vaultEntries]);

      const workspacePhotosMap = useMemo(() => {
        const map = new Map();
        (photos || []).forEach(p => {
          if (p.fingerprintId) map.set(p.fingerprintId, p);
          if (p.id) map.set(p.id, p);
        });
        return map;
      }, [photos]);

      const categories = useMemo(() => {
        const cats = new Set(vaultEntries.map(e => e.category || 'Other'));
        return ['All', ...Array.from(cats)];
      }, [vaultEntries]);

      const filteredEntries = useMemo(() => {
        return vaultEntries.filter(entry => {
          const matchesCat = selectedCategory === 'All' || entry.category === selectedCategory;
          const matchesSearch = entry.speciesName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                entry.scientificName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                (entry.description && entry.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                (entry.habitat && entry.habitat.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCat && matchesSearch;
        });
      }, [vaultEntries, selectedCategory, searchQuery]);

      const handleExportVaultZip = async () => {
        setIsExportingOpfs(true);
        try {
          const zipFile = await exportOpfsVaultToZip();
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [zipFile] })) {
            await navigator.share({
              title: 'BirdVault Lifer Catalog Backup',
              text: 'Complete species catalog and photos.',
              files: [zipFile]
            });
          } else {
            const downloadUrl = URL.createObjectURL(zipFile);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = zipFile.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
          }
        } catch (err) {
          alert('Vault directory export failed: ' + (err.message || 'OPFS unavailable'));
        } finally {
          setIsExportingOpfs(false);
        }
      };

      return (
        <div className="flex-1 flex flex-col overflow-hidden min-h-0 p-3 sm:p-4 md:p-6 gap-3 sm:gap-4 pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-4">
          <div className="flex-shrink-0 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-3 bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-2xl shadow-xl">
              <div>
                <h2 className="text-base sm:text-xl font-extrabold text-white flex items-center space-x-2">
                  <Icon name="feather" className="w-5 h-5 sm:w-6 sm:h-6 text-emerald-400" />
                  <span>Lifer Species List Vault</span>
                </h2>
                <p className="hidden sm:block text-[11px] sm:text-xs text-slate-400">Master life-list species catalog displaying taxonomic records, species traits, and sighting timelines</p>
              </div>

              <div className="flex items-center space-x-2 w-full sm:w-auto">
                <div className="relative flex-1 sm:w-64">
                  <Icon name="search" className="w-3.5 h-3.5 sm:w-4 sm:h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                  <input
                    type="text"
                    placeholder="Search species, scientific name, or traits..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-slate-950 border border-slate-800 rounded-xl pl-8 sm:pl-9 pr-3 sm:pr-4 py-1.5 sm:py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full"
                  />
                </div>

                <button
                  onClick={handleExportVaultZip}
                  disabled={isExportingOpfs || vaultEntries.length === 0}
                  className="px-3 sm:px-3.5 py-1.5 sm:py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold text-xs rounded-xl shadow-lg transition flex items-center space-x-1.5 flex-shrink-0 touch-manipulation"
                >
                  <Icon name="download" className={`w-3.5 h-3.5 sm:w-4 sm:h-4 ${isExportingOpfs ? 'animate-bounce' : ''}`} />
                  <span className="hidden sm:inline">{isExportingOpfs ? 'Packaging...' : 'Export Vault (.zip)'}</span>
                  <span className="sm:hidden">{isExportingOpfs ? '...' : 'Export'}</span>
                </button>
              </div>
            </div>

            <div className="flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3.5 sm:px-4 py-1 sm:py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition flex-shrink-0 touch-manipulation ${selectedCategory === cat ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'}`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          <div className="flex-1 overflow-y-auto min-h-0 pr-1 pb-4">
            {filteredEntries.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                {filteredEntries.map(entry => {
                  const primarySighting = entry.sightings[0] || {};
                  const savedPhoto = primarySighting.photo || {};
                  const fpId = primarySighting.photoFingerprintId || savedPhoto.fingerprintId || savedPhoto.id;

                  const livePhoto = workspacePhotosMap.get(fpId);
                  const sightingKey = `${entry.category}_${entry.speciesName}_${primarySighting.id}`;
                  const hydratedUrl = vaultImageUrls[sightingKey];

                  const photoObj = livePhoto || (hydratedUrl ? { ...savedPhoto, thumbnailUrl: hydratedUrl, blobUrl: hydratedUrl, url: hydratedUrl } : savedPhoto);

                  let activeSrc = null;
                  if (livePhoto && (livePhoto.thumbnailUrl || livePhoto.blobUrl || livePhoto.url)) {
                    activeSrc = livePhoto.thumbnailUrl || livePhoto.blobUrl || livePhoto.url;
                  } else if (hydratedUrl) {
                    activeSrc = hydratedUrl;
                  } else if (savedPhoto && (savedPhoto.thumbnailUrl || savedPhoto.blobUrl || savedPhoto.url)) {
                    activeSrc = savedPhoto.thumbnailUrl || savedPhoto.blobUrl || savedPhoto.url;
                  }

                  const hasActiveFile = !!(photoObj && (photoObj.file || activeSrc));
                  const isExpanded = expandedSpecies === entry.speciesName;

                  return (
                    <div key={entry.speciesName} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-slate-700 transition flex flex-col justify-between">
                      <div>
                        <div 
                          className="h-44 sm:h-52 relative bg-slate-950 overflow-hidden cursor-pointer flex items-center justify-center p-1 touch-manipulation" 
                          onClick={() => hasActiveFile && onSelectPhoto(photoObj)}
                        >
                          {activeSrc ? (
                            <CroppedImage
                              src={activeSrc}
                              alt={entry.speciesName}
                              cropBox={photoObj.cropBox}
                              photo={photoObj}
                              fitMode="contain"
                              className="w-full h-full"
                              imgClassName="transition-transform duration-500 hover:scale-105"
                            />
                          ) : (
                            <div className="flex flex-col items-center justify-center p-4 text-center space-y-2 h-full w-full bg-slate-950">
                              <Icon name="image" className="w-8 h-8 text-slate-600" />
                              <span className="text-[10px] text-emerald-400 font-semibold bg-emerald-950/80 px-2 py-1 rounded border border-emerald-500/30">
                                Species Record

                          <div className="space-y-2 text-xs bg-slate-950/80 border border-slate-800 p-3 rounded-xl">
                            <div className="flex items-center justify-between text-[11px] border-b border-slate-800/80 pb-1.5">
                              <span className="text-slate-400 font-semibold flex items-center space-x-1">

                          <div className="space-y-1.5 border-t border-slate-800 pt-3">

                            <div className="space-y-1.5 max-h-40 overflow-y-auto">
                              {entry.sightings.map(s => {
                                const sPhoto = s.photo || {};
                                const cameraExif = sPhoto.cameraExif;
                                return (
                                  <div key={s.id} className="bg-slate-950 p-2 rounded-xl text-xs border border-slate-800 space-y-1">
                                    <div className="flex items-center justify-between">

                                      <div className="flex items-center space-x-1.5">
                                        <StarRating
                                          rating={sPhoto.userStars || sPhoto.stars || scoreToStars(sPhoto.sharpness)}
                                          readOnly={true}
                                          size="w-3 h-3"
                                        />
                                        <button
                                          onClick={() => onDeleteSighting(entry.speciesName, s.id)}
                                          className="text-slate-500 hover:text-red-400 ml-1 p-0.5 touch-manipulation"
                                          title="Delete Sighting"
                                        >

                                        </button>
                                      </div>

                                    {sPhoto.locationText && (
                                      <div className="text-[10px] text-slate-400 flex items-center space-x-1 truncate">
                                        <Icon name="mapPin" className="w-3 h-3 text-emerald-400 flex-shrink-0" />
                                        <span className="truncate">{sPhoto.locationText}</span>
                                      </div>
                                    )}

                                    {cameraExif && (
                                      <div className="flex items-center space-x-2 text-[9px] font-mono text-slate-500 pt-0.5">
                                        {cameraExif.shutterSpeed && <span>{cameraExif.shutterSpeed}</span>}
                                        {cameraExif.aperture && <span>• {cameraExif.aperture}</span>}
                                        {cameraExif.iso && <span>• {cameraExif.iso}</span>}
                                        {cameraExif.focalLength && <span>• {cameraExif.focalLength}</span>}

                  );
                })}
              </div>
            ) : (
              <div className="p-8 sm:p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-3xl space-y-3">
                <Icon name="feather" className="w-10 h-10 sm:w-12 sm:h-12 text-slate-600 mx-auto" />
                <h3 className="text-sm sm:text-base font-bold text-slate-300">No Species Records Found</h3>
                <p className="text-[11px] sm:text-xs text-slate-500 max-w-sm mx-auto">Upload wildlife photos in the Culling workspace to run AI species identification and build your Lifer Vault.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function CullingWorkspaceView({
      photos,
      onUpdatePhotos,
      onSelectPhoto,
      userApiKey,
      filterSharpness,
      setFilterSharpness,
      sortBy,
      setSortBy,
      currentPage,
      setCurrentPage,
      processedPhotos,
      isPreviewOpen
    }) {
      const pageSize = BATCH_PAGE_SIZE;

      const [selectedIds, setSelectedIds] = useState(new Set());
      const [showFilterBar, setShowFilterBar] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
      const [loadingThumbnails, setLoadingThumbnails] = useState(false);
      const [thumbnailProgress, setThumbnailProgress] = useState({ current: 0, total: 0 });
      const [rating, setRating] = useState(false);
      const [ratingProgress, setRatingProgress] = useState({ current: 0, total: 0 });
      const [showDeleteConfirmModal, setShowDeleteConfirmModal] = useState(false);
      
      const abortUploadRef = useRef(false);
      const abortRatingRef = useRef(false);
      const fileInputRef = useRef(null);
      const folderInputRef = useRef(null);

      const toggleSelectPhoto = (photoId, e) => {
        if (e) e.stopPropagation();
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(photoId)) {
            next.delete(photoId);
          } else {
            next.add(photoId);
          }
          return next;
        });
      };

      const handleSelectAll = () => {
        if (selectedIds.size === processedPhotos.length && processedPhotos.length > 0) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(processedPhotos.map(p => p.id)));
        }
      };

      const handleDeleteSinglePhoto = async (photoId, e) => {
        if (e) e.stopPropagation();
        const photo = photos.find(p => p.id === photoId);
        if (photo) {
          if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
            try {
              await photo.fileHandle.remove();
            } catch (err) {}
          }
          try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (err) {}
          try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (err) {}
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        }
        
        onUpdatePhotos(prev => prev.filter(p => p.id !== photoId));
        setSelectedIds(prev => {
          const next = new Set(prev);
          next.delete(photoId);
          return next;
        });
      };

      const handleOpenFolderPicker = async (e) => {
        if (e) e.preventDefault();

        const isSandboxedIframe = typeof window !== 'undefined' && window.self !== window.top;

        if (!isSandboxedIframe && 'showDirectoryPicker' in window) {
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            setUploading(true);
            const fpDb = getStoredFingerprintDb();

            // STEP 1: Fast scan for matching image file handles without heavy I/O blocking
            const fileEntries = [];
            for await (const [name, handle] of dirHandle.entries()) {
              if (handle.kind === 'file' && /\.(jpe?g|png|webp|cr2|nef|arw|dng)$/i.test(name)) {
                fileEntries.push({ name, handle });
              }
            }

            setUploadProgress({ current: 0, total: fileEntries.length });

            // STEP 2: Quickly collect lightweight File objects
            const rawPhotoList = [];
            for (let i = 0; i < fileEntries.length; i++) {
              try {
                const file = await fileEntries[i].handle.getFile();
                file.handle = fileEntries[i].handle;
                rawPhotoList.push(file);
              } catch (err) {}
            }

            // Order files chronologically by creation/last modified timestamp ascending (earliest to latest)
            rawPhotoList.sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));

            // Reset workspace list, selection, and page index when a new folder is opened
            onUpdatePhotos([]);
            setSelectedIds(new Set());
            setCurrentPage(1);

            // STEP 3: Stream files into React state in 20-photo chunks so Page 1 renders instantly
            const total = rawPhotoList.length;
            const CHUNK_SIZE = 20;

            let isFirstChunk = true;
            for (let i = 0; i < total; i += CHUNK_SIZE) {
              const chunkFiles = rawPhotoList.slice(i, i + CHUNK_SIZE);
              const chunkObjs = chunkFiles.map(file => {
                const fpId = generateFingerprintId(file);
                const savedMeta = fpDb[fpId] || {};
                const photoObj = {
                  id: fpId,
                  fingerprintId: fpId,
                  file: file,
                  fileHandle: file.handle || null,
                  name: file.name,
                  size: file.size,
                  lastModified: file.lastModified,
                  url: null,
                  blobUrl: null,
                  thumbnailUrl: null,
                  naturalWidth: 1000,
                  naturalHeight: 750,
                  sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
                  stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
                  userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
                  focusSpot: savedMeta.focusSpot || savedMeta.cameraExif?.focusArea || null,
                  cameraExif: savedMeta.cameraExif || null, // Deferred until preview/inspection
                  identification: savedMeta.identification || null,
                  cropBox: savedMeta.cropBox || null,
                  locationText: savedMeta.locationText || null,
                  opfsFileName: savedMeta.opfsFileName || null
                };
                saveFingerprintMetadata(photoObj);
                return photoObj;
              });

              if (isFirstChunk) {
                onUpdatePhotos(chunkObjs);
                isFirstChunk = false;
              } else {
                onUpdatePhotos(prev => {
                  const existingIds = new Set(prev.map(p => p.id));
                  const filteredNew = chunkObjs.filter(p => !existingIds.has(p.id));
                  return [...prev, ...filteredNew];
                });
              }

              setUploadProgress({ current: Math.min(i + CHUNK_SIZE, total), total });
              // Yield UI thread briefly so the user can interact with Page 1 immediately
              await new Promise(r => setTimeout(r, 10));
            }

            setUploading(false);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        if (folderInputRef.current) {
          folderInputRef.current.click();
        } else if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileUpload = async (e) => {
        const rawFiles = Array.from(e.target.files || []);
        const files = rawFiles.filter(file => /\.(jpe?g|png|webp|cr2|nef|arw|dng)$/i.test(file.name));
        if (!files.length) return;

        setUploading(true);
        abortUploadRef.current = false;

        // Reset workspace list, selection, and page index when new files are opened
        onUpdatePhotos([]);
        setSelectedIds(new Set());
        setCurrentPage(1);

        // Sort by creation/modified date ascending by default
        files.sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));

        setUploadProgress({ current: 0, total: files.length });

        const fpDb = getStoredFingerprintDb();
        const total = files.length;
        const CHUNK_SIZE = 20;

        let isFirstChunk = true;
        for (let i = 0; i < total; i += CHUNK_SIZE) {
          if (abortUploadRef.current) break;
          const chunkFiles = files.slice(i, i + CHUNK_SIZE);
          const chunkObjs = chunkFiles.map(file => {
            const fpId = generateFingerprintId(file);
            const savedMeta = fpDb[fpId] || {};
            const photoObj = {
              id: fpId,
              fingerprintId: fpId,
              file: file,
              fileHandle: file.handle || null,
              name: file.name,
              size: file.size,
              lastModified: file.lastModified,
              url: null,
              blobUrl: null,
              thumbnailUrl: null,
              naturalWidth: 1000,
              naturalHeight: 750,
              sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
              stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
              userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
              focusSpot: savedMeta.focusSpot || savedMeta.cameraExif?.focusArea || null,
              cameraExif: savedMeta.cameraExif || null,
              identification: savedMeta.identification || null,
              cropBox: savedMeta.cropBox || null,
              locationText: savedMeta.locationText || null,
              opfsFileName: savedMeta.opfsFileName || null
            };
            saveFingerprintMetadata(photoObj);
            return photoObj;
          });

          if (isFirstChunk) {
            onUpdatePhotos(chunkObjs);
            isFirstChunk = false;
          } else {
            onUpdatePhotos(prev => {
              const existingIds = new Set(prev.map(p => p.id));
              const filteredNew = chunkObjs.filter(p => !existingIds.has(p.id));
              return [...prev, ...filteredNew];
            });
          }

          setUploadProgress({ current: Math.min(i + CHUNK_SIZE, total), total });
          await new Promise(r => setTimeout(r, 10));
        }

        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleBatchRateFocus = async () => {
        const unrated = photos.filter(p => p.sharpness === null && p.userStars === null);
        if (!unrated.length) return;

        setRating(true);
        abortRatingRef.current = false;
        setRatingProgress({ current: 0, total: unrated.length });

        for (let i = 0; i < unrated.length; i++) {
          if (abortRatingRef.current) break;

          const target = unrated[i];
          let cameraExif = target.cameraExif;
          if (!cameraExif && target.file) {
            cameraExif = await extractCameraExif(target.file);
          }

          const evalResult = await evaluatePhotoFocus(target.file || target.url, target.cropBox || target.focusSpot, cameraExif || target.cameraExif);

          const updated = { 
            ...target, 
            cameraExif: cameraExif || target.cameraExif,
            sharpness: evalResult.score,
            stars: evalResult.stars,
            focusSpot: evalResult.focusSpot 
          };

          saveFingerprintMetadata(updated);

          onUpdatePhotos(prev => prev.map(p => p.id === target.id ? updated : p));
          setRatingProgress({ current: i + 1, total: unrated.length });
        }

        setRating(false);
      };

      const handleCardStarClick = (photoId, newStars) => {
        onUpdatePhotos(prev => prev.map(p => {
          if (p.id === photoId) {
            const updated = {
              ...p,
              userStars: newStars,
              stars: newStars
            };
            saveFingerprintMetadata(updated);
            return updated;
          }
          return p;
        }));
      };

      const confirmAndDeleteFiltered = async () => {
        setShowDeleteConfirmModal(false);

        if (selectedIds.size > 0) {
          const toDelete = photos.filter(p => selectedIds.has(p.id));
          for (const photo of toDelete) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
            deleteFingerprintMetadata(photo.fingerprintId || photo.id);
          }
          onUpdatePhotos(prev => prev.filter(p => !selectedIds.has(p.id)));
          setSelectedIds(new Set());
        } else {
          if (!processedPhotos.length) return;
          const idsToRemove = new Set(processedPhotos.map(p => p.id));
          
          for (const photo of processedPhotos) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
            deleteFingerprintMetadata(photo.fingerprintId || photo.id);
          }

          onUpdatePhotos(prev => prev.filter(p => !idsToRemove.has(p.id)));
        }
        setCurrentPage(1);
      };

      const handleExportFiltered = async () => {
        const listToExport = selectedIds.size > 0 ? photos.filter(p => selectedIds.has(p.id)) : processedPhotos;
        if (!listToExport.length) return;

        let exportedIds = new Set();

        if ('showDirectoryPicker' in window) {
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            let exportedCount = 0;
            
            for (const photo of listToExport) {
              if (photo.file) {
                const newFileHandle = await dirHandle.getFileHandle(photo.name, { create: true });
                const writable = await newFileHandle.createWritable();
                await writable.write(photo.file);
                await writable.close();
                exportedCount++;
                exportedIds.add(photo.id);
                deleteFingerprintMetadata(photo.fingerprintId || photo.id);
              }
            }
            
            if (exportedIds.size > 0) {
              onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
              setSelectedIds(prev => {
                const next = new Set(prev);
                exportedIds.forEach(id => next.delete(id));
                return next;
              });
            }
            
            alert(`Successfully exported ${exportedCount} photo(s) to your selected directory folder and removed them from the main list!`);
            setCurrentPage(1);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        listToExport.forEach((photo, i) => {
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = photo.blobUrl || photo.thumbnailUrl || photo.url;
            a.download = photo.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }, i * 200);
          exportedIds.add(photo.id);
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        });

        onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
        setSelectedIds(prev => {
          const next = new Set(prev);
          exportedIds.forEach(id => next.delete(id));
          return next;
        });
        setCurrentPage(1);
      };

      const totalPages = Math.ceil(processedPhotos.length / pageSize) || 1;
      
      const paginatedPhotos = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedPhotos.slice(start, start + pageSize);
      }, [processedPhotos, currentPage, pageSize]);

      const bufferedPhotos = useMemo(() => {
        const total = processedPhotos.length;
        if (total === 0) return [];

        const pageStart = (currentPage - 1) * pageSize;
        const pageEnd = Math.min(total, currentPage * pageSize);
        return processedPhotos.slice(pageStart, pageEnd);
      }, [processedPhotos, currentPage, pageSize]);

      useEffect(() => {
        if (isPreviewOpen) {
          setLoadingThumbnails(false);
          return;
        }

        const abortController = new AbortController();
        let isMounted = true;

        if (!bufferedPhotos.length) {
          setLoadingThumbnails(false);
          return;
        }

        const bufferedIds = new Set(bufferedPhotos.map(p => p.id));
        const needed = bufferedPhotos.filter(p => !p.thumbnailUrl && p.file);

        if (needed.length > 0) {
          setLoadingThumbnails(true);
          setThumbnailProgress({ current: 0, total: needed.length });

          processThumbnailQueue(
            needed,
            (batchUpdates) => {
              if (!isMounted) return;
              onUpdatePhotos(prev => {
                const mapUpdates = new Map(batchUpdates.map(u => [u.id, u]));
                return prev.map(p => {
                  const u = mapUpdates.get(p.id);
                  if (u) {
                    return {
                      ...p,
                      thumbnailUrl: u.thumbUrl,
                      naturalWidth: u.width,
                      naturalHeight: u.height
                    };
                  }
                  return p;
                });
              });
            },
            (completed, total) => {
              if (isMounted) setThumbnailProgress({ current: completed, total });
            },
            abortController.signal
          ).then(() => {
            if (isMounted) setLoadingThumbnails(false);
          });
        } else {
          setLoadingThumbnails(false);
        }

        onUpdatePhotos(prev => {
          let hasChanges = false;
          const updated = prev.map(p => {
            let updatedPhoto = p;
            let changed = false;

            if (!bufferedIds.has(p.id) && p.thumbnailUrl) {
              try { URL.revokeObjectURL(p.thumbnailUrl); } catch(e){}
              updatedPhoto = { ...updatedPhoto, thumbnailUrl: null };
              changed = true;
            }

            if (p.blobUrl) {
              try { URL.revokeObjectURL(p.blobUrl); } catch(e){}
              updatedPhoto = { ...updatedPhoto, blobUrl: null };
              changed = true;
            }

            if (changed) hasChanges = true;
            return updatedPhoto;
          });
          return hasChanges ? updated : prev;
        });

        return () => { 
          isMounted = false; 
          abortController.abort(); 
        };
      }, [currentPage, processedPhotos.length, filterSharpness, sortBy, isPreviewOpen]);

      const isSelectionActive = selectedIds.size > 0;
      const unratedCount = photos.filter(p => p.sharpness === null && p.userStars === null).length;

      const showFooterBar = uploading || (loadingThumbnails && !isPreviewOpen) || rating;

      return (
        <div className="flex-1 flex flex-col overflow-hidden min-h-0 p-2 sm:p-4 md:p-6 gap-2 sm:gap-4 pb-[calc(4.5rem+env(safe-area-inset-bottom))] md:pb-4 relative">
          
          <div className="flex-shrink-0 bg-slate-900 border border-slate-800 p-2.5 sm:p-4 rounded-2xl shadow-xl space-y-2.5 sm:space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-3">
              <div>
                <h2 className="text-base sm:text-xl font-extrabold text-white flex items-center space-x-2">
                  <Icon name="camera" className="w-5 h-5 sm:w-6 sm:h-6 text-emerald-400" />
                  <span>Culling Focus Workspace</span>
                </h2>

    function BirdVaultApp() {
      const [activeTab, setActiveTabState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_tab') || 'culling'; } catch(e) { return 'culling'; }
      });
      
      const [filterSharpness, setFilterSharpnessState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_filter') || 'all'; } catch(e) { return 'all'; }
      });

      const [sortBy, setSortByState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_sort') || 'name'; } catch(e) { return 'name'; }
      });

      const [userLocation, setUserLocationState] = useState(() => {
        try { return localStorage.getItem('birdvault_user_location') || 'Auckland, New Zealand'; } catch(e) { return 'Auckland, New Zealand'; }
      });

      const [photos, setPhotos] = useState([]);
      const [vaultEntries, setVaultEntries] = useState([]);
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [currentPage, setCurrentPage] = useState(1);

      const [userApiKey, setUserApiKey] = useState((localStorage.getItem('birdvault_gemini_token') || '').trim());
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);

      const [tokenUsageState, setTokenUsageState] = useState(getStoredTokenUsage());

      const setActiveTab = (tab) => {
        setActiveTabState(tab);
        try { localStorage.setItem('birdvault_pref_tab', tab); } catch(e){}
      };

      const setFilterSharpness = (filter) => {
        setFilterSharpnessState(filter);
        try { localStorage.setItem('birdvault_pref_filter', filter); } catch(e){}
      };

      const setSortBy = (sort) => {
        setSortByState(sort);
        try { localStorage.setItem('birdvault_pref_sort', sort); } catch(e){}
      };

      const setUserLocation = (loc) => {
        setUserLocationState(loc);
        try {
          if (loc) localStorage.setItem('birdvault_user_location', loc);
          else localStorage.removeItem('birdvault_user_location');
        } catch(e){}
      };

      const updatePhotos = (action) => {
        setPhotos(prev => {
          const nextPhotos = typeof action === 'function' ? action(prev) : action;
          syncFingerprintDbPrune(nextPhotos);
          return nextPhotos;
        });
      };

      useEffect(() => {
        window.birdvault_open_auth_modal = () => setShowAuthModal(true);
        return () => { delete window.birdvault_open_auth_modal; };
      }, []);

      useEffect(() => {
        async function reloadWorkspaceAndVault() {
          const savedVault = localStorage.getItem('birdvault_entries_v5');
          if (savedVault) {
            try {
              const parsed = JSON.parse(savedVault);
              const validEntries = [];

              for (const entry of parsed) {
                const validSightings = [];
                for (const s of (entry.sightings || [])) {
                  let loadedBlob = null;
                  const opfsName = s.opfsFileName || (s.photo ? `${s.photo.name}` : null);
                  if (opfsName) {
                    loadedBlob = await getOpfsSightingFileBlob(entry.category, entry.speciesName, opfsName);
                  }

                  if (loadedBlob) {
                    const freshBlobUrl = URL.createObjectURL(loadedBlob);
                    validSightings.push({
                      ...s,
                      photo: {
                        ...s.photo,
                        thumbnailUrl: freshBlobUrl,
                        blobUrl: freshBlobUrl,
                        url: freshBlobUrl
                      }
                    });
                  } else if (s.photo?.thumbnailUrl && !s.photo.thumbnailUrl.startsWith('blob:')) {
                    validSightings.push(s);
                  }
                }

                if (validSightings.length > 0) {
                  validEntries.push({
                    ...entry,
                    sightings: validSightings
                  });
                }
              }

              setVaultEntries(validEntries);
              localStorage.setItem('birdvault_entries_v5', JSON.stringify(validEntries));
            } catch (e) {
              console.warn('Vault reload error:', e);
            }
          }

          const fpDb = getStoredFingerprintDb();
          const fingerprintKeys = Object.keys(fpDb);
          const validWorkspacePhotos = [];

          for (const fpId of fingerprintKeys) {
            const savedMeta = fpDb[fpId];
            let workspaceBlob = null;
            if (savedMeta.identification?.category && savedMeta.identification?.speciesName) {
              const opfsName = savedMeta.opfsFileName || savedMeta.name;
              workspaceBlob = await getOpfsSightingFileBlob(savedMeta.identification.category, savedMeta.identification.speciesName, opfsName);
            }

            if (workspaceBlob) {
              const freshBlobUrl = URL.createObjectURL(workspaceBlob);
              validWorkspacePhotos.push({
                id: fpId,
                fingerprintId: fpId,
                file: null,
                fileHandle: null,
                name: savedMeta.name || 'Photo',
                size: savedMeta.size || 0,
                lastModified: savedMeta.lastModified || 0,
                url: freshBlobUrl,
                blobUrl: freshBlobUrl,
                thumbnailUrl: freshBlobUrl,
                naturalWidth: 1000,
                naturalHeight: 750,
                sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
                stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
                userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
                focusSpot: savedMeta.focusSpot || savedMeta.cameraExif?.focusArea || null,
                cameraExif: savedMeta.cameraExif || null,
                identification: savedMeta.identification || null,
                cropBox: savedMeta.cropBox || null,
                locationText: savedMeta.locationText || null,
                opfsFileName: savedMeta.opfsFileName || null
              });
            } else {
              deleteFingerprintMetadata(fpId);
            }
          }

          setPhotos(validWorkspacePhotos);
        }

        reloadWorkspaceAndVault();
      }, []);

      const handleSaveApiKey = (newKey) => {
        setUserApiKey(newKey);
        if (newKey) {
          localStorage.setItem('birdvault_gemini_token', newKey);
        } else {
          localStorage.removeItem('birdvault_gemini_token');
        }
      };

      const processedPhotos = useMemo(() => {
        let list = [...photos];
        
        if (filterSharpness === '5star') {
          list = list.filter(p => (p.sharpness !== null && p.sharpness >= 9) || p.userStars === 5);
        } else if (filterSharpness === '4star') {
          list = list.filter(p => (p.sharpness !== null && p.sharpness >= 7) || (p.userStars && p.userStars >= 4));
        } else if (filterSharpness === 'soft') {
          list = list.filter(p => (p.sharpness !== null && p.sharpness <= 6) || (p.userStars && p.userStars <= 3));
        } else if (filterSharpness === 'unrated') {
          list = list.filter(p => p.sharpness === null && p.userStars === null);
        }

        if (sortBy === 'default') {
          // Keep natural streaming order (Created Date Ascending)
        } else if (sortBy === 'name') {
          list.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'date_asc') {
          list.sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));
        } else if (sortBy === 'date_desc') {
          list.sort((a, b) => (b.lastModified || 0) - (a.lastModified || 0));
        } else if (sortBy === 'sharpness') {
          list.sort((a, b) => {
            const scoreA = a.sharpness !== null ? a.sharpness : (a.userStars ? a.userStars * 2 : 0);
            const scoreB = b.sharpness !== null ? b.sharpness : (b.userStars ? b.userStars * 2 : 0);
            return scoreB - scoreA;
          });
        }

        return list;
      }, [photos, filterSharpness, sortBy]);

      useEffect(() => {
        if (!selectedPhoto) return;
        const indexInProcessed = processedPhotos.findIndex(p => p.id === selectedPhoto.id);
        if (indexInProcessed !== -1) {
          const targetPage = Math.floor(indexInProcessed / BATCH_PAGE_SIZE) + 1;
          if (targetPage !== currentPage) {
            setCurrentPage(targetPage);
          }
        }
      }, [selectedPhoto, processedPhotos]);

      useEffect(() => {
        const handleTokenUpdate = () => setTokenUsageState(getStoredTokenUsage());
        window.addEventListener('birdvault_token_update', handleTokenUpdate);
        return () => window.removeEventListener('birdvault_token_update', handleTokenUpdate);
      }, []);

      const saveVaultToStorage = (entries) => {
        setVaultEntries(entries);
        localStorage.setItem('birdvault_entries_v5', JSON.stringify(entries));
        updateOpfsMasterManifest(entries);
      };

      const handleSaveToVault = async (photoWithAi) => {
        if (!photoWithAi.identification) return;
        const idInfo = photoWithAi.identification;
        const { speciesName, scientificName, category } = idInfo;

        const fpId = photoWithAi.fingerprintId || photoWithAi.id;
        const sightingId = 'sighting_' + Math.random().toString(36).substring(2, 9);
        const fileName = `${new Date().toISOString().split('T')[0]}_${sightingId}.jpg`;

        let liveBlobUrl = photoWithAi.blobUrl || photoWithAi.thumbnailUrl || photoWithAi.url;
        let blobToWrite = photoWithAi.file;

        if (!blobToWrite && liveBlobUrl) {
          try {
            const res = await fetch(liveBlobUrl);
            blobToWrite = await res.blob();
          } catch (err) {
            console.warn('Could not fetch blob for vault write:', err);
          }
        }

        if (blobToWrite) {
          await writeOpfsSightingFile(category, speciesName, fileName, blobToWrite);
          if (blobToWrite instanceof Blob || blobToWrite instanceof File) {
            liveBlobUrl = URL.createObjectURL(blobToWrite);
          }
        }

        const sanitizeUrl = (u) => (u && typeof u === 'string' && !u.startsWith('blob:')) ? u : null;

        const cleanPhotoMeta = {
          id: fpId,
          fingerprintId: fpId,
          file: null,
          name: photoWithAi.name,
          size: photoWithAi.size,
          lastModified: photoWithAi.lastModified,
          thumbnailUrl: sanitizeUrl(photoWithAi.thumbnailUrl),
          sharpness: photoWithAi.sharpness,
          stars: photoWithAi.stars,
          userStars: photoWithAi.userStars,
          focusSpot: photoWithAi.focusSpot || photoWithAi.cameraExif?.focusArea,
          cameraExif: photoWithAi.cameraExif,
          identification: photoWithAi.identification,
          cropBox: photoWithAi.cropBox,
          locationText: photoWithAi.locationText,
          opfsFileName: fileName
        };

        saveFingerprintMetadata(cleanPhotoMeta);

        const statePhotoMeta = {
          ...cleanPhotoMeta,
          thumbnailUrl: liveBlobUrl,
          blobUrl: liveBlobUrl,
          url: liveBlobUrl
        };

        const newSightingForState = {
          id: sightingId,
          date: Date.now(),
          opfsFileName: fileName,
          photoFingerprintId: fpId,
          photo: statePhotoMeta
        };

        const newSightingForStorage = {
          id: sightingId,
          date: Date.now(),
          opfsFileName: fileName,
          photoFingerprintId: fpId,
          photo: cleanPhotoMeta
        };

        const existingIdx = vaultEntries.findIndex(e => e.speciesName.toLowerCase() === speciesName.toLowerCase());

        let stateEntries = [...vaultEntries];
        let storageEntries = [...vaultEntries];

        if (existingIdx >= 0) {
          stateEntries[existingIdx] = {
            ...stateEntries[existingIdx],
            description: idInfo.description || stateEntries[existingIdx].description || '',
            habitat: idInfo.habitat || stateEntries[existingIdx].habitat || '',
            conservationStatus: idInfo.conservationStatus || stateEntries[existingIdx].conservationStatus || '',
            diet: idInfo.diet || stateEntries[existingIdx].diet || '',
            keyTraits: idInfo.keyTraits || stateEntries[existingIdx].keyTraits || '',
            sightings: [newSightingForState, ...stateEntries[existingIdx].sightings]
          };
          storageEntries[existingIdx] = {
            ...storageEntries[existingIdx],
            description: idInfo.description || storageEntries[existingIdx].description || '',
            habitat: idInfo.habitat || storageEntries[existingIdx].habitat || '',
            conservationStatus: idInfo.conservationStatus || storageEntries[existingIdx].conservationStatus || '',
            diet: idInfo.diet || storageEntries[existingIdx].diet || '',
            keyTraits: idInfo.keyTraits || storageEntries[existingIdx].keyTraits || '',
            sightings: [newSightingForStorage, ...storageEntries[existingIdx].sightings]
          };
        } else {
          const newSpeciesState = {
            speciesName,
            scientificName,
            category,
            description: idInfo.description || '',
            habitat: idInfo.habitat || '',
            conservationStatus: idInfo.conservationStatus || '',
            diet: idInfo.diet || '',
            keyTraits: idInfo.keyTraits || '',
            sightings: [newSightingForState]
          };
          const newSpeciesStorage = {
            speciesName,
            scientificName,
            category,
            description: idInfo.description || '',
            habitat: idInfo.habitat || '',
            conservationStatus: idInfo.conservationStatus || '',
            diet: idInfo.diet || '',
            keyTraits: idInfo.keyTraits || '',
            sightings: [newSightingForStorage]
          };
          stateEntries.unshift(newSpeciesState);
          storageEntries.unshift(newSpeciesStorage);
        }

        saveVaultToStorage(storageEntries);
        setVaultEntries(stateEntries);

        await writeOpfsSightingFile(category, speciesName, 'species_info.json', {
          speciesName,
          scientificName,
          category,
          description: idInfo.description || '',
          habitat: idInfo.habitat || '',
          conservationStatus: idInfo.conservationStatus || '',
          diet: idInfo.diet || '',
          keyTraits: idInfo.keyTraits || '',
          updatedAt: Date.now(),
          lastSighting: cleanPhotoMeta
        });

        updatePhotos(prev => prev.filter(p => p.id !== fpId && p.fingerprintId !== fpId));

        setSelectedPhoto(null);
        setActiveTab('vault');
      };

      const handleDeleteSighting = (speciesName, sightingId) => {
        const updated = vaultEntries.map(e => {
          if (e.speciesName === speciesName) {
            return {
              ...e,
              sightings: e.sightings.filter(s => s.id !== sightingId)
            };
          }
          return e;
        }).filter(e => e.sightings.length > 0);

        saveVaultToStorage(updated);
      };

      const handleDeleteSpecies = (speciesName) => {
        const updated = vaultEntries.filter(e => e.speciesName !== speciesName);
        saveVaultToStorage(updated);
      };

      const handleDeletePhotoInViewer = async (photoId) => {
        const currentIndex = photos.findIndex(p => p.id === photoId);
        const photoToDelete = photos.find(p => p.id === photoId);
        
        if (photoToDelete) {
          if (photoToDelete.fileHandle && typeof photoToDelete.fileHandle.remove === 'function') {
            try { await photoToDelete.fileHandle.remove(); } catch (e) {}
          }
          try { if (photoToDelete.blobUrl) URL.revokeObjectURL(photoToDelete.blobUrl); } catch (e) {}
          try { if (photoToDelete.thumbnailUrl) URL.revokeObjectURL(photoToDelete.thumbnailUrl); } catch (e) {}
          deleteFingerprintMetadata(photoToDelete.fingerprintId || photoToDelete.id);
        }

        const updatedPhotos = photos.filter(p => p.id !== photoId);
        updatePhotos(updatedPhotos);

        if (updatedPhotos.length > 0) {
          const nextIndex = currentIndex < updatedPhotos.length ? currentIndex : updatedPhotos.length - 1;
          setSelectedPhoto(updatedPhotos[nextIndex]);
        } else {
          setSelectedPhoto(null);
        }
      };

      const rpmUsedPct = Math.round((tokenUsageState.minuteRequests / GEMINI_QUOTAS.MAX_RPM) * 100);

      return (
        <div className="h-full w-full flex flex-col bg-slate-950 text-slate-100 overflow-hidden select-none">
          <header className="h-14 sm:h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-2.5 sm:px-6 flex items-center justify-between z-30 flex-shrink-0 gap-1.5 sm:gap-4">
            <div className="flex items-center space-x-2 min-w-0">
              <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-lg flex-shrink-0">
                <Icon name="feather" className="w-4 h-4 sm:w-6 sm:h-6" />
              </div>
              <div className="truncate">
                <h1 className="font-extrabold text-white text-xs sm:text-base tracking-tight leading-none flex items-center space-x-1">
                  <span>BirdVault</span>
                  <span className="text-emerald-400 font-mono text-[9px] sm:text-xs font-normal">PRO</span>
                </h1>
                <p className="text-[8px] sm:text-[10px] text-slate-400 truncate">Wildlife Focus Culling & Vault</p>
              </div>
            </div>

            <div className="hidden md:flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
              <button
                onClick={() => setActiveTab('culling')}
                className={`px-4 py-1.5 rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'culling' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <Icon name="camera" className="w-4 h-4" />
                <span>Focus Culling</span>
              </button>
              <button
                onClick={() => setActiveTab('vault')}
                className={`px-4 py-1.5 rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'vault' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <Icon name="feather" className="w-4 h-4" />
                <span>Lifer List Vault</span>
              </button>
            </div>

            <div className="flex items-center space-x-1.5 sm:space-x-2">
              <button
                onClick={() => setShowAuthModal(true)}
                className={`px-2 sm:px-2.5 py-1.5 rounded-xl border text-[11px] sm:text-xs font-semibold flex items-center space-x-1 transition touch-manipulation ${userApiKey ? 'bg-slate-950 text-slate-300 border-slate-800 hover:border-emerald-500/50' : 'bg-emerald-600/20 text-emerald-300 border-emerald-500/40 animate-pulse'}`}
              >
                <Icon name="google" className="w-3.5 h-3.5 text-emerald-400" />
                <span className="text-[10px] sm:text-[11px] font-medium hidden xs:inline">{userApiKey ? 'AI Connected' : 'Connect AI'}</span>
              </button>

              <button
                onClick={() => setShowTokenModal(true)}
                className={`px-2 sm:px-2.5 py-1.5 rounded-xl border text-[11px] sm:text-xs font-semibold flex items-center space-x-1 transition touch-manipulation ${rpmUsedPct > 80 ? 'bg-amber-500/20 text-amber-400 border-amber-500/40 animate-pulse' : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-700'}`}
              >
                <Icon name="bolt" className={`w-3.5 h-3.5 ${rpmUsedPct > 80 ? 'text-amber-400' : 'text-emerald-400'}`} />
                <span className="text-[10px] sm:text-[11px] font-mono hidden xs:inline">{100 - rpmUsedPct}% Quota</span>
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-hidden flex flex-col relative z-20">
            {activeTab === 'vault' ? (
              <LiferVaultView
                vaultEntries={vaultEntries}
                photos={photos}
                onDeleteSighting={handleDeleteSighting}
                onDeleteSpecies={handleDeleteSpecies}
                onSelectPhoto={(photo) => setSelectedPhoto(photo)}
              />
            ) : (
              <CullingWorkspaceView
                photos={photos}
                onUpdatePhotos={updatePhotos}
                onSelectPhoto={(photo) => setSelectedPhoto(photo)}
                userApiKey={userApiKey}
                filterSharpness={filterSharpness}
                setFilterSharpness={setFilterSharpness}
                sortBy={sortBy}
                setSortBy={setSortBy}
                currentPage={currentPage}
                setCurrentPage={setCurrentPage}
                processedPhotos={processedPhotos}
                isPreviewOpen={selectedPhoto !== null}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg flex items-center justify-around z-40 px-2 pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.3)] min-h-[3.8rem]">
            <button
              onClick={() => setActiveTab('culling')}
              className={`flex flex-col items-center justify-center w-full h-full py-1.5 space-y-0.5 transition touch-manipulation ${activeTab === 'culling' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-300'}`}
            >
              <Icon name="camera" className="w-4 h-4 sm:w-5 sm:h-5" />
              <span className="text-[10px]">Focus Culling</span>
            </button>
            <div className="w-px h-6 bg-slate-800"></div>
            <button
              onClick={() => setActiveTab('vault')}
              className={`flex flex-col items-center justify-center w-full h-full py-1.5 space-y-0.5 transition touch-manipulation ${activeTab === 'vault' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-300'}`}
            >
              <Icon name="feather" className="w-4 h-4 sm:w-5 sm:h-5" />
              <span className="text-[10px]">Lifer List Vault</span>
            </button>
          </nav>

          {selectedPhoto && (() => {
            const selectedIndex = processedPhotos.findIndex(p => p.id === selectedPhoto.id);
            const hasPrev = selectedIndex > 0;
            const hasNext = selectedIndex >= 0 && selectedIndex < processedPhotos.length - 1;

            return (
              <InteractivePhotoViewer
                key={selectedPhoto.id}
                photo={selectedPhoto}
                onClose={() => setSelectedPhoto(null)}
                onUpdatePhoto={(updated) => {
                  updatePhotos(prev => prev.map(p => p.id === updated.id ? updated : p));
                  setSelectedPhoto(updated);
                  saveFingerprintMetadata(updated);
                }}
                onSaveToVault={handleSaveToVault}
                onDeletePhoto={handleDeletePhotoInViewer}
                userApiKey={userApiKey}
                initialLocation={userLocation}
                onUpdateLocation={setUserLocation}
                onNextPhoto={() => hasNext && setSelectedPhoto(processedPhotos[selectedIndex + 1])}
                onPrevPhoto={() => hasPrev && setSelectedPhoto(processedPhotos[selectedIndex - 1])}
                hasNext={hasNext}
                hasPrev={hasPrev}
              />
            );
          })()}

          <TokenUsageMonitorModal
            isOpen={showTokenModal}
            onClose={() => setShowTokenModal(false)}
          />

          <GoogleAuthModal
            isOpen={showAuthModal}
            onClose={() => setShowAuthModal(false)}
            apiKey={userApiKey}
            onSaveKey={handleSaveApiKey}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BirdVaultApp />);
  </script>
</body>
</html>
