        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
        setPanZoom(prev => {
          const nextScale = Math.max(1, Math.min(8, prev.scale * zoomFactor));
          return {
            ...prev,
            scale: nextScale,
            x: nextScale === 1 ? 0 : prev.x,
            y: nextScale === 1 ? 0 : prev.y
          };
        });
      };

      const handlePointerMove = (e) => {
        if (e.touches && e.touches.length === 2) {
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          if (pinchStartDistRef.current && pinchStartDistRef.current > 0) {
            const factor = currentDist / pinchStartDistRef.current;
            const newScale = Math.max(1, Math.min(8, pinchStartScaleRef.current * factor));
            setPanZoom(prev => ({
              ...prev,
              scale: newScale,
              x: newScale === 1 ? 0 : prev.x,
              y: newScale === 1 ? 0 : prev.y
            }));
          }
          return;
        }

        const containerPos = getContainerPointerPos(e);
        const imgPos = getImagePointerPos(e);
        const pctX = imgPos.pctX;
        const pctY = imgPos.pctY;

        if (isLoupeActive) {
          setLoupeImgPos({ xPct: pctX, yPct: pctY });
          setLoupeScreenPos({ x: containerPos.x, y: containerPos.y });
        }

        if (isCropToolActive && isDrawingCrop && cropStartRef.current) {
          const startX = cropStartRef.current.x;
          const startY = cropStartRef.current.y;
          const left = Math.min(startX, pctX);
          const top = Math.min(startY, pctY);
          const width = Math.abs(pctX - startX);
          const height = Math.abs(pctY - startY);

          const updatedCrop = { x: left, y: top, width, height };
          currentCropBoxRef.current = updatedCrop;
          setCropBox(updatedCrop);
        } else if (isDraggingPan && panZoom.scale > 1) {
          setPanZoom(p => ({
            ...p,
            x: containerPos.clientX - dragStartRef.current.x,
            y: containerPos.clientY - dragStartRef.current.y
          }));
        }
      };

      const handlePointerDown = (e) => {
        if ((e.touches || e.pointerType === 'touch') && showMobileSidebar) {
          setShowMobileSidebar(false);
        }

        if (e.touches && e.touches.length === 2) {
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          pinchStartDistRef.current = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          pinchStartScaleRef.current = panZoom.scale;
          return;
        }

        const containerPos = getContainerPointerPos(e);
        const imgPos = getImagePointerPos(e);
        const pctX = imgPos.pctX;
        const pctY = imgPos.pctY;

        if (isLoupeActive) {
          setLoupeImgPos({ xPct: pctX, yPct: pctY });
          setLoupeScreenPos({ x: containerPos.x, y: containerPos.y });
        }
        
        if (isCropToolActive) {
          setShowCroppedPreview(false);
          cropStartRef.current = { x: pctX, y: pctY };
          const initialBox = { x: pctX, y: pctY, width: 0, height: 0 };
          currentCropBoxRef.current = initialBox;
          setCropBox(initialBox);
          setIsDrawingCrop(true);
        } else if (panZoom.scale > 1) {
          setIsDraggingPan(true);
          dragStartRef.current = { x: containerPos.clientX - panZoom.x, y: containerPos.clientY - panZoom.y };
        }
      };

      const handlePointerUp = async (e) => {
        if (e.touches && e.touches.length < 2) {
          pinchStartDistRef.current = null;
        }

        if (isDrawingCrop) {
          const finalCrop = currentCropBoxRef.current;
          setIsDrawingCrop(false);
          setIsCropToolActive(false);

          if (finalCrop && finalCrop.width >= MIN_CROP_DIMENSION_PCT && finalCrop.height >= MIN_CROP_DIMENSION_PCT) {
            setShowCroppedPreview(true);
            await triggerCropFocusEvaluation(finalCrop);
          } else {
            setCropBox(photo.cropBox || null);
            currentCropBoxRef.current = photo.cropBox || null;
            if (!photo.cropBox) {
              setShowCroppedPreview(false);
            }
          }
        }
        setIsDraggingPan(false);
      };

      const handleRunAiIdentification = async () => {
        let currentPhoto = photo;
        if (currentPhoto.sharpness === null) {
          setEvaluatingFocus(true);
          const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl || photo.url, photo.cropBox || photo.focusSpot, cameraExif);
          currentPhoto = { ...photo, sharpness: evalRes.score, stars: evalRes.stars, focusSpot: evalRes.focusSpot };
          if (evalRes.debugDetails) setDebugData(evalRes.debugDetails);
          onUpdatePhoto(currentPhoto);
          saveFingerprintMetadata(currentPhoto);
          setEvaluatingFocus(false);
        }

        setIdentifying(true);
        const result = await identifyBirdWithGemini(currentPhoto, userApiKey, cropBox, locationInput);
        
        if (result && (result.error === 'MISSING_KEY' || result.error === 'INVALID_KEY')) {
          if (window.birdvault_open_auth_modal) {
            window.birdvault_open_auth_modal();
          }
        }

        setAiResult(result);
        setIdentifying(false);
        setShowMobileSidebar(true);
        
        let updatedFocusSpot = currentPhoto.focusSpot;
        if (result && result.heatmapPoints && result.heatmapPoints.length > 0) {
          const eyePt = result.heatmapPoints.find(p => p.label && p.label.toLowerCase().includes('eye')) || result.heatmapPoints[0];
          if (eyePt && eyePt.x !== undefined && eyePt.y !== undefined) {
            updatedFocusSpot = {
              xPct: eyePt.x,
              yPct: eyePt.y,
              widthPct: 20,
              heightPct: 20,
              source: 'AI Heatmap Anchor'
            };
            setEvaluatingFocus(true);
            const aiFocusRes = await evaluatePhotoFocus(currentPhoto.file || currentPhoto.blobUrl || currentPhoto.thumbnailUrl || currentPhoto.url, updatedFocusSpot, cameraExif);
            currentPhoto = {
              ...currentPhoto,
              sharpness: aiFocusRes.score,
              stars: aiFocusRes.stars,
              focusSpot: updatedFocusSpot
            };
            if (aiFocusRes.debugDetails) setDebugData(aiFocusRes.debugDetails);
            setEvaluatingFocus(false);
          }
        }

        const updated = { ...currentPhoto, identification: result, cropBox: cropBox, locationText: locationInput, focusSpot: updatedFocusSpot };
        onUpdatePhoto(updated);
        saveFingerprintMetadata(updated);

        if (result && !result.error && result.speciesName) {
          const isLifer = !vaultEntries.some(
            e => e.speciesName.toLowerCase() === result.speciesName.toLowerCase()
          );
          if (isLifer) {
            setCongratData({ photoMeta: updated, result });
            setShowCongratModal(true);
          }
        }
      };

      const formattedDate = useMemo(() => {
        if (!photo.lastModified) return 'Unknown Date';
        return new Date(photo.lastModified).toLocaleString();
      }, [photo.lastModified]);

      const formattedFileSize = useMemo(() => {
        if (!photo.size) return 'Unknown Size';
        return (photo.size / (1024 * 1024)).toFixed(2) + ' MB';
      }, [photo.size]);

      const loupeDiameter = 192;
      const hasValidCropBox = cropBox && cropBox.width >= MIN_CROP_DIMENSION_PCT && cropBox.height >= MIN_CROP_DIMENSION_PCT;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col md:flex-row overflow-hidden select-none">
          <div className="flex-1 min-h-0 flex flex-col relative bg-black/80 overflow-hidden h-full">
            
            <div className="h-14 sm:h-16 px-3 sm:px-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 gap-2">
              <div className="flex items-center space-x-2 truncate min-w-0">
                <span
                  className="text-xs sm:text-sm font-semibold text-slate-300 truncate max-w-[120px] sm:max-w-[180px]"
                  title={vaultSpeciesName || photo.name}
                >
                  {vaultSpeciesName || photo.name}
                </span>
                {evaluatingFocus && (
                  <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full flex items-center space-x-1">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Rating...</span>
                  </span>
                )}
              </div>

              <div className="flex items-center">
                <button type="button" onClick={onClose} aria-label="Close preview" title="Close preview" className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 touch-manipulation">
                  <Icon name="x" className="w-6 h-6" />
                </button>
              </div>
            </div>

            <div
              ref={containerRef}
              onWheel={handleWheelZoom}
              onTouchStart={handlePointerDown}
              onTouchMove={handlePointerMove}
              onTouchEnd={handlePointerUp}
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerCancel={handlePointerUp}
              className={`flex-1 min-h-0 relative flex items-center justify-center p-2 sm:p-4 overflow-hidden select-none ${isCropToolActive ? 'cursor-crosshair' : panZoom.scale > 1 ? 'cursor-grab active:cursor-grabbing' : 'cursor-default'} touch-canvas`}
            >
              <button
                type="button"
                onPointerDown={event => event.stopPropagation()}
                onClick={event => {
                  event.stopPropagation();
                  if (onDeletePhoto) onDeletePhoto(photo.id);
                }}
                aria-label="Delete photo"
                title="Delete photo"
                className="absolute top-3 left-3 sm:top-4 sm:left-4 z-30 min-w-10 min-h-10 p-2 bg-slate-900/90 hover:bg-red-600 text-slate-300 hover:text-white rounded-xl border border-slate-700/80 shadow-xl backdrop-blur-md transition-all touch-manipulation"
              >
                <Icon name="trash" className="w-5 h-5 text-red-400 hover:text-white" />
              </button>

              {vaultSpeciesName && (
                <div className="absolute top-3 left-1/2 -translate-x-1/2 z-30 max-w-[calc(100%-7rem)] px-3 py-1.5 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-full shadow-xl pointer-events-none">
                  <span className="block truncate text-xs sm:text-sm font-bold text-white text-center" title={vaultSpeciesName}>
                    {vaultSpeciesName}
                  </span>
                </div>
              )}

              <div className="absolute bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-30 px-3.5 py-1.5 sm:px-4 sm:py-2 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-full shadow-2xl flex items-center space-x-2">
                <span className="text-[10px] sm:text-xs font-bold text-slate-300">Rating:</span>
                <StarRating
                  rating={activeStars}
                  onChange={handleRatingChange}
                  size="w-4 h-4 sm:w-5 sm:h-5"
                />
              </div>

              <div className="absolute left-3 sm:left-5 top-1/2 -translate-y-1/2 z-30 flex flex-col items-center space-y-2.5 bg-slate-900/90 p-2 sm:p-2.5 rounded-2xl border border-slate-700/90 backdrop-blur-md shadow-2xl">
                <button
                  type="button"
                  onClick={(e) => {
                    e.stopPropagation();
                    if (hasPrev && onPrevPhoto) onPrevPhoto();
                  }}
                  disabled={!hasPrev}
                  className={`p-2.5 sm:p-3 rounded-xl border transition-all touch-manipulation flex items-center justify-center ${
                    hasPrev 
                      ? 'bg-slate-800 hover:bg-emerald-600 text-slate-100 border-slate-700 hover:border-emerald-500 shadow-md active:scale-95' 
                      : 'bg-slate-900/50 text-slate-600 border-slate-800/50 opacity-30 cursor-not-allowed'
                  }`}
                  title="Previous Photo"
                >
                  <Icon name="chevronLeft" className="w-5 h-5 sm:w-6 sm:h-6" />
                </button>

                <div className="w-6 h-px bg-slate-700/60"></div>

                <button
                  type="button"
                  onClick={(e) => {
                    e.stopPropagation();
                    if (hasNext && onNextPhoto) onNextPhoto();
                  }}
                  disabled={!hasNext}
                  className={`p-2.5 sm:p-3 rounded-xl border transition-all touch-manipulation flex items-center justify-center ${
                    hasNext 
                      ? 'bg-slate-800 hover:bg-emerald-600 text-slate-100 border-slate-700 hover:border-emerald-500 shadow-md active:scale-95' 
                      : 'bg-slate-900/50 text-slate-600 border-slate-800/50 opacity-30 cursor-not-allowed'
                  }`}
                  title="Next Photo"
                >
                  <Icon name="chevronRight" className="w-5 h-5 sm:w-6 sm:h-6" />
                </button>
              </div>

              <div 
                className="relative flex items-center justify-center w-full h-full max-w-full max-h-full transition-transform duration-75 ease-out"
                style={{
                  transform: `scale(${panZoom.scale}) translate(${panZoom.x / panZoom.scale}px, ${panZoom.y / panZoom.scale}px)`,
                  transformOrigin: 'center center'
                }}
              >
                {showCroppedPreview && hasValidCropBox && !isDrawingCrop ? (
                  <div className="relative flex items-center justify-center w-full h-full max-h-[calc(100vh-8rem)] max-w-full p-2">
                    <CroppedImage
                      innerRef={imgRef}
                      src={isHoldingOriginal ? (photo.blobUrl || activeBlobUrl) : (enhancedPreviewUrl || activeBlobUrl)}
                      alt={photo.name}
                      cropBox={cropBox}
                      photo={photo}
                      fitMode="contain"
                      className="rounded-2xl border border-slate-700 shadow-2xl overflow-hidden max-h-[calc(100vh-10rem)] max-w-full"
                    >
                      <button
                        type="button"
                        aria-label="Remove crop region"
                        title="Remove crop region"
                        onPointerDown={e => e.stopPropagation()}
                        onTouchStart={e => e.stopPropagation()}
                        onClick={handleClearCropBox}
                        className="absolute -top-3 -right-3 pointer-events-auto z-30 w-6 h-6 flex items-center justify-center rounded-full bg-red-600 hover:bg-red-500 text-white border-2 border-slate-950 shadow-lg touch-manipulation"
                      >
                        <Icon name="x" className="w-3.5 h-3.5" />
                      </button>
                    </CroppedImage>
                  </div>
                ) : (
                  <div className="relative flex items-center justify-center w-full h-full max-w-full max-h-full">
                    <CroppedImage
                      innerRef={imgRef}
                      src={isHoldingOriginal ? (photo.blobUrl || activeBlobUrl) : (enhancedPreviewUrl || activeBlobUrl)}
                      alt={photo.name}
                      cropBox={null}
                      photo={photo}
                      fitMode="contain"
                      className="rounded-2xl border border-slate-800 shadow-2xl overflow-hidden"
                    >
                      {cropBox && cropBox.width > 0 && !isShowingBakedCrop && (
                        <div
                          className="absolute border-2 border-emerald-400 bg-emerald-500/20 z-20 shadow-[0_0_0_9999px_rgba(0,0,0,0.6)]"
                          style={{
                            left: `${cropBox.x}%`,
                            top: `${cropBox.y}%`,
                            width: `${cropBox.width}%`,
                            height: `${cropBox.height}%`
                          }}
                        >
                          <span className="absolute -top-6 left-0 pointer-events-none bg-emerald-600 text-white text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap shadow">
                            Crop ROI ({cropBox.width.toFixed(0)}% × {cropBox.height.toFixed(0)}%)
                          </span>
                          <button
                            type="button"
                            aria-label="Remove crop region"
                            title="Remove crop region"
                            onPointerDown={e => e.stopPropagation()}
                            onTouchStart={e => e.stopPropagation()}
                            onClick={handleClearCropBox}
                            className="absolute -top-3 -right-3 pointer-events-auto z-30 w-6 h-6 flex items-center justify-center rounded-full bg-red-600 hover:bg-red-500 text-white border-2 border-slate-950 shadow-lg touch-manipulation"
                          >
                            <Icon name="x" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      )}
                    </CroppedImage>
                  </div>
                )}
              </div>

              {isLoupeActive && (
                <div
                  className="absolute pointer-events-none z-30"
                  style={{
                    left: `${loupeScreenPos.x}px`,
                    top: `${loupeScreenPos.y}px`,
                    transform: 'translate(-50%, -50%)'
                  }}
                >
                  <canvas
                    ref={loupeCanvasRef}
                    width={loupeDiameter}
                    height={loupeDiameter}
                    className="loupe-lens-canvas w-36 h-36 sm:w-48 sm:h-48 rounded-full border-2 border-emerald-400 bg-slate-950"
                  />
                </div>
              )}

              {aiResult && aiResult.heatmapPoints && showHeatmapOverlay && (
                <div className="absolute inset-0 pointer-events-none">
                  {aiResult.heatmapPoints.map((pt, i) => (
                    <div
                      key={i}
                      className="absolute w-6 h-6 -ml-3 -mt-3 rounded-full bg-emerald-500/40 border-2 border-emerald-400 animate-ping flex items-center justify-center"
                      style={{ left: `${pt.x}%`, top: `${pt.y}%` }}
                      title={pt.label || "Key Feature"}
                    >
                      <span className="w-2 h-2 rounded-full bg-emerald-300"></span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {showEnhancementPanel && (
              <div className="md:hidden flex-shrink-0 max-h-[38vh] overflow-y-auto overscroll-contain bg-slate-900 border-t border-slate-700 px-3 py-2 space-y-2">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-1.5 text-xs font-bold text-slate-100">
                    <Icon name="sparkles" className="w-4 h-4 text-emerald-400" />
                    <span>AI Processing</span>
                    {activeVersions.length > 1 && <span className="text-[9px] text-emerald-300">{activeVersionId}</span>}
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowEnhancementPanel(false)}
                    aria-label="Close AI processing controls"
                    className="p-1 text-slate-400 hover:text-white rounded touch-manipulation"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                {activeVersions.length > 1 && (
                  <div className="flex gap-1.5 overflow-x-auto">
                    {activeVersions.map(version => (
                      <div key={version.versionId} className="flex flex-shrink-0 items-center rounded-lg border border-slate-700 bg-slate-950">
                        <button
                          type="button"
                          onClick={() => handleSelectVersion(version.versionId)}
                          disabled={isDeletingVersion}
                          aria-pressed={activeVersionId === version.versionId}
                          aria-label={`Show ${version.label}${activeVersionId === version.versionId ? ', active version' : ''}`}
                          className={`text-[10px] font-semibold px-2 py-1 rounded-l-lg touch-manipulation ${
                            activeVersionId === version.versionId
                              ? 'bg-emerald-600 text-white'
                              : 'text-slate-400'
                          }`}
                        >
                          {version.label}
                        </button>
                        {!version.isOriginal && (
                          <button
                            type="button"
                            onClick={() => setPendingDeleteVersionId(version.versionId)}
                            disabled={isDeletingVersion}
                            aria-label={`Delete ${version.label}`}
                            title={`Delete ${version.label}`}
                            className="px-1.5 py-1 text-slate-500 hover:text-red-400 touch-manipulation"
                          >
                            <Icon name="trash" className="w-3 h-3" />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                {pendingDeleteVersionId && (
                  <div className="flex items-center justify-between gap-2 bg-red-950/40 border border-red-500/40 px-2 py-1.5 rounded-lg">
                    <span className="text-[10px] text-red-200">Delete this processed version?</span>
                    <div className="flex items-center gap-1.5">
                      <button type="button" onClick={() => setPendingDeleteVersionId(null)} disabled={isDeletingVersion} className="px-2 py-1 text-[10px] text-slate-300 touch-manipulation disabled:opacity-50">Cancel</button>
                      <button
                        type="button"
                        onClick={() => handleDeleteVersion(pendingDeleteVersionId)}
                        disabled={isDeletingVersion}
                        aria-busy={isDeletingVersion}
                        className="px-2 py-1 text-[10px] font-bold text-white bg-red-600 rounded touch-manipulation disabled:opacity-50"
                      >
                        {isDeletingVersion ? 'Deleting...' : 'Delete'}
                      </button>
                    </div>
                  </div>
                )}

                <div className="flex items-center justify-between gap-2">
                  <span className="text-[10px] font-semibold text-slate-400">Scope</span>
                  <div className="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800">
                    <button
                      type="button"
                      onClick={() => setEnhanceScope('full')}
                      aria-pressed={enhanceScope === 'full'}
                      className={`text-[10px] px-2.5 py-1 rounded font-semibold touch-manipulation ${enhanceScope === 'full' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}
                    >
                      Full
                    </button>
                    <button
                      type="button"
                      onClick={() => setEnhanceScope('crop')}
                      disabled={!cropBox || cropBox.width <= 0}
                      aria-pressed={enhanceScope === 'crop'}
                      className={`text-[10px] px-2.5 py-1 rounded font-semibold touch-manipulation ${enhanceScope === 'crop' ? 'bg-emerald-600 text-white' : 'text-slate-400 disabled:opacity-40'}`}
                    >
                      Crop
                    </button>
                  </div>
                  <button
                    type="button"
                    onClick={handleAutoTuneAiParams}
                    disabled={isEstimatingParams}
                    aria-label={isEstimatingParams ? 'Tuning image parameters' : 'Auto-tune parameters with AI'}
                    className="px-2.5 py-1.5 bg-slate-800 text-emerald-300 border border-slate-700 rounded-lg text-[10px] font-semibold disabled:opacity-50 touch-manipulation"
                  >
                    {isEstimatingParams ? 'Tuning...' : 'Auto-Tune'}
                  </button>
                </div>

                {enhancementNotes && <p className="text-[10px] text-slate-400 truncate" title={enhancementNotes}>{enhancementNotes}</p>}
                {enhancementSaveError && <p role="alert" className="text-[10px] text-red-300">{enhancementSaveError}</p>}
                {versionLoadError && <p role="alert" className="text-[10px] text-rose-300">{versionLoadError}</p>}

                <div className="grid grid-cols-2 gap-x-3 gap-y-1.5">
                  {[
                    ['sharpness', 'Sharpness'],
                    ['denoise', 'Noise reduction'],
                    ['vibrance', 'Vibrance'],
                    ['contrast', 'Contrast']
                  ].map(([key, label]) => (
                    <label key={key} className="min-w-0">
                      <span className="flex items-center justify-between text-[10px] text-slate-300">
                        <span className="truncate">{label}</span>
                        <span className="text-emerald-400 font-bold">{enhanceParams[key]}%</span>
                      </span>
                      <input
                        type="range"
                        min="0"
                        max="100"
                        value={enhanceParams[key]}
                        onChange={event => setEnhanceParams(prev => ({ ...prev, [key]: parseInt(event.target.value) }))}
                        aria-label={label}
                        className="w-full accent-emerald-500 h-1.5 cursor-pointer touch-manipulation"
                      />
                    </label>
                  ))}
                </div>

                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleGenerateEnhancementPreview}
                    disabled={isProcessingEnhancement}
                    aria-busy={isProcessingEnhancement}
                    aria-label={isProcessingEnhancement ? 'Rendering preview' : 'Show live preview'}
                    className="flex-1 min-h-9 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs rounded-lg border border-slate-700 transition flex items-center justify-center gap-1 touch-manipulation disabled:opacity-50"
                  >
                    <Icon name="eye" className="w-3.5 h-3.5 text-emerald-400" />
                    {isProcessingEnhancement ? 'Rendering...' : 'Preview'}
                  </button>
                  {enhancedPreviewUrl && (
                    <button
                      type="button"
                      onPointerDown={() => setIsHoldingOriginal(true)}
                      onPointerUp={() => setIsHoldingOriginal(false)}
                      onPointerCancel={() => setIsHoldingOriginal(false)}

                  >
