<body class="h-[100dvh] w-full overflow-hidden bg-slate-950 text-slate-100 flex flex-col">
  <div id="root" class="h-full w-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const GEMINI_QUOTAS = {
      MAX_RPM: 15,
      MAX_TPM: 1000000,
      MAX_RPD: 1500
    };

    const BATCH_PAGE_SIZE = 20;
    const TIMELINE_PAGE_SIZE = 10;
    const VAULT_PAGE_SIZE = 5;
    const MIN_CROP_DIMENSION_PCT = 2.0;

    function getStoredTokenUsage() {
      try {
        const raw = localStorage.getItem('birdvault_gemini_usage');
        if (raw) {
          const usage = JSON.parse(raw);
          const now = Date.now();
          if (!usage.minuteWindowStart || now - usage.minuteWindowStart > 60000) {
            usage.minuteWindowStart = now;
            usage.minuteRequests = 0;
            usage.minuteTokens = 0;
          }
          if (!usage.dailyWindowStart || now - usage.dailyWindowStart > 86400000) {
            usage.dailyWindowStart = now;
            usage.dailyRequests = 0;
          }
          return usage;
        }
      } catch (e) {}
      return {
        minuteWindowStart: Date.now(),
        minuteRequests: 0,
        minuteTokens: 0,
        dailyWindowStart: Date.now(),
        dailyRequests: 0
      };
    }

    function getStoredFingerprintDb() {
      try {
        const raw = localStorage.getItem('birdvault_fingerprints_v1');
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveFingerprintMetadata(photo) {
      const fingerprintId = photo?.fingerprintId || photo?.id;
      if (!photo || !fingerprintId) return;
      try {
        const db = getStoredFingerprintDb();
        db[fingerprintId] = {
          id: photo.id,
          fingerprintId,
          relativePath: photo.relativePath,
          name: photo.name,
          size: photo.size,
          lastModified: photo.lastModified,
          sharpness: photo.sharpness,
          sharpnessSource: photo.sharpnessSource,
          stars: photo.stars,
          userStars: photo.userStars,
          focusSpot: photo.focusSpot,
          cameraExif: photo.cameraExif,
          identification: photo.identification,
          cropBox: photo.cropBox,
          locationText: photo.locationText,
          opfsFileName: photo.opfsFileName,
          activeVersionId: photo.activeVersionId,
          versions: photo.versions ? photo.versions.map(v => ({...v, blobUrl: null, thumbnailUrl: null})) : undefined
        };
        localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
      } catch (e) {
        console.warn(`Could not save photo metadata for "${photo.name || photo.fingerprintId}":`, e);
      }
    }

    function deleteFingerprintMetadata(fingerprintId) {
      if (!fingerprintId) return;
      try {
        const db = getStoredFingerprintDb();
        delete db[fingerprintId];
        localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
      } catch (e) {}
    }

    function stripEphemeralVaultImageUrls(image) {
      if (!image || typeof image !== 'object') return image;
      const clearBlobUrl = value => typeof value === 'string' && value.startsWith('blob:') ? null : value;
      const stripVersionUrls = version => ({
        ...version,
        blobUrl: clearBlobUrl(version.blobUrl),
        thumbnailUrl: clearBlobUrl(version.thumbnailUrl),
        url: clearBlobUrl(version.url)
      });
      return {
        ...image,
        blobUrl: clearBlobUrl(image.blobUrl),
        thumbnailUrl: clearBlobUrl(image.thumbnailUrl),
        url: clearBlobUrl(image.url),
        versions: image.versions?.map(stripVersionUrls)
      };
    }

    function sanitizeVaultImageUrls(entries) {
      return (entries || []).map(entry => ({
        ...entry,
        sightings: (entry.sightings || []).map(sighting => ({
          ...stripEphemeralVaultImageUrls(sighting),
          photo: stripEphemeralVaultImageUrls(sighting.photo)
        }))
      }));
    }

    function getStoredVault() {
      try {
        const raw = localStorage.getItem('birdvault_entries_v5');
        return raw ? sanitizeVaultImageUrls(JSON.parse(raw)) : [];
      } catch (e) {
        return [];
      }
    }

    function saveVaultToStorage(entries) {
      try {
        localStorage.setItem('birdvault_entries_v5', JSON.stringify(sanitizeVaultImageUrls(entries)));
      } catch (e) {}
    }

    function getVaultBlobStorageKey(category, speciesName, fileName) {
      return JSON.stringify([category || 'Other', speciesName || 'Uncategorized', fileName]);
    }

    function getSightingImageFileNames(sighting) {
      const names = new Set();
      const addFileName = (fileName) => {
        if (fileName === undefined || fileName === null || fileName === '') return;
        if (typeof fileName !== 'string' || fileName === '.' || fileName === '..' || fileName.includes('/') || fileName.includes('\\')) {
          throw new Error('The vault manifest contains an invalid image filename.');
        }
        names.add(fileName);
      };
      addFileName(sighting?.opfsFileName);
      addFileName(sighting?.photo?.opfsFileName);
      (sighting?.versions || []).forEach(version => addFileName(version?.opfsFileName));
      (sighting?.photo?.versions || []).forEach(version => addFileName(version?.opfsFileName));
      return Array.from(names);
    }

    async function exportOpfsVaultToZip(vaultEntries) {
      if (typeof JSZip === 'undefined') {
        throw new Error('JSZip library is not loaded.');
      }
      const zip = new JSZip();
      const manifest = {
        format: 'BirdVaultVaultBackup',
        version: 2,
        exportDate: new Date().toISOString(),
        totalSpecies: vaultEntries.length,
        vaultEntries: sanitizeVaultImageUrls(vaultEntries)
      };
      zip.file('vault_manifest.json', JSON.stringify(manifest, null, 2));

      const missingFiles = [];
      const exportedFiles = new Set();
      for (const entry of vaultEntries) {
        const catDir = await sanitizeDirectoryName(entry.category || 'Other');
        const speciesDir = await sanitizeDirectoryName(entry.speciesName || 'Unknown');
        const folder = zip.folder(`${catDir}/${speciesDir}`);

        for (const s of (entry.sightings || [])) {
          for (const fileName of getSightingImageFileNames(s)) {
            const assetKey = getVaultBlobStorageKey(entry.category, entry.speciesName, fileName);
            if (exportedFiles.has(assetKey)) continue;
            const blob = await getOpfsSightingFileBlob(entry.category, entry.speciesName, fileName);
            if (!blob) {
              missingFiles.push(`${entry.speciesName}/${fileName}`);
              continue;
            }
            folder.file(fileName, blob);
            exportedFiles.add(assetKey);
          }
        }
      }

      if (missingFiles.length) {
        throw new Error(`Could not include ${missingFiles.length} referenced image file(s): ${missingFiles.slice(0, 5).join(', ')}${missingFiles.length > 5 ? ', ...' : ''}`);
      }

      const content = await zip.generateAsync({ type: 'blob' });
      return new File([content], `BirdVault_Lifer_Export_${new Date().toISOString().split('T')[0]}.zip`, { type: 'application/zip' });
    }

    function mergeVaultEntries(existingEntries, restoredEntries) {
      const mergedEntries = existingEntries.map(entry => ({ ...entry, sightings: [...(entry.sightings || [])] }));
      const entriesBySpecies = new Map(mergedEntries.map(entry => [entry.speciesName.toLowerCase(), entry]));

      const mergeRecords = (existing, restored) => {
        const result = { ...restored, ...existing };
        const versions = new Map();
        [...(restored?.versions || []), ...(existing?.versions || [])].forEach(version => {
          if (version?.versionId) versions.set(version.versionId, { ...versions.get(version.versionId), ...version });
        });
        if (versions.size) result.versions = Array.from(versions.values());

        if (existing?.photo || restored?.photo) {
          result.photo = mergeRecords(existing?.photo || {}, restored?.photo || {});
        }
        return result;
      };

      for (const restoredEntry of restoredEntries) {
        const speciesKey = restoredEntry.speciesName.toLowerCase();
        const existingEntry = entriesBySpecies.get(speciesKey);
        if (!existingEntry) {
          const newEntry = { ...restoredEntry, sightings: [...(restoredEntry.sightings || [])] };
          mergedEntries.push(newEntry);
          entriesBySpecies.set(speciesKey, newEntry);
          continue;
        }

        const sightingsById = new Map(existingEntry.sightings.map((sighting, index) => [sighting.id, index]));
        for (const restoredSighting of restoredEntry.sightings || []) {
          const existingIndex = sightingsById.get(restoredSighting.id);
          if (existingIndex === undefined) {
            sightingsById.set(restoredSighting.id, existingEntry.sightings.length);
            existingEntry.sightings.push(restoredSighting);
          } else {
            existingEntry.sightings[existingIndex] = mergeRecords(existingEntry.sightings[existingIndex], restoredSighting);
          }
        }
      }

      return mergedEntries;
    }

    async function importVaultArchive(zipFile, existingEntries) {
      if (typeof JSZip === 'undefined') {
        throw new Error('JSZip library is not loaded.');
      }
      const zip = await JSZip.loadAsync(zipFile);
      const manifestFile = zip.file('vault_manifest.json');
      if (!manifestFile) throw new Error('This ZIP does not contain a BirdVault vault manifest.');

      let manifest;
      try {
        manifest = JSON.parse(await manifestFile.async('string'));
      } catch (err) {
        throw new Error('The vault manifest is invalid or unreadable.');
      }
      if (
        !manifest ||
        !Array.isArray(manifest.vaultEntries) ||
        (manifest.format && manifest.format !== 'BirdVaultVaultBackup') ||
        (manifest.version !== undefined && (!Number.isInteger(manifest.version) || manifest.version < 1 || manifest.version > 2)) ||
        (manifest.format === 'BirdVaultVaultBackup' && manifest.version !== 2)
      ) {
        throw new Error('The ZIP is not a supported BirdVault vault backup.');
      }

      const isCompleteBackup = manifest.format === 'BirdVaultVaultBackup' && manifest.version === 2;
      const archiveDirectoryName = name => (name || 'Uncategorized').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 60);
      const findArchiveImage = (entry, fileName) => {
        const category = entry.category || 'Other';
        const modernPath = `${archiveDirectoryName(category)}/${archiveDirectoryName(entry.speciesName)}/${fileName}`;
        const legacyCatDir = category.replace(/[^a-zA-Z0-9_-]/g, '_');
        const legacySpeciesDir = entry.speciesName.replace(/[^a-zA-Z0-9_-]/g, '_');
        return zip.file(modernPath) || zip.file(`${legacyCatDir}/${legacySpeciesDir}/${fileName}`);
      };

      for (const entry of manifest.vaultEntries) {
        if (
          !entry ||
          typeof entry.speciesName !== 'string' ||
          !entry.speciesName.trim() ||
          (entry.category !== undefined && typeof entry.category !== 'string') ||
          !Array.isArray(entry.sightings)
        ) {
          throw new Error('The vault manifest contains an invalid species record.');
        }
        for (const sighting of entry.sightings) {
          if (
            !sighting ||
            typeof sighting.id !== 'string' ||
            !sighting.id ||
            (sighting.photo !== undefined && sighting.photo !== null && (typeof sighting.photo !== 'object' || Array.isArray(sighting.photo))) ||
            (sighting.versions !== undefined && !Array.isArray(sighting.versions)) ||
            (sighting.photo?.versions !== undefined && !Array.isArray(sighting.photo.versions))
          ) {
            throw new Error(`Species "${entry.speciesName}" contains an invalid sighting record.`);
          }
          for (const version of [...(sighting.versions || []), ...(sighting.photo?.versions || [])]) {
            if (!version || typeof version !== 'object' || typeof version.versionId !== 'string') {
              throw new Error(`Sighting "${sighting.id}" contains invalid image-version metadata.`);
            }
          }
          for (const fileName of getSightingImageFileNames(sighting)) {
            if (isCompleteBackup && !findArchiveImage(entry, fileName)) {
              throw new Error(`The backup is missing "${fileName}" for ${entry.speciesName}.`);
            }
          }
        }
      }

      const restoredEntries = [];
      let restoredImageCount = 0;
      let skippedSightings = 0;
      let skippedVersionCount = 0;
      const restoredFiles = new Set();

      for (const rawEntry of manifest.vaultEntries) {
        if (
          !rawEntry ||
          typeof rawEntry.speciesName !== 'string' ||
          !rawEntry.speciesName.trim() ||
          !Array.isArray(rawEntry.sightings)
        ) {
          throw new Error('The vault manifest contains an invalid species record.');
        }

        const entry = { ...rawEntry, sightings: [] };
        const category = entry.category || 'Other';
        for (const rawSighting of rawEntry.sightings) {
          if (!rawSighting || typeof rawSighting.id !== 'string' || !rawSighting.id) {
            throw new Error(`Species "${entry.speciesName}" contains an invalid sighting record.`);
          }
          const sighting = {
            ...rawSighting,
            versions: (rawSighting.versions || rawSighting.photo?.versions || []).map(version => ({ ...version })),
            photo: rawSighting.photo ? { ...rawSighting.photo } : rawSighting.photo
          };
          const missingVersionIds = new Set();
          const fileNames = getSightingImageFileNames(rawSighting);
          let availableFileCount = 0;
          for (const fileName of fileNames) {
            const blobFile = findArchiveImage(entry, fileName);
            if (!blobFile) {
              (rawSighting.versions || rawSighting.photo?.versions || []).forEach(version => {
                if (version?.opfsFileName === fileName) missingVersionIds.add(version.versionId);
              });
              continue;
            }

            const blob = await blobFile.async('blob');
            if (blob.size <= 100) throw new Error(`The backup image "${fileName}" is empty or invalid.`);
            const assetKey = getVaultBlobStorageKey(category, entry.speciesName, fileName);
            if (!restoredFiles.has(assetKey)) {
              const written = await writeOpfsSightingFile(category, entry.speciesName, fileName, blob);
              if (!written) throw new Error(`Could not restore "${fileName}" to local image storage. Previously copied files may remain; retrying the restore is safe.`);
              restoredFiles.add(assetKey);
              restoredImageCount++;
            }
            availableFileCount++;
          }

          if (fileNames.length && !availableFileCount) {
            skippedSightings++;
            continue;
          }

          if (missingVersionIds.size) {
            skippedVersionCount += missingVersionIds.size;
            sighting.versions = sighting.versions.filter(version => !missingVersionIds.has(version.versionId));
            if (sighting.photo?.versions) {
              sighting.photo.versions = sighting.photo.versions.filter(version => !missingVersionIds.has(version.versionId));
            }
          }
          entry.sightings.push(sighting);
        }
        restoredEntries.push(entry);
      }

      if (!restoredEntries.length) throw new Error('The backup contains no restorable vault records.');
      const mergedEntries = sanitizeVaultImageUrls(mergeVaultEntries(existingEntries, restoredEntries));
      try {
        localStorage.setItem('birdvault_entries_v5', JSON.stringify(mergedEntries));
      } catch (err) {
        throw new Error(`Image files were restored, but vault metadata could not be saved: ${err.message || 'local storage error'}`);
      }
      return { entries: mergedEntries, restoredImageCount, skippedSightings, skippedVersionCount };
    }

    function scoreToStars(score) {
      if (score === null || score === undefined) return 0;
      return Math.max(1, Math.min(5, Math.ceil(score / 2)));
    }

    function getEffectiveStars(photo) {
      return photo.userStars ?? photo.stars ?? scoreToStars(photo.sharpness);
    }

    function createFocusEvaluationError(reason) {
      console.error('Focus evaluation failed:', reason);
      return {
        score: null,
        stars: null,
        focusSpot: null,
        error: reason,
        debugDetails: {
          peakGradient: 0,
          coherentEdgeCount: 0,
          sharpEdgeRatioPct: 0,
          avgAcutance: 0,
          selectedRegion: null,
          rule: "Evaluation failed",
          reason
        }
      };
    }

    function scoreFocusLuminance(luminance, width, height, assumeSubjectRegion = false) {
      const pixelCount = width * height;
      const gradientX = new Float32Array(pixelCount);
      const gradientY = new Float32Array(pixelCount);
      const gradientMagnitude = new Float32Array(pixelCount);
      let peakGradient = 0;

      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const idx = y * width + x;
          const gx = (
            -luminance[(y - 1) * width + (x - 1)] + luminance[(y - 1) * width + (x + 1)] +
            -2 * luminance[y * width + (x - 1)] + 2 * luminance[y * width + (x + 1)] +
            -luminance[(y + 1) * width + (x - 1)] + luminance[(y + 1) * width + (x + 1)]
          );
          const gy = (
            -luminance[(y - 1) * width + (x - 1)] - 2 * luminance[(y - 1) * width + x] - luminance[(y - 1) * width + (x + 1)] +
            luminance[(y + 1) * width + (x - 1)] + 2 * luminance[(y + 1) * width + x] + luminance[(y + 1) * width + (x + 1)]
          );
          const magnitude = Math.hypot(gx, gy);
          gradientX[idx] = gx;
          gradientY[idx] = gy;
          gradientMagnitude[idx] = magnitude;
          if (magnitude > peakGradient) peakGradient = magnitude;
        }
      }

      const gridSize = 10;
      const grid = Array.from({ length: gridSize * gridSize }, () => ({
        edges: 0,
        sharpEdges: 0,
        acutanceTotal: 0,
        coherentEdges: 0
      }));

      for (let y = 2; y < height - 2; y++) {
        for (let x = 2; x < width - 2; x++) {
          const idx = y * width + x;
          const magnitude = gradientMagnitude[idx];
          if (magnitude < 20) continue;

          let localMin = luminance[idx];
          let localMax = luminance[idx];
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const value = luminance[(y + dy) * width + x + dx];
              if (value < localMin) localMin = value;
              if (value > localMax) localMax = value;
            }
          }
          let broadMin = localMin;
          let broadMax = localMax;
          for (let dy = -2; dy <= 2; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const value = luminance[(y + dy) * width + x + dx];
              if (value < broadMin) broadMin = value;
              if (value > broadMax) broadMax = value;
            }
          }
          const localContrast = localMax - localMin;
          const transitionSharpness = localContrast / Math.max(1, broadMax - broadMin);

          let coherentNeighbors = 0;
          let edgeNeighbors = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              const neighborIdx = (y + dy) * width + x + dx;
              const neighborMagnitude = gradientMagnitude[neighborIdx];
              if (neighborMagnitude < 20) continue;
              edgeNeighbors++;
              const alignment = Math.abs(
                gradientX[idx] * gradientX[neighborIdx] +
                gradientY[idx] * gradientY[neighborIdx]
              ) / (magnitude * neighborMagnitude);
              if (alignment >= 0.9) coherentNeighbors++;
            }
          }

          const gridX = Math.min(gridSize - 1, Math.floor(x / width * gridSize));
          const gridY = Math.min(gridSize - 1, Math.floor(y / height * gridSize));
          const region = grid[gridY * gridSize + gridX];
          region.edges++;
          region.acutanceTotal += transitionSharpness;
          if (
            transitionSharpness >= 0.6 &&
            coherentNeighbors >= 3 &&
            coherentNeighbors / Math.max(1, edgeNeighbors) >= 0.6
          ) {
            region.sharpEdges++;
          }
          if (coherentNeighbors >= 2) region.coherentEdges++;
        }
      }

      let bestRegion = null;
      for (let top = 0; top <= gridSize - 4; top++) {
        for (let left = 0; left <= gridSize - 4; left++) {
          const region = { edges: 0, sharpEdges: 0, acutanceTotal: 0, coherentEdges: 0 };
          for (let dy = 0; dy < 4; dy++) {
            for (let dx = 0; dx < 4; dx++) {
              const cell = grid[(top + dy) * gridSize + left + dx];
              region.edges += cell.edges;
              region.sharpEdges += cell.sharpEdges;
              region.acutanceTotal += cell.acutanceTotal;
              region.coherentEdges += cell.coherentEdges;
            }
          }

          const sharpRatio = region.edges ? region.sharpEdges / region.edges : 0;
          const averageAcutance = region.edges ? region.acutanceTotal / region.edges : 0;
          const ratioQuality = Math.max(0, Math.min(1, (sharpRatio - 0.02) / 0.38));
          const acutanceQuality = Math.max(0, Math.min(1, (averageAcutance - 0.55) / 0.4));
          const evidenceWeight = 0.65 + 0.35 * Math.min(1, region.edges / 160);
          const centerX = (left + 2) / (gridSize - 1);
          const centerY = (top + 2) / (gridSize - 1);
          const centerDistance = Math.hypot(centerX - 0.5, centerY - 0.5) / Math.SQRT1_2;
          const centerWeight = 1 - centerDistance * 0.05;
          const quality = ratioQuality * (0.45 + acutanceQuality * 0.55) * evidenceWeight * centerWeight;

          if (!bestRegion || quality > bestRegion.quality) {
            bestRegion = { ...region, sharpRatio, averageAcutance, quality, left, top };
          }
        }
      }

      const selectedRegion = bestRegion || {
        edges: 0,
        sharpEdges: 0,
        acutanceTotal: 0,
        coherentEdges: 0,
        sharpRatio: 0,
        averageAcutance: 0,
        quality: 0,
        left: 0,
        top: 0
      };
      let subjectConfidence = assumeSubjectRegion ? 1 : 0;
      let subjectRegion = null;
      if (!assumeSubjectRegion) {
        const totalSharpEdges = grid.reduce((total, cell) => total + cell.sharpEdges, 0);
        let bestSubjectQuality = 0;
        for (let regionHeight = 2; regionHeight <= 6; regionHeight++) {
          for (let regionWidth = 2; regionWidth <= 6; regionWidth++) {
            for (let top = 0; top <= gridSize - regionHeight; top++) {
              for (let left = 0; left <= gridSize - regionWidth; left++) {
                let insideSharpEdges = 0;
                let outsideSharpEdges = 0;
                let outsideCellCount = 0;
                for (let y = 0; y < gridSize; y++) {
                  for (let x = 0; x < gridSize; x++) {
                    const cell = grid[y * gridSize + x];
                    if (x >= left && x < left + regionWidth && y >= top && y < top + regionHeight) {
                      insideSharpEdges += cell.sharpEdges;
                    } else {
                      outsideSharpEdges += cell.sharpEdges;
                      outsideCellCount++;
                    }
                  }
                }

                if (insideSharpEdges < 20 || !totalSharpEdges) continue;
                const insideDensity = insideSharpEdges / (regionWidth * regionHeight);
                const outsideDensity = outsideSharpEdges / Math.max(1, outsideCellCount);
                const densityContrast = Math.max(0, (insideDensity - outsideDensity) / (insideDensity + 0.1));
                const edgeSupport = Math.min(1, insideSharpEdges / 100);
                const edgeConcentration = Math.min(1, insideSharpEdges / totalSharpEdges / 0.65);
                const quality = densityContrast * edgeSupport * edgeConcentration;
                if (quality > bestSubjectQuality) {
                  bestSubjectQuality = quality;
                  subjectRegion = { x: left, y: top, width: regionWidth, height: regionHeight };
                }
              }
            }
          }
        }
        subjectConfidence = Math.max(0, Math.min(1, bestSubjectQuality));
      }

      let score = Math.max(1, Math.min(10, Math.round(
        1 + selectedRegion.quality * (assumeSubjectRegion ? 1 : 0.12 + subjectConfidence * 0.88) * 9
      )));
      let ruleReason = `Focus estimate from ${selectedRegion.sharpEdges} crisp, continuous edges in the best-detail area.`;

      if (!selectedRegion.edges || !selectedRegion.sharpEdges) {
        score = 1;
        ruleReason = "No sufficiently crisp, continuous edges were detected.";
      } else if (!assumeSubjectRegion && subjectConfidence < 0.12) {
        ruleReason = "No localized subject-like detail was detected; background sharpness was strongly discounted.";
      } else if (score >= 9) {
        ruleReason = "Strong, continuous edge transitions indicate a very sharp detail area.";
      } else if (score >= 7) {
        ruleReason = "Mostly crisp detail edges indicate good focus.";
      } else if (score >= 4) {
        ruleReason = "Some detail is defined, but edges appear moderately soft.";
      } else {
        ruleReason = "Few crisp edges were detected; the image may be soft or blurred.";
      }

      const stars = scoreToStars(score);
      return {
        score,
        stars,
        debugDetails: {
          peakGradient: Math.round(peakGradient),
          coherentEdgeCount: selectedRegion.coherentEdges,
          sharpEdgeRatioPct: Math.round(selectedRegion.sharpRatio * 100),
          avgAcutance: Math.round(selectedRegion.averageAcutance * 100) / 100,
          selectedRegion: { x: selectedRegion.left, y: selectedRegion.top, width: 4, height: 4 },
          subjectConfidence: Math.round(subjectConfidence * 100) / 100,
          subjectRegion,
          rule: `Grade ${score}/10 (${stars} Stars)`,
          reason: ruleReason
        }
      };
    }

    function generateFingerprintId(file, relativePath = '') {
      if (!file) return null;
      const cleanName = (file.name || 'unnamed').replace(/[^a-zA-Z0-9._-]/g, '_');
      const fileId = `fp_${cleanName}_${file.size || 0}_${file.lastModified || 0}`;
      return relativePath.includes('/') ? `${fileId}_${encodeURIComponent(relativePath)}` : fileId;
    }

    function getFolderRelativePath(file, nativeRelativePath = '') {
      if (nativeRelativePath) return nativeRelativePath;
      const pathParts = (file?.webkitRelativePath || '').split('/').filter(Boolean);
      return pathParts.length > 1 ? pathParts.slice(1).join('/') : '';
    }

    const OPFS_VAULT_ROOT = 'BirdVault_Lifer_Catalog';
    const IDB_NAME = 'BirdVault_Storage_DB';
    const IDB_VERSION = 2;

    function openBirdVaultDb() {
      return new Promise((resolve) => {
        if (typeof indexedDB === 'undefined') return resolve(null);
        const request = indexedDB.open(IDB_NAME, IDB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('vault_blobs')) {
            db.createObjectStore('vault_blobs');
          }
          if (!db.objectStoreNames.contains('birdvault_thumbs')) {
            db.createObjectStore('birdvault_thumbs');
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => {
          console.warn('IndexedDB Open Warning:', e);
          resolve(null);
        };
      });
    }

    async function saveBlobToIdb(storeName, key, blob) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return false;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(blob, key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        });
      } catch (e) {
        console.warn('IDB Save Error:', e);
        return false;
      }
    }

    async function getBlobFromIdb(storeName, key) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function deleteFromIdb(storeName, key) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return false;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const getRequest = store.get(key);
          getRequest.onsuccess = () => {
            if (getRequest.result === undefined) {
              resolve(false);
              return;
            }
            const deleteRequest = store.delete(key);
            deleteRequest.onsuccess = () => resolve(true);
            deleteRequest.onerror = () => resolve(false);
          };
          getRequest.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    }

    async function isOpfsSupported() {
      return typeof navigator !== 'undefined' && 
             navigator.storage && 
             typeof navigator.storage.getDirectory === 'function';
    }

    async function getOpfsRootHandle() {
      if (!(await isOpfsSupported())) return null;
      try {
        const root = await navigator.storage.getDirectory();
        return await root.getDirectoryHandle(OPFS_VAULT_ROOT, { create: true });
      } catch (err) {
        console.warn('OPFS Root Access Warning:', err);
        return null;
      }
    }

    async function sanitizeDirectoryName(name) {
      return (name || 'Uncategorized').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 60);
    }

    async function writeOpfsSightingFile(category, speciesName, fileName, blobOrFile) {
      try {
        let blobToWrite = null;
        if (blobOrFile instanceof File || blobOrFile instanceof Blob) {
          blobToWrite = blobOrFile;
        } else if (typeof blobOrFile === 'string') {
          try {
            const res = await fetch(blobOrFile);
            blobToWrite = await res.blob();
          } catch (err) {
            console.warn('Could not fetch URL for OPFS write:', err);
          }
        }

        if (!blobToWrite) {
          blobToWrite = new Blob([JSON.stringify(blobOrFile, null, 2)], { type: 'application/json' });
        }

        const root = await getOpfsRootHandle();
        let persisted = false;
        if (root) {
          const catDirName = await sanitizeDirectoryName(category || 'Other');
          const speciesDirName = await sanitizeDirectoryName(speciesName);

          const catHandle = await root.getDirectoryHandle(catDirName, { create: true });
          const speciesHandle = await catHandle.getDirectoryHandle(speciesDirName, { create: true });

          const fileHandle = await speciesHandle.getFileHandle(fileName, { create: true });
          if (typeof fileHandle.createWritable === 'function') {
            const writable = await fileHandle.createWritable();
            await writable.write(blobToWrite);
            await writable.close();
            persisted = true;
          }
        }

        if (
          blobToWrite instanceof Blob &&
          fileName.toLowerCase() !== 'species_info.json' &&
          (fileName.toLowerCase().endsWith('.jpg') || !persisted)
        ) {
          const storedInIdb = await saveBlobToIdb(
            'vault_blobs',
            getVaultBlobStorageKey(category, speciesName, fileName),
            blobToWrite
          );
          persisted = persisted || storedInIdb;
        }

        return persisted;
      } catch (err) {
        console.warn('OPFS File Write Warning:', err);
        return false;
      }
    }

    async function getOpfsSightingFileBlob(category, speciesName, fileName) {
      if (!fileName) return null;

      try {
        const root = await getOpfsRootHandle();
        if (root) {
          const catDirName = await sanitizeDirectoryName(category || 'Other');
          const speciesDirName = await sanitizeDirectoryName(speciesName);

          const catHandle = await root.getDirectoryHandle(catDirName, { create: false });
          const speciesHandle = await catHandle.getDirectoryHandle(speciesDirName, { create: false });
          const fileHandle = await speciesHandle.getFileHandle(fileName, { create: false });

          const file = await fileHandle.getFile();
          if (file && file.size > 100) {
            return file;
          }
        }
      } catch (err) {}

      const scopedBlob = await getBlobFromIdb(
        'vault_blobs',
        getVaultBlobStorageKey(category, speciesName, fileName)
      );
      const idbBlob = scopedBlob || await getBlobFromIdb('vault_blobs', fileName);
      if (idbBlob && idbBlob.size > 100) {
        return idbBlob;
      }

      return null;
    }

    async function deleteOpfsSightingFile(category, speciesName, fileName) {
      if (!fileName) throw new Error('The processed version has no saved file reference.');

      const root = await getOpfsRootHandle();
      let opfsDeleted = false;
      if (root) {
        try {
          const catDirName = await sanitizeDirectoryName(category || 'Other');
          const speciesDirName = await sanitizeDirectoryName(speciesName);
          const catHandle = await root.getDirectoryHandle(catDirName, { create: false });
          const speciesHandle = await catHandle.getDirectoryHandle(speciesDirName, { create: false });
          await speciesHandle.removeEntry(fileName);
          opfsDeleted = true;
        } catch (err) {
          if (err.name !== 'NotFoundError') {
            throw new Error(`Could not delete the processed image from vault storage: ${err.message || 'storage error'}`);
          }
        }
      }

      const scopedKey = getVaultBlobStorageKey(category, speciesName, fileName);
      const idbDeleted = await deleteFromIdb('vault_blobs', scopedKey);
      const legacyIdbDeleted = await deleteFromIdb('vault_blobs', fileName);
      if (!opfsDeleted && !idbDeleted && !legacyIdbDeleted) {
        throw new Error('Could not delete the processed image from local storage.');
      }
    }

    async function updateOpfsMasterManifest(manifestData) {
      try {
        const root = await getOpfsRootHandle();
        if (!root) return false;
        const fileHandle = await root.getFileHandle('vault_manifest.json', { create: true });
        if (typeof fileHandle.createWritable === 'function') {
          const writable = await fileHandle.createWritable();
          await writable.write(JSON.stringify(manifestData, null, 2));
          await writable.close();
        }
        return true;
      } catch (err) {
        console.warn('OPFS Manifest Update Error:', err);
        return false;
      }
    }

    async function applyAiEnhancementsToImage(sourceUrlOrFile, params, cropBox = null, heatmapPoints = [], literallyCrop = false) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';

        let srcToRevoke = null;
        if (typeof sourceUrlOrFile === 'string') {
          img.src = sourceUrlOrFile;
        } else if (sourceUrlOrFile instanceof File || sourceUrlOrFile instanceof Blob) {
          srcToRevoke = URL.createObjectURL(sourceUrlOrFile);
          img.src = srcToRevoke;
        } else {
          return resolve(null);
        }

        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            let sx = 0;
            let sy = 0;
            let sw = img.naturalWidth || img.width;
            let sh = img.naturalHeight || img.height;
            const cropRequested = literallyCrop && cropBox && cropBox.width > 0 && cropBox.height > 0;
            if (cropRequested) {
              sx = (cropBox.x / 100) * sw;
              sy = (cropBox.y / 100) * sh;
              sw = (cropBox.width / 100) * sw;
              sh = (cropBox.height / 100) * sh;
            }

            canvas.width = Math.max(1, Math.round(sw));
            canvas.height = Math.max(1, Math.round(sh));
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            if (cropRequested) {
              ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            } else {
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }

            const w = canvas.width;
            const h = canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const denoiseLevel = (params.denoise || 0) / 100;
            const sharpeningLevel = (params.sharpness || 0) / 100;
            const vibranceLevel = (params.vibrance || 0) / 100;
            const contrastLevel = (params.contrast || 0) / 100;
            const shadowsLevel = (params.shadows || 0) / 100;

            // 1. Subject Mask Construction (Radial gradient from Crop ROI or Heatmap)
            const mask = new Float32Array(w * h);
            let maskCx = w / 2;
            let maskCy = h / 2;
            let maskRx = w * 0.4;
            let maskRy = h * 0.4;

            if (cropRequested) {
              maskCx = w / 2;
              maskCy = h / 2;
              maskRx = w * 0.6;
              maskRy = h * 0.6;
            } else if (cropBox && cropBox.width > 0) {
              maskCx = (cropBox.x + cropBox.width / 2) / 100 * w;
              maskCy = (cropBox.y + cropBox.height / 2) / 100 * h;
              maskRx = (cropBox.width / 2) / 100 * w * 1.2;
              maskRy = (cropBox.height / 2) / 100 * h * 1.2;
            } else if (heatmapPoints && heatmapPoints.length > 0) {
              const eyePt = heatmapPoints.find(p => p.label && p.label.toLowerCase().includes('eye')) || heatmapPoints[0];
              if (eyePt && eyePt.x !== undefined) {
                maskCx = (eyePt.x / 100) * w;
                maskCy = (eyePt.y / 100) * h;
              }
            }

            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                const dx = (x - maskCx) / maskRx;
                const dy = (y - maskCy) / maskRy;
                const distSq = dx * dx + dy * dy;
                const weight = Math.max(0.15, Math.min(1.0, 1.0 - distSq * 0.65));
                mask[y * w + x] = weight;
              }
            }

            // 2. Spatial Bilateral Denoising & High-Pass Unsharp Masking
            const copy = new Uint8ClampedArray(data);
            const sharpKernel = [-1, -1, -1, -1, 9, -1, -1, -1, -1];

            for (let y = 1; y < h - 1; y++) {
              for (let x = 1; x < w - 1; x++) {
                const idx = (y * w + x) * 4;
                const mWeight = mask[y * w + x];

                // Denoise pass across flat areas
                if (denoiseLevel > 0) {
                  let rSum = 0, gSum = 0, bSum = 0, count = 0;
                  for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                      const nIdx = ((y + dy) * w + (x + dx)) * 4;
                      rSum += copy[nIdx];
                      gSum += copy[nIdx + 1];
                      bSum += copy[nIdx + 2];
                      count++;
                    }
                  }
                  const blend = denoiseLevel * (1.0 - mWeight * 0.5);
                  data[idx] = data[idx] * (1 - blend) + (rSum / count) * blend;
                  data[idx + 1] = data[idx + 1] * (1 - blend) + (gSum / count) * blend;
                  data[idx + 2] = data[idx + 2] * (1 - blend) + (bSum / count) * blend;
                }

                // Sharpening pass on subject
                if (sharpeningLevel > 0) {
                  let sr = 0, sg = 0, sb = 0;
                  let kIdx = 0;
                  for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                      const nIdx = ((y + dy) * w + (x + dx)) * 4;
                      const k = sharpKernel[kIdx++];
                      sr += copy[nIdx] * k;
                      sg += copy[nIdx + 1] * k;
                      sb += copy[nIdx + 2] * k;
                    }
                  }
                  const sFactor = sharpeningLevel * mWeight * 0.75;
                  data[idx] = Math.min(255, Math.max(0, data[idx] * (1 - sFactor) + sr * sFactor));
                  data[idx + 1] = Math.min(255, Math.max(0, data[idx + 1] * (1 - sFactor) + sg * sFactor));
                  data[idx + 2] = Math.min(255, Math.max(0, data[idx + 2] * (1 - sFactor) + sb * sFactor));
                }

                // 3. Vibrance, Shadow Lift & Contrast Curve
                let r = data[idx];
                let g = data[idx + 1];
                let b = data[idx + 2];

                // Shadow Lift
                if (shadowsLevel > 0) {
                  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                  if (lum < 128) {
                    const shadowBoost = (1 - lum / 128) * shadowsLevel * 40;
                    r = Math.min(255, r + shadowBoost);
                    g = Math.min(255, g + shadowBoost);
                    b = Math.min(255, b + shadowBoost);
                  }
                }

                // Contrast
                if (contrastLevel !== 0) {
                  const factor = (259 * (contrastLevel * 100 + 255)) / (255 * (259 - contrastLevel * 100));
                  r = Math.min(255, Math.max(0, factor * (r - 128) + 128));
                  g = Math.min(255, Math.max(0, factor * (g - 128) + 128));
                  b = Math.min(255, Math.max(0, factor * (b - 128) + 128));
                }

                // Selective Vibrance
                if (vibranceLevel > 0) {
                  const max = Math.max(r, g, b);
                  const avg = (r + g + b) / 3;
                  const amt = (((max - avg) * -1) / 128) * vibranceLevel * 1.2;
                  r = Math.min(255, Math.max(0, r + (max - r) * amt));
                  g = Math.min(255, Math.max(0, g + (max - g) * amt));
                  b = Math.min(255, Math.max(0, b + (max - b) * amt));
                }

                data[idx] = r;
                data[idx + 1] = g;
                data[idx + 2] = b;
              }
            }

            ctx.putImageData(imgData, 0, 0);

            canvas.toBlob((blob) => {
              if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
              canvas.width = 0; canvas.height = 0;
              if (blob) resolve(blob);
              else reject(new Error('Canvas toBlob failed'));
            }, 'image/jpeg', 0.92);
          } catch (err) {
            if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
            reject(err);
          }
        };

        img.onerror = () => {
          if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
          reject(new Error('Failed to load source image for enhancement'));
        };
      });
    }

    async function estimateAiEnhancementParams(photo, userApiKey = '', scope = 'full', locationText = 'Global') {

          const resJson = await response.json();
          const text = resJson.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const clean = text.replace(/```json/g, '').replace(/```/g, '').trim();
          return JSON.parse(clean);
        }
      } catch (e) {
        console.warn('AI Parameter estimation fallback:', e);
      }

      return {
        denoise: 35,
        sharpness: 55,
        vibrance: 30,
        contrast: 20,
        shadows: 25,
        aiNotes: "Adaptive default parameters."
      };
    }

    function recordTokenUsage(estimatedTokens = 350) {
      const usage = getStoredTokenUsage();
      usage.minuteRequests += 1;
      usage.minuteTokens += estimatedTokens;
      usage.dailyRequests += 1;
      localStorage.setItem('birdvault_gemini_usage', JSON.stringify(usage));

    async function extractExifEmbeddedThumbnail(file) {
      if (!file || !(file instanceof File)) return null;
      const sliceSize = Math.min(65536, file.size);
      const blobSlice = file.slice(0, sliceSize);

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const view = new DataView(e.target.result);
            if (view.byteLength < 12 || view.getUint16(0, false) !== 0xFFD8) return resolve(null);

            let offset = 2;
            let app1Offset = -1;

            while (offset < view.byteLength - 4) {
              const marker = view.getUint16(offset, false);
              offset += 2;
              if (marker === 0xFFE1) {
                const length = view.getUint16(offset, false);
                if (view.getUint32(offset + 2, false) === 0x45786966) {
                  app1Offset = offset + 2;
                  break;
                }
                offset += length;
              } else if ((marker & 0xFF00) === 0xFF00 && marker !== 0xFF00) {
                const length = view.getUint16(offset, false);
                offset += length;
              } else {
                break;
              }
            }

            if (app1Offset === -1) return resolve(null);

            const tiffOffset = app1Offset + 6;
            if (tiffOffset + 8 > view.byteLength) return resolve(null);

            const littleEndian = view.getUint16(tiffOffset, false) === 0x4949;
            if (view.getUint16(tiffOffset + 2, littleEndian) !== 0x002A) return resolve(null);

            const firstIFDOffset = view.getUint32(tiffOffset + 4, littleEndian);
            if (!firstIFDOffset || tiffOffset + firstIFDOffset + 2 > view.byteLength) return resolve(null);

            const ifd0Entries = view.getUint16(tiffOffset + firstIFDOffset, littleEndian);
            const ifd0NextPtr = tiffOffset + firstIFDOffset + 2 + (ifd0Entries * 12);

            if (ifd0NextPtr + 4 > view.byteLength) return resolve(null);
            const ifd1Offset = view.getUint32(ifd0NextPtr, littleEndian);
            if (!ifd1Offset || tiffOffset + ifd1Offset + 2 > view.byteLength) return resolve(null);

            const ifd1Entries = view.getUint16(tiffOffset + ifd1Offset, littleEndian);
            let entryOffset = tiffOffset + ifd1Offset + 2;

            let thumbOffset = null;
            let thumbLength = null;

            for (let i = 0; i < ifd1Entries; i++) {
              if (entryOffset + 12 > view.byteLength) break;
              const tag = view.getUint16(entryOffset, littleEndian);
              const val = view.getUint32(entryOffset + 8, littleEndian);
              if (tag === 0x0201) thumbOffset = tiffOffset + val;
              if (tag === 0x0202) thumbLength = val;
              entryOffset += 12;
            }

            if (thumbOffset && thumbLength && thumbOffset + thumbLength <= file.size) {
              if (thumbOffset + thumbLength > view.byteLength) {
                const fullReader = new FileReader();
                fullReader.onload = (e2) => {
                  const thumbBlob = new Blob([e2.target.result], { type: 'image/jpeg' });
                  resolve(thumbBlob);
                };
                fullReader.onerror = () => resolve(null);
                fullReader.readAsArrayBuffer(file.slice(thumbOffset, thumbOffset + thumbLength));
              } else {
                const thumbBytes = new Uint8Array(e.target.result, thumbOffset, thumbLength);
                const thumbBlob = new Blob([thumbBytes], { type: 'image/jpeg' });
                resolve(thumbBlob);
              }
            } else {
              resolve(null);
            }
          } catch (err) {
            resolve(null);
          }
        };
        reader.onerror = () => resolve(null);
        reader.readAsArrayBuffer(blobSlice);
      });
    }

    function parseExifCaptureDate(dateValue) {
      if (dateValue === null || dateValue === undefined) return null;
      if (typeof dateValue === 'number' && Number.isFinite(dateValue)) return dateValue;

      const raw = String(dateValue).trim();
      if (!raw) return null;

      const isoCandidate = raw.replace(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/, '$1-$2-$3T$4:$5:$6');
      const parsed = new Date(isoCandidate);
      if (!Number.isNaN(parsed.getTime())) return parsed.getTime();

      const altParsed = new Date(raw);
      if (!Number.isNaN(altParsed.getTime())) return altParsed.getTime();

      return null;
    }

    async function extractCameraExif(file) {
      return new Promise((resolve) => {
        if (!file || !(file instanceof File)) return resolve(null);
        
        const reader = new FileReader();
        const slice = file.slice(0, 524288);
        
        reader.onload = (e) => {
          try {
            const view = new DataView(e.target.result);
            if (view.byteLength < 12) return resolve(null);
            if (view.getUint16(0, false) !== 0xFFD8) return resolve(null);

            let offset = 2;
            let app1Offset = -1;

            while (offset < view.byteLength - 4) {
              const marker = view.getUint16(offset, false);
              offset += 2;
              
              if (marker === 0xFFE1) {
                const length = view.getUint16(offset, false);
                const exifHeader = view.getUint32(offset + 2, false);
                if (exifHeader === 0x45786966) {
                  app1Offset = offset + 2;
                  break;
                }
                offset += length;
              } else if ((marker & 0xFF00) === 0xFF00 && marker !== 0xFF00) {
                const length = view.getUint16(offset, false);
                offset += length;
              } else {
                break;
              }
            }

            if (app1Offset === -1) return resolve(null);

            const tiffOffset = app1Offset + 6;
            if (tiffOffset + 8 > view.byteLength) return resolve(null);

            const endianCode = view.getUint16(tiffOffset, false);
            let littleEndian = false;
            if (endianCode === 0x4949) {
              littleEndian = true;
            } else if (endianCode === 0x4D4D) {
              littleEndian = false;
            } else {
              return resolve(null);
            }

            if (view.getUint16(tiffOffset + 2, littleEndian) !== 0x002A) return resolve(null);

            const firstIFDOffset = view.getUint32(tiffOffset + 4, littleEndian);
            if (!firstIFDOffset) return resolve(null);

            const getString = (start, length) => {
              let str = '';
              for (let i = 0; i < length; i++) {
                if (start + i >= view.byteLength) break;
                const charCode = view.getUint8(start + i);
                if (charCode === 0) break;
                str += String.fromCharCode(charCode);
              }
              return str.trim();
            };

            const getRational = (valueOffset) => {
              if (valueOffset + 8 > view.byteLength) return null;
              const num = view.getUint32(valueOffset, littleEndian);
              const den = view.getUint32(valueOffset + 4, littleEndian);
              if (den === 0) return null;
              return num / den;
            };

            const getValue = (type, count, valueOffset, entryOffset) => {
              if (type === 3) {
                if (count === 1) return view.getUint16(entryOffset + 8, littleEndian);
                const arr = [];
                const arrOffset = count * 2 > 4 ? tiffOffset + valueOffset : entryOffset + 8;
                for (let k = 0; k < count; k++) {
                  if (arrOffset + k * 2 + 2 <= view.byteLength) {
                    arr.push(view.getUint16(arrOffset + k * 2, littleEndian));
                  }
                }
                return arr;
              } else if (type === 4) {
                if (count === 1) return view.getUint32(entryOffset + 8, littleEndian);
                const arr = [];
                const arrOffset = count * 4 > 4 ? tiffOffset + valueOffset : entryOffset + 8;
                for (let k = 0; k < count; k++) {
                  if (arrOffset + k * 4 + 4 <= view.byteLength) {
                    arr.push(view.getUint32(arrOffset + k * 4, littleEndian));
                  }
                }
                return arr;
              } else if (type === 5 || type === 10) {
                return getRational(tiffOffset + valueOffset);
              } else if (type === 2) {
                const strOffset = count > 4 ? tiffOffset + valueOffset : entryOffset + 8;
                return getString(strOffset, count);
              }
              return null;
            };

            const readIFD = (ifdStart) => {
              const tags = {};
              if (ifdStart + 2 > view.byteLength) return tags;
              const numEntries = view.getUint16(ifdStart, littleEndian);
              let entryOffset = ifdStart + 2;

              for (let i = 0; i < numEntries; i++) {
                if (entryOffset + 12 > view.byteLength) break;
                const tag = view.getUint16(entryOffset, littleEndian);
                const type = view.getUint16(entryOffset + 2, littleEndian);
                const count = view.getUint32(entryOffset + 4, littleEndian);
                const valueOffset = view.getUint32(entryOffset + 8, littleEndian);

                const val = getValue(type, count, valueOffset, entryOffset);
                if (val !== null && val !== undefined) {
                  tags[tag] = val;
                }
                entryOffset += 12;
              }
              return tags;
            };

            const ifd0Tags = readIFD(tiffOffset + firstIFDOffset);

            let cameraData = {
              make: ifd0Tags[0x010F] || null,
              model: ifd0Tags[0x0110] || null,
              lens: null,
              shutterSpeed: null,
              aperture: null,
              apertureValue: null,
              iso: null,
              focalLength: null,
              focalLengthValue: null,
              subjectDistance: null,
              focusArea: null,
              captureDate: null,
              captureTimestamp: null
            };

            const exifSubIFDOffset = ifd0Tags[0x8769];
            if (exifSubIFDOffset) {
              const exifTags = readIFD(tiffOffset + exifSubIFDOffset);

              const captureDateCandidate = exifTags[0x9003] || exifTags[0x9004] || ifd0Tags[0x0132];
              if (captureDateCandidate) {
                const captureTimestamp = parseExifCaptureDate(captureDateCandidate);
                if (captureTimestamp) {
                  cameraData.captureTimestamp = captureTimestamp;
                  cameraData.captureDate = new Date(captureTimestamp).toISOString();
                }
              }

              if (exifTags[0x920A] !== undefined) {
                const fl = parseFloat(exifTags[0x920A]);
                if (!isNaN(fl) && fl > 0) {
                  cameraData.focalLengthValue = fl;
                  cameraData.focalLength = `${Math.round(fl)}mm`;
                  if (exifTags[0xA405]) {
                    cameraData.focalLength += ` (${exifTags[0xA405]}mm eq)`;
                  }
                }
              }

              if (exifTags[0x829A] !== undefined) {
                const expTime = parseFloat(exifTags[0x829A]);
                if (!isNaN(expTime) && expTime > 0) {
                  if (expTime < 1) {
                    cameraData.shutterSpeed = `1/${Math.round(1 / expTime)}s`;
                  } else {
                    cameraData.shutterSpeed = `${expTime.toFixed(1)}s`;
                  }
                }
              }

              if (exifTags[0x829D] !== undefined) {
                const fnum = parseFloat(exifTags[0x829D]);
                if (!isNaN(fnum) && fnum > 0) {
                  cameraData.apertureValue = fnum;
                  cameraData.aperture = `f/${fnum.toFixed(1)}`;
                }
              }

              const isoVal = exifTags[0x8827] || exifTags[0x8833];
              if (isoVal !== undefined) {
                cameraData.iso = `ISO ${isoVal}`;
              }

              if (exifTags[0xA434]) {
                cameraData.lens = exifTags[0xA434];
              }

              const imgW = exifTags[0xA002] || ifd0Tags[0x0100] || null;
              const imgH = exifTags[0xA003] || ifd0Tags[0x0101] || null;
              const subjectArea = exifTags[0x9214] || ifd0Tags[0x9214] || null;

              if (Array.isArray(subjectArea) && imgW && imgH && imgW > 0 && imgH > 0) {
                const cx = subjectArea[0];
                const cy = subjectArea[1];
                let w = imgW * 0.2;
                let h = imgH * 0.2;

                if (subjectArea.length === 4) {
                  w = subjectArea[2];
                  h = subjectArea[3];
                } else if (subjectArea.length === 3) {
                  w = subjectArea[2] * 2;
                  h = subjectArea[2] * 2;
                }

                if (cx > 0 && cy > 0) {
                  cameraData.focusArea = {
                    xPct: Math.max(0, Math.min(100, (cx / imgW) * 100)),
                    yPct: Math.max(0, Math.min(100, (cy / imgH) * 100)),
                    widthPct: Math.max(5, Math.min(100, (w / imgW) * 100)),
                    heightPct: Math.max(5, Math.min(100, (h / imgH) * 100)),
                    source: 'Camera EXIF AF Point (SubjectArea Tag 0x9214)'
                  };
                }
              }
            }

            if (cameraData.make || cameraData.model || cameraData.focalLength || cameraData.shutterSpeed || cameraData.aperture || cameraData.iso || cameraData.lens || cameraData.focusArea || cameraData.captureTimestamp) {
              resolve(cameraData);
            } else {
              resolve(null);
            }
          } catch (err) {
            console.warn('EXIF binary parse error:', err);
            resolve(null);
          }
        };
        reader.onerror = () => resolve(null);
        reader.readAsArrayBuffer(slice);
      });
    }

    function getCropThumbnailCacheKey(photo) {
      const cropBox = photo?.cropBox;
      if (!cropBox || cropBox.width <= 0 || cropBox.height <= 0) return null;
      const fpId = photo.fingerprintId || photo.id;
      if (!fpId) return null;
      const cropKey = [cropBox.x, cropBox.y, cropBox.width, cropBox.height]
        .map(value => Number(value).toFixed(3))
        .join('_');
      return `${fpId}_crop_v1_${cropKey}`;
    }

    async function generateFastThumbnail(photo, targetSize = 240) {
      const fpId = photo.fingerprintId || photo.id;
      const file = photo.file;
      const thumbnailCacheKey = fpId ? `${fpId}_oriented_v3` : null;
      const cropCacheKey = getCropThumbnailCacheKey(photo);
      const cropBox = cropCacheKey ? photo.cropBox : null;
      let cachedThumbnail = null;
      let cachedCropThumbnail = null;

      if (thumbnailCacheKey) {
        cachedThumbnail = await getBlobFromIdb('birdvault_thumbs', thumbnailCacheKey);
        if (cachedThumbnail?.size <= 50) cachedThumbnail = null;
      }
      if (cropCacheKey) {
        cachedCropThumbnail = await getBlobFromIdb('birdvault_thumbs', cropCacheKey);
        if (cachedCropThumbnail?.size <= 50) cachedCropThumbnail = null;
      }

      if (cachedThumbnail && (!cropCacheKey || cachedCropThumbnail)) {
        try {
          const bitmap = await createImageBitmap(cachedThumbnail, { imageOrientation: 'from-image' });
          const width = bitmap.width;
          const height = bitmap.height;
          bitmap.close();
          return {
            thumbUrl: URL.createObjectURL(cachedThumbnail),
            cropThumbUrl: cachedCropThumbnail ? URL.createObjectURL(cachedCropThumbnail) : null,
            cropCacheKey,
            width,
            height
          };
        } catch (err) {
          console.warn('Cached thumbnail dimensions unavailable; regenerating thumbnail:', err);
        }
      }

      if (!file) {
        const source = photo.thumbnailUrl || photo.blobUrl || photo.url;
        if (!source) return { thumbUrl: '', cropThumbUrl: null, cropCacheKey, width: 1000, height: 750 };
        try {
          const img = new Image();
          const dimensions = await new Promise((resolve, reject) => {
            img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
            img.onerror = () => reject(new Error('Could not read thumbnail dimensions'));
            img.src = source;
          });
          return { thumbUrl: source, cropThumbUrl: null, cropCacheKey, ...dimensions };
        } catch (err) {
          console.warn('Thumbnail dimensions unavailable:', err);
          return { thumbUrl: source, cropThumbUrl: null, cropCacheKey, width: 1000, height: 750 };
        }
      }

      try {
        if ('createImageBitmap' in window) {
          const needsCropBitmap = !!cropBox && !cachedCropThumbnail;
          const bitmap = await createImageBitmap(file, {
            resizeWidth: needsCropBitmap ? 1800 : targetSize,
            resizeQuality: 'high',
            imageOrientation: 'from-image'
          });
          const thumbnailScale = Math.min(targetSize / bitmap.width, targetSize / bitmap.height);
          const width = Math.max(1, Math.round(bitmap.width * thumbnailScale));
          const height = Math.max(1, Math.round(bitmap.height * thumbnailScale));
          const thumbnailCanvas = document.createElement('canvas');
          thumbnailCanvas.width = width;
          thumbnailCanvas.height = height;
          const thumbnailContext = thumbnailCanvas.getContext('2d', { alpha: false });
          thumbnailContext.imageSmoothingEnabled = true;
          thumbnailContext.imageSmoothingQuality = 'high';
          thumbnailContext.drawImage(bitmap, 0, 0, width, height);

          const thumbnailBlob = cachedThumbnail ? null : await new Promise(resolve => {
            thumbnailCanvas.toBlob(resolve, 'image/jpeg', 0.82);
          });
          thumbnailCanvas.width = 0;
          thumbnailCanvas.height = 0;

          let cropBlob = cachedCropThumbnail;
          if (needsCropBitmap) {
            const sx = Math.max(0, Math.min(bitmap.width, cropBox.x / 100 * bitmap.width));
            const sy = Math.max(0, Math.min(bitmap.height, cropBox.y / 100 * bitmap.height));
            const sw = Math.max(1, Math.min(bitmap.width - sx, cropBox.width / 100 * bitmap.width));
            const sh = Math.max(1, Math.min(bitmap.height - sy, cropBox.height / 100 * bitmap.height));
            const outputScale = Math.min((targetSize * 2.5) / sw, (targetSize * 2.5) / sh);
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = Math.max(1, Math.round(sw * outputScale));
            cropCanvas.height = Math.max(1, Math.round(sh * outputScale));
            const cropContext = cropCanvas.getContext('2d', { alpha: false });
            cropContext.imageSmoothingEnabled = true;
            cropContext.imageSmoothingQuality = 'high';
            cropContext.drawImage(bitmap, sx, sy, sw, sh, 0, 0, cropCanvas.width, cropCanvas.height);
            cropBlob = await new Promise(resolve => cropCanvas.toBlob(resolve, 'image/jpeg', 0.9));
            cropCanvas.width = 0;
            cropCanvas.height = 0;
          }
          bitmap.close();

          if (thumbnailBlob && thumbnailCacheKey) {
            saveBlobToIdb('birdvault_thumbs', thumbnailCacheKey, thumbnailBlob);
          }
          if (cropBlob && cropCacheKey && !cachedCropThumbnail) {
            saveBlobToIdb('birdvault_thumbs', cropCacheKey, cropBlob);
          }
          return {
            thumbUrl: cachedThumbnail
              ? URL.createObjectURL(cachedThumbnail)
              : thumbnailBlob ? URL.createObjectURL(thumbnailBlob) : URL.createObjectURL(file),
            cropThumbUrl: cropBlob ? URL.createObjectURL(cropBlob) : null,
            cropCacheKey,
            width,
            height
          };
        }
      } catch (err) {
        console.warn('createImageBitmap fallback:', err);
      }

      const fallbackUrl = URL.createObjectURL(file);
      try {
        const img = new Image();
        const dimensions = await new Promise((resolve, reject) => {
          img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
          img.onerror = () => reject(new Error('Could not read source image dimensions'));
          img.src = fallbackUrl;
        });
        return { thumbUrl: fallbackUrl, ...dimensions };
      } catch (err) {
        URL.revokeObjectURL(fallbackUrl);
        console.warn('Source image dimensions unavailable:', err);
        return { thumbUrl: URL.createObjectURL(file), width: 1000, height: 750 };
      }
    }

    async function createScreenProxy(file, maxDimension = 2048) {
      if (!file || !(file instanceof File)) return null;
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: maxDimension,
            resizeMode: 'aspect-fit',
            imageOrientation: 'from-image'
          });

          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;

          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();

          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              canvas.width = 0; canvas.height = 0;
              if (blob) {
                resolve(URL.createObjectURL(blob));
              } else {
                resolve(URL.createObjectURL(file));
              }
            }, 'image/jpeg', 0.82);
          });
        }
      } catch (e) {
        console.warn('Screen Proxy creation fallback:', e);
      }
      return URL.createObjectURL(file);
    }

    async function processThumbnailQueue(neededPhotos, updateBatchCallback, progressCallback, signal) {
      let index = 0;
      let completed = 0;
      const total = neededPhotos.length;
      const concurrency = 4;

      let pendingBatch = [];
      const revokePendingBatch = () => {
        pendingBatch.forEach(item => {
          if (item.thumbUrl) try { URL.revokeObjectURL(item.thumbUrl); } catch(e){}
          if (item.cropThumbUrl) try { URL.revokeObjectURL(item.cropThumbUrl); } catch(e){}
        });
        pendingBatch = [];
      };

      return new Promise((resolve) => {
        if (!total) return resolve();

        const worker = async () => {
          while (index < total) {
            if (signal?.aborted) break;
            const currentPhoto = neededPhotos[index++];
            let thumbUrl = null;
            let cropThumbUrl = null;
            try {
              const res = await generateFastThumbnail(currentPhoto, 240);
              thumbUrl = res.thumbUrl;
              cropThumbUrl = res.cropThumbUrl;
              if (signal?.aborted) {
                if (thumbUrl) URL.revokeObjectURL(thumbUrl);
                if (cropThumbUrl) URL.revokeObjectURL(cropThumbUrl);
                break;
              }
              pendingBatch.push({
                id: currentPhoto.id,
                thumbUrl: res.thumbUrl,
                cropThumbUrl: res.cropThumbUrl,
                cropCacheKey: res.cropCacheKey,
                thumbWidth: res.width,
                thumbHeight: res.height
              });

              if (pendingBatch.length >= 2 || index === total) {
                if (!signal?.aborted) {
                  updateBatchCallback([...pendingBatch]);
                  pendingBatch = [];
                } else {
                  revokePendingBatch();
                }
                await new Promise(r => setTimeout(r, 0));
              }
            } catch (err) {
              console.warn('Thumbnail generation error:', err);
              if (thumbUrl) try { URL.revokeObjectURL(thumbUrl); } catch(e){}
              if (cropThumbUrl) try { URL.revokeObjectURL(cropThumbUrl); } catch(e){}
            } finally {
              completed++;
              if (!signal?.aborted) progressCallback(completed, total);
            }
          }
        };

        const workers = Array.from({ length: Math.min(concurrency, total) }, () => worker());
        Promise.all(workers).then(() => {
          if (pendingBatch.length > 0) {
            if (!signal?.aborted) updateBatchCallback([...pendingBatch]);
            else revokePendingBatch();
          }
          resolve();
        });
      });
    }

    async function evaluatePhotoFocus(fileOrBlobUrl, targetRoi = null, cameraExif = null, options = {}) {
      return new Promise((resolve) => {
        let focusSpot = null;
        let cropBoxRoi = null;

        if (targetRoi) {
          if (targetRoi.width !== undefined && targetRoi.height !== undefined && targetRoi.x !== undefined) {
            cropBoxRoi = targetRoi;
          } else if (targetRoi.xPct !== undefined) {
            focusSpot = targetRoi;
          }
        } else if (!options.ignoreExifFocusArea && cameraExif?.focusArea) {
          focusSpot = cameraExif.focusArea;
        }

        let srcToRevoke = null;
        const img = new Image();
        img.crossOrigin = 'anonymous';

        try {
          if (typeof fileOrBlobUrl === 'string' && fileOrBlobUrl.trim()) {
            img.src = fileOrBlobUrl;
          } else if (fileOrBlobUrl instanceof File || fileOrBlobUrl instanceof Blob) {
            srcToRevoke = URL.createObjectURL(fileOrBlobUrl);
            img.src = srcToRevoke;
          } else {
            resolve(createFocusEvaluationError("Empty or missing source file URL."));
            return;
          }
        } catch (err) {
          resolve(createFocusEvaluationError(err.message || "Could not prepare image for focus evaluation."));
          return;
        }

        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');

            let cropX = 0, cropY = 0, cropW = img.width, cropH = img.height;

            if (cropBoxRoi && cropBoxRoi.width > 0 && cropBoxRoi.height > 0) {
              cropX = Math.round((cropBoxRoi.x / 100) * img.width);
              cropY = Math.round((cropBoxRoi.y / 100) * img.height);
              cropW = Math.round((cropBoxRoi.width / 100) * img.width);
              cropH = Math.round((cropBoxRoi.height / 100) * img.height);
            } else if (focusSpot && focusSpot.xPct !== undefined) {
              const cx = (focusSpot.xPct / 100) * img.width;
              const cy = (focusSpot.yPct / 100) * img.height;
              const rw = ((focusSpot.widthPct || 25) / 100) * img.width;
              const rh = ((focusSpot.heightPct || 25) / 100) * img.height;
              cropX = Math.max(0, Math.round(cx - rw / 2));
              cropY = Math.max(0, Math.round(cy - rh / 2));
              cropW = Math.min(img.width - cropX, Math.round(rw));
              cropH = Math.min(img.height - cropY, Math.round(rh));
            }

            const evalMaxDim = 600;
            const scale = Math.min(1, evalMaxDim / Math.max(cropW, cropH));
            const w = Math.max(16, Math.round(cropW * scale));
            const h = Math.max(16, Math.round(cropH * scale));

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, w, h);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const luminance = new Float32Array(w * h);
            for (let i = 0; i < data.length; i += 4) {
              luminance[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            }

            const { score, stars, debugDetails } = scoreFocusLuminance(
              luminance,
              w,
              h,
              !!(options.assumeSubjectRegion || cropBoxRoi || focusSpot)
            );

            if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
            canvas.width = 0; canvas.height = 0;
            resolve({ score, stars, focusSpot, debugDetails });
          } catch (err) {
            if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
            resolve(createFocusEvaluationError(err.message || "Canvas execution error"));
          }
        };

        img.onerror = () => {
          if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
          resolve(createFocusEvaluationError("Could not load image resource."));
        };
      });
    }
