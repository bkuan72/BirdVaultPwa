    (function() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><rect width="512" height="512" rx="128" fill="#040711"/><path d="M256 64C180 64 120 120 120 200C120 300 256 448 256 448C256 448 392 300 392 200C392 120 332 64 256 64ZM256 250C228.4 250 206 227.6 206 200C206 172.4 228.4 150 256 150C283.6 150 306 172.4 306 200C306 227.6 283.6 250 256 250Z" fill="#10b981"/></svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

      const manifest = {
        name: "BirdVault Pro",
        short_name: "BirdVault",
        start_url: ".",
        display: "standalone",
        background_color: "#040711",
        theme_color: "#090d16",
        icons: [
          { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], {type: 'application/json'});
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const GEMINI_QUOTAS = {
      MAX_RPM: 15,
      MAX_TPM: 1000000,
      MAX_RPD: 1500,
      ESTIMATED_TOKENS_PER_IMG: 258
    };

    function scoreToStars(score) {
      if (score === null || score === undefined) return 0;
      return Math.max(1, Math.min(5, Math.ceil(score / 2)));
    }

    function getStoredTokenUsage() {
      try {
        const stored = localStorage.getItem('birdvault_gemini_usage');
        if (stored) {
          const parsed = JSON.parse(stored);
          const now = Date.now();
          if (now - parsed.minuteWindowStart > 60000) {
            parsed.minuteRequests = 0;
            parsed.minuteTokens = 0;
            parsed.minuteWindowStart = now;
          }
          const storedDate = new Date(parsed.dailyWindowStart).getUTCDate();
          const currentDate = new Date(now).getUTCDate();
          if (storedDate !== currentDate) {
            parsed.dailyRequests = 0;
            parsed.dailyWindowStart = now;
          }
          return parsed;
        }
      } catch (e) {}
      
      const now = Date.now();
      return {
        minuteRequests: 0,
        minuteTokens: 0,
        dailyRequests: 0,
        minuteWindowStart: now,
        dailyWindowStart: now,
        lastRenewalTimestamp: now + 60000
      };
    }

    function recordTokenUsage(estimatedTokens = 350) {
      const usage = getStoredTokenUsage();
      usage.minuteRequests += 1;
      usage.minuteTokens += estimatedTokens;
      usage.dailyRequests += 1;
      localStorage.setItem('birdvault_gemini_usage', JSON.stringify(usage));
      window.dispatchEvent(new Event('birdvault_token_update'));
      return usage;
    }

        clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>,

        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>,
        folder: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>,
        chevronLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/>,
        chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/>,
        chevronDown: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/>,

    function Accordion({ title, icon, children, defaultOpen = false, badge = null }) {
      const [isOpen, setIsOpen] = useState(defaultOpen);

      return (
        <div className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden transition-all duration-200">
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className="w-full px-3.5 py-3 flex items-center justify-between text-left hover:bg-slate-900/60 transition"
          >
            <div className="flex items-center space-x-2.5 truncate">
              {icon && <Icon name={icon} className="w-4 h-4 text-emerald-400 flex-shrink-0" />}
              <span className="text-xs font-bold text-slate-200 truncate">{title}</span>
              {badge && <span className="ml-2">{badge}</span>}
            </div>
            <Icon
              name="chevronDown"
              className={`w-4 h-4 text-slate-400 transition-transform duration-200 flex-shrink-0 ${isOpen ? 'rotate-180' : ''}`}
            />
          </button>
          {isOpen && (
            <div className="px-3.5 pb-3.5 pt-1 border-t border-slate-800/60 space-y-3">
              {children}
            </div>
          )}
        </div>
      );
    }

    function StarRating({ rating = 0, maxStars = 5, onChange, readOnly = false, size = "w-4 h-4" }) {
      const [hoverRating, setHoverRating] = useState(0);
      const displayRating = hoverRating || rating || 0;

      return (
        <div 
          className="flex items-center space-x-0.5 select-none" 
          onMouseLeave={() => !readOnly && setHoverRating(0)}
        >
          {Array.from({ length: maxStars }).map((_, idx) => {
            const starValue = idx + 1;
            const isFilled = starValue <= displayRating;
            return (
              <button
                key={idx}
                type="button"
                disabled={readOnly}
                onClick={(e) => {
                  e.stopPropagation();
                  if (!readOnly && onChange) onChange(starValue);
                }}
                onMouseEnter={() => !readOnly && setHoverRating(starValue)}
                className={`${readOnly ? 'cursor-default' : 'cursor-pointer hover:scale-125'} transition-transform duration-150 p-0.5 focus:outline-none`}
                title={!readOnly ? `Set rating to ${starValue} star${starValue > 1 ? 's' : ''}` : `${rating} / ${maxStars} stars`}
              >
                <svg
                  className={`${size} ${isFilled ? 'text-amber-400 fill-amber-400' : 'text-slate-600 fill-transparent'}`}
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  strokeWidth="1.5"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
                  />
                </svg>
              </button>
            );
          })}
        </div>
      );
    }

    function TokenUsageMonitorModal({ isOpen, onClose }) {
      const [usage, setUsage] = useState(getStoredTokenUsage());
      const [secondsToMinuteReset, setSecondsToMinuteReset] = useState(60);
      const [dailyResetText, setDailyResetText] = useState('');

      useEffect(() => {
        const updateState = () => setUsage(getStoredTokenUsage());
        window.addEventListener('birdvault_token_update', updateState);

        const timer = setInterval(() => {
          const u = getStoredTokenUsage();
          setUsage(u);

          const elapsedMinute = Math.floor((Date.now() - u.minuteWindowStart) / 1000);
          const remainingMinute = Math.max(0, 60 - elapsedMinute);
          setSecondsToMinuteReset(remainingMinute);

          const now = new Date();
          const nextUtcMidnight = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
          const diffMs = nextUtcMidnight - now;
          const hours = Math.floor(diffMs / (1000 * 60 * 60));
          const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((diffMs % (1000 * 60)) / 1000);
          setDailyResetText(`${hours}h ${mins}m ${secs}s`);
        }, 1000);

        return () => {
          window.removeEventListener('birdvault_token_update', updateState);
          clearInterval(timer);
        };
      }, []);

      if (!isOpen) return null;

      const rpmPct = Math.min(100, Math.round((usage.minuteRequests / GEMINI_QUOTAS.MAX_RPM) * 100));
      const tpmPct = Math.min(100, Math.round((usage.minuteTokens / GEMINI_QUOTAS.MAX_TPM) * 100));
      const rpdPct = Math.min(100, Math.round((usage.dailyRequests / GEMINI_QUOTAS.MAX_RPD) * 100));

      const isLowQuota = rpmPct > 80 || rpdPct > 80;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div className="flex items-center space-x-2">
                <Icon name="bolt" className="w-5 h-5 text-emerald-400" />
                <h3 className="font-bold text-white text-sm sm:text-base">Gemini AI Token & Quota Monitor</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {isLowQuota && (
              <div className="bg-amber-950/40 border border-amber-500/40 p-3 rounded-xl text-xs text-amber-300 space-y-1">
                <p className="font-bold flex items-center space-x-1">
                  <Icon name="clock" className="w-3.5 h-3.5" />
                  <span>Approaching Quota Rate Limits</span>
                </p>
                <p className="text-[11px] text-amber-200/80">
                  You are close to your minute or daily quota threshold. Token allowance resets automatically on schedule.
                </p>
              </div>
            )}

            <div className="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-300 font-medium">Requests Per Minute (RPM)</span>
                  <span className="text-emerald-400 font-bold">{usage.minuteRequests} / {GEMINI_QUOTAS.MAX_RPM} ({rpmPct}%)</span>
                </div>
                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className={`h-full transition-all duration-500 ${rpmPct > 80 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                    style={{ width: `${rpmPct}%` }}
                  ></div>
                </div>
                <div className="flex justify-between items-center mt-1 text-[10px] text-slate-500">
                  <span>Minute Limit: 15 Requests</span>
                  <span className="text-sky-400 font-medium flex items-center space-x-1">
                    <Icon name="clock" className="w-3 h-3" />
                    <span>Minute Reset in: <strong className="font-mono text-white">{secondsToMinuteReset}s</strong></span>
                  </span>
                </div>
              </div>

              <div className="pt-2 border-t border-slate-800/80">
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-300 font-medium">Tokens Per Minute (TPM)</span>
                  <span className="text-emerald-400 font-bold">~{usage.minuteTokens.toLocaleString()} / {GEMINI_QUOTAS.MAX_TPM.toLocaleString()} ({tpmPct}%)</span>
                </div>
                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                  <div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${tpmPct}%` }}></div>
                </div>
              </div>

              <div className="pt-2 border-t border-slate-800/80">
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-300 font-medium">Daily Requests (RPD)</span>
                  <span className="text-emerald-400 font-bold">{usage.dailyRequests} / {GEMINI_QUOTAS.MAX_RPD} ({rpdPct}%)</span>
                </div>
                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className={`h-full transition-all duration-500 ${rpdPct > 80 ? 'bg-red-500' : 'bg-emerald-500'}`}
                    style={{ width: `${rpdPct}%` }}
                  ></div>
                </div>
                <div className="flex justify-between items-center mt-1 text-[10px] text-slate-500">
                  <span>Daily Free Allowance: 1,500 calls</span>
                  <span className="text-emerald-400 font-medium flex items-center space-x-1">
                    <Icon name="clock" className="w-3 h-3" />
                    <span>Daily Reset in: <strong className="font-mono text-white">{dailyResetText}</strong></span>
                  </span>
                </div>
              </div>
            </div>

            <div className="flex justify-end pt-2 border-t border-slate-800">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition shadow"
              >
                Close Dashboard
              </button>
            </div>
          </div>
        </div>
      );
    }

    function GoogleAuthModal({ isOpen, onClose, apiKey, onSaveKey }) {
      const [inputKey, setInputKey] = useState(apiKey || '');
      const [showKey, setShowKey] = useState(false);
      const [savedMessage, setSavedMessage] = useState('');

      useEffect(() => {
        setInputKey(apiKey || '');
      }, [apiKey, isOpen]);

      if (!isOpen) return null;

      const handleSave = (e) => {
        e.preventDefault();
        const trimmed = inputKey.trim();
        onSaveKey(trimmed);
        setSavedMessage('API Key saved successfully!');
        setTimeout(() => {
          setSavedMessage('');
          onClose();
        }, 1000);
      };

      const handleClear = () => {
        setInputKey('');
        onSaveKey('');
        setSavedMessage('API Key cleared.');
        setTimeout(() => setSavedMessage(''), 1200);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4">

    function CroppedImage({ src, alt, cropBox, photo = null, className = "", imgClassName = "", innerRef = null, fitMode = "contain", children = null }) {
      const naturalW = photo?.naturalWidth || photo?.width || 1000;
      const naturalH = photo?.naturalHeight || photo?.height || 750;

      const aspect = useMemo(() => {
        const baseAspect = naturalW / naturalH;
        if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
          return (cropBox.width / cropBox.height) * baseAspect;
        }
        return baseAspect;
      }, [cropBox, naturalW, naturalH]);

      const frameStyle = useMemo(() => {
        if (!aspect || fitMode !== "contain") return {};
        return {
          aspectRatio: `${aspect}`,
          width: `min(100%, calc((100vh - 8rem) * ${aspect}))`,
          maxHeight: 'calc(100vh - 8rem)'
        };
      }, [aspect, fitMode]);

      const preserveAspect = fitMode === "cover" ? "xMidYMid slice" : "xMidYMid meet";

      if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
        const cropX = (cropBox.x / 100) * naturalW;
        const cropY = (cropBox.y / 100) * naturalH;
        const cropW = (cropBox.width / 100) * naturalW;
        const cropH = (cropBox.height / 100) * naturalH;

        return (
          <div 
            className={`relative overflow-hidden flex items-center justify-center bg-slate-950 ${className}`}
            style={frameStyle}
          >
            <svg
              ref={innerRef}
              viewBox={`${cropX} ${cropY} ${cropW} ${cropH}`}
              preserveAspectRatio={preserveAspect}
              className={`w-full h-full block ${imgClassName}`}
            >
              <image
                href={src}
                x="0"
                y="0"
                width={naturalW}
                height={naturalH}
              />
            </svg>
            {children}
          </div>
        );
      }

      return (
        <div 
          className={`relative overflow-hidden flex items-center justify-center bg-slate-950 ${className}`}
          style={frameStyle}
        >
          <img
            ref={innerRef}
            src={src}
            alt={alt}
            decoding="async"
            className={`${fitMode === 'cover' ? 'w-full h-full object-cover' : 'w-full h-full object-contain'} ${imgClassName}`}
          />
          {children}
        </div>
      );
    }

    async function generateFastThumbnail(file, targetSize = 240) {
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: targetSize,
            resizeHeight: targetSize,
            resizeMode: 'aspect-fit'
          });
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();

          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              if (blob) {
                resolve({
                  thumbUrl: URL.createObjectURL(blob),
                  width: canvas.width,
                  height: canvas.height
                });
              } else {
                resolve({ thumbUrl: URL.createObjectURL(file), width: 1000, height: 750 });
              }
            }, 'image/jpeg', 0.65);
          });
        }
      } catch (e) {
        console.warn('createImageBitmap fallback:', e);
      }
      return { thumbUrl: URL.createObjectURL(file), width: 1000, height: 750 };
    }

    async function processThumbnailQueue(neededPhotos, updateBatchCallback, progressCallback) {
      let index = 0;
      let completed = 0;
      const total = neededPhotos.length;
      const concurrency = 2; // 2 background worker tasks max to maintain 60fps UI thread

      let pendingBatch = [];
      let lastFlush = Date.now();

      const flush = () => {
        if (pendingBatch.length > 0) {
          updateBatchCallback([...pendingBatch]);
          pendingBatch = [];
          lastFlush = Date.now();
        }
      };

      return new Promise((resolve) => {
        if (!total) return resolve();

        const worker = async () => {
          while (index < total) {
            const currentPhoto = neededPhotos[index++];
            try {
              const res = await generateFastThumbnail(currentPhoto.file, 240);
              const bUrl = currentPhoto.blobUrl || URL.createObjectURL(currentPhoto.file);
              pendingBatch.push({
                id: currentPhoto.id,
                thumbUrl: res.thumbUrl,
                blobUrl: bUrl,
                width: res.width,
                height: res.height
              });

              // Micro-batch flush every 6 items or 100ms elapsed
              if (pendingBatch.length >= 6 || Date.now() - lastFlush > 100) {
                flush();
                await new Promise(r => setTimeout(r, 0)); // Yield thread to DOM/browser
              }
            } catch (err) {
              console.warn('Thumbnail generation error:', err);
            } finally {
              completed++;
              progressCallback(completed, total);
            }
          }
          flush();
        };

        const workers = Array.from({ length: Math.min(concurrency, total) }, () => worker());
        Promise.all(workers).then(() => {
          flush();
          resolve();
        });
      });
    }

    async function extractExifFocusSpot(file) {
      return new Promise((resolve) => {
        if (!file || !(file instanceof File)) return resolve(null);
        const reader = new FileReader();
        const slice = file.slice(0, 131072);
        reader.onload = (e) => {
          try {
            const view = new DataView(e.target.result);
            if (view.getUint16(0, false) !== 0xFFD8) return resolve(null);
            
            let offset = 2;
            while (offset < view.byteLength) {
              const marker = view.getUint16(offset, false);
              offset += 2;
              if (marker === 0xFFE1) {
                if (view.getUint32(offset + 2, false) === 0x45786966) {
                  const tiffOffset = offset + 8;
                  const bigEndian = view.getUint16(tiffOffset, false) === 0x4D4D;
                  const firstIFD = view.getUint32(tiffOffset + 4, bigEndian);
                  if (firstIFD) {
                    const entries = view.getUint16(tiffOffset + firstIFD, bigEndian);
                    for (let i = 0; i < entries; i++) {
                      const tagOffset = tiffOffset + firstIFD + 2 + (i * 12);
                      const tag = view.getUint16(tagOffset, bigEndian);
                      if (tag === 0x9214) {
                        const valOffset = tiffOffset + view.getUint32(tagOffset + 8, bigEndian);
                        const x = view.getUint16(valOffset, bigEndian);
                        const y = view.getUint16(valOffset + 2, bigEndian);
                        return resolve({
                          xPct: Math.min(90, Math.max(10, (x / 4000) * 100)),
                          yPct: Math.min(90, Math.max(10, (y / 3000) * 100)),
                          widthPct: 20,
                          heightPct: 20,
                          source: 'EXIF SubjectArea AF Tag'
                        });
                      }
                    }
                  }
                }
                break;
              } else if ((marker & 0xFF00) !== 0xFF00) {
                break;
              } else {
                offset += view.getUint16(offset, false);
              }
            }
          } catch (err) {
            console.warn('EXIF AF parse fallback:', err);
          }
          resolve(null);
        };
        reader.onerror = () => resolve(null);
        reader.readAsArrayBuffer(slice);
      });
    }

    async function evaluatePhotoFocus(fileOrBlobUrl, existingFocusSpot = null) {
      return new Promise(async (resolve) => {
        let focusSpot = existingFocusSpot;
        
        if (!focusSpot && fileOrBlobUrl instanceof File) {
          focusSpot = await extractExifFocusSpot(fileOrBlobUrl);
        }

        const img = new Image();
        img.crossOrigin = 'anonymous';
        let src = typeof fileOrBlobUrl === 'string' ? fileOrBlobUrl : URL.createObjectURL(fileOrBlobUrl);
        
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const sampleSize = 300;
            const scale = Math.min(1, sampleSize / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, w, h);
            
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            
            const gray = new Float32Array(w * h);
            for (let i = 0; i < data.length; i += 4) {
              gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            }

            if (!focusSpot) {
              let maxVar = -1;
              let bestX = 50, bestY = 50;
              const gridCols = 5, gridRows = 5;
              const tileW = Math.floor(w / gridCols);
              const tileH = Math.floor(h / gridRows);

              for (let gy = 0; gy < gridRows; gy++) {
                for (let gx = 0; gx < gridCols; gx++) {
                  let lSum = 0, lSqSum = 0, count = 0;
                  const startX = Math.max(1, gx * tileW);
                  const endX = Math.min(w - 1, (gx + 1) * tileW);
                  const startY = Math.max(1, gy * tileH);
                  const endY = Math.min(h - 1, (gy + 1) * tileH);

                  for (let y = startY; y < endY; y++) {
                    for (let x = startX; x < endX; x++) {
                      const idx = y * w + x;
                      const lap = (-4 * gray[idx] + gray[idx - 1] + gray[idx + 1] + gray[idx - w] + gray[idx + w]);
                      lSum += lap;
                      lSqSum += lap * lap;
                      count++;
                    }
                  }
                  const mean = count > 0 ? lSum / count : 0;
                  const v = count > 0 ? (lSqSum / count) - (mean * mean) : 0;
                  if (v > maxVar) {
                    maxVar = v;
                    bestX = Math.round(((gx + 0.5) / gridCols) * 100);
                    bestY = Math.round(((gy + 0.5) / gridRows) * 100);
                  }
                }
              }

              focusSpot = {
                xPct: bestX,
                yPct: bestY,
                widthPct: 20,
                heightPct: 20,
                source: 'Spatial Laplacian Micro-Contrast Peak'
              };
            }

            let minX = 1, maxX = w - 1, minY = 1, maxY = h - 1;
            if (focusSpot && focusSpot.xPct) {
              const cx = (focusSpot.xPct / 100) * w;
              const cy = (focusSpot.yPct / 100) * h;
              const rw = ((focusSpot.widthPct || 20) / 100) * w;
              const rh = ((focusSpot.heightPct || 20) / 100) * h;
              
              minX = Math.max(1, Math.round(cx - rw / 2));
              maxX = Math.min(w - 1, Math.round(cx + rw / 2));
              minY = Math.max(1, Math.round(cy - rh / 2));
              maxY = Math.min(h - 1, Math.round(cy + rh / 2));
            }

            let laplacianSum = 0;
            let laplacianSqSum = 0;
            let count = 0;

            for (let y = minY; y < maxY; y++) {
              for (let x = minX; x < maxX; x++) {
                const idx = y * w + x;
                const lap = (
                  -4 * gray[idx] +
                  gray[idx - 1] + gray[idx + 1] +
                  gray[idx - w] + gray[idx + w]
                );
                laplacianSum += lap;
                laplacianSqSum += lap * lap;
                count++;
              }
            }

            const mean = count > 0 ? laplacianSum / count : 0;
            const variance = count > 0 ? (laplacianSqSum / count) - (mean * mean) : 0;
            
            let score = Math.min(10, Math.max(1, Math.round(Math.log2(Math.max(1, variance / 25)) * 2.2)));
            if (isNaN(score)) score = 5;

            const stars = scoreToStars(score);

            if (typeof fileOrBlobUrl !== 'string') URL.revokeObjectURL(src);
            resolve({ score, stars, focusSpot });
          } catch (err) {
            resolve({ score: 5, stars: 3, focusSpot: null });
          }
        };

        img.onerror = () => resolve({ score: 5, stars: 3, focusSpot: null });
        img.src = src;
      });
    }

    async function identifyBirdWithGemini(photo, customApiKey = '', cropBox = null, locationText = 'Global') {
      const rawKey = customApiKey || localStorage.getItem('birdvault_gemini_token') || '';
      const apiKey = rawKey.trim().replace(/[\r\n\t]/g, '');

      if (!apiKey) {
        return { 
          error: 'MISSING_KEY', 
          message: 'A Google Gemini API key is required to identify bird species.' 
        };
      }

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

      try {
        const base64Data = await new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let sx = 0, sy = 0, sw = img.width, sh = img.height;
            if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
              sx = (cropBox.x / 100) * img.width;
              sy = (cropBox.y / 100) * img.height;
              sw = (cropBox.width / 100) * img.width;
              sh = (cropBox.height / 100) * img.height;
            }
            
            const maxDim = 2048;
            let targetW = sw;
            let targetH = sh;
            if (targetW > maxDim || targetH > maxDim) {
              const r = Math.min(maxDim / targetW, maxDim / targetH);
              targetW *= r;
              targetH *= r;
            }

            canvas.width = Math.max(10, Math.round(targetW));
            canvas.height = Math.max(10, Math.round(targetH));
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = reject;
          img.src = photo.blobUrl;
        });

        const systemPrompt = `You are a world-class ornithologist and computer vision expert. Identify the bird species in the full-resolution cropped image provided.
GEOGRAPHIC CONTEXT: The photo was taken in or near "${locationText}".
CRITICAL: Restrict your identification and candidates strictly to species native, introduced, or vagrant to "${locationText}". Do NOT identify species from incorrect continents or incompatible biomes.

UNIDENTIFIED / LOW QUALITY RULE:
If the image does NOT contain a bird, or the subject is too blurry/unclear/obscured to identify with reasonable confidence, return a JSON object with an "error" property set to "UNIDENTIFIED" and a "message" explaining the optical or visual reason why species identification is not possible.

Return STRICT JSON ONLY without markdown fences.
JSON Schema:
{
  "speciesName": "Common Name",
  "scientificName": "Scientific Name",
  "category": "Songbirds" | "Raptors" | "Waterfowl" | "Seabirds" | "Waders" | "Parrots" | "Other",
  "confidence": 0.95,
  "description": "Short diagnostic description of key visual identification traits.",
  "habitat": "Primary habitat preferences.",
  "candidates": [
    { "name": "Alternative Species 1", "confidence": 0.4 },
    { "name": "Alternative Species 2", "confidence": 0.2 }
  ],
  "heatmapPoints": [
    { "x": 45, "y": 30, "intensity": 0.9, "label": "Sharp Eye Contrast" },
    { "x": 52, "y": 42, "intensity": 0.8, "label": "Beak Morphology" }
  ]
}`;

        const userPrompt = `Geographic Location Context: ${locationText}. Identify this bird photo, analyze regional species distributions for location "${locationText}", analyze focus points for heatmap, and return strict JSON.`;

        const payload = {
          contents: [{
            parts: [
              { text: userPrompt },
              { inlineData: { mimeType: "image/jpeg", data: base64Data } }
            ]
          }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        recordTokenUsage(320);

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let serverMessage = `HTTP ${response.status}`;
          try {
            const errData = await response.json();
            if (errData.error && errData.error.message) {
              serverMessage = errData.error.message;
            }
          } catch (e) {}

          if (response.status === 402) {
            return {
              error: 'PAYMENT_REQUIRED',
              message: 'Payment Required (HTTP 402): Your Gemini API project has run out of prepaid credits or requires active billing setup in Google AI Studio.'
            };
          }

          if (response.status === 429) {
            return {
              error: 'RATE_LIMIT_EXCEEDED',
              message: 'Gemini API Rate Limit reached (15 Requests/Min or Daily Quota). Allowance resets automatically on minute/daily schedule.'
            };
          }
          if (response.status === 400 || response.status === 403 || response.status === 401) {
            return { 
              error: 'INVALID_KEY', 
              message: `Gemini API Key rejected (${serverMessage}). Please verify your key at Google AI Studio and ensure there are no trailing space characters.` 
            };
          }
          return {
            error: 'API_ERROR',
            message: `Gemini API returned an error: ${serverMessage}`
          };
        }

        const result = await response.json();
        const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleanJson = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();

        let parsed;
        try {
          parsed = JSON.parse(cleanJson);
        } catch (jsonErr) {
          return {
            error: 'UNPARSABLE_RESPONSE',
            message: 'AI returned an unparseable response structure. Please adjust the crop framing or try again.'
          };
        }

        if (parsed.error) {
          return parsed;
        }

        if (parsed.confidence && parsed.confidence < 0.35) {
          return {
            error: 'LOW_CONFIDENCE',
            message: `Identification confidence is too low (${Math.round(parsed.confidence * 100)}%). Try drawing a tighter crop box around diagnostic features like the head or plumage.`
          };
        }

        return parsed;
      } catch (err) {
        return {
          error: 'API_ERROR',
          message: err.message || 'An unexpected error occurred while communicating with Gemini.'
        };
      }
    }

    function InteractivePhotoViewer({ photo, onClose, onUpdatePhoto, onSaveToVault, onDeletePhoto, userApiKey, initialLocation = '', onNextPhoto, onPrevPhoto, hasNext = false, hasPrev = false }) {
      const [viewMode, setViewMode] = useState('lightbox');
      const [loupePos, setLoupePos] = useState({ x: 50, y: 50 });
      const [zoomLevel, setZoomLevel] = useState(1.0);
      const [showMobileSidebar, setShowMobileSidebar] = useState(false);
      const [showHeatmapOverlay, setShowHeatmapOverlay] = useState(true);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft' && hasPrev && onPrevPhoto) {
            onPrevPhoto();
          } else if (e.key === 'ArrowRight' && hasNext && onNextPhoto) {
            onNextPhoto();
          } else if (e.key === 'Escape' && onClose) {
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [hasPrev, hasNext, onPrevPhoto, onNextPhoto, onClose]);

      const activeBlobUrl = useMemo(() => {
        if (photo.blobUrl) return photo.blobUrl;
        if (photo.thumbnailUrl) return photo.thumbnailUrl;
        if (photo.file) return URL.createObjectURL(photo.file);
        return null;
      }, [photo.id, photo.blobUrl, photo.thumbnailUrl, photo.file]);

      useEffect(() => {
        if (!photo.blobUrl && photo.file) {
          const bUrl = URL.createObjectURL(photo.file);
          onUpdatePhoto({ ...photo, blobUrl: bUrl });
        }
      }, [photo.id]);

      const [panZoom, setPanZoom] = useState({ scale: 1, x: 0, y: 0 });
      const [isDraggingPan, setIsDraggingPan] = useState(false);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const initialTouchDistanceRef = useRef(null);

      const [cropBox, setCropBox] = useState(photo.cropBox || null);
      const [showCroppedPreview, setShowCroppedPreview] = useState(!!(photo.cropBox && photo.cropBox.width > 0));
      const [isDrawingCrop, setIsDrawingCrop] = useState(false);
      const cropStartRef = useRef(null);
      const containerRef = useRef(null);
      const imgRef = useRef(null);

      const [identifying, setIdentifying] = useState(false);
      const [aiResult, setAiResult] = useState(photo.identification || null);
      const [locationInput, setLocationInput] = useState(photo.locationText || initialLocation || 'Auckland, New Zealand');

      const [evaluatingFocus, setEvaluatingFocus] = useState(false);

      const activeStars = photo.userStars || photo.stars || scoreToStars(photo.sharpness);
      const isZoomedOrCropped = showCroppedPreview || (viewMode === 'lightbox' && panZoom.scale > 1) || (viewMode === 'loupe' && zoomLevel > 1);

      useEffect(() => {
        if (photo.sharpness === null && !evaluatingFocus) {
          setEvaluatingFocus(true);
          evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl, photo.focusSpot).then((res) => {
            onUpdatePhoto({
              ...photo,
              sharpness: res.score,
              stars: res.stars,
              focusSpot: res.focusSpot
            });
            setEvaluatingFocus(false);
          });
        }
      }, [photo]);

      const handleLocationChange = (newLoc) => {
        setLocationInput(newLoc);
        if (newLoc) {
          localStorage.setItem('birdvault_user_location', newLoc);
        }
      };

      const handleRatingChange = (newStars) => {
        const updatedPhoto = {
          ...photo,
          userStars: newStars,
          stars: newStars
        };
        onUpdatePhoto(updatedPhoto);
      };

      const getImagePointerPos = useCallback((e) => {
        if (!imgRef.current) return { pctX: 50, pctY: 50 };
        const rect = imgRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const pctX = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const pctY = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
        return { pctX, pctY, clientX, clientY };
      }, []);

      const getContainerPointerPos = useCallback((e) => {
        if (!containerRef.current) return { pctX: 50, pctY: 50 };
        const rect = containerRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const pctX = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const pctY = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
        return { x: clientX - rect.left, y: clientY - rect.top, pctX, pctY, clientX, clientY };
      }, []);

      const getTouchDistance = (e) => {
        if (!e.touches || e.touches.length < 2) return null;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      };

      const handlePointerMove = (e) => {
        if (e.touches && e.touches.length === 2 && viewMode === 'lightbox') {
          const newDist = getTouchDistance(e);
          if (newDist && initialTouchDistanceRef.current) {
            const factor = newDist / initialTouchDistanceRef.current;
            setPanZoom((p) => {
              const newScale = Math.min(8, Math.max(1, p.scale * factor));
              return { ...p, scale: newScale };
            });
            initialTouchDistanceRef.current = newDist;
          }
          return;
        }

        const containerPos = getContainerPointerPos(e);

        if (viewMode === 'loupe') {
          if (e.buttons > 0 || (e.touches && e.touches.length > 0)) {
            setLoupePos({ x: containerPos.pctX, y: containerPos.pctY });
          }
        }

        if (isDrawingCrop && cropStartRef.current) {
          const imgPos = getImagePointerPos(e);
          const startX = cropStartRef.current.x;
          const startY = cropStartRef.current.y;
          const left = Math.min(startX, imgPos.pctX);
          const top = Math.min(startY, imgPos.pctY);
          const width = Math.abs(imgPos.pctX - startX);
          const height = Math.abs(imgPos.pctY - startY);

          const updatedCrop = { x: left, y: top, width, height };
          setCropBox(updatedCrop);
        } else if (isDraggingPan && viewMode === 'lightbox') {
          setPanZoom(p => ({
            ...p,
            x: containerPos.clientX - dragStartRef.current.x,
            y: containerPos.clientY - dragStartRef.current.y
          }));
        }
      };

      const handlePointerDown = (e) => {
        if (e.touches && e.touches.length === 2 && viewMode === 'lightbox') {
          initialTouchDistanceRef.current = getTouchDistance(e);
          return;
        }

        const containerPos = getContainerPointerPos(e);

        if (viewMode === 'loupe') {
          setLoupePos({ x: containerPos.pctX, y: containerPos.pctY });
        } else if (viewMode === 'crop') {
          const imgPos = getImagePointerPos(e);
          cropStartRef.current = { x: imgPos.pctX, y: imgPos.pctY };
          setCropBox({ x: imgPos.pctX, y: imgPos.pctY, width: 0, height: 0 });
          setIsDrawingCrop(true);
        } else if (viewMode === 'lightbox') {
          setIsDraggingPan(true);
          dragStartRef.current = { x: containerPos.clientX - panZoom.x, y: containerPos.clientY - panZoom.y };
        }
      };

      const handlePointerUp = (e) => {
        if (e && e.touches && e.touches.length < 2) {
          initialTouchDistanceRef.current = null;
        }
        if (isDrawingCrop && cropBox && cropBox.width > 2 && cropBox.height > 2) {
          setShowCroppedPreview(true);
          onUpdatePhoto({ ...photo, cropBox: cropBox });
        }
        setIsDrawingCrop(false);
        setIsDraggingPan(false);
      };

      const handleWheelZoom = (e) => {
        if (viewMode !== 'lightbox') return;
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.3 : -0.3;
        setPanZoom(p => ({
          ...p,
          scale: Math.min(8, Math.max(1, p.scale + zoomDelta))
        }));
      };

      const handleRunAiIdentification = async () => {
        let currentPhoto = photo;
        if (currentPhoto.sharpness === null) {
          setEvaluatingFocus(true);
          const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl, photo.focusSpot);
          currentPhoto = { ...photo, sharpness: evalRes.score, stars: evalRes.stars, focusSpot: evalRes.focusSpot };
          onUpdatePhoto(currentPhoto);
          setEvaluatingFocus(false);
        }

        setIdentifying(true);
        const result = await identifyBirdWithGemini(currentPhoto, userApiKey, cropBox, locationInput);
        
        if (result && (result.error === 'MISSING_KEY' || result.error === 'INVALID_KEY')) {
          if (window.birdvault_open_auth_modal) {
            window.birdvault_open_auth_modal();
          }
        }

        setAiResult(result);
        setIdentifying(false);
        setShowMobileSidebar(true);
        onUpdatePhoto({ ...currentPhoto, identification: result, cropBox: cropBox, locationText: locationInput });
      };

      const handleClearCrop = () => {
        setCropBox(null);
        setShowCroppedPreview(false);
        onUpdatePhoto({ ...photo, cropBox: null });
      };

      const getLoupeStyle = () => {
        if (!containerRef.current || !imgRef.current) return {};
        const containerRect = containerRef.current.getBoundingClientRect();
        const imgEl = imgRef.current;
        const rect = imgEl.getBoundingClientRect();
        if (!rect.width || !rect.height) return {};

        const radius = window.innerWidth < 640 ? 72 : 96;

        const naturalW = photo.naturalWidth || photo.width || 1000;
        const naturalH = photo.naturalHeight || photo.height || 750;
        const aspect = naturalW / naturalH;

        const loupePxX = (loupePos.x / 100) * containerRect.width;
        const loupePxY = (loupePos.y / 100) * containerRect.height;

        const loupeClientX = containerRect.left + loupePxX;
        const loupeClientY = containerRect.top + loupePxY;

        const imgPctX = Math.max(0, Math.min(1, (loupeClientX - rect.left) / rect.width));
        const imgPctY = Math.max(0, Math.min(1, (loupeClientY - rect.top) / rect.height));

        let bgW = 0;
        let bgH = 0;
        let fullX_pct = imgPctX;
        let fullY_pct = imgPctY;

        if (showCroppedPreview && cropBox && cropBox.width > 0 && cropBox.height > 0) {
          const cropW_pct = cropBox.width / 100;
          const cropH_pct = cropBox.height / 100;

          const dispW = rect.width;
          bgW = (dispW * zoomLevel) / cropW_pct;
          bgH = bgW / aspect;

          fullX_pct = (cropBox.x / 100) + imgPctX * cropW_pct;
          fullY_pct = (cropBox.y / 100) + imgPctY * cropH_pct;
        } else {
          const dispW = rect.width;
          bgW = dispW * zoomLevel;
          bgH = bgW / aspect;

          fullX_pct = imgPctX;
          fullY_pct = imgPctY;
        }

        const bgX = radius - fullX_pct * bgW;
        const bgY = radius - fullY_pct * bgH;

        return {
          left: `${loupePxX - radius}px`,
          top: `${loupePxY - radius}px`,
          backgroundImage: `url(${activeBlobUrl})`,
          backgroundSize: `${bgW}px ${bgH}px`,
          backgroundPosition: `${bgX}px ${bgY}px`
        };
      };

      const formattedDate = useMemo(() => {
        if (!photo.lastModified) return 'Unknown Date';
        return new Date(photo.lastModified).toLocaleString();
      }, [photo.lastModified]);

      const formattedFileSize = useMemo(() => {
        if (!photo.size) return 'Unknown Size';
        return (photo.size / (1024 * 1024)).toFixed(2) + ' MB';
      }, [photo.size]);

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col md:flex-row overflow-hidden">
          <div className="flex-1 flex flex-col relative bg-black/80 overflow-hidden h-full">
            <div className="h-14 px-3 sm:px-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 gap-2">
              <div className="flex items-center space-x-2 truncate min-w-0">
                <span className="text-xs font-semibold text-slate-300 truncate max-w-[100px] sm:max-w-[180px]">{photo.name}</span>
                {evaluatingFocus ? (
                  <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full flex items-center space-x-1">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Rating Focus...</span>
                  </span>
                ) : (
                  <div className="flex items-center space-x-1 bg-slate-950 px-2 py-0.5 rounded-full border border-slate-800">
                    <StarRating
                      rating={activeStars}
                      onChange={handleRatingChange}
                      size="w-3.5 h-3.5"
                    />
                  </div>
                )}
                {photo.sharpness !== null && (
                  <span className="text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                    Sharpness: {photo.sharpness}/10
                  </span>
                )}
                {cropBox && cropBox.width > 0 && (
                  <div className="flex items-center space-x-1">
                    <button
                      onClick={() => setShowCroppedPreview(!showCroppedPreview)}
                      className={`text-[10px] px-2 py-0.5 rounded-full font-semibold border transition ${showCroppedPreview ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
                    >
                      {showCroppedPreview ? 'Cropped Framing' : 'Full Frame'}
                    </button>
                    <button
                      onClick={handleClearCrop}
                      className="text-[10px] px-1.5 py-0.5 rounded-full font-semibold border bg-red-950/40 text-red-400 border-red-500/30 hover:bg-red-600 hover:text-white transition"
                      title="Delete / Clear Crop Box"
                    >
                      <Icon name="trash" className="w-3 h-3" />
                    </button>
                  </div>
                )}
              </div>

              <div className="flex items-center space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] sm:text-xs">
                <button
                  onClick={() => setViewMode('lightbox')}
                  className={`px-2 sm:px-3 py-1 rounded-lg transition font-medium flex items-center space-x-1 ${viewMode === 'lightbox' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  <Icon name="zoomIn" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Lightbox</span>
                </button>
                <button
                  onClick={() => setViewMode('crop')}
                  className={`px-2 sm:px-3 py-1 rounded-lg transition font-medium flex items-center space-x-1 ${viewMode === 'crop' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  <Icon name="crop" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Crop AI</span>
                </button>
                <button
                  onClick={() => setViewMode('loupe')}
                  className={`px-2 sm:px-3 py-1 rounded-lg transition font-medium flex items-center space-x-1 ${viewMode === 'loupe' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  <Icon name="search" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Loupe</span>
                </button>
              </div>

              <div className="flex items-center space-x-1">
                <button
                  onClick={() => setShowMobileSidebar(!showMobileSidebar)}
                  className="md:hidden p-1.5 text-slate-300 hover:text-white rounded-lg bg-slate-800 flex items-center justify-center"
                >
                  <Icon name="info" className="w-4 h-4 text-emerald-400" />
                </button>
                <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>
            </div>

            <div
              ref={containerRef}
              onMouseMove={handlePointerMove}
              onMouseDown={handlePointerDown}
              onMouseUp={handlePointerUp}
              onWheel={handleWheelZoom}
              onTouchStart={(e) => { handlePointerDown(e); handlePointerMove(e); }}
              onTouchMove={handlePointerMove}
              onTouchEnd={handlePointerUp}
              className="flex-1 relative flex items-center justify-center p-2 sm:p-4 overflow-hidden select-none cursor-crosshair touch-canvas"
            >
              {/* Floating Delete Button */}
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (onDeletePhoto) onDeletePhoto(photo.id);
                }}
                className="absolute top-3 left-3 sm:top-4 sm:left-4 z-30 p-2 sm:p-2.5 bg-slate-900/80 hover:bg-red-600 text-slate-300 hover:text-white rounded-full border border-slate-700/80 shadow-xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center"
                title="Delete photo"
              >
                <Icon name="trash" className="w-4 h-4 sm:w-5 sm:h-5 text-red-400 hover:text-white" />
              </button>

              {/* Floating Previous Image Button */}
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (hasPrev && onPrevPhoto) onPrevPhoto();
                }}
                disabled={!hasPrev}
                className={`absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 z-30 p-2 sm:p-3 rounded-full border shadow-2xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center ${
                  hasPrev
                    ? 'bg-slate-900/80 hover:bg-emerald-600 text-slate-200 hover:text-white border-slate-700/80 cursor-pointer'
                    : 'bg-slate-900/40 text-slate-600 border-slate-800/40 cursor-not-allowed opacity-40'
                }`}
                title={hasPrev ? "Previous photo (Left Arrow)" : "No previous photo"}
              >
                <Icon name="chevronLeft" className="w-5 h-5 sm:w-6 sm:h-6" />
              </button>

              {/* Floating Next Image Button */}
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (hasNext && onNextPhoto) onNextPhoto();
                }}
                disabled={!hasNext}
                className={`absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 z-30 p-2 sm:p-3 rounded-full border shadow-2xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center ${
                  hasNext
                    ? 'bg-slate-900/80 hover:bg-emerald-600 text-slate-200 hover:text-white border-slate-700/80 cursor-pointer'
                    : 'bg-slate-900/40 text-slate-600 border-slate-800/40 cursor-not-allowed opacity-40'
                }`}
                title={hasNext ? "Next photo (Right Arrow)" : "No next photo"}
              >
                <Icon name="chevronRight" className="w-5 h-5 sm:w-6 sm:h-6" />
              </button>

              {showCroppedPreview && cropBox && cropBox.width > 0 && viewMode !== 'crop' ? (
                <div 
                  className="relative flex items-center justify-center max-h-[calc(100vh-8rem)] max-w-full"
                  style={viewMode === 'lightbox' ? { transform: `translate(${panZoom.x}px, ${panZoom.y}px) scale(${panZoom.scale})` } : {}}
                >
                  <CroppedImage
                    innerRef={imgRef}
                    src={activeBlobUrl}
                    alt={photo.name}
                    cropBox={cropBox}
                    photo={photo}
                    fitMode="contain"
                    className="rounded-2xl border border-slate-700 shadow-2xl overflow-hidden"
                  />
                </div>
              ) : (
                <div 
                  className="relative flex items-center justify-center max-h-full max-w-full"
                  style={viewMode === 'lightbox' ? { transform: `translate(${panZoom.x}px, ${panZoom.y}px) scale(${panZoom.scale})` } : {}}
                >
                  <CroppedImage
                    innerRef={imgRef}
                    src={activeBlobUrl}
                    alt={photo.name}
                    cropBox={null}
                    photo={photo}
                    fitMode="contain"
                    className="rounded-2xl border border-slate-800 shadow-2xl overflow-hidden"
                  >
                    {cropBox && cropBox.width > 0 && viewMode === 'crop' && (
                      <div
                        className="absolute border-2 border-dashed border-emerald-400 bg-emerald-500/20 pointer-events-none z-20"
                        style={{
                          left: `${cropBox.x}%`,
                          top: `${cropBox.y}%`,
                          width: `${cropBox.width}%`,
                          height: `${cropBox.height}%`
                        }}
                      >
                        <span className="absolute -top-6 left-0 bg-emerald-600 text-white text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap shadow">
                          Crop Region ({cropBox.width.toFixed(0)}% × {cropBox.height.toFixed(0)}%)
                        </span>
                      </div>
                    )}
                  </CroppedImage>

                  {photo.focusSpot && viewMode !== 'crop' && !isZoomedOrCropped && (
                    <div
                      className="absolute w-12 h-12 -ml-6 -mt-6 border-2 border-sky-400/80 bg-sky-500/10 rounded-full pointer-events-none flex items-center justify-center shadow-lg animate-pulse"
                      style={{ left: `${photo.focusSpot.xPct}%`, top: `${photo.focusSpot.yPct}%` }}
                    >
                      <span className="w-1.5 h-1.5 rounded-full bg-sky-300"></span>
                    </div>
                  )}
                </div>
              )}

              {viewMode === 'loupe' && (
                <div
                  className="loupe-lens absolute w-36 h-36 sm:w-48 sm:h-48 rounded-full pointer-events-none border-2 border-emerald-400 bg-no-repeat z-30"
                  style={getLoupeStyle()}
                />
              )}

              {aiResult && aiResult.heatmapPoints && showHeatmapOverlay && (
                <div className="absolute inset-0 pointer-events-none">
                  {aiResult.heatmapPoints.map((pt, i) => (
                    <div
                      key={i}
                      className="absolute w-6 h-6 -ml-3 -mt-3 rounded-full bg-emerald-500/40 border-2 border-emerald-400 animate-ping flex items-center justify-center"
                      style={{ left: `${pt.x}%`, top: `${pt.y}%` }}
                      title={pt.label || "Key Feature"}
                    >
                      <span className="w-2 h-2 rounded-full bg-emerald-300"></span>
                    </div>
                  ))}
                </div>

    function CullingWorkspaceView({
      photos,
      setPhotos,
      onSelectPhoto,
      userApiKey,
      filterSharpness,
      setFilterSharpness,
      sortBy,
      setSortBy,
      currentPage,
      setCurrentPage,
      processedPhotos,
      isPreviewOpen
    }) {
      const pageSize = 20;

      const [selectedIds, setSelectedIds] = useState(new Set());
      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
      const [loadingThumbnails, setLoadingThumbnails] = useState(false);
      const [thumbnailProgress, setThumbnailProgress] = useState({ current: 0, total: 0 });
      const [rating, setRating] = useState(false);
      const [ratingProgress, setRatingProgress] = useState({ current: 0, total: 0 });
      const [showDeleteConfirmModal, setShowDeleteConfirmModal] = useState(false);
      const abortUploadRef = useRef(false);
      const abortRatingRef = useRef(false);
      const fileInputRef = useRef(null);

      const toggleSelectPhoto = (photoId, e) => {
        if (e) e.stopPropagation();
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(photoId)) {
            next.delete(photoId);
          } else {
            next.add(photoId);
          }
          return next;
        });
      };

      const handleSelectAll = () => {
        if (selectedIds.size === processedPhotos.length && processedPhotos.length > 0) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(processedPhotos.map(p => p.id)));
        }
      };

      const handleDeleteSinglePhoto = (photoId, e) => {
        if (e) e.stopPropagation();
        const photo = photos.find(p => p.id === photoId);
        if (photo) {
          try { if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') photo.fileHandle.remove(); } catch (err) {}
          try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (err) {}
          try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (err) {}
        }
        setPhotos(prev => prev.filter(p => p.id !== photoId));
        setSelectedIds(prev => {
          const next = new Set(prev);
          next.delete(photoId);
          return next;
        });
      };

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        setUploading(true);
        abortUploadRef.current = false;
        setUploadProgress({ current: 0, total: files.length });

        const newPhotoObjs = [];
        for (let i = 0; i < files.length; i++) {
          if (abortUploadRef.current) break;
          const file = files[i];
          newPhotoObjs.push({
            id: 'photo_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now(),
            file: file,
            fileHandle: file.handle || null,
            name: file.name,
            size: file.size,
            lastModified: file.lastModified,
            blobUrl: null,
            thumbnailUrl: null,
            naturalWidth: 1000,
            naturalHeight: 750,
            sharpness: null,
            stars: null,
            userStars: null,
            focusSpot: null,
            identification: null,
            cropBox: null
          });
          setUploadProgress({ current: i + 1, total: files.length });
          if (i % 20 === 0) await new Promise(r => setTimeout(r, 0));
        }

        setPhotos(prev => [...newPhotoObjs, ...prev]);
        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleBatchRateFocus = async () => {
        const unrated = photos.filter(p => p.sharpness === null && p.userStars === null);
        if (!unrated.length) return;

        setRating(true);
        abortRatingRef.current = false;
        setRatingProgress({ current: 0, total: unrated.length });

        for (let i = 0; i < unrated.length; i++) {
          if (abortRatingRef.current) break;

          const target = unrated[i];
          const evalResult = await evaluatePhotoFocus(target.file, target.focusSpot);

          setPhotos(prev => prev.map(p => p.id === target.id ? { 
            ...p, 
            sharpness: evalResult.score,
            stars: evalResult.stars,
            focusSpot: evalResult.focusSpot 
          } : p));
          setRatingProgress({ current: i + 1, total: unrated.length });
        }

        setRating(false);
      };

      const handleCardStarClick = (photoId, newStars) => {
        setPhotos(prev => prev.map(p => p.id === photoId ? {
          ...p,
          userStars: newStars,
          stars: newStars
        } : p));
      };

      const confirmAndDeleteFiltered = async () => {
        setShowDeleteConfirmModal(false);

        if (selectedIds.size > 0) {
          const toDelete = photos.filter(p => selectedIds.has(p.id));
          for (const photo of toDelete) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
          }
          setPhotos(prev => prev.filter(p => !selectedIds.has(p.id)));
          setSelectedIds(new Set());
        } else {
          if (!processedPhotos.length) return;
          const idsToRemove = new Set(processedPhotos.map(p => p.id));
          
          for (const photo of processedPhotos) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
          }

          setPhotos(prev => prev.filter(p => !idsToRemove.has(p.id)));
        }
        setCurrentPage(1);
      };

      const handleExportFiltered = async () => {
        const listToExport = selectedIds.size > 0 ? photos.filter(p => selectedIds.has(p.id)) : processedPhotos;
        if (!listToExport.length) return;

        let exportedIds = new Set();

        if ('showDirectoryPicker' in window) {
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            let exportedCount = 0;
            
            for (const photo of listToExport) {
              if (photo.file) {
                const newFileHandle = await dirHandle.getFileHandle(photo.name, { create: true });
                const writable = await newFileHandle.createWritable();
                await writable.write(photo.file);
                await writable.close();
                exportedCount++;
                exportedIds.add(photo.id);
              }
            }
            
            if (exportedIds.size > 0) {
              setPhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
              setSelectedIds(prev => {
                const next = new Set(prev);
                exportedIds.forEach(id => next.delete(id));
                return next;
              });
            }
            
            alert(`Successfully exported ${exportedCount} photo(s) to your selected folder and removed them from the workspace!`);
            setCurrentPage(1);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
            console.warn('showDirectoryPicker export fallback:', err);
          }
        }

        listToExport.forEach((photo, i) => {
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = photo.blobUrl || photo.thumbnailUrl;
            a.download = photo.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }, i * 200);
          exportedIds.add(photo.id);
        });

        setPhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
        setSelectedIds(prev => {
          const next = new Set(prev);
          exportedIds.forEach(id => next.delete(id));
          return next;
        });
        setCurrentPage(1);
        alert(`Exporting ${listToExport.length} photo(s). They have been removed from the workspace.`);
      };

      const totalPages = Math.ceil(processedPhotos.length / pageSize) || 1;
      
      const paginatedPhotos = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedPhotos.slice(start, start + pageSize);
      }, [processedPhotos, currentPage]);

      const bufferedPhotos = useMemo(() => {
        const total = processedPhotos.length;
        if (total === 0) return [];

        const targetBufferSize = 100;
        const pageStart = (currentPage - 1) * pageSize;
        const pageEnd = Math.min(total, currentPage * pageSize);
        const pageCenter = Math.floor((pageStart + pageEnd) / 2);

        let bufStart = pageCenter - Math.floor(targetBufferSize / 2);
        let bufEnd = pageCenter + Math.ceil(targetBufferSize / 2);

        if (bufStart < 0) {
          bufEnd = Math.min(total, bufEnd + Math.abs(bufStart));
          bufStart = 0;
        }
        if (bufEnd > total) {
          bufStart = Math.max(0, bufStart - (bufEnd - total));
          bufEnd = total;
        }

        return processedPhotos.slice(bufStart, bufEnd);
      }, [processedPhotos, currentPage, pageSize]);

      useEffect(() => {
        if (isPreviewOpen) {
          setLoadingThumbnails(false);
          return;
        }

        if (!bufferedPhotos.length) {
          setLoadingThumbnails(false);
          return;
        }

        const bufferedIds = new Set(bufferedPhotos.map(p => p.id));
        const needed = bufferedPhotos.filter(p => !p.thumbnailUrl && p.file);

        let isMounted = true;

        if (needed.length > 0) {
          setLoadingThumbnails(true);
          setThumbnailProgress({ current: 0, total: needed.length });

          processThumbnailQueue(
            needed,
            (batchUpdates) => {
              if (!isMounted) return;
              setPhotos(prev => {
                const mapUpdates = new Map(batchUpdates.map(u => [u.id, u]));
                return prev.map(p => {
                  const u = mapUpdates.get(p.id);
                  if (u) {
                    return {
                      ...p,
                      thumbnailUrl: u.thumbUrl,
                      blobUrl: u.blobUrl,
                      naturalWidth: u.width,
                      naturalHeight: u.height
                    };
                  }
                  return p;
                });
              });
            },
            (completed, total) => {
              if (isMounted) setThumbnailProgress({ current: completed, total });
            }
          ).then(() => {
            if (isMounted) setLoadingThumbnails(false);
          });
        } else {
          setLoadingThumbnails(false);
        }

        /* Garbage collect memory for photos outside the 100-image window buffer */
        setPhotos(prev => {
          let hasChanges = false;
          const updated = prev.map(p => {
            if (!bufferedIds.has(p.id) && (p.thumbnailUrl || p.blobUrl)) {
              hasChanges = true;
              if (p.thumbnailUrl) try { URL.revokeObjectURL(p.thumbnailUrl); } catch(e){}
              if (p.blobUrl) try { URL.revokeObjectURL(p.blobUrl); } catch(e){}
              return { ...p, thumbnailUrl: null, blobUrl: null };
            }
            return p;
          });
          return hasChanges ? updated : prev;
        });

        return () => { isMounted = false; };
      }, [currentPage, processedPhotos.length, filterSharpness, sortBy, isPreviewOpen]);

      const isSelectionActive = selectedIds.size > 0;
      const deleteButtonText = isSelectionActive 
        ? `Delete Selected (${selectedIds.size})` 
        : `Delete Filtered (${processedPhotos.length})`;

      return (
        <div className="flex-1 flex flex-col overflow-hidden min-h-0 p-3 sm:p-4 md:p-6 gap-3 sm:gap-4 pb-20 md:pb-4">
          <div className="flex-shrink-0 bg-slate-900 border border-slate-800 p-3.5 sm:p-4 rounded-2xl shadow-xl space-y-3 sm:space-y-4">

                >
