      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><rect width="512" height="512" rx="128" fill="#040711"/><path d="M256 64C180 64 120 120 120 200C120 300 256 448 256 448C256 448 392 300 392 200C392 120 332 64 256 64ZM256 250C228.4 250 206 227.6 206 200C206 172.4 228.4 150 256 150C283.6 150 306 127.6 306 200C306 227.6 283.6 250 256 250Z" fill="#10b981"/><path d="M256 120C211.8 120 176 155.8 176 200C176 260 256 360 256 360C256 360 336 260 336 200C336 155.8 300.2 120 256 120ZM256 230C239.4 230 226 216.6 226 200C226 183.4 239.4 170 256 170C272.6 170 286 183.4 286 200C286 216.6 272.6 230 256 230Z" fill="#34d399"/></svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

      let validStartUrl = window.location.origin + window.location.pathname;

      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);
    })();

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const GEMINI_QUOTAS = {
      MAX_RPM: 15,
      MAX_TPM: 1000000,
      MAX_RPD: 1500
    };

    const BATCH_PAGE_SIZE = 20;
    const MIN_CROP_DIMENSION_PCT = 2.0;

    function scoreToStars(score) {
      if (score === null || score === undefined) return 0;
      return Math.max(1, Math.min(5, Math.ceil(score / 2)));
    }

    function generateFingerprintId(file) {
      if (!file) return null;
      const cleanName = (file.name || 'unnamed').replace(/[^a-zA-Z0-9._-]/g, '_');
      return `fp_${cleanName}_${file.size || 0}_${file.lastModified || 0}`;
    }

    const OPFS_VAULT_ROOT = 'BirdVault_Lifer_Catalog';
    const IDB_NAME = 'BirdVault_Storage_DB';
    const IDB_VERSION = 1;

    function openBirdVaultDb() {
      return new Promise((resolve) => {
        if (typeof indexedDB === 'undefined') return resolve(null);
        const request = indexedDB.open(IDB_NAME, IDB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('vault_blobs')) {
            db.createObjectStore('vault_blobs');
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => {
          console.warn('IndexedDB Open Warning:', e);
          resolve(null);
        };
      });
    }

    async function saveBlobToIdb(storeName, key, blob) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return false;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(blob, key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        });
      } catch (e) {
        console.warn('IDB Save Error:', e);
        return false;
      }
    }

    async function getBlobFromIdb(storeName, key) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function isOpfsSupported() {
      return typeof navigator !== 'undefined' && 
             navigator.storage && 
             typeof navigator.storage.getDirectory === 'function';
    }

    async function getOpfsRootHandle() {
      if (!(await isOpfsSupported())) return null;
      try {
        const root = await navigator.storage.getDirectory();
        return await root.getDirectoryHandle(OPFS_VAULT_ROOT, { create: true });
      } catch (err) {
        console.warn('OPFS Root Access Warning:', err);
        return null;
      }
    }

    async function sanitizeDirectoryName(name) {
      return (name || 'Uncategorized').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 60);
    }

    async function writeOpfsSightingFile(category, speciesName, fileName, blobOrFile) {
      try {
        let blobToWrite = null;
        if (blobOrFile instanceof File || blobOrFile instanceof Blob) {
          blobToWrite = blobOrFile;
        } else if (typeof blobOrFile === 'string') {
          try {
            const res = await fetch(blobOrFile);
            blobToWrite = await res.blob();
          } catch (err) {
            console.warn('Could not fetch URL for OPFS write:', err);
          }
        }

        if (!blobToWrite) {
          blobToWrite = new Blob([JSON.stringify(blobOrFile, null, 2)], { type: 'application/json' });
        }

        const root = await getOpfsRootHandle();
        if (root) {
          const catDirName = await sanitizeDirectoryName(category || 'Other');
          const speciesDirName = await sanitizeDirectoryName(speciesName);

          const catHandle = await root.getDirectoryHandle(catDirName, { create: true });
          const speciesHandle = await catHandle.getDirectoryHandle(speciesDirName, { create: true });

          const fileHandle = await speciesHandle.getFileHandle(fileName, { create: true });
          if (typeof fileHandle.createWritable === 'function') {
            const writable = await fileHandle.createWritable();
            await writable.write(blobToWrite);
            await writable.close();
          }
        }

        if (blobToWrite instanceof Blob && fileName.toLowerCase().endsWith('.jpg')) {
          await saveBlobToIdb('vault_blobs', fileName, blobToWrite);
        }

        return true;
      } catch (err) {
        console.warn('OPFS File Write Warning:', err);
        return false;
      }
    }

    async function getOpfsSightingFileBlob(category, speciesName, fileName) {
      if (!fileName) return null;

      try {
        const root = await getOpfsRootHandle();
        if (root) {
          const catDirName = await sanitizeDirectoryName(category || 'Other');
          const speciesDirName = await sanitizeDirectoryName(speciesName);

          const catHandle = await root.getDirectoryHandle(catDirName, { create: false });
          const speciesHandle = await catHandle.getDirectoryHandle(speciesDirName, { create: false });
          const fileHandle = await speciesHandle.getFileHandle(fileName, { create: false });

          const file = await fileHandle.getFile();
          if (file && file.size > 100) {
            return file;
          }
        }
      } catch (err) {}

      const idbBlob = await getBlobFromIdb('vault_blobs', fileName);
      if (idbBlob && idbBlob.size > 100) {
        return idbBlob;
      }

      return null;
    }

    async function updateOpfsMasterManifest(manifestData) {
      try {
        const root = await getOpfsRootHandle();
        if (!root) return false;
        const fileHandle = await root.getFileHandle('vault_manifest.json', { create: true });
        if (typeof fileHandle.createWritable === 'function') {
          const writable = await fileHandle.createWritable();
          await writable.write(JSON.stringify(manifestData, null, 2));
          await writable.close();
        }
        return true;
      } catch (err) {
        console.warn('OPFS Manifest Update Error:', err);
        return false;
      }
    }

    async function exportOpfsVaultToZip() {
      if (typeof JSZip === 'undefined') {
        throw new Error('JSZip library is not loaded');
      }

      const root = await getOpfsRootHandle();
      if (!root) throw new Error('OPFS physical storage is not accessible on this device');

      const zip = new JSZip();
      const vaultFolder = zip.folder(OPFS_VAULT_ROOT);

      async function traverseDirectory(dirHandle, currentZipFolder) {
        for await (const [name, handle] of dirHandle.entries()) {
          if (handle.kind === 'file') {
            const file = await handle.getFile();
            currentZipFolder.file(name, file);
          } else if (handle.kind === 'directory') {
            const subFolder = currentZipFolder.folder(name);
            await traverseDirectory(handle, subFolder);
          }
        }
      }

      await traverseDirectory(root, vaultFolder);
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      return new File([zipBlob], `${OPFS_VAULT_ROOT}_Export.zip`, { type: 'application/zip' });
    }

    function getStoredFingerprintDb() {
      try {
        const stored = localStorage.getItem('birdvault_fingerprints_v1');
        if (stored) return JSON.parse(stored);
      } catch (e) {
        console.warn('Fingerprint DB read error:', e);
      }
      return {};
    }

    function saveFingerprintMetadata(photoMeta) {
      if (!photoMeta || (!photoMeta.fingerprintId && !photoMeta.id)) return;
      const fpId = photoMeta.fingerprintId || photoMeta.id;
      
      try {
        const db = getStoredFingerprintDb();
        db[fpId] = {
          fingerprintId: fpId,
          name: photoMeta.name,
          size: photoMeta.size,
          lastModified: photoMeta.lastModified,
          sharpness: photoMeta.sharpness !== undefined ? photoMeta.sharpness : null,
          stars: photoMeta.stars !== undefined ? photoMeta.stars : null,
          userStars: photoMeta.userStars !== undefined ? photoMeta.userStars : null,
          focusSpot: photoMeta.focusSpot || null,
          cameraExif: photoMeta.cameraExif || null,
          identification: photoMeta.identification || null,
          cropBox: photoMeta.cropBox || null,
          locationText: photoMeta.locationText || null,
          opfsFileName: photoMeta.opfsFileName || null
        };
        localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
      } catch (e) {
        console.warn('Fingerprint DB save warning:', e);
      }
    }

    function deleteFingerprintMetadata(fpId) {
      if (!fpId) return;
      try {
        const db = getStoredFingerprintDb();
        if (db[fpId]) {
          delete db[fpId];
          localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
        }
      } catch (e) {
        console.warn('Fingerprint DB delete warning:', e);
      }
    }

    function syncFingerprintDbPrune(activePhotos) {
      try {
        const activeIds = new Set((activePhotos || []).map(p => p.fingerprintId || p.id));
        const db = getStoredFingerprintDb();
        let changed = false;
        Object.keys(db).forEach(fpId => {
          if (!activeIds.has(fpId)) {
            delete db[fpId];
            changed = true;
          }
        });
        if (changed) {
          localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
        }
      } catch (e) {
        console.warn('Fingerprint DB sync prune error:', e);
      }
    }

    function getStoredTokenUsage() {
      try {
        const stored = localStorage.getItem('birdvault_gemini_usage');
        if (stored) {
          const parsed = JSON.parse(stored);
          const now = Date.now();
          if (now - parsed.minuteWindowStart > 60000) {
            parsed.minuteRequests = 0;
            parsed.minuteTokens = 0;
            parsed.minuteWindowStart = now;
          }
          const storedDate = new Date(parsed.dailyWindowStart).getUTCDate();
          const currentDate = new Date(now).getUTCDate();
          if (storedDate !== currentDate) {
            parsed.dailyRequests = 0;
            parsed.dailyWindowStart = now;
          }
          return parsed;
        }
      } catch (e) {}
      
      const now = Date.now();
      return {
        minuteRequests: 0,
        minuteTokens: 0,
        dailyRequests: 0,
        minuteWindowStart: now,
        dailyWindowStart: now
      };
    }

    function recordTokenUsage(estimatedTokens = 350) {
      const usage = getStoredTokenUsage();
      usage.minuteRequests += 1;
      usage.minuteTokens += estimatedTokens;
      usage.dailyRequests += 1;
      localStorage.setItem('birdvault_gemini_usage', JSON.stringify(usage));
      window.dispatchEvent(new Event('birdvault_token_update'));
      return usage;
    }

    async function extractCameraExif(file) {
      return new Promise((resolve) => {
        if (!file || !(file instanceof File)) return resolve(null);
        
        const reader = new FileReader();
        const slice = file.slice(0, 524288);
        
        reader.onload = (e) => {
          try {
            const view = new DataView(e.target.result);
            if (view.byteLength < 12) return resolve(null);
            if (view.getUint16(0, false) !== 0xFFD8) return resolve(null);

            let offset = 2;
            let app1Offset = -1;

            while (offset < view.byteLength - 4) {
              const marker = view.getUint16(offset, false);
              offset += 2;
              
              if (marker === 0xFFE1) {
                const length = view.getUint16(offset, false);
                const exifHeader = view.getUint32(offset + 2, false);
                if (exifHeader === 0x45786966) {
                  app1Offset = offset + 2;
                  break;
                }
                offset += length;
              } else if ((marker & 0xFF00) === 0xFF00 && marker !== 0xFF00) {
                const length = view.getUint16(offset, false);
                offset += length;
              } else {
                break;
              }
            }

            if (app1Offset === -1) return resolve(null);

            const tiffOffset = app1Offset + 6;
            if (tiffOffset + 8 > view.byteLength) return resolve(null);

            const endianCode = view.getUint16(tiffOffset, false);
            let littleEndian = false;
            if (endianCode === 0x4949) {
              littleEndian = true;
            } else if (endianCode === 0x4D4D) {
              littleEndian = false;
            } else {
              return resolve(null);
            }

            if (view.getUint16(tiffOffset + 2, littleEndian) !== 0x002A) return resolve(null);

            const firstIFDOffset = view.getUint32(tiffOffset + 4, littleEndian);
            if (!firstIFDOffset) return resolve(null);

            const getString = (start, length) => {
              let str = '';
              for (let i = 0; i < length; i++) {
                if (start + i >= view.byteLength) break;
                const charCode = view.getUint8(start + i);
                if (charCode === 0) break;
                str += String.fromCharCode(charCode);
              }
              return str.trim();
            };

            const getRational = (valueOffset) => {
              if (valueOffset + 8 > view.byteLength) return null;
              const num = view.getUint32(valueOffset, littleEndian);
              const den = view.getUint32(valueOffset + 4, littleEndian);
              if (den === 0) return null;
              return num / den;
            };

            const getValue = (type, count, valueOffset, entryOffset) => {
              if (type === 3) {
                if (count === 1) return view.getUint16(entryOffset + 8, littleEndian);
                const arr = [];
                const arrOffset = count * 2 > 4 ? tiffOffset + valueOffset : entryOffset + 8;
                for (let k = 0; k < count; k++) {
                  if (arrOffset + k * 2 + 2 <= view.byteLength) {
                    arr.push(view.getUint16(arrOffset + k * 2, littleEndian));
                  }
                }
                return arr;
              } else if (type === 4) {
                if (count === 1) return view.getUint32(entryOffset + 8, littleEndian);
                const arr = [];
                const arrOffset = count * 4 > 4 ? tiffOffset + valueOffset : entryOffset + 8;
                for (let k = 0; k < count; k++) {
                  if (arrOffset + k * 4 + 4 <= view.byteLength) {
                    arr.push(view.getUint32(arrOffset + k * 4, littleEndian));
                  }
                }
                return arr;
              } else if (type === 5 || type === 10) {
                return getRational(tiffOffset + valueOffset);
              } else if (type === 2) {
                const strOffset = count > 4 ? tiffOffset + valueOffset : entryOffset + 8;
                return getString(strOffset, count);
              }
              return null;
            };

            const readIFD = (ifdStart) => {
              const tags = {};
              if (ifdStart + 2 > view.byteLength) return tags;
              const numEntries = view.getUint16(ifdStart, littleEndian);
              let entryOffset = ifdStart + 2;

              for (let i = 0; i < numEntries; i++) {
                if (entryOffset + 12 > view.byteLength) break;
                const tag = view.getUint16(entryOffset, littleEndian);
                const type = view.getUint16(entryOffset + 2, littleEndian);
                const count = view.getUint32(entryOffset + 4, littleEndian);
                const valueOffset = view.getUint32(entryOffset + 8, littleEndian);

                const val = getValue(type, count, valueOffset, entryOffset);
                if (val !== null && val !== undefined) {
                  tags[tag] = val;
                }
                entryOffset += 12;
              }
              return tags;
            };

            const ifd0Tags = readIFD(tiffOffset + firstIFDOffset);

            let cameraData = {
              make: ifd0Tags[0x010F] || null,
              model: ifd0Tags[0x0110] || null,
              lens: null,
              shutterSpeed: null,
              aperture: null,
              apertureValue: null,
              iso: null,
              focalLength: null,
              focalLengthValue: null,
              subjectDistance: null,
              focusArea: null
            };

            const exifSubIFDOffset = ifd0Tags[0x8769];
            if (exifSubIFDOffset) {
              const exifTags = readIFD(tiffOffset + exifSubIFDOffset);

              if (exifTags[0x920A] !== undefined) {
                const fl = parseFloat(exifTags[0x920A]);
                if (!isNaN(fl) && fl > 0) {
                  cameraData.focalLengthValue = fl;
                  cameraData.focalLength = `${Math.round(fl)}mm`;
                  if (exifTags[0xA405]) {
                    cameraData.focalLength += ` (${exifTags[0xA405]}mm eq)`;
                  }
                }
              }

              if (exifTags[0x829A] !== undefined) {
                const expTime = parseFloat(exifTags[0x829A]);
                if (!isNaN(expTime) && expTime > 0) {
                  if (expTime < 1) {
                    cameraData.shutterSpeed = `1/${Math.round(1 / expTime)}s`;
                  } else {
                    cameraData.shutterSpeed = `${expTime.toFixed(1)}s`;
                  }
                }
              }

              if (exifTags[0x829D] !== undefined) {
                const fnum = parseFloat(exifTags[0x829D]);
                if (!isNaN(fnum) && fnum > 0) {
                  cameraData.apertureValue = fnum;
                  cameraData.aperture = `f/${fnum.toFixed(1)}`;
                }
              }

              const isoVal = exifTags[0x8827] || exifTags[0x8833];
              if (isoVal !== undefined) {
                cameraData.iso = `ISO ${isoVal}`;
              }

              if (exifTags[0xA434]) {
                cameraData.lens = exifTags[0xA434];
              }

              const imgW = exifTags[0xA002] || ifd0Tags[0x0100] || null;
              const imgH = exifTags[0xA003] || ifd0Tags[0x0101] || null;
              const subjectArea = exifTags[0x9214] || ifd0Tags[0x9214] || null;

              if (Array.isArray(subjectArea) && imgW && imgH && imgW > 0 && imgH > 0) {
                const cx = subjectArea[0];
                const cy = subjectArea[1];
                let w = imgW * 0.2;
                let h = imgH * 0.2;

                if (subjectArea.length === 4) {
                  w = subjectArea[2];
                  h = subjectArea[3];
                } else if (subjectArea.length === 3) {
                  w = subjectArea[2] * 2;
                  h = subjectArea[2] * 2;
                }

                if (cx > 0 && cy > 0) {
                  cameraData.focusArea = {
                    xPct: Math.max(0, Math.min(100, (cx / imgW) * 100)),
                    yPct: Math.max(0, Math.min(100, (cy / imgH) * 100)),
                    widthPct: Math.max(5, Math.min(100, (w / imgW) * 100)),
                    heightPct: Math.max(5, Math.min(100, (h / imgH) * 100)),
                    source: 'Camera EXIF AF Point (SubjectArea Tag 0x9214)'
                  };
                }
              }
            }

            if (cameraData.make || cameraData.model || cameraData.focalLength || cameraData.shutterSpeed || cameraData.aperture || cameraData.iso || cameraData.lens || cameraData.focusArea) {
              resolve(cameraData);
            } else {
              resolve(null);
            }
          } catch (err) {
            console.warn('EXIF binary parse error:', err);
            resolve(null);
          }
        };
        reader.onerror = () => resolve(null);
        reader.readAsArrayBuffer(slice);
      });
    }

    async function generateFastThumbnail(file, targetSize = 240) {
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: targetSize,
            resizeHeight: targetSize,
            resizeMode: 'aspect-fit'
          });
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'medium';
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();

          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              canvas.width = 0; canvas.height = 0;
              if (blob) {
                resolve({
                  thumbUrl: URL.createObjectURL(blob),
                  width: canvas.width,
                  height: canvas.height
                });
              } else {
                resolve({ thumbUrl: URL.createObjectURL(file), width: 1000, height: 750 });
              }
            }, 'image/jpeg', 0.65);
          });
        }
      } catch (e) {
        console.warn('createImageBitmap fallback:', e);
      }
      return { thumbUrl: URL.createObjectURL(file), width: 1000, height: 750 };
    }

    async function createScreenProxy(file, maxDimension = 2048) {
      if (!file || !(file instanceof File)) return null;
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: maxDimension,
            resizeMode: 'aspect-fit'
          });

          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;

          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();

          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              canvas.width = 0; canvas.height = 0;
              if (blob) {
                resolve(URL.createObjectURL(blob));
              } else {
                resolve(URL.createObjectURL(file));
              }
            }, 'image/jpeg', 0.82);
          });
        }
      } catch (e) {
        console.warn('Screen Proxy creation fallback:', e);
      }
      return URL.createObjectURL(file);
    }

    async function processThumbnailQueue(neededPhotos, updateBatchCallback, progressCallback, signal) {
      let index = 0;
      let completed = 0;
      const total = neededPhotos.length;
      const concurrency = 2;

      let pendingBatch = [];

      return new Promise((resolve) => {
        if (!total) return resolve();

        const worker = async () => {
          while (index < total) {
            if (signal?.aborted) break;
            const currentPhoto = neededPhotos[index++];
            let thumbUrl = null;
            try {
              const res = await generateFastThumbnail(currentPhoto.file, 240);
              thumbUrl = res.thumbUrl;
              pendingBatch.push({
                id: currentPhoto.id,
                thumbUrl: res.thumbUrl,
                thumbWidth: res.width,
                thumbHeight: res.height
              });

              if (pendingBatch.length >= 2 || index === total) {
                if (!signal?.aborted) updateBatchCallback([...pendingBatch]);
                pendingBatch = [];
                await new Promise(r => setTimeout(r, 0));
              }
            } catch (err) {
              console.warn('Thumbnail generation error:', err);
              if (thumbUrl) try { URL.revokeObjectURL(thumbUrl); } catch(e){}
            } finally {
              completed++;
              if (!signal?.aborted) progressCallback(completed, total);
            }
          }
        };

        const workers = Array.from({ length: Math.min(concurrency, total) }, () => worker());
        Promise.all(workers).then(() => {
          if (pendingBatch.length > 0 && !signal?.aborted) {
            updateBatchCallback([...pendingBatch]);
          }
          resolve();
        });
      });
    }

    async function evaluatePhotoFocus(fileOrBlobUrl, targetRoi = null, cameraExif = null) {
      return new Promise(async (resolve) => {
        let focusSpot = null;
        let cropBoxRoi = null;

        if (targetRoi) {
          if (targetRoi.width !== undefined && targetRoi.height !== undefined && targetRoi.x !== undefined) {
            cropBoxRoi = targetRoi;
          } else if (targetRoi.xPct !== undefined) {
            focusSpot = targetRoi;
          }
        } else if (cameraExif?.focusArea) {
          focusSpot = cameraExif.focusArea;
        }

        let srcToRevoke = null;
        const img = new Image();
        img.crossOrigin = 'anonymous';

        if (typeof fileOrBlobUrl === 'string') {
          img.src = fileOrBlobUrl;
        } else if (fileOrBlobUrl instanceof File || fileOrBlobUrl instanceof Blob) {
          srcToRevoke = URL.createObjectURL(fileOrBlobUrl);
          img.src = srcToRevoke;
        } else {
          return resolve({
            score: 1,
            stars: 1,
            focusSpot: null,
            debugDetails: {
              peakGradient: 0,
              closedShapesCount: 0,
              sharpEdgeRatioPct: 0,
              avgAcutance: 0,
              rule: "No valid image blob",
              reason: "Empty or missing source file URL."
            }
          });
        }

        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');

            let cropX = 0, cropY = 0, cropW = img.width, cropH = img.height;

            if (cropBoxRoi && cropBoxRoi.width > 0 && cropBoxRoi.height > 0) {
              cropX = Math.round((cropBoxRoi.x / 100) * img.width);
              cropY = Math.round((cropBoxRoi.y / 100) * img.height);
              cropW = Math.round((cropBoxRoi.width / 100) * img.width);
              cropH = Math.round((cropBoxRoi.height / 100) * img.height);
            } else if (focusSpot && focusSpot.xPct !== undefined) {
              const cx = (focusSpot.xPct / 100) * img.width;
              const cy = (focusSpot.yPct / 100) * img.height;
              const rw = ((focusSpot.widthPct || 25) / 100) * img.width;
              const rh = ((focusSpot.heightPct || 25) / 100) * img.height;
              cropX = Math.max(0, Math.round(cx - rw / 2));
              cropY = Math.max(0, Math.round(cy - rh / 2));
              cropW = Math.min(img.width - cropX, Math.round(rw));
              cropH = Math.min(img.height - cropY, Math.round(rh));
            }

            const evalMaxDim = 600;
            const scale = Math.min(1, evalMaxDim / Math.max(cropW, cropH));
            const w = Math.max(16, Math.round(cropW * scale));
            const h = Math.max(16, Math.round(cropH * scale));

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, w, h);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const luminance = new Float32Array(w * h);
            for (let i = 0; i < data.length; i += 4) {
              luminance[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            }

            const gradMag = new Float32Array(w * h);
            const isEdge = new Uint8Array(w * h);

            const LOWER_GRADIENT_THRESHOLD = 20;
            let peakGrad = 0;

            for (let y = 1; y < h - 1; y++) {
              for (let x = 1; x < w - 1; x++) {
                const idx = y * w + x;
                const gx = (
                  -1 * luminance[(y - 1) * w + (x - 1)] + 1 * luminance[(y - 1) * w + (x + 1)] +
                  -2 * luminance[y * w + (x - 1)]       + 2 * luminance[y * w + (x + 1)] +
                  -1 * luminance[(y + 1) * w + (x - 1)] + 1 * luminance[(y + 1) * w + (x + 1)]
                );
                const gy = (
                  -1 * luminance[(y - 1) * w + (x - 1)] - 2 * luminance[(y - 1) * w + x] - 1 * luminance[(y - 1) * w + (x + 1)] +
                   1 * luminance[(y + 1) * w + (x - 1)] + 2 * luminance[(y + 1) * w + x] + 1 * luminance[(y + 1) * w + (x + 1)]
                );

                const mag = Math.sqrt(gx * gx + gy * gy);
                gradMag[idx] = mag;
                if (mag > peakGrad) peakGrad = mag;

                if (mag >= LOWER_GRADIENT_THRESHOLD) {
                  isEdge[idx] = 1;
                }
              }
            }

            const visited = new Uint8Array(w * h);
            let closedShapePixels = 0;
            let sharpClosedShapePixels = 0;
            let totalClosedAcutance = 0;
            let closedShapesCount = 0;

            for (let y = 2; y < h - 2; y++) {
              for (let x = 2; x < w - 2; x++) {
                const startIdx = y * w + x;
                if (isEdge[startIdx] && !visited[startIdx]) {
                  const queue = [startIdx];
                  visited[startIdx] = 1;
                  const componentIndices = [];

                  let minX = x, maxX = x, minY = y, maxY = y;

                  let head = 0;
                  while (head < queue.length) {
                    const curr = queue[head++];
                    componentIndices.push(curr);

                    const cy = Math.floor(curr / w);
                    const cx = curr % w;

                    if (cx < minX) minX = cx;
                    if (cx > maxX) maxX = cx;
                    if (cy < minY) minY = cy;
                    if (cy > maxY) maxY = cy;

                    for (let dy = -1; dy <= 1; dy++) {
                      for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = cx + dx;
                        const ny = cy + dy;
                        if (nx >= 1 && nx < w - 1 && ny >= 1 && ny < h - 1) {
                          const nIdx = ny * w + nx;
                          if (isEdge[nIdx] && !visited[nIdx]) {
                            visited[nIdx] = 1;
                            queue.push(nIdx);
                          }
                        }
                      }
                    }
                  }

                  const compSize = componentIndices.length;
                  const boxW = maxX - minX + 1;
                  const boxH = maxY - minY + 1;
                  const boxArea = boxW * boxH;

                  const compactness = boxArea > 0 ? compSize / boxArea : 0;
                  const isClosedOrEnclosedShape = compSize >= 12 && (compactness >= 0.18 || (boxW >= 5 && boxH >= 5 && compSize >= (boxW + boxH) * 1.2));

                  if (isClosedOrEnclosedShape) {
                    closedShapesCount++;
                    for (let k = 0; k < compSize; k++) {
                      const idx = componentIndices[k];
                      const mag = gradMag[idx];
                      closedShapePixels++;

                      const cy = Math.floor(idx / w);
                      const cx = idx % w;
                      let localMin = luminance[idx];
                      let localMax = luminance[idx];
                      for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                          const lumVal = luminance[(cy + dy) * w + (cx + dx)];
                          if (lumVal < localMin) localMin = lumVal;
                          if (lumVal > localMax) localMax = lumVal;
                        }
                      }
                      const contrastStep = localMax - localMin;
                      
                      let acutance = 0;
                      if (mag >= 45 && contrastStep >= 20) {
                        acutance = (mag * mag) / (contrastStep + 1);
                      }

                      if (acutance >= 16.0) {
                        sharpClosedShapePixels++;
                        totalClosedAcutance += acutance;
                      }
                    }
                  }
                }
              }
            }

            const sharpRatio = closedShapePixels > 0 ? sharpClosedShapePixels / closedShapePixels : 0;
            const avgAcutance = sharpClosedShapePixels > 0 ? totalClosedAcutance / sharpClosedShapePixels : 0;

            let score = 1;
            let ruleReason = "";

            if (closedShapePixels === 0 || sharpClosedShapePixels === 0) {
              score = 1;
              ruleReason = "No closed subject shapes found, or shape edges are broad and blurry.";
            } else if (sharpRatio >= 0.28 && avgAcutance >= 45) {
              score = 10;
              ruleReason = `Tack sharp closed shape contours (${(sharpRatio * 100).toFixed(1)}% sharp ratio, ${avgAcutance.toFixed(0)} avg acutance).`;
            } else if (sharpRatio >= 0.22 && avgAcutance >= 35) {
              score = 9;
              ruleReason = `Very sharp closed shape contours (${(sharpRatio * 100).toFixed(1)}% sharp ratio).`;
            } else if (sharpRatio >= 0.16 && avgAcutance >= 28) {
              score = 8;
              ruleReason = `Sharp shape contours with crisp contrast.`;
            } else if (sharpRatio >= 0.12 && avgAcutance >= 22) {
              score = 7;
              ruleReason = `Good edge steepness across closed shapes.`;
            } else if (sharpRatio >= 0.08 && avgAcutance >= 18) {
              score = 6;
              ruleReason = `Acceptable subject focus on closed shape boundaries.`;
            } else if (sharpRatio >= 0.05) {
              score = 5;
              ruleReason = `Moderate edge steepness; subject slightly soft.`;
            } else if (sharpRatio >= 0.025) {
              score = 4;
              ruleReason = `Low shape boundary acutance; soft subject.`;
            } else if (sharpRatio >= 0.01) {
              score = 3;
              ruleReason = `Very soft closed shapes.`;
            } else {
              score = 2;
              ruleReason = `Barely detectable micro-contrast on closed shape contours.`;
            }

            if (isNaN(score)) score = 1;
            const stars = scoreToStars(score);

            const debugDetails = {
              peakGradient: Math.round(peakGrad),
              closedShapesCount,
              sharpEdgeRatioPct: Math.round(sharpRatio * 100),
              avgAcutance: Math.round(avgAcutance),
              rule: `Grade ${score}/10 (${stars} Stars)`,
              reason: ruleReason
            };

            if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
            canvas.width = 0; canvas.height = 0;
            resolve({ score, stars, focusSpot, debugDetails });
          } catch (err) {
            if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
            resolve({
              score: 1,
              stars: 1,
              focusSpot: null,
              debugDetails: {
                peakGradient: 0,
                closedShapesCount: 0,
                sharpEdgeRatioPct: 0,
                avgAcutance: 0,
                rule: "Error fallback",
                reason: err.message || "Canvas execution error"
              }
            });
          }
        };

        img.onerror = () => {
          if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
          resolve({
            score: 1,
            stars: 1,
            focusSpot: null,
            debugDetails: {
              peakGradient: 0,
              closedShapesCount: 0,
              sharpEdgeRatioPct: 0,
              avgAcutance: 0,
              rule: "Image load failed",
              reason: "Could not load image resource."
            }
          });
        };
      });
    }

    function StarRating({ rating = 0, maxStars = 5, onChange, readOnly = false, size = "w-4 h-4" }) {
      const [hoverRating, setHoverRating] = useState(0);
      const displayRating = hoverRating || rating || 0;

      return (
        <div 
          className="flex items-center space-x-0.5 select-none" 
          onMouseLeave={() => !readOnly && setHoverRating(0)}
        >
          {Array.from({ length: maxStars }).map((_, idx) => {
            const starValue = idx + 1;
            const isFilled = starValue <= displayRating;
            return (
              <button
                key={idx}
                type="button"
                disabled={readOnly}
                onClick={(e) => {
                  e.stopPropagation();
                  if (!readOnly && onChange) onChange(starValue);
                }}
                onMouseEnter={() => !readOnly && setHoverRating(starValue)}
                className={`${readOnly ? 'cursor-default' : 'cursor-pointer hover:scale-125'} transition-transform duration-150 p-1 -m-1 focus:outline-none touch-manipulation`}
                title={!readOnly ? `Set rating to ${starValue} star${starValue > 1 ? 's' : ''}` : `${rating} / ${maxStars} stars`}
              >
                <svg
                  className={`${size} ${isFilled ? 'text-amber-400 fill-amber-400' : 'text-slate-600 fill-transparent'}`}
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  strokeWidth="1.5"
                >
                  <path

      const [usage, setUsage] = useState(getStoredTokenUsage());
      const [secondsToMinuteReset, setSecondsToMinuteReset] = useState(60);
      const [dailyResetText, setDailyResetText] = useState('');

      useEffect(() => {
        const updateState = () => setUsage(getStoredTokenUsage());
        window.addEventListener('birdvault_token_update', updateState);

        const timer = setInterval(() => {
          const u = getStoredTokenUsage();
          setUsage(u);

          const elapsedMinute = Math.floor((Date.now() - u.minuteWindowStart) / 1000);
          const remainingMinute = Math.max(0, 60 - elapsedMinute);
          setSecondsToMinuteReset(remainingMinute);

          const now = new Date();
          const nextUtcMidnight = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
          const diffMs = nextUtcMidnight - now;
          const hours = Math.floor(diffMs / (1000 * 60 * 60));
          const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((diffMs % (1000 * 60)) / 1000);
          setDailyResetText(`${hours}h ${mins}m ${secs}s`);
        }, 1000);

        return () => {
          window.removeEventListener('birdvault_token_update', updateState);

    function CroppedImage({ src, alt, cropBox, photo = null, className = "", imgClassName = "", innerRef = null, fitMode = "contain", children = null }) {
      const [imgError, setImgError] = useState(false);
      const [imgDims, setImgDims] = useState({
        w: (photo?.naturalWidth && photo.naturalWidth > 300) ? photo.naturalWidth : 1000,
        h: (photo?.naturalHeight && photo.naturalHeight > 300) ? photo.naturalHeight : 750
      });

      useEffect(() => {
        setImgError(false);
        if (src) {
          const img = new Image();
          img.onload = () => {
            if (img.naturalWidth > 0 && img.naturalHeight > 0) {
              setImgDims({ w: img.naturalWidth, h: img.naturalHeight });
            }
          };
          img.onerror = () => setImgError(true);
          img.src = src;
        }
      }, [src]);

      const naturalW = imgDims.w;
      const naturalH = imgDims.h;

      const aspect = useMemo(() => {
        const baseAspect = naturalW / naturalH;
        if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
          return (cropBox.width / cropBox.height) * baseAspect;
        }
        return baseAspect;
      }, [cropBox, naturalW, naturalH]);

      const frameStyle = useMemo(() => {
        if (!aspect || fitMode !== "contain") return {};
        return {
          aspectRatio: `${aspect}`,
          maxWidth: '100%',
          maxHeight: '100%',
          width: 'auto',
          height: 'auto'
        };
      }, [aspect, fitMode]);

      const preserveAspect = fitMode === "cover" ? "xMidYMid slice" : "xMidYMid meet";

      if (imgError || !src) {
        return (
          <div className={`relative overflow-hidden flex flex-col items-center justify-center bg-slate-950 p-4 text-center select-none ${className}`} style={frameStyle}>
            <Icon name="image" className="w-8 h-8 text-slate-600 mb-1" />
            <span className="text-[10px] text-emerald-400 font-semibold bg-emerald-950/80 px-2 py-1 rounded border border-emerald-500/30">
              📁 Re-select folder for preview
            </span>
          </div>
        );
      }

      if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
        const cropX = (cropBox.x / 100) * naturalW;
        const cropY = (cropBox.y / 100) * naturalH;
        const cropW = (cropBox.width / 100) * naturalW;
        const cropH = (cropBox.height / 100) * naturalH;

        const finalSrc = photo?.blobUrl || src;

        return (
          <div 
            className={`relative overflow-hidden flex items-center justify-center bg-slate-950 select-none ${className}`}
            style={frameStyle}
          >
            <svg
              ref={innerRef}
              viewBox={`${cropX} ${cropY} ${cropW} ${cropH}`}
              preserveAspectRatio={preserveAspect}
              className={`w-full h-full block ${imgClassName}`}
              draggable="false"
              onDragStart={(e) => e.preventDefault()}
            >
              <image
                href={finalSrc}
                x="0"
                y="0"
                width={naturalW}
                height={naturalH}
                onError={() => setImgError(true)}
              />
            </svg>
            {children}
          </div>
        );
      }

      return (
        <div 
          className={`relative overflow-hidden flex items-center justify-center bg-slate-950 select-none ${className}`}
          style={frameStyle}
        >
          <img
            ref={innerRef}
            src={src}
            alt={alt}
            decoding="async"
            draggable="false"
            onDragStart={(e) => e.preventDefault()}
            onError={() => setImgError(true)}
            className={`${fitMode === 'cover' ? 'w-full h-full object-cover' : 'w-full h-full object-contain'} ${imgClassName}`}
          />
          {children}
        </div>
      );
    }

      const globalHotspots = useMemo(() => [

        "Aoraki / Mount Cook National Park, Canterbury, NZ",
        "Kruger National Park, Limpopo, South Africa",

        "Everglades National Park, Florida, United States",
        "Pantanal Matogrossense National Park, Mato Grosso, Brazil",
        "Kakadu National Park, Northern Territory, Australia",
        "Galapagos National Park, Galapagos Islands, Ecuador",
        "Daintree Rainforest, Queensland, Australia",
        "Bwindi Impenetrable National Park, Western Region, Uganda",
        "Ranthambore National Park, Rajasthan, India",
        "Central Park Bird Sanctuary, New York City, USA",
        "Lake Nakuru National Park, Great Rift Valley, Kenya"

      const handleInputChange = (e) => {
        const query = e.target.value;
        onChange(query);
        if (query.trim().length > 0) {
          const filtered = globalHotspots.filter(h => 
            h.toLowerCase().includes(query.toLowerCase())
          );
          setSuggestions(filtered.length > 0 ? filtered : [query]);
          setIsOpen(true);
        } else {
          setSuggestions([]);
          setIsOpen(false);
        }
      };

      const handleSelectSuggestion = (suggestion) => {

      };

      const handleDetectGPS = () => {
        if (!navigator.geolocation) {
          onChange("GPS unavailable");
          return;
        }

        setGettingGps(true);
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const { latitude, longitude } = position.coords;
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
              if (res.ok) {
                const data = await res.json();
                const displayName = data.display_name || `${latitude.toFixed(4)}°, ${longitude.toFixed(4)}°`;
                onChange(displayName);
              } else {
                onChange(`GPS: ${latitude.toFixed(4)}°, ${longitude.toFixed(4)}°`);
              }
            } catch (err) {
              onChange(`GPS Location: ${latitude.toFixed(4)}°, ${longitude.toFixed(4)}°`);
            }
            setGettingGps(false);
          },
          (error) => {
            console.warn('GPS Error:', error);
            onChange("Auckland, New Zealand (Fallback)");
            setGettingGps(false);
          },
          { enableHighAccuracy: true, timeout: 8000 }

      return (

              className="text-[10px] text-emerald-400 hover:text-emerald-300 font-semibold flex items-center space-x-1 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30 transition touch-manipulation"
            >
              <Icon name="crosshair" className={`w-3 h-3 ${gettingGps ? 'animate-spin' : ''}`} />
              <span>{gettingGps ? 'Locating...' : 'Detect GPS'}</span>
            </button>
          </label>
          
          <div className="relative">
            <input
              ref={inputRef}
              type="text"
              value={value}
              onChange={handleInputChange}
              onFocus={() => setIsOpen(true)}
              onBlur={() => setTimeout(() => setIsOpen(false), 200)}
              placeholder="Address or birding hotspot..."
              className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 pr-10"
            />
            {value && (
              <button
                onClick={() => onChange('')}

                <Icon name="x" className="w-3.5 h-3.5" />

            )}
          </div>

          {isOpen && suggestions.length > 0 && (
            <div className="absolute z-50 left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-h-48 overflow-y-auto divide-y divide-slate-800/60">
              {suggestions.map((sug, i) => (

                >

    async function identifyBirdWithGemini(photo, customApiKey = '', cropBox = null, locationText = 'Global') {
      const rawKey = customApiKey || localStorage.getItem('birdvault_gemini_token') || '';
      const apiKey = rawKey.trim().replace(/[\r\n\t]/g, '');

      if (!apiKey) {
        return { 
          error: 'MISSING_KEY', 
          message: 'A Google Gemini API key is required to identify bird species.' 
        };
      }

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

      try {
        const base64Data = await new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let sx = 0, sy = 0, sw = img.width, sh = img.height;
            if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
              sx = (cropBox.x / 100) * img.width;
              sy = (cropBox.y / 100) * img.height;
              sw = (cropBox.width / 100) * img.width;
              sh = (cropBox.height / 100) * img.height;
            }
            
            const maxDim = 2048;
            let targetW = sw;
            let targetH = sh;
            if (targetW > maxDim || targetH > maxDim) {
              const r = Math.min(maxDim / targetW, maxDim / targetH);
              targetW *= r;
              targetH *= r;
            }

            canvas.width = Math.max(10, Math.round(targetW));
            canvas.height = Math.max(10, Math.round(targetH));
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            canvas.width = 0; canvas.height = 0;
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = reject;
          img.src = photo.blobUrl || photo.thumbnailUrl || photo.url;
        });

        const systemPrompt = `You are an expert ornithologist and wildlife biology taxonomist. Identify the bird species in the photo.
Geographic Location Context: "${locationText}". Restrict species identification to birds native, introduced, or vagrant to "${locationText}".

Provide detailed species metadata records suitable for a professional bird life-list catalog.

Return STRICT JSON ONLY without markdown fences or code blocks:
{
  "speciesName": "Common Name",
  "scientificName": "Genus species",
  "category": "Songbirds" | "Raptors" | "Waterfowl" | "Seabirds" | "Waders" | "Parrots" | "Other",
  "confidence": 0.95,
  "description": "Comprehensive diagnostic description of plumage, bill shape, size, and plumage variation.",
  "habitat": "Primary ecosystem, elevation range, nesting preferences, and geographic distribution.",
  "conservationStatus": "e.g. Least Concern / Vulnerable / Endangered / Near Threatened / Endemic",
  "diet": "Primary diet, foraging strategy, and feeding behaviors.",
  "keyTraits": "3-4 distinct field marks or visual diagnostic traits (e.g., distinctive eye stripe, crest, bill color, wing bars).",
  "heatmapPoints": [
    { "x": 45, "y": 30, "intensity": 0.9, "label": "Eye Contrast" },
    { "x": 52, "y": 42, "intensity": 0.8, "label": "Beak Morphology" }
  ]
}`;

        const userPrompt = `Geographic Location Context: ${locationText}. Identify this bird photo, extract complete species metadata parameters, analyze diagnostic focus points for heatmap, and return strict JSON.`;

        const payload = {
          contents: [{
            parts: [
              { text: userPrompt },
              { inlineData: { mimeType: "image/jpeg", data: base64Data } }
            ]
          }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        recordTokenUsage(320);

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let serverMessage = `HTTP ${response.status}`;
          try {
            const errData = await response.json();
            if (errData.error && errData.error.message) {
              serverMessage = errData.error.message;
            }
          } catch (e) {}

          if (response.status === 429) {
            return {
              error: 'RATE_LIMIT_EXCEEDED',
              message: 'Gemini API Rate Limit reached (15 Requests/Min or Daily Quota).'
            };
          }
          if (response.status === 400 || response.status === 401 || response.status === 403) {
            return { 
              error: 'INVALID_KEY', 
              message: `Gemini API Key rejected (${serverMessage}).` 
            };
          }
          return {
            error: 'API_ERROR',
            message: `Gemini API error: ${serverMessage}`
          };
        }

        const result = await response.json();
        const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleanJson = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();

        let parsed;
        try {
          parsed = JSON.parse(cleanJson);
        } catch (jsonErr) {
          return {
            error: 'UNPARSABLE_RESPONSE',
            message: 'AI returned an unparseable response structure.'
          };
        }

        if (parsed.error) {
          return parsed;
        }

        return parsed;
      } catch (err) {
        return {
          error: 'API_ERROR',
          message: err.message || 'An unexpected error occurred.'
        };
      }
    }

    function InteractivePhotoViewer({ photo, onClose, onUpdatePhoto, onSaveToVault, onDeletePhoto, userApiKey, initialLocation = '', onUpdateLocation, onNextPhoto, onPrevPhoto, hasNext = false, hasPrev = false }) {
      const [loupeImgPos, setLoupeImgPos] = useState({ xPct: 50, yPct: 50 });
      const [loupeScreenPos, setLoupeScreenPos] = useState({ x: 0, y: 0 });
      const [isLoupeActive, setIsLoupeActive] = useState(false);
      const [isCropToolActive, setIsCropToolActive] = useState(false);
      
      const [zoomLevel, setZoomLevel] = useState(3.0);
      const [showMobileSidebar, setShowMobileSidebar] = useState(false);
      const [showHeatmapOverlay, setShowHeatmapOverlay] = useState(true);

      const loupeCanvasRef = useRef(null);
      const cachedLoupeImgRef = useRef(null);
      const [loupeImgLoaded, setLoupeImgLoaded] = useState(false);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft' && hasPrev && onPrevPhoto) {
            onPrevPhoto();
          } else if (e.key === 'ArrowRight' && hasNext && onNextPhoto) {
            onNextPhoto();
          } else if (e.key === 'Escape' && onClose) {
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [hasPrev, hasNext, onPrevPhoto, onNextPhoto, onClose]);

      const activeBlobUrl = useMemo(() => {
        if (photo.blobUrl) return photo.blobUrl;
        if (photo.file) return URL.createObjectURL(photo.file);
        if (photo.thumbnailUrl) return photo.thumbnailUrl;
        if (photo.url) return photo.url;
        return null;
      }, [photo.id, photo.blobUrl, photo.file, photo.thumbnailUrl, photo.url]);

      useEffect(() => {
        setLoupeImgLoaded(false);
        if (!activeBlobUrl) return;

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          cachedLoupeImgRef.current = img;
          setLoupeImgLoaded(true);
        };
        img.onerror = () => {
          setLoupeImgLoaded(false);
        };
        img.src = activeBlobUrl;
      }, [activeBlobUrl]);

      useEffect(() => {
        if (!photo.blobUrl && photo.file) {
          createScreenProxy(photo.file, 2048).then((proxyUrl) => {
            if (proxyUrl) onUpdatePhoto({ ...photo, blobUrl: proxyUrl });
          });
        }
        if (!photo.cameraExif && photo.file) {
          extractCameraExif(photo.file).then((exifData) => {
            if (exifData) {
              const updated = {
                ...photo,
                cameraExif: exifData,
                focusSpot: photo.focusSpot || exifData.focusArea || null
              };
              onUpdatePhoto(updated);
              saveFingerprintMetadata(updated);
            }
          });
        }
      }, [photo.id]);

      const [panZoom, setPanZoom] = useState({ scale: 1, x: 0, y: 0 });
      const [isDraggingPan, setIsDraggingPan] = useState(false);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const pinchStartDistRef = useRef(null);
      const pinchStartScaleRef = useRef(1);

      const [cropBox, setCropBox] = useState(photo.cropBox || null);
      const [showCroppedPreview, setShowCroppedPreview] = useState(!!(photo.cropBox && photo.cropBox.width > 0));
      const [isDrawingCrop, setIsDrawingCrop] = useState(false);
      const cropStartRef = useRef(null);
      const currentCropBoxRef = useRef(photo.cropBox || null);
      const containerRef = useRef(null);
      const imgRef = useRef(null);

      const [identifying, setIdentifying] = useState(false);
      const [aiResult, setAiResult] = useState(photo.identification || null);
      const [locationInput, setLocationInput] = useState(photo.locationText || initialLocation || 'Auckland, New Zealand');

      const [evaluatingFocus, setEvaluatingFocus] = useState(false);
      const [debugData, setDebugData] = useState(null);
      const cameraExif = photo?.cameraExif || null;

      const activeStars = photo.userStars || photo.stars || scoreToStars(photo.sharpness);

      const triggerCropFocusEvaluation = async (targetCropBox) => {
        if (!targetCropBox || targetCropBox.width < MIN_CROP_DIMENSION_PCT || targetCropBox.height < MIN_CROP_DIMENSION_PCT) return;
        setEvaluatingFocus(true);
        const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl || photo.url, targetCropBox, cameraExif);
        const updated = {
          ...photo,
          cropBox: targetCropBox,
          sharpness: evalRes.score,
          stars: evalRes.stars
        };
        if (evalRes.debugDetails) setDebugData(evalRes.debugDetails);
        onUpdatePhoto(updated);
        saveFingerprintMetadata(updated);
        setEvaluatingFocus(false);
      };

      const toggleCropTool = async () => {
        if (isCropToolActive) {
          setIsCropToolActive(false);
          const activeCrop = currentCropBoxRef.current || cropBox;
          if (activeCrop && activeCrop.width >= MIN_CROP_DIMENSION_PCT && activeCrop.height >= MIN_CROP_DIMENSION_PCT) {
            await triggerCropFocusEvaluation(activeCrop);
          }
        } else {
          setIsCropToolActive(true);
        }
      };

      const handleRatingChange = (newStars) => {
        const updated = {
          ...photo,
          userStars: newStars,
          stars: newStars
        };
        onUpdatePhoto(updated);
        saveFingerprintMetadata(updated);
      };

      const handleLocationChange = (newLoc) => {
        setLocationInput(newLoc);
        if (onUpdateLocation) onUpdateLocation(newLoc);
        const updated = {
          ...photo,
          locationText: newLoc
        };
        onUpdatePhoto(updated);
        saveFingerprintMetadata(updated);
      };

      const getContainerPointerPos = (e) => {
        if (!containerRef.current) return { x: 0, y: 0, clientX: 0, clientY: 0 };
        const rect = containerRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
          clientX,
          clientY
        };
      };

      const getImagePointerPos = (e) => {
        if (!imgRef.current) return { pctX: 50, pctY: 50 };
        const rect = imgRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const pctX = Math.max(0, Math.min(100, (x / rect.width) * 100));
        const pctY = Math.max(0, Math.min(100, (y / rect.height) * 100));

        return { pctX, pctY };
      };

      const drawLoupeLens = useCallback(() => {
        const canvas = loupeCanvasRef.current;
        const img = cachedLoupeImgRef.current;
        if (!canvas || !img || !loupeImgLoaded) return;

        const ctx = canvas.getContext('2d', { alpha: false });
        const size = canvas.width;
        const radius = size / 2;

        ctx.clearRect(0, 0, size, size);

        ctx.save();
        ctx.beginPath();
        ctx.arc(radius, radius, radius - 1, 0, Math.PI * 2);
        ctx.clip();

        const srcX = (loupeImgPos.xPct / 100) * img.naturalWidth;
        const srcY = (loupeImgPos.yPct / 100) * img.naturalHeight;

        const sw = img.naturalWidth / zoomLevel;
        const sh = img.naturalHeight / zoomLevel;

        const sx = Math.max(0, Math.min(img.naturalWidth - sw, srcX - sw / 2));
        const sy = Math.max(0, Math.min(img.naturalHeight - sh, srcY - sh / 2));

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, size, size);

        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(radius - 12, radius); ctx.lineTo(radius + 12, radius);
        ctx.moveTo(radius, radius - 12); ctx.lineTo(radius, radius + 12);
        ctx.stroke();

        ctx.restore();
      }, [loupeImgPos, zoomLevel, loupeImgLoaded]);

      useEffect(() => {
        if (isLoupeActive) {
          drawLoupeLens();
        }
      }, [isLoupeActive, loupeImgPos, zoomLevel, loupeImgLoaded, drawLoupeLens]);

      const handleWheelZoom = (e) => {
        if (isLoupeActive || isCropToolActive) return;
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.25 : -0.25;
        setPanZoom(prev => {
          const nextScale = Math.max(1, Math.min(8, prev.scale + delta));
          return {
            ...prev,
            scale: nextScale,
            x: nextScale === 1 ? 0 : prev.x,
            y: nextScale === 1 ? 0 : prev.y
          };
        });
      };

      const handlePointerMove = (e) => {
        if (e.touches && e.touches.length === 2) {
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          if (pinchStartDistRef.current && pinchStartDistRef.current > 0) {
            const factor = currentDist / pinchStartDistRef.current;
            const newScale = Math.max(1, Math.min(8, pinchStartScaleRef.current * factor));
            setPanZoom(prev => ({
              ...prev,
              scale: newScale,
              x: newScale === 1 ? 0 : prev.x,
              y: newScale === 1 ? 0 : prev.y
            }));
          }
          return;
        }

        const containerPos = getContainerPointerPos(e);
        const imgPos = getImagePointerPos(e);
        const pctX = imgPos.pctX;
        const pctY = imgPos.pctY;

        if (isLoupeActive) {
          setLoupeImgPos({ xPct: pctX, yPct: pctY });
          setLoupeScreenPos({ x: containerPos.x, y: containerPos.y });
        }

        if (isCropToolActive && isDrawingCrop && cropStartRef.current) {
          const startX = cropStartRef.current.x;
          const startY = cropStartRef.current.y;
          const left = Math.min(startX, pctX);
          const top = Math.min(startY, pctY);
          const width = Math.abs(pctX - startX);
          const height = Math.abs(pctY - startY);

          const updatedCrop = { x: left, y: top, width, height };
          currentCropBoxRef.current = updatedCrop;
          setCropBox(updatedCrop);
        } else if (isDraggingPan && panZoom.scale > 1) {
          setPanZoom(p => ({
            ...p,
            x: containerPos.clientX - dragStartRef.current.x,
            y: containerPos.clientY - dragStartRef.current.y
          }));
        }
      };

      const handlePointerDown = (e) => {
        if (e.touches && e.touches.length === 2) {
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          pinchStartDistRef.current = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          pinchStartScaleRef.current = panZoom.scale;
          return;
        }

        const containerPos = getContainerPointerPos(e);
        const imgPos = getImagePointerPos(e);
        const pctX = imgPos.pctX;
        const pctY = imgPos.pctY;

        if (isLoupeActive) {
          setLoupeImgPos({ xPct: pctX, yPct: pctY });
          setLoupeScreenPos({ x: containerPos.x, y: containerPos.y });
        }
        
        if (isCropToolActive) {
          setShowCroppedPreview(false);
          cropStartRef.current = { x: pctX, y: pctY };
          const initialBox = { x: pctX, y: pctY, width: 0, height: 0 };
          currentCropBoxRef.current = initialBox;
          setCropBox(initialBox);
          setIsDrawingCrop(true);
        } else if (panZoom.scale > 1) {
          setIsDraggingPan(true);
          dragStartRef.current = { x: containerPos.clientX - panZoom.x, y: containerPos.clientY - panZoom.y };
        }
      };

      const handlePointerUp = async (e) => {
        if (e.touches && e.touches.length < 2) {
          pinchStartDistRef.current = null;
        }

        if (isDrawingCrop) {
          const finalCrop = currentCropBoxRef.current;
          setIsDrawingCrop(false);
          setIsCropToolActive(false);

          if (finalCrop && finalCrop.width >= MIN_CROP_DIMENSION_PCT && finalCrop.height >= MIN_CROP_DIMENSION_PCT) {
            await triggerCropFocusEvaluation(finalCrop);
          } else {
            setCropBox(photo.cropBox || null);
            currentCropBoxRef.current = photo.cropBox || null;
            if (!photo.cropBox) {
              setShowCroppedPreview(false);
            }
          }
        }
        setIsDraggingPan(false);
      };

      const handleRunAiIdentification = async () => {
        let currentPhoto = photo;
        if (currentPhoto.sharpness === null) {
          setEvaluatingFocus(true);
          const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl || photo.url, photo.cropBox || photo.focusSpot, cameraExif);
          currentPhoto = { ...photo, sharpness: evalRes.score, stars: evalRes.stars, focusSpot: evalRes.focusSpot };
          if (evalRes.debugDetails) setDebugData(evalRes.debugDetails);
          onUpdatePhoto(currentPhoto);
          saveFingerprintMetadata(currentPhoto);
          setEvaluatingFocus(false);
        }

        setIdentifying(true);
        const result = await identifyBirdWithGemini(currentPhoto, userApiKey, cropBox, locationInput);
        
        if (result && (result.error === 'MISSING_KEY' || result.error === 'INVALID_KEY')) {
          if (window.birdvault_open_auth_modal) {
            window.birdvault_open_auth_modal();
          }
        }

        setAiResult(result);
        setIdentifying(false);
        setShowMobileSidebar(true);
        
        let updatedFocusSpot = currentPhoto.focusSpot;
        if (result && result.heatmapPoints && result.heatmapPoints.length > 0) {
          const eyePt = result.heatmapPoints.find(p => p.label && p.label.toLowerCase().includes('eye')) || result.heatmapPoints[0];
          if (eyePt && eyePt.x !== undefined && eyePt.y !== undefined) {
            updatedFocusSpot = {
              xPct: eyePt.x,
              yPct: eyePt.y,
              widthPct: 20,
              heightPct: 20,
              source: 'AI Heatmap Anchor'
            };
            setEvaluatingFocus(true);
            const aiFocusRes = await evaluatePhotoFocus(currentPhoto.file || currentPhoto.blobUrl || currentPhoto.thumbnailUrl || currentPhoto.url, updatedFocusSpot, cameraExif);
            currentPhoto = {
              ...currentPhoto,
              sharpness: aiFocusRes.score,
              stars: aiFocusRes.stars,
              focusSpot: updatedFocusSpot
            };
            if (aiFocusRes.debugDetails) setDebugData(aiFocusRes.debugDetails);
            setEvaluatingFocus(false);
          }
        }

        const updated = { ...currentPhoto, identification: result, cropBox: cropBox, locationText: locationInput, focusSpot: updatedFocusSpot };
        onUpdatePhoto(updated);
        saveFingerprintMetadata(updated);
      };

      const formattedDate = useMemo(() => {
        if (!photo.lastModified) return 'Unknown Date';
        return new Date(photo.lastModified).toLocaleString();
      }, [photo.lastModified]);

      const formattedFileSize = useMemo(() => {
        if (!photo.size) return 'Unknown Size';
        return (photo.size / (1024 * 1024)).toFixed(2) + ' MB';
      }, [photo.size]);

      const loupeDiameter = 192;
      const hasValidCropBox = cropBox && cropBox.width >= MIN_CROP_DIMENSION_PCT && cropBox.height >= MIN_CROP_DIMENSION_PCT;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col md:flex-row overflow-hidden select-none">
          <div className="flex-1 flex flex-col relative bg-black/80 overflow-hidden h-full">
            
            <div className="h-14 sm:h-16 px-3 sm:px-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 gap-2">
              <div className="flex items-center space-x-2 truncate min-w-0">
                <span className="text-xs sm:text-sm font-semibold text-slate-300 truncate max-w-[120px] sm:max-w-[180px]">{photo.name}</span>
                {evaluatingFocus && (
                  <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full flex items-center space-x-1">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Rating...</span>
                  </span>
                )}
              </div>

              <div className="flex items-center space-x-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                <button
                  onClick={toggleCropTool}
                  className={`px-3 py-1.5 rounded-lg transition font-medium flex items-center space-x-1.5 ${isCropToolActive ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 hover:text-white'}`}
                >
                  <Icon name="crop" className="w-3.5 h-3.5" />
                  <span>Crop Box {isCropToolActive ? '(ON)' : '(OFF)'}</span>
                </button>
                
                <button
                  onClick={() => setIsLoupeActive(!isLoupeActive)}
                  className={`px-3 py-1.5 rounded-lg transition font-medium flex items-center space-x-1.5 ${isLoupeActive ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 hover:text-white'}`}
                >
                  <Icon name="search" className="w-3.5 h-3.5" />
                  <span>Loupe Tool {isLoupeActive ? '(ON)' : '(OFF)'}</span>
                </button>
              </div>

              <div className="flex items-center space-x-1">
                <button
                  onClick={() => setShowMobileSidebar(!showMobileSidebar)}
                  className="md:hidden p-2 text-slate-300 hover:text-white rounded-lg bg-slate-800 flex items-center justify-center touch-manipulation"
                >
                  <Icon name="info" className="w-5 h-5 text-emerald-400" />
                </button>
                <button onClick={onClose} className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 touch-manipulation">
                  <Icon name="x" className="w-6 h-6" />
                </button>
              </div>
            </div>

            <div
              ref={containerRef}
              onWheel={handleWheelZoom}
              onTouchStart={handlePointerDown}
              onTouchMove={handlePointerMove}
              onTouchEnd={handlePointerUp}
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerCancel={handlePointerUp}
              className={`flex-1 relative flex items-center justify-center p-2 sm:p-4 overflow-hidden select-none ${isCropToolActive ? 'cursor-crosshair' : panZoom.scale > 1 ? 'cursor-grab active:cursor-grabbing' : 'cursor-default'} touch-canvas`}
            >
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (onDeletePhoto) onDeletePhoto(photo.id);
                }}
                className="absolute top-3 left-3 sm:top-4 sm:left-4 z-30 p-2 sm:p-2.5 bg-slate-900/80 hover:bg-red-600 text-slate-300 hover:text-white rounded-full border border-slate-700/80 shadow-xl backdrop-blur-md transition-all touch-manipulation"
                title="Delete photo"
              >
                <Icon name="trash" className="w-4 h-4 sm:w-5 sm:h-5 text-red-400 hover:text-white" />
              </button>

              <div className="absolute bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-30 px-3.5 py-1.5 sm:px-4 sm:py-2 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-full shadow-2xl flex items-center space-x-2">
                <span className="text-[10px] sm:text-xs font-bold text-slate-300">Rating:</span>
                <StarRating
                  rating={activeStars}
                  onChange={handleRatingChange}
                  size="w-4 h-4 sm:w-5 sm:h-5"
                />
              </div>

              {/* Left-Hand Ergonomic Navigation Controller */}
              <div className="absolute left-3 sm:left-5 top-1/2 -translate-y-1/2 z-30 flex flex-col items-center space-y-2.5 bg-slate-900/90 p-2 sm:p-2.5 rounded-2xl border border-slate-700/90 backdrop-blur-md shadow-2xl">
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    if (hasPrev && onPrevPhoto) onPrevPhoto();
                  }}
                  disabled={!hasPrev}
                  className={`p-2.5 sm:p-3 rounded-xl border transition-all touch-manipulation flex items-center justify-center ${
                    hasPrev 
                      ? 'bg-slate-800 hover:bg-emerald-600 text-slate-100 border-slate-700 hover:border-emerald-500 shadow-md active:scale-95' 
                      : 'bg-slate-900/50 text-slate-600 border-slate-800/50 opacity-30 cursor-not-allowed'
                  }`}
                  title="Previous Photo (Left Finger / Thumb)"
                >
                  <Icon name="chevronLeft" className="w-5 h-5 sm:w-6 sm:h-6" />
                </button>

                <div className="w-6 h-px bg-slate-700/60"></div>

                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    if (hasNext && onNextPhoto) onNextPhoto();
                  }}
                  disabled={!hasNext}
                  className={`p-2.5 sm:p-3 rounded-xl border transition-all touch-manipulation flex items-center justify-center ${
                    hasNext 
                      ? 'bg-slate-800 hover:bg-emerald-600 text-slate-100 border-slate-700 hover:border-emerald-500 shadow-md active:scale-95' 
                      : 'bg-slate-900/50 text-slate-600 border-slate-800/50 opacity-30 cursor-not-allowed'
                  }`}
                  title="Next Photo (Left Finger / Thumb)"
                >
                  <Icon name="chevronRight" className="w-5 h-5 sm:w-6 sm:h-6" />
                </button>
              </div>

              <div 
                className="relative flex items-center justify-center w-full h-full max-w-full max-h-full transition-transform duration-75 ease-out"
                style={{
                  transform: `scale(${panZoom.scale}) translate(${panZoom.x / panZoom.scale}px, ${panZoom.y / panZoom.scale}px)`,
                  transformOrigin: 'center center'
                }}
              >
                {showCroppedPreview && hasValidCropBox && !isDrawingCrop ? (
                  <div className="relative flex items-center justify-center max-h-[calc(100vh-8rem)] max-w-full">
                    <CroppedImage
                      innerRef={imgRef}
                      src={activeBlobUrl}
                      alt={photo.name}
                      cropBox={cropBox}
                      photo={photo}
                      fitMode="contain"
                      className="rounded-2xl border border-slate-700 shadow-2xl overflow-hidden"
                    />
                  </div>
                ) : (
                  <div className="relative flex items-center justify-center w-full h-full max-w-full max-h-full">
                    <CroppedImage
                      innerRef={imgRef}
                      src={activeBlobUrl}
                      alt={photo.name}
                      cropBox={null}
                      photo={photo}
                      fitMode="contain"
                      className="rounded-2xl border border-slate-800 shadow-2xl overflow-hidden"
                    >
                      {cropBox && cropBox.width > 0 && (
                        <div
                          className="absolute border-2 border-emerald-400 bg-emerald-500/20 pointer-events-none z-20 shadow-[0_0_0_9999px_rgba(0,0,0,0.6)]"
                          style={{
                            left: `${cropBox.x}%`,
                            top: `${cropBox.y}%`,
                            width: `${cropBox.width}%`,
                            height: `${cropBox.height}%`
                          }}
                        >

          <div className={`w-full md:w-80 lg:w-96 bg-slate-900 border-l border-slate-800 p-3 sm:p-4 overflow-y-auto space-y-3 transition-all duration-300 ${showMobileSidebar ? 'block absolute md:relative bottom-0 left-0 right-0 max-h-[60vh] md:max-h-full border-t md:border-t-0 z-50 pb-safe shadow-2xl md:shadow-none' : 'hidden md:block'}`}>

                      <div className="bg-slate-950 p-1.5 rounded border border-slate-800/80">

                      </div>
                      <div className="bg-slate-950 p-1.5 rounded border border-slate-800/80">
                        <span className="text-slate-500 block">ISO</span>
                        <span className="text-slate-200 font-bold">{cameraExif.iso || 'N/A'}</span>
                      </div>
                      <div className="bg-slate-950 p-1.5 rounded border border-slate-800/80">
                        <span className="text-slate-500 block">FOCAL LENGTH</span>

                      </div>
