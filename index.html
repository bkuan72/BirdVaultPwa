  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // Default Quotas for Gemini Flash Tier
    const GEMINI_QUOTAS = {
      MAX_RPM: 15,           // Requests per minute
      MAX_TPM: 1000000,      // Tokens per minute
      MAX_RPD: 1500,         // Requests per day
      ESTIMATED_TOKENS_PER_IMG: 258 // Est. vision tokens per cropped ROI image
    };

    // Token Tracker Utilities & Local Storage Management
    function getStoredTokenUsage() {
      try {
        const stored = localStorage.getItem('birdvault_gemini_usage');
        if (stored) {
          const parsed = JSON.parse(stored);
          const now = Date.now();
          if (now - parsed.minuteWindowStart > 60000) {
            parsed.minuteRequests = 0;
            parsed.minuteTokens = 0;
            parsed.minuteWindowStart = now;
          }
          const storedDate = new Date(parsed.dailyWindowStart).getUTCDate();
          const currentDate = new Date(now).getUTCDate();
          if (storedDate !== currentDate) {
            parsed.dailyRequests = 0;
            parsed.dailyWindowStart = now;
          }
          return parsed;
        }
      } catch (e) {}
      
      const now = Date.now();
      return {
        minuteRequests: 0,
        minuteTokens: 0,
        dailyRequests: 0,
        minuteWindowStart: now,
        dailyWindowStart: now,
        lastRenewalTimestamp: now + 60000
      };
    }

    function recordTokenUsage(estimatedTokens = 350) {
      const usage = getStoredTokenUsage();
      usage.minuteRequests += 1;
      usage.minuteTokens += estimatedTokens;
      usage.dailyRequests += 1;
      localStorage.setItem('birdvault_gemini_usage', JSON.stringify(usage));
      window.dispatchEvent(new Event('birdvault_token_update'));
      return usage;
    }

    function TokenUsageMonitorModal({ isOpen, onClose }) {
      const [usage, setUsage] = useState(getStoredTokenUsage());
      const [secondsToMinuteReset, setSecondsToMinuteReset] = useState(60);
      const [dailyResetText, setDailyResetText] = useState('');

      useEffect(() => {
        const updateState = () => setUsage(getStoredTokenUsage());
        window.addEventListener('birdvault_token_update', updateState);

        const timer = setInterval(() => {
          const u = getStoredTokenUsage();
          setUsage(u);

          const elapsedMinute = Math.floor((Date.now() - u.minuteWindowStart) / 1000);
          const remainingMinute = Math.max(0, 60 - elapsedMinute);
          setSecondsToMinuteReset(remainingMinute);

          const now = new Date();
          const nextUtcMidnight = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
          const diffMs = nextUtcMidnight - now;
          const hours = Math.floor(diffMs / (1000 * 60 * 60));
          const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((diffMs % (1000 * 60)) / 1000);
          setDailyResetText(`${hours}h ${mins}m ${secs}s`);
        }, 1000);

        return () => {
          window.removeEventListener('birdvault_token_update', updateState);
          clearInterval(timer);
        };
      }, []);

      if (!isOpen) return null;

      const rpmPct = Math.min(100, Math.round((usage.minuteRequests / GEMINI_QUOTAS.MAX_RPM) * 100));
      const tpmPct = Math.min(100, Math.round((usage.minuteTokens / GEMINI_QUOTAS.MAX_TPM) * 100));
      const rpdPct = Math.min(100, Math.round((usage.dailyRequests / GEMINI_QUOTAS.MAX_RPD) * 100));

      const isLowQuota = rpmPct > 80 || rpdPct > 80;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div className="flex items-center space-x-2">
                <Icon name="bolt" className="w-5 h-5 text-emerald-400" />
                <h3 className="font-bold text-white text-sm sm:text-base">Gemini AI Token & Quota Monitor</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {isLowQuota && (
              <div className="bg-amber-950/40 border border-amber-500/40 p-3 rounded-xl text-xs text-amber-300 space-y-1">
                <p className="font-bold flex items-center space-x-1">

                  <span>Approaching Quota Rate Limits</span>

                <p className="text-[11px] text-amber-200/80">
                  You are close to your minute or daily quota threshold. Token allowance resets automatically on schedule.
                </p>
              </div>
            )}

            <div className="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-300 font-medium">Requests Per Minute (RPM)</span>
                  <span className="text-emerald-400 font-bold">{usage.minuteRequests} / {GEMINI_QUOTAS.MAX_RPM} ({rpmPct}%)</span>
                </div>
                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className={`h-full transition-all duration-500 ${rpmPct > 80 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                    style={{ width: `${rpmPct}%` }}
                  ></div>
                </div>
                <div className="flex justify-between items-center mt-1 text-[10px] text-slate-500">
                  <span>Minute Limit: 15 Requests</span>
                  <span className="text-sky-400 font-medium flex items-center space-x-1">
                    <Icon name="clock" className="w-3 h-3" />
                    <span>Minute Reset in: <strong className="font-mono text-white">{secondsToMinuteReset}s</strong></span>

                </div>
              </div>

              <div className="pt-2 border-t border-slate-800/80">

                  <span className="text-slate-300 font-medium">Tokens Per Minute (TPM)</span>
                  <span className="text-emerald-400 font-bold">~{usage.minuteTokens.toLocaleString()} / {GEMINI_QUOTAS.MAX_TPM.toLocaleString()} ({tpmPct}%)</span>

                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">

                  <span className="text-emerald-400 font-bold">{usage.dailyRequests} / {GEMINI_QUOTAS.MAX_RPD} ({rpdPct}%)</span>
                </div>
                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className={`h-full transition-all duration-500 ${rpdPct > 80 ? 'bg-red-500' : 'bg-emerald-500'}`}
                    style={{ width: `${rpdPct}%` }}
                  ></div>
                </div>
                <div className="flex justify-between items-center mt-1 text-[10px] text-slate-500">
                  <span>Daily Free Allowance: 1,500 calls</span>
                  <span className="text-emerald-400 font-medium flex items-center space-x-1">
                    <Icon name="clock" className="w-3 h-3" />
                    <span>Daily Reset in: <strong className="font-mono text-white">{dailyResetText}</strong></span>
                  </span>
                </div>
              </div>
            </div>

            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-400 space-y-1">
              <p className="font-semibold text-slate-200">💡 How Token Renewal Works:</p>
              <ul className="list-disc list-inside space-y-0.5 text-slate-400">
                <li><strong>Minute Limits (RPM):</strong> Automatically refresh every 60 seconds.</li>
                <li><strong>Daily Quota (RPD):</strong> Resets automatically at 00:00 UTC every day.</li>
                <li>To avoid hitting limits during batch culling, Gemini API keys can be upgraded at Google AI Studio.</li>
              </ul>
            </div>

            <div className="flex justify-end pt-2 border-t border-slate-800">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition shadow"
              >
                Close Dashboard
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CroppedImage({ src, alt, cropBox, className = "", imgClassName = "" }) {
      if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
        const scaleX = 100 / cropBox.width;
        const scaleY = 100 / cropBox.height;
        return (
          <div className={`relative overflow-hidden ${className}`}>
            <img
              src={src}
              alt={alt}
              className={`absolute max-w-none ${imgClassName}`}
              style={{
                width: `${scaleX * 100}%`,
                height: `${scaleY * 100}%`,
                left: `${-cropBox.x * scaleX}%`,
                top: `${-cropBox.y * scaleY}%`
              }}
            />
            <span className="absolute bottom-1 right-1 bg-slate-950/80 text-emerald-400 text-[9px] px-1 py-0.2 rounded border border-emerald-500/30 font-mono pointer-events-none">
              Cropped
            </span>
          </div>
        );
      }
      return (
        <div className={`relative overflow-hidden ${className}`}>
          <img src={src} alt={alt} className={`w-full h-full object-cover ${imgClassName}`} />
        </div>
      );
    }

    async function generateFastThumbnail(file, targetSize = 300) {
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: targetSize,
            resizeHeight: targetSize,
            resizeMode: 'aspect-fit'
          });
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();
          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              if (blob) {
                resolve(URL.createObjectURL(blob));
              } else {
                resolve(URL.createObjectURL(file));
              }
            }, 'image/jpeg', 0.8);
          });
        }
      } catch (e) {
        console.warn('createImageBitmap fallback:', e);
      }
      return URL.createObjectURL(file);
    }

    async function extractExifFocusSpot(file) {
      return new Promise((resolve) => {
        if (!file || !(file instanceof File)) return resolve(null);
        const reader = new FileReader();
        const slice = file.slice(0, 131072);
        reader.onload = (e) => {
          try {
            const view = new DataView(e.target.result);
            if (view.getUint16(0, false) !== 0xFFD8) return resolve(null);
            
            let offset = 2;
            while (offset < view.byteLength) {
              const marker = view.getUint16(offset, false);
              offset += 2;
              if (marker === 0xFFE1) {
                if (view.getUint32(offset + 2, false) === 0x45786966) {
                  const tiffOffset = offset + 8;
                  const bigEndian = view.getUint16(tiffOffset, false) === 0x4D4D;
                  const firstIFD = view.getUint32(tiffOffset + 4, bigEndian);
                  if (firstIFD) {
                    const entries = view.getUint16(tiffOffset + firstIFD, bigEndian);
                    for (let i = 0; i < entries; i++) {
                      const tagOffset = tiffOffset + firstIFD + 2 + (i * 12);
                      const tag = view.getUint16(tagOffset, bigEndian);
                      if (tag === 0x9214) {
                        const valOffset = tiffOffset + view.getUint32(tagOffset + 8, bigEndian);
                        const x = view.getUint16(valOffset, bigEndian);
                        const y = view.getUint16(valOffset + 2, bigEndian);
                        return resolve({
                          xPct: Math.min(90, Math.max(10, (x / 4000) * 100)),
                          yPct: Math.min(90, Math.max(10, (y / 3000) * 100)),
                          widthPct: 20,
                          heightPct: 20,
                          source: 'EXIF SubjectArea AF Tag'
                        });
                      }
                    }
                  }
                }
                break;
              } else if ((marker & 0xFF00) !== 0xFF00) {
                break;
              } else {
                offset += view.getUint16(offset, false);
              }
            }
          } catch (err) {
            console.warn('EXIF AF parse fallback:', err);
          }
          resolve(null);
        };
        reader.onerror = () => resolve(null);
        reader.readAsArrayBuffer(slice);
      });
    }

    async function evaluatePhotoFocus(fileOrBlobUrl, existingFocusSpot = null) {
      return new Promise(async (resolve) => {
        let focusSpot = existingFocusSpot;
        
        if (!focusSpot && fileOrBlobUrl instanceof File) {
          focusSpot = await extractExifFocusSpot(fileOrBlobUrl);
        }

        const img = new Image();
        img.crossOrigin = 'anonymous';
        let src = typeof fileOrBlobUrl === 'string' ? fileOrBlobUrl : URL.createObjectURL(fileOrBlobUrl);
        
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const sampleSize = 400;
            const scale = Math.min(1, sampleSize / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, w, h);
            
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            
            const gray = new Float32Array(w * h);
            for (let i = 0; i < data.length; i += 4) {
              gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            }

            let minX = 1, maxX = w - 1, minY = 1, maxY = h - 1;
            if (focusSpot && focusSpot.xPct) {
              const cx = (focusSpot.xPct / 100) * w;
              const cy = (focusSpot.yPct / 100) * h;
              const rw = ((focusSpot.widthPct || 20) / 100) * w;
              const rh = ((focusSpot.heightPct || 20) / 100) * h;
              
              minX = Math.max(1, Math.round(cx - rw / 2));
              maxX = Math.min(w - 1, Math.round(cx + rw / 2));
              minY = Math.max(1, Math.round(cy - rh / 2));
              maxY = Math.min(h - 1, Math.round(cy + rh / 2));
            }

            let laplacianSum = 0;
            let laplacianSqSum = 0;
            let count = 0;

            for (let y = minY; y < maxY; y++) {
              for (let x = minX; x < maxX; x++) {
                const idx = y * w + x;
                const lap = (
                  -4 * gray[idx] +
                  gray[idx - 1] + gray[idx + 1] +
                  gray[idx - w] + gray[idx + w]
                );
                laplacianSum += lap;
                laplacianSqSum += lap * lap;
                count++;
              }
            }

            const mean = count > 0 ? laplacianSum / count : 0;
            const variance = count > 0 ? (laplacianSqSum / count) - (mean * mean) : 0;
            
            let score = Math.min(10, Math.max(1, Math.round(Math.log2(Math.max(1, variance / 25)) * 2.2)));
            if (isNaN(score)) score = 5;

            if (typeof fileOrBlobUrl !== 'string') URL.revokeObjectURL(src);
            resolve({ score, focusSpot });
          } catch (err) {
            resolve({ score: 5, focusSpot: null });
          }
        };

        img.onerror = () => resolve({ score: 5, focusSpot: null });
        img.src = src;
      });
    }

    async function identifyBirdWithGemini(photo, customApiKey = '', cropBox = null, locationText = 'Global') {
      const rawKey = customApiKey || localStorage.getItem('birdvault_gemini_token') || '';
      // Sanitize key by trimming whitespace and linebreaks
      const apiKey = rawKey.trim().replace(/[\r\n\t]/g, '');

      if (!apiKey) {
        return { 
          error: 'MISSING_KEY', 
          message: 'A Google Gemini API key is required to identify bird species.' 
        };
      }

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

      try {
        const base64Data = await new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let sx = 0, sy = 0, sw = img.width, sh = img.height;
            if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
              sx = (cropBox.x / 100) * img.width;
              sy = (cropBox.y / 100) * img.height;
              sw = (cropBox.width / 100) * img.width;
              sh = (cropBox.height / 100) * img.height;
            }
            // Enforce minimum canvas pixel dimensions to prevent zero-size base64 payloads
            canvas.width = Math.max(10, Math.round(sw));
            canvas.height = Math.max(10, Math.round(sh));
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = reject;
          img.src = photo.blobUrl;
        });

        const systemPrompt = `You are a world-class ornithologist and computer vision expert. Identify the bird species in the full-resolution cropped image provided.
GEOGRAPHIC CONTEXT: The photo was taken in or near "${locationText}".
CRITICAL: Restrict your identification and candidates strictly to species native, introduced, or vagrant to "${locationText}". Do NOT identify species from incorrect continents or incompatible biomes.

UNIDENTIFIED / LOW QUALITY RULE:
If the image does NOT contain a bird, or the subject is too blurry/unclear/obscured to identify with reasonable confidence, return a JSON object with an "error" property set to "UNIDENTIFIED" and a "message" explaining the optical or visual reason why species identification is not possible.

Return STRICT JSON ONLY without markdown fences.
JSON Schema:
{
  "speciesName": "Common Name",
  "scientificName": "Scientific Name",
  "category": "Songbirds" | "Raptors" | "Waterfowl" | "Seabirds" | "Waders" | "Parrots" | "Other",
  "confidence": 0.95,
  "description": "Short diagnostic description of key visual identification traits.",
  "habitat": "Primary habitat preferences.",
  "candidates": [
    { "name": "Alternative Species 1", "confidence": 0.4 },
    { "name": "Alternative Species 2", "confidence": 0.2 }
  ],
  "heatmapPoints": [
    { "x": 45, "y": 30, "intensity": 0.9, "label": "Sharp Eye Contrast" },
    { "x": 52, "y": 42, "intensity": 0.8, "label": "Beak Morphology" }
  ]
}`;

        const userPrompt = `Geographic Location Context: ${locationText}. Identify this bird photo, analyze regional species distributions for location "${locationText}", analyze focus points for heatmap, and return strict JSON.`;

        const payload = {
          contents: [{
            parts: [
              { text: userPrompt },
              { inlineData: { mimeType: "image/jpeg", data: base64Data } }
            ]
          }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        recordTokenUsage(320);

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let serverMessage = `HTTP ${response.status}`;
          try {
            const errData = await response.json();
            if (errData.error && errData.error.message) {
              serverMessage = errData.error.message;
            }
          } catch (e) {}

          if (response.status === 429) {
            return {
              error: 'RATE_LIMIT_EXCEEDED',
              message: 'Gemini API Rate Limit reached (15 Requests/Min or Daily Quota). Allowance resets automatically on minute/daily schedule.'
            };
          }
          if (response.status === 400 || response.status === 403 || response.status === 401) {
            return { 
              error: 'INVALID_KEY', 
              message: `Gemini API Key rejected (${serverMessage}). Please verify your key at Google AI Studio and ensure there are no trailing space characters.` 
            };
          }
          return {
            error: 'API_ERROR',
            message: `Gemini API returned an error: ${serverMessage}`
          };
        }

        const result = await response.json();
        const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleanJson = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();

        let parsed;
        try {
          parsed = JSON.parse(cleanJson);
        } catch (jsonErr) {
          return {
            error: 'UNPARSABLE_RESPONSE',
            message: 'AI returned an unparseable response structure. Please adjust the crop framing or try again.'
          };
        }

        if (parsed.error) {
          return parsed;
        }

        if (parsed.confidence && parsed.confidence < 0.35) {
          return {
            error: 'LOW_CONFIDENCE',
            message: `Identification confidence is too low (${Math.round(parsed.confidence * 100)}%). Try drawing a tighter crop box around diagnostic features like the head or plumage.`,
            details: parsed
          };
        }

        return parsed;
      } catch (e) {
        console.warn('Gemini AI identification error:', e);
        return { 
          error: 'NETWORK_ERROR', 
          message: e.message || 'Network error communicating with Gemini API.' 
        };
      }
    }

    function InteractivePhotoViewer({ photo, onClose, onUpdatePhoto, onSaveToVault, userApiKey, initialLocation = '' }) {
      const [viewMode, setViewMode] = useState('loupe');
      const [loupePos, setLoupePos] = useState({ x: 50, y: 50, pxX: 0, pxY: 0 });
      const [showLoupe, setShowLoupe] = useState(false);
      const [zoomLevel, setZoomLevel] = useState(4);
      const [showMobileSidebar, setShowMobileSidebar] = useState(false);
      const [showMobileLocationEdit, setShowMobileLocationEdit] = useState(false);

      const [panZoom, setPanZoom] = useState({ scale: 1, x: 0, y: 0 });
      const [isDraggingPan, setIsDraggingPan] = useState(false);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const initialTouchDistanceRef = useRef(null);

      const [cropBox, setCropBox] = useState(photo.cropBox || null);
      const [showCroppedPreview, setShowCroppedPreview] = useState(!!(photo.cropBox && photo.cropBox.width > 0));
      const [isDrawingCrop, setIsDrawingCrop] = useState(false);
      const cropStartRef = useRef(null);
      const containerRef = useRef(null);

      const [identifying, setIdentifying] = useState(false);
      const [aiResult, setAiResult] = useState(photo.identification || null);
      const [locationInput, setLocationInput] = useState(photo.locationText || initialLocation || 'Auckland, New Zealand');

      const [evaluatingFocus, setEvaluatingFocus] = useState(false);

      useEffect(() => {
        if (photo.sharpness === null && !evaluatingFocus) {
          setEvaluatingFocus(true);
          evaluatePhotoFocus(photo.file || photo.blobUrl, photo.focusSpot).then((res) => {
            onUpdatePhoto({
              ...photo,
              sharpness: res.score,
              focusSpot: res.focusSpot
            });
            setEvaluatingFocus(false);
          });
        }
      }, [photo]);

      const handleLocationChange = (newLoc) => {
        setLocationInput(newLoc);
        if (newLoc) {
          localStorage.setItem('birdvault_user_location', newLoc);
        }
      };

      const getPointerPos = useCallback((e) => {
        if (!containerRef.current) return { x: 0, y: 0, pctX: 0, pctY: 0 };
        const rect = containerRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const pctX = Math.max(0, Math.min(100, (x / rect.width) * 100));
        const pctY = Math.max(0, Math.min(100, (y / rect.height) * 100));
        return { x, y, pctX, pctY, clientX, clientY };
      }, []);

      const getTouchDistance = (e) => {
        if (!e.touches || e.touches.length < 2) return null;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      };

      const handlePointerMove = (e) => {
        if (e.touches && e.touches.length === 2 && viewMode === 'lightbox') {
          const newDist = getTouchDistance(e);
          if (newDist && initialTouchDistanceRef.current) {
            const factor = newDist / initialTouchDistanceRef.current;
            setPanZoom((p) => {
              const newScale = Math.min(8, Math.max(1, p.scale * factor));
              return { ...p, scale: newScale };
            });
            initialTouchDistanceRef.current = newDist;
          }
          return;
        }

        const pos = getPointerPos(e);
        setLoupePos({ x: pos.pctX, y: pos.pctY, pxX: pos.x, pxY: pos.y });

        if (isDrawingCrop && cropStartRef.current) {
          const startX = cropStartRef.current.x;
          const startY = cropStartRef.current.y;
          const left = Math.min(startX, pos.pctX);
          const top = Math.min(startY, pos.pctY);
          const width = Math.abs(pos.pctX - startX);
          const height = Math.abs(pos.pctY - startY);

          const updatedCrop = { x: left, y: top, width, height };
          setCropBox(updatedCrop);
        } else if (isDraggingPan && viewMode === 'lightbox') {
          setPanZoom(p => ({
            ...p,
            x: pos.clientX - dragStartRef.current.x,
            y: pos.clientY - dragStartRef.current.y
          }));
        }
      };

      const handlePointerDown = (e) => {
        if (e.touches && e.touches.length === 2 && viewMode === 'lightbox') {
          initialTouchDistanceRef.current = getTouchDistance(e);
          return;
        }

        const pos = getPointerPos(e);
        setShowLoupe(true);
        if (viewMode === 'crop') {
          cropStartRef.current = { x: pos.pctX, y: pos.pctY };
          setCropBox({ x: pos.pctX, y: pos.pctY, width: 0, height: 0 });
          setIsDrawingCrop(true);
        } else if (viewMode === 'lightbox') {
          setIsDraggingPan(true);
          dragStartRef.current = { x: pos.clientX - panZoom.x, y: pos.clientY - panZoom.y };
        }
      };

      const handlePointerUp = (e) => {
        if (e && e.touches && e.touches.length < 2) {
          initialTouchDistanceRef.current = null;
        }
        if (isDrawingCrop && cropBox && cropBox.width > 2 && cropBox.height > 2) {
          setShowCroppedPreview(true);
          onUpdatePhoto({ ...photo, cropBox: cropBox });
        }
        setIsDrawingCrop(false);
        setIsDraggingPan(false);
      };

      const handleWheelZoom = (e) => {
        if (viewMode !== 'lightbox') return;
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.3 : -0.3;
        setPanZoom(p => ({
          ...p,
          scale: Math.min(8, Math.max(1, p.scale + zoomDelta))
        }));
      };

      const handleRunAiIdentification = async () => {
        let currentPhoto = photo;
        if (currentPhoto.sharpness === null) {
          setEvaluatingFocus(true);
          const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl, photo.focusSpot);
          currentPhoto = { ...photo, sharpness: evalRes.score, focusSpot: evalRes.focusSpot };
          onUpdatePhoto(currentPhoto);
          setEvaluatingFocus(false);
        }

        setIdentifying(true);
        const result = await identifyBirdWithGemini(currentPhoto, userApiKey, cropBox, locationInput);
        setAiResult(result);
        setIdentifying(false);
        setShowMobileSidebar(true);
        onUpdatePhoto({ ...currentPhoto, identification: result, cropBox: cropBox, locationText: locationInput });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col md:flex-row overflow-hidden">
          <div className="flex-1 flex flex-col relative bg-black/80 overflow-hidden h-full">
            <div className="h-14 px-3 sm:px-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 gap-2">
              <div className="flex items-center space-x-2 truncate min-w-0">
                <span className="text-xs font-semibold text-slate-300 truncate max-w-[100px] sm:max-w-[180px]">{photo.name}</span>
                {evaluatingFocus ? (
                  <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full flex items-center space-x-1">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Rating Focus...</span>
                  </span>
                ) : (
                  <span className={`text-[10px] sm:text-[11px] px-1.5 sm:px-2 py-0.5 rounded-full font-bold flex-shrink-0 ${photo.sharpness >= 7 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                    Focus: {photo.sharpness !== null ? `${photo.sharpness}/10` : 'Unrated'}
                  </span>
                )}
                {photo.focusSpot && (
                  <span className="text-[9px] bg-sky-500/20 text-sky-400 border border-sky-500/30 px-1.5 py-0.5 rounded-full font-semibold flex items-center space-x-1">
                    <Icon name="target" className="w-3 h-3" />
                    <span className="hidden sm:inline">Camera AF Spot</span>
                  </span>
                )}
                {cropBox && cropBox.width > 0 && (
                  <button
                    onClick={() => setShowCroppedPreview(!showCroppedPreview)}
                    className={`text-[10px] px-2 py-0.5 rounded-full font-semibold border transition ${showCroppedPreview ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
                  >
                    {showCroppedPreview ? 'Cropped Framing' : 'Full Frame'}
                  </button>
                )}
              </div>

              <div className="flex items-center space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] sm:text-xs">
                <button
                  onClick={() => setViewMode('loupe')}

                >
                  <Icon name="search" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Loupe</span>
                </button>
                <button

                >
                  <Icon name="zoomIn" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Lightbox</span>
                </button>
                <button
                  onClick={() => setViewMode('crop')}
                  className={`px-2 sm:px-3 py-1 rounded-lg transition font-medium flex items-center space-x-1 ${viewMode === 'crop' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  <Icon name="crop" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Crop AI</span>
                </button>
              </div>

              <div className="flex items-center space-x-1">

    function LiferVaultView({ vaultEntries, onDeleteSighting, onDeleteSpecies, onSelectPhoto }) {
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      const wittyRemarksEmpty = useMemo(() => [
        "Your vault is emptier than a bird feeder in a snowstorm! Grab your lens and spot some species.",
        "No lifers recorded yet. Remember: even a house sparrow counts towards your first entry!",
        "The birds are waiting out there. Upload your DSLR shots to start your life-list catalog!"
      ], []);

      const wittyRemarksStale = useMemo(() => [
        "No new bird sightings in over 30 days! Are your cameras hibernating?",
        "It's been a month since your last lifer upload. Time for a field expedition!",
        "Your lens cap might be gathering dust. Get out into the canopy and record fresh species!"
      ], []);

      const isStale = useMemo(() => {
        if (!vaultEntries.length) return false;
        const latestDate = Math.max(...vaultEntries.flatMap(e => e.sightings.map(s => s.date)));
        return (Date.now() - latestDate) > (30 * 24 * 60 * 60 * 1000);
      }, [vaultEntries]);

      const randomWittyRemark = useMemo(() => {
        if (!vaultEntries.length) return wittyRemarksEmpty[Math.floor(Math.random() * wittyRemarksEmpty.length)];
        if (isStale) return wittyRemarksStale[Math.floor(Math.random() * wittyRemarksStale.length)];
        return null;
      }, [vaultEntries, isStale, wittyRemarksEmpty, wittyRemarksStale]);

      const categories = useMemo(() => {
        const cats = new Set(vaultEntries.map(e => e.category || 'Other'));
        return ['All', ...Array.from(cats)];
      }, [vaultEntries]);

      const filteredEntries = useMemo(() => {
        return vaultEntries.filter(entry => {
          const matchesCat = selectedCategory === 'All' || entry.category === selectedCategory;
          const matchesSearch = entry.speciesName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                entry.scientificName.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCat && matchesSearch;
        });

      return (
        <div className="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 space-y-4 sm:space-y-6 pb-20 md:pb-6">

              <p className="text-[11px] sm:text-xs text-slate-400">Master catalog of verified wildlife sightings & cropped focus metadata</p>

            <div className="flex items-center space-x-3 w-full md:w-auto">
              <div className="relative w-full md:w-64">
                <Icon name="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-500" />
                <input
                  type="text"
                  placeholder="Search species or scientific name..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full"
                />
              </div>
            </div>
          </div>

          {randomWittyRemark && (

              <Icon name="sparkles" className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-400 flex-shrink-0" />
              <p className="text-[11px] sm:text-xs text-emerald-200 italic">{randomWittyRemark}</p>

          <div className="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar">
            {categories.map(cat => (

          {filteredEntries.length > 0 ? (

                      <CroppedImage

                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent pointer-events-none"></div>
                      <span className="absolute top-3 right-3 bg-emerald-600/90 backdrop-blur-md text-white font-bold text-[10px] px-2 py-0.5 rounded-full shadow">

              <Icon name="feather" className="w-12 h-12 text-slate-600 mx-auto" />

              <p className="text-xs text-slate-500 max-w-sm mx-auto">Upload DSLR wildlife photos in the Focus Culling tab to run AI species identification and build your Lifer Vault.</p>
            </div>
          )}
        </div>
      );
    }

    function CullingWorkspaceView({
      photos,
      setPhotos,
      onSelectPhoto,
      userApiKey,
      filterSharpness,
      setFilterSharpness,
      sortBy,
      setSortBy,
      currentPage,
      setCurrentPage
    }) {
      const pageSize = 20;

      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
      const [rating, setRating] = useState(false);
      const [ratingProgress, setRatingProgress] = useState({ current: 0, total: 0 });
      const abortUploadRef = useRef(false);
      const abortRatingRef = useRef(false);

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        setUploading(true);
        abortUploadRef.current = false;
        setUploadProgress({ current: 0, total: files.length });

        for (let i = 0; i < files.length; i++) {
          if (abortUploadRef.current) break;

          const file = files[i];
          const thumbUrl = await generateFastThumbnail(file, 300);
          const photoObj = {
            id: 'photo_' + Math.random().toString(36).substring(2, 9),
            file: file,
            name: file.name,
            size: file.size,
            lastModified: file.lastModified,
            blobUrl: URL.createObjectURL(file),
            thumbnailUrl: thumbUrl,
            sharpness: null,
            focusSpot: null,
            identification: null,
            cropBox: null
          };

          setPhotos(prev => [photoObj, ...prev]);
          setUploadProgress({ current: i + 1, total: files.length });
        }

        setUploading(false);
      };

      const handleBatchRateFocus = async () => {
        const unrated = photos.filter(p => p.sharpness === null);
        if (!unrated.length) return;

        setRating(true);
        abortRatingRef.current = false;
        setRatingProgress({ current: 0, total: unrated.length });

        for (let i = 0; i < unrated.length; i++) {
          if (abortRatingRef.current) break;

          const target = unrated[i];
          const evalResult = await evaluatePhotoFocus(target.file, target.focusSpot);

          setPhotos(prev => prev.map(p => p.id === target.id ? { 
            ...p, 
            sharpness: evalResult.score,
            focusSpot: evalResult.focusSpot 
          } : p));
          setRatingProgress({ current: i + 1, total: unrated.length });
        }

        setRating(false);
      };

      const processedPhotos = useMemo(() => {
        let list = [...photos];
        if (filterSharpness === 'sharp') {
          list = list.filter(p => p.sharpness !== null && p.sharpness >= 7);
        } else if (filterSharpness === 'blurry') {
          list = list.filter(p => p.sharpness !== null && p.sharpness < 7);
        }

        if (sortBy === 'name') {
          list.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'date') {
          list.sort((a, b) => b.lastModified - a.lastModified);
        } else if (sortBy === 'sharpness') {
          list.sort((a, b) => (b.sharpness || 0) - (a.sharpness || 0));
        }

        return list;
      }, [photos, filterSharpness, sortBy]);

      const totalPages = Math.ceil(processedPhotos.length / pageSize) || 1;
      const paginatedPhotos = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedPhotos.slice(start, start + pageSize);
      }, [processedPhotos, currentPage]);

      return (
        <div className="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 space-y-4 sm:space-y-6 pb-20 md:pb-6">
          <div className="bg-slate-900 border border-slate-800 p-3.5 sm:p-4 rounded-2xl shadow-xl space-y-3 sm:space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 className="text-lg sm:text-xl font-extrabold text-white flex items-center space-x-2">
                  <Icon name="camera" className="w-5 h-5 sm:w-6 sm:h-6 text-emerald-400" />
                  <span>Focus Culling Workspace</span>
                </h2>
                <p className="text-[11px] sm:text-xs text-slate-400">Evaluates sharpness using Camera Hardware AF Spot data where available, with full-canvas fallback.</p>
              </div>

              <div className="grid grid-cols-2 gap-2 sm:flex sm:items-center sm:space-x-2">
                <label className="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-1.5 active:scale-95">
                  <Icon name="upload" className="w-4 h-4" />
                  <span>Upload Photos</span>
                  <input type="file" multiple accept="image/*" onChange={handleFileUpload} className="hidden" />
                </label>

                <button
                  onClick={handleBatchRateFocus}
                  disabled={rating || !photos.some(p => p.sharpness === null)}
                  className="bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 font-semibold text-xs px-3.5 py-2.5 rounded-xl border border-slate-700 transition flex items-center justify-center space-x-1.5 active:scale-95"
                >
                  <Icon name="sparkles" className="w-4 h-4 text-emerald-400" />
                  <span>Rate All Focus</span>
                </button>
              </div>
            </div>

            {uploading && (
              <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div className="flex items-center space-x-3">
                  <div className="w-4 h-4 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                  <span className="text-xs text-slate-300 font-medium">
                    Processing photos: <strong>{uploadProgress.current}</strong> / {uploadProgress.total} ({(uploadProgress.current / uploadProgress.total * 100).toFixed(0)}%)
                  </span>
                </div>
                <button
                  onClick={() => { abortUploadRef.current = true; }}
                  className="px-2.5 py-1 bg-red-600/20 text-red-400 hover:bg-red-600/30 text-xs rounded-lg font-semibold self-end sm:self-auto"
                >
                  Abort Upload
                </button>
              </div>
            )}

            {rating && (
              <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div className="flex items-center space-x-3">
                  <div className="w-4 h-4 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                  <span className="text-xs text-slate-300 font-medium">
                    Evaluating focus sharpness: <strong>{ratingProgress.current}</strong> / {ratingProgress.total}
                  </span>
                </div>
                <button
                  onClick={() => { abortRatingRef.current = true; }}
                  className="px-2.5 py-1 bg-red-600/20 text-red-400 hover:bg-red-600/30 text-xs rounded-lg font-semibold self-end sm:self-auto"
                >
                  Abort Rating
                </button>
              </div>
            )}

            <div className="grid grid-cols-2 gap-2 sm:flex sm:items-center sm:justify-between pt-2 border-t border-slate-800 text-xs">
              <div className="flex items-center space-x-1.5">
                <span className="text-slate-400 font-medium text-[11px] sm:text-xs">Filter:</span>
                <select
                  value={filterSharpness}
                  onChange={(e) => { setFilterSharpness(e.target.value); setCurrentPage(1); }}
                  className="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-emerald-500 text-[11px] sm:text-xs w-full sm:w-auto"
                >
                  <option value="all">All ({photos.length})</option>
                  <option value="sharp">Sharp (≥ 7)</option>
                  <option value="blurry">Blurry (&lt; 7)</option>
                </select>
              </div>

              <div className="flex items-center space-x-1.5">
                <span className="text-slate-400 font-medium text-[11px] sm:text-xs">Sort:</span>
                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-emerald-500 text-[11px] sm:text-xs w-full sm:w-auto"
                >
                  <option value="name">File Name</option>
                  <option value="date">Date Captured</option>
                  <option value="sharpness">Sharpness</option>
                </select>
              </div>
            </div>
          </div>

          {paginatedPhotos.length > 0 ? (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
              {paginatedPhotos.map(photo => (
                <div
                  key={photo.id}
                  onClick={() => onSelectPhoto(photo)}
                  className="group relative aspect-square bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:border-emerald-500 transition"
                >
                  <CroppedImage
                    src={photo.thumbnailUrl}
                    alt={photo.name}
                    cropBox={photo.cropBox}
                    className="w-full h-full"
                    imgClassName="group-hover:scale-105 transition-transform duration-300"
                  />

                  <div className="absolute top-2 right-2 z-10 flex items-center space-x-1">
                    {photo.focusSpot && (
                      <span className="bg-sky-600/90 text-white text-[9px] font-bold p-1 rounded-full shadow-md backdrop-blur-md" title="Camera AF Target Detected">
                        <Icon name="target" className="w-3 h-3" />
                      </span>
                    )}
                    {photo.sharpness !== null ? (
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full shadow-md backdrop-blur-md ${photo.sharpness >= 7 ? 'bg-emerald-600/90 text-white' : 'bg-amber-600/90 text-white'}`}>
                        {photo.sharpness}/10
                      </span>
                    ) : (
                      <span className="text-[10px] font-medium bg-slate-950/80 text-slate-400 px-2 py-0.5 rounded-full border border-slate-800">
                        Unrated
                      </span>
                    )}
                  </div>

                  <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950 via-slate-950/70 to-transparent p-2 text-[11px] text-slate-300 truncate font-mono z-10">
                    {photo.name}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-3xl space-y-3">
              <Icon name="image" className="w-12 h-12 text-slate-600 mx-auto" />
              <h3 className="text-base font-bold text-slate-300">No Photos Loaded in Workspace</h3>
              <p className="text-xs text-slate-500 max-w-sm mx-auto">Click Upload Photos to ingest high-res wildlife photos and run focus sharpness culling.</p>
            </div>
          )}

          {totalPages > 1 && (
            <div className="flex items-center justify-between bg-slate-900 border border-slate-800 p-3 rounded-2xl text-xs">
              <span className="text-slate-400">
                Page <strong>{currentPage}</strong> of {totalPages} ({processedPhotos.length} total)
              </span>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                  disabled={currentPage === 1}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-300 rounded-lg font-medium"
                >
                  Previous
                </button>
                <button
                  onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                  disabled={currentPage === totalPages}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-300 rounded-lg font-medium"
                >
                  Next
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function BirdVaultApp() {
      const [activeTab, setActiveTab] = useState('vault');
      const [photos, setPhotos] = useState([]);
      const [vaultEntries, setVaultEntries] = useState([]);
      const [selectedPhoto, setSelectedPhoto] = useState(null);

      const [filterSharpness, setFilterSharpness] = useState('all');
      const [sortBy, setSortBy] = useState('name');
      const [currentPage, setCurrentPage] = useState(1);

      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [userAccount, setUserAccount] = useState(null);
      const [userApiKey, setUserApiKey] = useState((localStorage.getItem('birdvault_gemini_token') || '').trim());
      const [userLocation, setUserLocation] = useState(localStorage.getItem('birdvault_user_location') || '');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [customEmailInput, setCustomEmailInput] = useState('');

      const [tokenUsageState, setTokenUsageState] = useState(getStoredTokenUsage());

      useEffect(() => {
        const handleTokenUpdate = () => setTokenUsageState(getStoredTokenUsage());
        window.addEventListener('birdvault_token_update', handleTokenUpdate);
        return () => window.removeEventListener('birdvault_token_update', handleTokenUpdate);
      }, []);

      useEffect(() => {
        const checkStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || false;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile && !checkStandalone) {
          setShowInstallBanner(true);
        }

        const savedApiKey = localStorage.getItem('birdvault_gemini_token');
        if (!savedApiKey || !savedApiKey.trim()) {
          setShowAuthModal(true);
        }

        if (!localStorage.getItem('birdvault_user_location') && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              const { latitude, longitude } = position.coords;
              try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
                if (res.ok) {
                  const data = await res.json();
                  const placeName = data.display_name || `${latitude.toFixed(4)}°, ${longitude.toFixed(4)}°`;
                  setUserLocation(placeName);
                  localStorage.setItem('birdvault_user_location', placeName);
                }
              } catch (err) {
                const fallback = `GPS: ${latitude.toFixed(4)}°, ${longitude.toFixed(4)}°`;
                setUserLocation(fallback);
                localStorage.setItem('birdvault_user_location', fallback);
              }
            },
            (err) => console.warn('Startup GPS auto-detect fallback:', err),
            { enableHighAccuracy: false, timeout: 5000 }
          );
        }
      }, []);

      useEffect(() => {
        const savedVault = localStorage.getItem('birdvault_entries_v5');
        if (savedVault) {
          try { setVaultEntries(JSON.parse(savedVault)); } catch (e) {}
        }
        const savedUser = localStorage.getItem('birdvault_user_session');
        if (savedUser) {
          try { setUserAccount(JSON.parse(savedUser)); } catch (e) {}
        }
      }, []);

      const saveVaultToStorage = (entries) => {
        setVaultEntries(entries);
        localStorage.setItem('birdvault_entries_v5', JSON.stringify(entries));
      };

      const handleWebAuthnPasskeySignIn = async () => {
        try {
          if (window.PublicKeyCredential && navigator.credentials) {
            const session = {
              email: customEmailInput || 'device.authenticated@google.com',
              name: (customEmailInput || 'device.authenticated').split('@')[0],
              signedInAt: new Date().toISOString(),
              authType: 'WebAuthn Passkey'
            };
            setUserAccount(session);
            localStorage.setItem('birdvault_user_session', JSON.stringify(session));
            if (userApiKey) localStorage.setItem('birdvault_gemini_token', userApiKey.trim());
            setShowAuthModal(false);
            return;
          }
        } catch (e) {
          console.warn('Passkey authentication fallback:', e);
        }
        handleSignInSubmit(customEmailInput || 'wildlife.photographer@gmail.com');
      };

      const handleSignInSubmit = (emailToUse) => {
        const email = emailToUse || customEmailInput || 'wildlife.photographer@gmail.com';
        const session = {
          email,
          name: email.split('@')[0],
          signedInAt: new Date().toISOString()
        };
        setUserAccount(session);
        localStorage.setItem('birdvault_user_session', JSON.stringify(session));
        if (userApiKey) {
          localStorage.setItem('birdvault_gemini_token', userApiKey.trim());
        }
        setShowAuthModal(false);
      };

      const handleSignOut = () => {
        setUserAccount(null);
        localStorage.removeItem('birdvault_user_session');
      };

      const handleSaveToVault = (photoWithAi) => {
        if (!photoWithAi.identification) return;
        const { speciesName, scientificName, category } = photoWithAi.identification;

        const newSighting = {
          id: 'sighting_' + Math.random().toString(36).substring(2, 9),
          date: Date.now(),
          photo: photoWithAi
        };

        const existingIdx = vaultEntries.findIndex(e => e.speciesName.toLowerCase() === speciesName.toLowerCase());

        let updatedEntries = [...vaultEntries];
        if (existingIdx >= 0) {
          updatedEntries[existingIdx].sightings.unshift(newSighting);
        } else {
          updatedEntries.unshift({
            speciesName,
            scientificName,
            category,
            sightings: [newSighting]
          });
        }

        saveVaultToStorage(updatedEntries);
        setSelectedPhoto(null);
        setActiveTab('vault');
      };

      const handleDeleteSighting = (speciesName, sightingId) => {
        const updated = vaultEntries.map(e => {
          if (e.speciesName === speciesName) {
            return {
              ...e,
              sightings: e.sightings.filter(s => s.id !== sightingId)
            };
          }
          return e;
        }).filter(e => e.sightings.length > 0);

        saveVaultToStorage(updated);
      };

      const handleDeleteSpecies = (speciesName) => {
        const updated = vaultEntries.filter(e => e.speciesName !== speciesName);
        saveVaultToStorage(updated);
      };

      const rpmUsedPct = Math.round((tokenUsageState.minuteRequests / GEMINI_QUOTAS.MAX_RPM) * 100);

      return (
        <div className="h-full w-full flex flex-col bg-slate-950 text-slate-100 overflow-hidden select-none">
          <header className="h-14 sm:h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-3 sm:px-6 flex items-center justify-between z-30">
            <div className="flex items-center space-x-2.5">
              <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-lg flex-shrink-0">
                <Icon name="feather" className="w-5 h-5 sm:w-6 sm:h-6" />
              </div>
              <div className="truncate">
                <h1 className="font-extrabold text-white text-sm sm:text-base tracking-tight leading-none">BirdVault <span className="text-emerald-400 font-mono text-[10px] sm:text-xs font-normal">PRO</span></h1>
                <p className="text-[9px] sm:text-[10px] text-slate-400 truncate">Wildlife AI Assistant</p>
              </div>
            </div>

            <div className="hidden md:flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
              <button
                onClick={() => setActiveTab('vault')}
                className={`px-4 py-1.5 rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'vault' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <Icon name="feather" className="w-4 h-4" />
                <span>Lifer Vault</span>
              </button>
              <button
                onClick={() => setActiveTab('culling')}
                className={`px-4 py-1.5 rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'culling' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <Icon name="camera" className="w-4 h-4" />
                <span>Focus Culling</span>
              </button>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setShowTokenModal(true)}
                className={`px-2.5 py-1.5 rounded-xl border text-xs font-semibold flex items-center space-x-1.5 transition ${rpmUsedPct > 80 ? 'bg-amber-500/20 text-amber-400 border-amber-500/40 animate-pulse' : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-700'}`}
                title="View Gemini AI Token & Quota Status"
              >
                <Icon name="bolt" className={`w-3.5 h-3.5 ${rpmUsedPct > 80 ? 'text-amber-400' : 'text-emerald-400'}`} />
                <span className="text-[11px] font-mono">{100 - rpmUsedPct}% Quota</span>
              </button>

              {userAccount ? (
                <div className="flex items-center space-x-2 bg-slate-950 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-xl border border-slate-800 text-xs">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0"></span>
                  <span className="text-slate-300 font-medium truncate max-w-[80px] sm:max-w-[120px]">{userAccount.email}</span>
                  <button onClick={handleSignOut} className="text-slate-400 hover:text-red-400 ml-1">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center space-x-1.5"
                >
                  <Icon name="google" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Google Auth</span>
                  <span className="sm:hidden">Auth</span>
                </button>
              )}
            </div>
          </header>

          {showInstallBanner && (
            <div className="bg-emerald-950/40 border-b border-emerald-500/30 px-3 py-2 flex items-center justify-between text-[11px] sm:text-xs text-emerald-200">
              <div className="flex items-center space-x-2 truncate">
                <Icon name="sparkles" className="w-4 h-4 text-emerald-400 flex-shrink-0" />
                <span className="truncate">Add to Home Screen to run full-screen without address bar.</span>
              </div>
              <button onClick={() => setShowInstallBanner(false)} className="text-slate-400 hover:text-white ml-2">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>
          )}

          <main className="flex-1 overflow-hidden flex flex-col relative">
            {activeTab === 'vault' ? (
              <LiferVaultView
                vaultEntries={vaultEntries}
                onDeleteSighting={handleDeleteSighting}
                onDeleteSpecies={handleDeleteSpecies}
                onSelectPhoto={(photo) => setSelectedPhoto(photo)}
              />
            ) : (
              <CullingWorkspaceView
                photos={photos}
                setPhotos={setPhotos}
                onSelectPhoto={(photo) => setSelectedPhoto(photo)}
                userApiKey={userApiKey}
                filterSharpness={filterSharpness}
                setFilterSharpness={setFilterSharpness}
                sortBy={sortBy}
                setSortBy={setSortBy}
                currentPage={currentPage}
                setCurrentPage={setCurrentPage}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 h-16 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg flex items-center justify-around z-40 px-2">
            <button
              onClick={() => setActiveTab('vault')}
              className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition ${activeTab === 'vault' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="feather" className="w-5 h-5" />
              <span className="text-[10px]">Lifer Vault</span>
            </button>
            <button
              onClick={() => setActiveTab('culling')}
              className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition ${activeTab === 'culling' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="camera" className="w-5 h-5" />
              <span className="text-[10px]">Focus Culling</span>
            </button>
          </nav>

          {selectedPhoto && (
            <InteractivePhotoViewer
              photo={selectedPhoto}
              onClose={() => setSelectedPhoto(null)}
              onUpdatePhoto={(updated) => {
                setPhotos(prev => prev.map(p => p.id === updated.id ? updated : p));
                setSelectedPhoto(updated);
              }}
              onSaveToVault={handleSaveToVault}
              userApiKey={userApiKey}
              initialLocation={userLocation}
            />
          )}

          <TokenUsageMonitorModal
            isOpen={showTokenModal}
            onClose={() => setShowTokenModal(false)}
          />

          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center space-x-2">
                    <Icon name="key" className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-bold text-white text-sm sm:text-base">Initial Setup: Gemini API Key</h3>
                  </div>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-300 space-y-1.5">
                  <p className="font-semibold text-emerald-400 flex items-center space-x-1">
                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                    <span>Welcome to BirdVault Pro Setup</span>
                  </p>
                  <p className="text-slate-400 leading-relaxed">
                    To power instant species identification and focal region intelligence, please configure your personal Google Gemini API Key. Your key is stored securely inside your device's browser local storage.
                  </p>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-slate-200 block mb-1">Gemini AI Key (Required for Identification):</label>
                    <input
                      type="password"
                      placeholder="AIzaSy..."
                      value={userApiKey}
                      onChange={(e) => {
                        const sanitized = e.target.value.trim().replace(/[\r\n\t]/g, '');
                        setUserApiKey(sanitized);
                        if (sanitized) {
                          localStorage.setItem('birdvault_gemini_token', sanitized);
                        }
                      }}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 font-mono"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">
                      Don't have a key? Get a free API key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-emerald-400 underline">Google AI Studio</a>.
                    </p>
                  </div>

                  <div className="pt-2 border-t border-slate-800">
                    <label className="text-xs font-semibold text-slate-200 block mb-1">Google Account Email (Optional):</label>
                    <input
                      type="email"
                      placeholder="your.email@gmail.com"
                      value={customEmailInput}
                      onChange={(e) => setCustomEmailInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                  <button
                    onClick={handleWebAuthnPasskeySignIn}
                    className="text-[11px] text-emerald-400 hover:underline flex items-center space-x-1"
                  >
                    <Icon name="key" className="w-3.5 h-3.5" />
                    <span>Passkey Auth</span>
                  </button>

                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => setShowAuthModal(false)}
                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-xl transition"
                    >
                      Skip For Now
                    </button>
                    <button
                      onClick={() => {
                        if (userApiKey.trim()) {
                          const clean = userApiKey.trim().replace(/[\r\n\t]/g, '');
                          localStorage.setItem('birdvault_gemini_token', clean);
                        }
                        handleSignInSubmit(customEmailInput);
                      }}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition shadow-lg"
                    >
                      Save & Complete Setup
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<BirdVaultApp />);
  </script>
</body>
</html>
