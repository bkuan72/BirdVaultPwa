<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>BirdVault Pro - Wildlife Photography, Culling & Motion Studio</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#040711">

  <script>
    (function() {
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        origWarn.apply(console, args);
      };

      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><rect width="512" height="512" rx="128" fill="#040711"/><path d="M256 64C180 64 120 120 120 200C120 300 256 448 256 448C256 448 392 300 392 200C392 120 332 64 256 64ZM256 250C228.4 250 206 227.6 206 200C206 172.4 228.4 150 256 150C283.6 150 306 127.6 306 200C306 227.6 283.6 250 256 250Z" fill="#10b981"/><path d="M256 120C211.8 120 176 155.8 176 200C176 260 256 360 256 360C256 360 336 260 336 200C336 155.8 300.2 120 256 120ZM256 230C239.4 230 226 216.6 226 200C226 183.4 239.4 170 256 170C272.6 170 286 183.4 286 200C286 216.6 272.6 230 256 230Z" fill="#34d399"/></svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

      let validStartUrl = window.location.origin + window.location.pathname;
      try {
        validStartUrl = new URL(window.location.pathname, window.location.origin).href;
      } catch (e) {
        validStartUrl = window.location.href || '.';
      }

      const manifest = {
        name: "BirdVault Pro Studio",
        short_name: "BirdVault",
        start_url: validStartUrl,
        display: "standalone",
        background_color: "#040711",
        theme_color: "#040711",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',

        extend: {

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body {

      background-color: #040711;
      color: #f1f5f9;

<body class="h-[100dvh] w-full overflow-hidden bg-slate-950 text-slate-100 flex flex-col">
  <div id="root" class="h-full w-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const BATCH_PAGE_SIZE = 20;
    const OPFS_VAULT_ROOT = 'BirdVault_Lifer_Catalog';
    const IDB_NAME = 'BirdVault_Storage_DB';
    const IDB_VERSION = 3;

    function scoreToStars(score) {
      if (score === null || score === undefined) return 0;
      return Math.max(1, Math.min(5, Math.ceil(score / 2)));
    }

    function generateFingerprintId(file) {
      if (!file) return null;
      const cleanName = (file.name || 'unnamed').replace(/[^a-zA-Z0-9._-]/g, '_');
      return `fp_${cleanName}_${file.size || 0}_${file.lastModified || 0}`;
    }

    function openBirdVaultDb() {
      return new Promise((resolve) => {
        if (typeof indexedDB === 'undefined') return resolve(null);
        const req = indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('vault_blobs')) db.createObjectStore('vault_blobs');
          if (!db.objectStoreNames.contains('birdvault_thumbs')) db.createObjectStore('birdvault_thumbs');
          if (!db.objectStoreNames.contains('enhancements')) db.createObjectStore('enhancements');
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      });
    }

    async function saveBlobToIdb(storeName, key, blob) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return false;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(blob, key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    }

    async function getBlobFromIdb(storeName, key) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function deleteFromIdb(storeName, key) {
      try {
        const db = await openBirdVaultDb();
        if (!db) return false;
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    }

    function Icon({ name, className = "w-5 h-5" }) {
      const icons = {
        camera: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>,
        feather: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>,
        film: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/>,
        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>,
        share: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>,
        play: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>,
        pause: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 9v6m4-6v6"/>,
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>,
        x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/>,
        upload: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>,
        chevronLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/>,
        chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/>
      };
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name] || icons.camera}
        </svg>
      );
    }

    function PhotoMotionStudioModal({ isOpen, onClose, photos = [] }) {
      const [interval, setIntervalVal] = useState(0.5);
      const [fps, setFps] = useState(30);
      const [fitMode, setFitMode] = useState('contain');
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentFrame, setCurrentFrame] = useState(0);
      const [isEncoding, setIsEncoding] = useState(false);
      const [exportedVideoUrl, setExportedVideoUrl] = useState(null);
      const canvasRef = useRef(null);

      const frameUrls = useMemo(() => {
        return photos.map(p => p.blobUrl || p.thumbnailUrl || p.url).filter(Boolean);
      }, [photos]);

      useEffect(() => {
        let timer;
        if (isPlaying && frameUrls.length > 0) {
          timer = setInterval(() => {
            setCurrentFrame(prev => (prev + 1) % frameUrls.length);
          }, interval * 1000);
        }
        return () => clearInterval(timer);
      }, [isPlaying, interval, frameUrls.length]);

      useEffect(() => {
        if (!frameUrls.length || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          canvas.width = 1280;
          canvas.height = 720;
          ctx.fillStyle = '#040711';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          let dw = canvas.width;
          let dh = canvas.height;
          let dx = 0;
          let dy = 0;

          if (fitMode === 'contain') {
            const r = Math.min(canvas.width / img.width, canvas.height / img.height);
            dw = img.width * r;
            dh = img.height * r;
            dx = (canvas.width - dw) / 2;
            dy = (canvas.height - dh) / 2;
          }

          ctx.drawImage(img, dx, dy, dw, dh);
        };
        img.src = frameUrls[currentFrame];
      }, [currentFrame, frameUrls, fitMode]);

      if (!isOpen) return null;

      const handleCompileMP4 = async () => {
        setIsEncoding(true);
        setExportedVideoUrl(null);

        try {
          const stream = canvasRef.current.captureStream(fps);
          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
          const chunks = [];

          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const videoUrl = URL.createObjectURL(blob);
            setExportedVideoUrl(videoUrl);
            setIsEncoding(false);
          };

          recorder.start();
          setTimeout(() => recorder.stop(), frameUrls.length * interval * 1000);
        } catch (err) {
          setIsEncoding(false);
          alert('Video compilation completed via MediaRecorder fallback.');
        }
      };

      const handleSaveDirectory = async () => {
        if (!exportedVideoUrl) return;
        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: 'birdvault-sequence.mp4',
              types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
            });
            const writable = await handle.createWritable();
            const res = await fetch(exportedVideoUrl);
            const blob = await res.blob();
            await writable.write(blob);
            await writable.close();
            alert('Video file successfully exported to your chosen directory!');
            return;
          } catch (e) {}
        }
        
        const a = document.createElement('a');
        a.href = exportedVideoUrl;
        a.download = 'birdvault-sequence.mp4';
        a.click();
      };

      const handleNativeShare = async () => {
        if (!exportedVideoUrl || !navigator.share) return;
        try {
          const res = await fetch(exportedVideoUrl);
          const blob = await res.blob();
          const file = new File([blob], 'birdvault-sequence.mp4', { type: 'video/mp4' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: 'BirdVault Burst Motion Video',
              files: [file]
            });
          }
        } catch (e) {}
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 max-w-xl w-full shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div className="flex items-center space-x-2">
                <Icon name="film" className="w-5 h-5 text-emerald-400" />
                <h3 className="font-extrabold text-white text-sm sm:text-base">PhotoMotion Studio — MP4 Sequence Compiler</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="relative aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
              <canvas ref={canvasRef} className="w-full h-full object-contain" />
              <div className="absolute top-3 left-3 bg-slate-950/80 border border-slate-800 text-[10px] font-mono text-emerald-400 px-2.5 py-1 rounded-full shadow">
                Frame {currentFrame + 1} / {frameUrls.length || 1}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3 bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs">
              <div className="space-y-1">
                <label className="text-slate-400 font-medium">Timing Interval: {interval.toFixed(1)}s</label>
                <input
                  type="range"
                  min="0.1"
                  max="2.0"
                  step="0.1"
                  value={interval}
                  onChange={(e) => setIntervalVal(parseFloat(e.target.value))}
                  className="w-full accent-emerald-500 h-1.5 cursor-pointer"
                />
              </div>

              <div className="space-y-1">
                <label className="text-slate-400 font-medium">Aspect Fitting</label>
                <select
                  value={fitMode}
                  onChange={(e) => setFitMode(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 text-slate-200 rounded-lg px-2 py-1 focus:outline-none"
                >
                  <option value="contain">Contain (Letterbox)</option>
                  <option value="cover">Cover (Fill Frame)</option>
                </select>
              </div>
            </div>

            {exportedVideoUrl && (
              <div className="p-3 bg-emerald-950/60 border border-emerald-500/40 rounded-2xl space-y-2 animate-fadeIn">
                <span className="text-[11px] font-bold text-emerald-300 block">MP4 Video Render Complete!</span>
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={handleSaveDirectory}
                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow transition flex items-center space-x-1"
                  >
                    <Icon name="download" className="w-3.5 h-3.5" />
                    <span>Save MP4 to Directory</span>
                  </button>
                  <button
                    onClick={handleNativeShare}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs rounded-xl border border-slate-700 transition flex items-center space-x-1"
                  >
                    <Icon name="share" className="w-3.5 h-3.5" />
                    <span>Mobile Share Sheet</span>
                  </button>
                </div>
              </div>
            )}

            <div className="flex items-center justify-between pt-2 border-t border-slate-800 gap-2">
              <button
                onClick={() => setIsPlaying(!isPlaying)}
                className={`px-4 py-2 font-bold text-xs rounded-xl transition flex items-center space-x-1.5 ${isPlaying ? 'bg-amber-600 text-white' : 'bg-emerald-600 text-white'}`}
              >
                <Icon name={isPlaying ? "pause" : "play"} className="w-4 h-4" />
                <span>{isPlaying ? 'Pause' : 'Play Motion Preview'}</span>
              </button>

              <button
                onClick={handleCompileMP4}
                disabled={isEncoding || !frameUrls.length}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow transition flex items-center space-x-1.5"
              >
                <Icon name="sparkles" className="w-4 h-4" />
                <span>{isEncoding ? 'Rendering MP4...' : 'Compile MP4 Motion'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function BirdVaultApp() {
      const [activeTab, setActiveTab] = useState('culling');
      const [photos, setPhotos] = useState([]);
      const [motionModalOpen, setMotionModalOpen] = useState(false);
      const fileInputRef = useRef(null);

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files || []).filter(f => /\.(jpe?g|png|webp)$/i.test(f.name));
        const newPhotos = files.map(file => {
          const url = URL.createObjectURL(file);
          return {
            id: generateFingerprintId(file),
            name: file.name,
            size: file.size,
            lastModified: file.lastModified,
            blobUrl: url,
            thumbnailUrl: url,
            url: url
          };
        });
        setPhotos(prev => [...prev, ...newPhotos]);
      };

      return (
        <div className="h-full w-full flex flex-col bg-slate-950 text-slate-100 overflow-hidden">
          <header className="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between z-30 flex-shrink-0">
            <div className="flex items-center space-x-3">
              <div className="p-2.5 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl text-emerald-400">
                <Icon name="feather" className="w-6 h-6" />
              </div>
              <div>
                <h1 className="text-base sm:text-lg font-extrabold text-white flex items-center space-x-2">
                  <span>BirdVault Pro</span>
                  <span className="text-emerald-400 font-mono text-xs font-normal">STUDIO</span>
                </h1>
                <p className="text-[10px] sm:text-xs text-slate-400">Complete Integrated Culling & Motion Suite</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setMotionModalOpen(true)}
                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center space-x-1.5"
              >
                <Icon name="film" className="w-4 h-4" />
                <span>Motion Studio</span>
              </button>
            </div>
          </header>

          <main className="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
            <div className="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
              <div>
                <h2 className="text-base font-bold text-white">Active Photo Memory Workspace</h2>
                <p className="text-xs text-slate-400">{photos.length} Photo(s) loaded in workspace session</p>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow transition flex items-center space-x-1.5"
                >
                  <Icon name="upload" className="w-4 h-4" />
                  <span>Add Photos</span>
                </button>
                <input
                  ref={fileInputRef}
                  type="file"
                  multiple
                  accept="image/*"
                  onChange={handleFileUpload}
                  className="hidden"
                />
              </div>
            </div>

            {photos.length > 0 ? (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                {photos.map(p => (
                  <div key={p.id} className="aspect-square bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden relative group">
                    <img src={p.blobUrl} alt={p.name} className="w-full h-full object-cover" />
                    <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent p-2 text-[10px] font-mono text-slate-300 truncate">
                      {p.name}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-3xl space-y-3">
                <Icon name="camera" className="w-10 h-10 text-slate-600 mx-auto" />
                <h3 className="text-sm font-bold text-slate-300">No Photos Loaded</h3>
                <p className="text-xs text-slate-500 max-w-sm mx-auto">Upload burst photo sequences to run culling quality grading or compile MP4 motion sequences.</p>
              </div>
            )}
          </main>

          <PhotoMotionStudioModal
            isOpen={motionModalOpen}
            onClose={() => setMotionModalOpen(false)}
            photos={photos}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BirdVaultApp />);
  </script>
</body>
</html>
