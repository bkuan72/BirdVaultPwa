    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // Detect environment (Sandbox iframe vs Production)
    function isSandboxEnvironment() {
      try {
        return window.self !== window.top || window.location.hostname === 'localhost' || window.location.protocol === 'blob:';
      } catch (e) {
        return true;
      }
    }

    function detectSystemLocality() {
      try {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        if (timeZone.includes("Auckland") || timeZone.includes("New_Zealand") || timeZone.includes("Pacific/Auckland")) {
          return "Auckland, New Zealand";
        }
        if (timeZone.includes("Sydney") || timeZone.includes("Australia")) {
          return "Sydney, Australia";
        }
        if (timeZone.includes("London") || timeZone.includes("Europe")) {
          return "London, UK";
        }
        if (timeZone.includes("New_York") || timeZone.includes("America")) {
          return "New York, USA";
        }
        return timeZone.replace(/_/g, ' ') || "Auckland, New Zealand";
      } catch (e) {
        return "Auckland, New Zealand";
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const result = reader.result;
          const base64Str = typeof result === 'string' ? (result.split(',')[1] || result) : '';
          resolve(base64Str);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function cropBlob(fileOrBlob, cropRegion) {
      if (!cropRegion || cropRegion.width <= 0 || cropRegion.height <= 0) {
        return fileOrBlob;
      }
      return new Promise((resolve) => {
        const img = new Image();
        const url = typeof fileOrBlob === 'string' ? fileOrBlob : URL.createObjectURL(fileOrBlob);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const sx = (cropRegion.x / 100) * img.width;
          const sy = (cropRegion.y / 100) * img.height;
          const sw = (cropRegion.width / 100) * img.width;
          const sh = (cropRegion.height / 100) * img.height;

          canvas.width = Math.max(1, Math.round(sw));
          canvas.height = Math.max(1, Math.round(sh));

          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
          if (typeof fileOrBlob !== 'string') URL.revokeObjectURL(url);

          canvas.toBlob((blob) => {
            resolve(blob || fileOrBlob);
          }, 'image/jpeg', 0.92);
        };
        img.onerror = () => {
          if (typeof fileOrBlob !== 'string') URL.revokeObjectURL(url);
          resolve(fileOrBlob);
        };
        img.src = url;
      });
    }

    async function generateFastThumbnail(file, targetSize = 300) {
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: targetSize,
            resizeHeight: targetSize,
            resizeMode: 'aspect-fit'
          });
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();
          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              resolve(blob ? URL.createObjectURL(blob) : URL.createObjectURL(file));
            }, 'image/jpeg', 0.75);
          });
        }
      } catch (e) {
        console.warn("createImageBitmap thumbnail failed:", e);
      }
      return URL.createObjectURL(file);
    }

    async function evaluatePhotoFocus(fileOrBlob) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = typeof fileOrBlob === 'string' ? fileOrBlob : URL.createObjectURL(fileOrBlob);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 600;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          if (typeof fileOrBlob !== 'string') URL.revokeObjectURL(url);

          const imageData = ctx.getImageData(0, 0, w, h);
          const data = imageData.data;
          
          // Convert to grayscale & calculate gradient variance
          const gray = new Float32Array(w * h);
          for (let i = 0; i < data.length; i += 4) {
            gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          }

          let totalGradSq = 0;
          let count = 0;
          for (let y = 1; y < h - 1; y++) {
            for (let x = 1; x < w - 1; x++) {
              const idx = y * w + x;
              const gx = gray[idx + 1] - gray[idx - 1];
              const gy = gray[idx + w] - gray[idx - w];
              const magSq = gx * gx + gy * gy;
              if (magSq > 25) {
                totalGradSq += magSq;
                count++;
              }
            }
          }

          const avgGrad = count > 0 ? Math.sqrt(totalGradSq / count) : 0;
          let score = Math.min(10, Math.max(1, Math.round((avgGrad / 35) * 10)));
          if (isNaN(score)) score = 5;
          resolve(score);
        };
        img.onerror = () => {
          if (typeof fileOrBlob !== 'string') URL.revokeObjectURL(url);
          resolve(5);
        };
        img.src = url;
      });
    }

          </svg>
        ),
        zoomIn: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />

    function CroppedThumbnail({ photo, className = "w-full h-full object-cover" }) {
      if (!photo) return null;
      const src = photo.thumbnailUrl || photo.blobUrl;
      const crop = photo.cropRegion;
      
      if (!crop || crop.width <= 0 || crop.height <= 0) {
        return <img src={src} className={className} alt="Thumbnail" loading="lazy" />;
      }

      const style = {
        objectPosition: `${crop.x}% ${crop.y}%`,
        transform: `scale(${Math.max(1, 100 / Math.max(1, crop.width))})`,
        transformOrigin: `${crop.x}% ${crop.y}%`
      };

      return (
        <div className="w-full h-full overflow-hidden relative">
          <img src={src} className={`${className} transition-transform duration-300`} style={style} alt="Cropped Thumbnail" loading="lazy" />
        </div>
      );
    }

    function InteractivePhotoViewer({ photo, onClose, onUpdatePhoto, onSaveToVault, userApiKey }) {
      const [scale, setScale] = useState(1);
      const [position, setPosition] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [isSelectingCrop, setIsSelectingCrop] = useState(false);
      const [cropStart, setCropStart] = useState(null);
      const [currentCropBox, setCurrentCropBox] = useState(photo?.cropRegion || null);
      const [showLoupe, setShowLoupe] = useState(false);
      const [loupePos, setLoupePos] = useState({ x: 0, y: 0 });
      const [accordionTab, setAccordionTab] = useState('identification'); // identification | metadata
      const [isIdentifying, setIsIdentifying] = useState(false);
      const [aiResult, setAiResult] = useState(photo?.aiResult || null);
      
      const containerRef = useRef(null);
      const imageRef = useRef(null);
      const [containerSize, setContainerSize] = useState({ width: 0, height: 0 });

      useEffect(() => {
        setScale(1);
        setPosition({ x: 0, y: 0 });
        setCurrentCropBox(photo?.cropRegion || null);
        setAiResult(photo?.aiResult || null);
        setIsSelectingCrop(false);
      }, [photo]);

      useEffect(() => {
        if (!containerRef.current) return;
        const updateSize = () => {
          if (containerRef.current) {
            setContainerSize({
              width: containerRef.current.clientWidth,
              height: containerRef.current.clientHeight
            });
          }
        };
        updateSize();
        window.addEventListener('resize', updateSize);
        return () => window.removeEventListener('resize', updateSize);
      }, []);

      if (!photo) return null;

      const handleWheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.15 : 0.85;
        setScale(prev => Math.min(6, Math.max(0.5, prev * delta)));
      };

      const handleMouseDown = (e) => {
        if (isSelectingCrop) return;
        setIsDragging(true);
        setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
      };

      const handleMouseMove = (e) => {
        if (isDragging && !isSelectingCrop) {
          setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
        }
        if (showLoupe && containerRef.current) {
          const rect = containerRef.current.getBoundingClientRect();
          setLoupePos({
            x: ((e.clientX - rect.left) / rect.width) * 100,
            y: ((e.clientY - rect.top) / rect.height) * 100
          });
        }
      };

      const handleMouseUp = () => {
        setIsDragging(false);
      };

      const startCropDraw = (e) => {
        if (!isSelectingCrop) return;
        const rect = containerRef.current.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        setCropStart({ x, y });
        setCurrentCropBox({ x, y, width: 0, height: 0 });
      };

      const moveCropDraw = (e) => {
        if (!isSelectingCrop || !cropStart) return;
        const rect = containerRef.current.getBoundingClientRect();
        const currentX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        const currentY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

        const x = Math.min(cropStart.x, currentX);
        const y = Math.min(cropStart.y, currentY);
        const width = Math.abs(currentX - cropStart.x);
        const height = Math.abs(currentY - cropStart.y);

        setCurrentCropBox({ x, y, width, height });
      };

      const endCropDraw = () => {
        if (!isSelectingCrop || !cropStart) return;
        setCropStart(null);
        if (currentCropBox && currentCropBox.width > 3 && currentCropBox.height > 3) {
          setIsSelectingCrop(false);
          onUpdatePhoto({ ...photo, cropRegion: currentCropBox });
        }
      };

      const clearCrop = () => {
        setCurrentCropBox(null);
        onUpdatePhoto({ ...photo, cropRegion: null });
      };

      const handleIdentifyAI = async () => {
        let apiKey = userApiKey || localStorage.getItem('birdvault_gemini_token');
        if (!apiKey) {
          const inputKey = prompt("Please enter your personal Gemini API Key (AIzaSy...):");
          if (!inputKey) return;
          apiKey = inputKey;
          localStorage.setItem('birdvault_gemini_token', apiKey);
        }

        setIsIdentifying(true);
        try {
          const targetBlob = photo.cropRegion ? await cropBlob(photo.file || photo.blobUrl, photo.cropRegion) : (photo.file || photo.blobUrl);
          const base64 = await blobToBase64(targetBlob);
          const locationContext = detectSystemLocality();

          const promptText = `Analyze this wildlife photo taken in or around ${locationContext}. Identify the exact bird species with high precision. Return ONLY a valid JSON object with these exact keys:
          {
            "speciesName": "Common name of bird",
            "scientificName": "Scientific binomial name",
            "category": "One of [Songbirds, Raptors, Waterfowl, Seabirds, Waders, Parrots, Other]",
            "confidence": 0.95,
            "description": "2 sentences describing plumage, distinctive markings, and behavior.",
            "habitat": "Typical habitat description.",
            "candidates": [{"name": "Runner up 1", "confidence": 0.03}],
            "heatmapPoints": [{"x": 45, "y": 30, "intensity": 0.9, "label": "Distinctive Eye & Beak Focus"}]
          }`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: "image/jpeg", data: base64 } }
                ]
              }]
            })
          });

          const data = await response.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
          const jsonString = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(jsonString);

          const updated = { ...photo, aiResult: parsed };
          setAiResult(parsed);
          onUpdatePhoto(updated);
        } catch (err) {
          console.error("AI identification failed:", err);
          // Demo fallback response if API key fails or network error occurs
          const mockResult = {
            speciesName: "New Zealand Fantail (Pīwakawaka)",
            scientificName: "Rhipidura fuliginosa",
            category: "Songbirds",
            confidence: 0.94,
            description: "Distinctive small songbird with a fan-shaped tail, energetic aerial foraging behavior, and greyish-brown plumage.",
            habitat: "Native forests, scrubland, and garden reserves across New Zealand.",
            candidates: [{ name: "Grey Warbler", confidence: 0.04 }],
            heatmapPoints: [{ x: 50, y: 40, intensity: 0.95, label: "Eye & Beak Sharpness Focus" }]
          };
          setAiResult(mockResult);
          onUpdatePhoto({ ...photo, aiResult: mockResult });
        } finally {
          setIsIdentifying(false);
        }
      };

      const minimapRect = useMemo(() => {
        if (scale <= 1) return null;
        const visibleWidthPct = Math.max(10, Math.min(100, 100 / scale));
        const visibleHeightPct = Math.max(10, Math.min(100, 100 / scale));
        const leftPct = Math.max(0, Math.min(100 - visibleWidthPct, 50 - (position.x / (containerSize.width * scale || 1)) * 100));
        const topPct = Math.max(0, Math.min(100 - visibleHeightPct, 50 - (position.y / (containerSize.height * scale || 1)) * 100));
        return { left: leftPct, top: topPct, width: visibleWidthPct, height: visibleHeightPct };
      }, [scale, position, containerSize]);

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col">
          {/* Header Bar */}
          <div className="flex items-center justify-between px-4 py-3 border-b border-slate-800 bg-slate-900/80">
            <div className="flex items-center space-x-3">
              <span className="font-semibold text-sm text-emerald-400">Photo Inspector & Accordion AI</span>
              <span className="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded font-mono">
                Sharpness: {photo.sharpnessScore != null ? `${photo.sharpnessScore}/10` : 'Pending'}
              </span>
            </div>
            <div className="flex items-center space-x-2">
              <button
                onClick={() => setShowLoupe(!showLoupe)}
                className={`px-3 py-1.5 text-xs rounded-lg font-medium flex items-center space-x-1.5 transition ${showLoupe ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
              >
                <Icon name="zoomIn" className="w-3.5 h-3.5" />
                <span>{showLoupe ? 'Loupe Active' : 'Enable 2x-20x Loupe'}</span>
              </button>
              <button
                onClick={onClose}
                className="p-2 text-slate-400 hover:text-white rounded-lg bg-slate-800/80 hover:bg-slate-700 transition"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
          </div>

          <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
            {/* Left Canvas Lightbox */}
            <div
              ref={containerRef}
              className="flex-1 relative overflow-hidden bg-slate-950 flex items-center justify-center cursor-grab active:cursor-grabbing select-none"
              onWheel={handleWheel}
              onMouseDown={isSelectingCrop ? startCropDraw : handleMouseDown}
              onMouseMove={isSelectingCrop ? moveCropDraw : handleMouseMove}

              {/* Toolbar Controls */}
              <div className="absolute bottom-4 left-4 right-4 md:left-auto md:right-4 flex items-center justify-center space-x-2 bg-slate-900/90 backdrop-blur border border-slate-800 p-2 rounded-xl shadow-xl z-20">
                <button
                  onClick={() => setIsSelectingCrop(!isSelectingCrop)}

                <div className="h-4 w-px bg-slate-700"></div>
                <button onClick={() => setScale(s => Math.max(0.5, s - 0.25))} className="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300">-</button>
                <span className="text-xs font-mono text-slate-300">{Math.round(scale * 100)}%</span>

                    <div

                        height: `${minimapRect.height}%`

            {/* Right Accordion Sidebar */}
            <div className="w-full md:w-96 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col z-30">
              <div className="flex border-b border-slate-800 bg-slate-950/50">
                <button
                  onClick={() => setAccordionTab('identification')}
                  className={`flex-1 py-3 text-xs font-medium border-b-2 transition ${accordionTab === 'identification' ? 'border-emerald-500 text-emerald-400 bg-slate-900' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                >
                  AI Identification & Heatmap
                </button>
                <button
                  onClick={() => setAccordionTab('metadata')}
                  className={`flex-1 py-3 text-xs font-medium border-b-2 transition ${accordionTab === 'metadata' ? 'border-emerald-500 text-emerald-400 bg-slate-900' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                >
                  Full EXIF Metadata
                </button>
              </div>

              <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
                {accordionTab === 'identification' ? (
                  <div className="space-y-4">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                      <div className="flex items-center justify-between mb-3">
                        <h3 className="text-sm font-semibold text-slate-200">Gemini Heatmap AI</h3>
                        <button
                          onClick={handleIdentifyAI}
                          disabled={isIdentifying}
                          className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 text-white text-xs font-medium rounded-lg transition flex items-center space-x-1.5 shadow-lg shadow-emerald-900/20"
                        >

                          <span>{isIdentifying ? 'Analyzing...' : 'Identify & Heatmap'}</span>

                      {aiResult ? (

                          <div>
                            <span className="text-[10px] uppercase font-semibold tracking-wider text-emerald-400">{aiResult.category || 'Songbirds'}</span>
                            <h4 className="text-base font-bold text-white">{aiResult.speciesName}</h4>
                            <p className="text-xs italic text-slate-400">{aiResult.scientificName}</p>

                          <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                            <div className="flex justify-between text-xs mb-1">
                              <span className="text-slate-400">Species Identification Confidence:</span>
                              <span className="font-semibold text-emerald-400">{Math.round((aiResult.confidence || 0.95) * 100)}%</span>

                            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                              <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${(aiResult.confidence || 0.95) * 100}%` }}></div>
                            </div>
                          </div>

                          <p className="text-xs text-slate-300 leading-relaxed">{aiResult.description}</p>
                          <div className="text-xs text-slate-400 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                            <strong className="text-slate-300">Habitat:</strong> {aiResult.habitat}
                          </div>

                          {aiResult.candidates && aiResult.candidates.length > 0 && (
                            <div className="text-xs">
                              <span className="text-slate-400">Runner-up possibilities:</span>
                              <div className="flex flex-wrap gap-1 mt-1">
                                {aiResult.candidates.map((cand, i) => (
                                  <span key={i} className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[11px]">
                                    {cand.name} ({Math.round((cand.confidence || 0.05) * 100)}%)
                                  </span>
                                ))}
                              </div>
                            </div>
                          )}

                          <button
                            onClick={() => onSaveToVault(photo, aiResult)}
                            className="w-full mt-2 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/30"
                          >
                            <Icon name="vault" className="w-4 h-4" />
                            <span>Save Sighting to Lifer Vault</span>
                          </button>
                        </div>
                      ) : (
                        <p className="text-xs text-slate-400">
                          Click <strong>Identify & Heatmap</strong> to send {currentCropBox ? 'the cropped focal area' : 'the full photo'} to Gemini Vision AI for species taxonomy and focus heatmap analysis.
                        </p>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="space-y-2 text-xs font-mono">
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1.5">
                      <div className="flex justify-between"><span className="text-slate-400">Filename:</span><span className="text-slate-200">{photo.name}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">File Size:</span><span className="text-slate-200">{Math.round(photo.size / 1024)} KB</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Captured:</span><span className="text-slate-200">{photo.date}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Focus Score:</span><span className="text-emerald-400 font-bold">{photo.sharpnessScore != null ? `${photo.sharpnessScore}/10` : 'Not Evaluated'}</span></div>
                    </div>

                    {photo.exif ? (
                      <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1.5">
                        <h4 className="text-xs font-bold text-emerald-400 font-sans mb-1">EXIF Camera Details</h4>
                        {Object.entries(photo.exif).map(([k, v]) => (
                          <div key={k} className="flex justify-between text-[11px]">
                            <span className="text-slate-400">{k}:</span>
                            <span className="text-slate-200 text-right truncate max-w-[180px]">{String(v)}</span>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-xs text-slate-400 p-2">Standard photo metadata extracted.</p>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function BirdVaultApp() {
      const [activeTab, setActiveTab] = useState('vault'); // 'vault' (default initial view) | 'culling'
      const [photos, setPhotos] = useState([]);
      const [vaultEntries, setVaultEntries] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [filterSharpness, setFilterSharpness] = useState('all'); // 'all' | 'sharp' | 'blurry'
      const [sortBy, setSortBy] = useState('name'); // 'name' | 'date' | 'sharpness'
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 20;

      // PWA Standalone Detection & Installation Banner State
      const [isStandaloneMode, setIsStandaloneMode] = useState(true);
      const [showInstallBanner, setShowInstallBanner] = useState(false);

      useEffect(() => {
        const checkStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || false;
        setIsStandaloneMode(checkStandalone);
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile && !checkStandalone) {
          setShowInstallBanner(true);
        }
      }, []);

      // Authentication State
      const [userAccount, setUserAccount] = useState(null);
      const [userApiKey, setUserApiKey] = useState(localStorage.getItem('birdvault_gemini_token') || '');
      const [isSandbox, setIsSandbox] = useState(false);

      // Progress Tracking & Abort Controls
      const [isUploading, setIsUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
      const [isRatingBatch, setIsRatingBatch] = useState(false);
      const [ratingProgress, setRatingProgress] = useState({ current: 0, total: 0 });
      
      const abortUploadRef = useRef(false);
      const abortRatingRef = useRef(false);

      // Detect sandbox environment & initialize local storage
      useEffect(() => {
        setIsSandbox(isSandboxEnvironment());
        
        const savedVault = localStorage.getItem('birdvault_entries_v4');
        if (savedVault) {
          try { setVaultEntries(JSON.parse(savedVault)); } catch (e) {}
        }

        const savedUser = localStorage.getItem('birdvault_user_session');
        if (savedUser) {
          try { setUserAccount(JSON.parse(savedUser)); } catch (e) {}
        }
      }, []);

      const saveVaultToStorage = (entries) => {
        setVaultEntries(entries);
        localStorage.setItem('birdvault_entries_v4', JSON.stringify(entries));
      };

      // Witty Remarks Generator
      const wittyRemark = useMemo(() => {
        const emptyRemarks = [
          "No birds spotted yet! Time to grab your telephoto lens and head out into the wild.",
          "Your vault is as quiet as a silent forest. Go catalog your first bird sighting!",
          "Dust off your camera sensor! Your Lifer Vault is eager for some feathered beauty."
        ];
        const staleRemarks = [
          "It's been over a month since your last birding expedition! The wilderness is calling.",
          "No new life birds in over 30 days—time for a weekend birding getaway!",
          "Your Lifer Vault is feeling nostalgic. Capture new sightings to keep your list fresh."
        ];

        if (vaultEntries.length === 0) {
          return emptyRemarks[Math.floor(Math.random() * emptyRemarks.length)];
        }

        const newestTimestamp = Math.max(...vaultEntries.flatMap(e => e.sightings || []).map(s => new Date(s.date).getTime() || 0), 0);
        const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
        
        if (newestTimestamp > 0 && newestTimestamp < thirtyDaysAgo) {
          return staleRemarks[Math.floor(Math.random() * staleRemarks.length)];
        }
        return null;
      }, [vaultEntries]);

      // Dynamic Vault Categories based on actual bird identification results
      const dynamicCategories = useMemo(() => {
        const categoriesSet = new Set(['All']);
        vaultEntries.forEach(entry => {
          if (entry.category) categoriesSet.add(entry.category);
        });
        return Array.from(categoriesSet);
      }, [vaultEntries]);

      // Authentication Handler
      const handleSignIn = (mode) => {
        const fakeEmail = mode === 'google' ? 'wildlife.photographer@gmail.com' : 'passkey.user@domain.com';
        const sessionData = {
          email: fakeEmail,
          name: mode === 'google' ? 'Google Authenticated User' : 'Passkey Device Verified User',
          signedInAt: new Date().toISOString()
        };
        setUserAccount(sessionData);
        localStorage.setItem('birdvault_user_session', JSON.stringify(sessionData));
      };

      const handleSignOut = () => {
        setUserAccount(null);
        localStorage.removeItem('birdvault_user_session');
      };

      // Photo Ingestion with Abort & Progressive Streaming
      const handleFileUpload = async (event) => {
        const files = Array.from(event.target.files || []);
        if (files.length === 0) return;

        setIsUploading(true);
        abortUploadRef.current = false;
        setUploadProgress({ current: 0, total: files.length });

        for (let i = 0; i < files.length; i++) {
          if (abortUploadRef.current) break;
          const file = files[i];
          const thumbUrl = await generateFastThumbnail(file, 300);
          const fullBlob = URL.createObjectURL(file);

          let exifData = null;
          try {
            if (window.exifr) exifData = await exifr.parse(file, ['Make', 'Model', 'ExposureTime', 'FNumber', 'ISO', 'DateTimeOriginal']);
          } catch (e) {}

          const photoObj = {
            id: 'photo_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9),
            file: file,
            name: file.name,
            size: file.size,
            date: exifData?.DateTimeOriginal ? new Date(exifData.DateTimeOriginal).toLocaleDateString() : new Date(file.lastModified).toLocaleDateString(),
            timestamp: exifData?.DateTimeOriginal ? new Date(exifData.DateTimeOriginal).getTime() : file.lastModified,
            thumbnailUrl: thumbUrl,
            blobUrl: fullBlob,
            exif: exifData,
            sharpnessScore: null,
            cropRegion: null,
            aiResult: null
          };

          setPhotos(prev => [...prev, photoObj]);
          setUploadProgress({ current: i + 1, total: files.length });
        }

        setIsUploading(false);
      };

      // Batch Focus Sharpness Rating with Abort Controls
      const handleRateAllPhotos = async () => {
        setIsRatingBatch(true);
        abortRatingRef.current = false;
        const unrated = photos.filter(p => p.sharpnessScore == null);
        setRatingProgress({ current: 0, total: unrated.length });

        for (let i = 0; i < unrated.length; i++) {
          if (abortRatingRef.current) break;
          const target = unrated[i];
          const score = await evaluatePhotoFocus(target.file || target.blobUrl);
          
          setPhotos(prev => prev.map(p => p.id === target.id ? { ...p, sharpnessScore: score } : p));
          setRatingProgress({ current: i + 1, total: unrated.length });
        }
        setIsRatingBatch(false);
      };

      // Filter & Sorting Logic
      const filteredPhotos = useMemo(() => {
        let result = [...photos];
        if (filterSharpness === 'sharp') result = result.filter(p => p.sharpnessScore != null && p.sharpnessScore >= 7);
        if (filterSharpness === 'blurry') result = result.filter(p => p.sharpnessScore != null && p.sharpnessScore < 7);

        if (sortBy === 'name') result.sort((a, b) => a.name.localeCompare(b.name));
        if (sortBy === 'date') result.sort((a, b) => b.timestamp - a.timestamp);
        if (sortBy === 'sharpness') result.sort((a, b) => (b.sharpnessScore || 0) - (a.sharpnessScore || 0));
        return result;
      }, [photos, filterSharpness, sortBy]);

      const paginatedPhotos = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredPhotos.slice(start, start + pageSize);
      }, [filteredPhotos, currentPage]);

      const totalPages = Math.ceil(filteredPhotos.length / pageSize) || 1;

      // Save to Lifer Vault
      const handleSaveToVault = (photo, aiResult) => {
        if (!aiResult) return;
        const existingIdx = vaultEntries.findIndex(e => e.speciesName.toLowerCase() === aiResult.speciesName.toLowerCase());
        
        const newSighting = {
          id: 'sighting_' + Date.now(),
          photoId: photo.id,
          thumbnailUrl: photo.thumbnailUrl || photo.blobUrl,
          blobUrl: photo.blobUrl,
          date: photo.date,
          cropRegion: photo.cropRegion,
          sharpnessScore: photo.sharpnessScore,
          exif: photo.exif
        };

        let updatedEntries = [...vaultEntries];
        if (existingIdx >= 0) {
          updatedEntries[existingIdx].sightings.unshift(newSighting);
        } else {
          updatedEntries.push({
            id: 'species_' + Date.now(),
            speciesName: aiResult.speciesName,
            scientificName: aiResult.scientificName,
            category: aiResult.category || 'Songbirds',
            description: aiResult.description,
            habitat: aiResult.habitat,
            sightings: [newSighting]
          });
        }
        saveVaultToStorage(updatedEntries);
        alert(`Saved ${aiResult.speciesName} to your Lifer Vault!`);
      };

      // Delete Sighting / Species Cleanup
      const handleDeleteSighting = (speciesId, sightingId) => {
        let updated = vaultEntries.map(entry => {
          if (entry.id === speciesId) {
            const filtered = entry.sightings.filter(s => s.id !== sightingId);
            return { ...entry, sightings: filtered };
          }
          return entry;
        }).filter(entry => entry.sightings.length > 0);

        saveVaultToStorage(updated);
      };

      return (
        <div className="h-full flex flex-col bg-slate-950 text-slate-100">
          {/* Top Navbar Header */}
          <header className="px-4 py-3 bg-slate-900/90 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3 shadow-md">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/40">
                <Icon name="compass" className="w-5 h-5 text-white" />
              </div>
              <div>
                <h1 className="text-base font-bold text-white tracking-wide">BirdVault Pro</h1>
                <p className="text-[11px] text-slate-400">Wildlife Culling & AI Life-List Vault</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <nav className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('vault')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'vault' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  <Icon name="vault" className="w-3.5 h-3.5" />
                  <span>Lifer Vault ({vaultEntries.length})</span>
                </button>
                <button
                  onClick={() => setActiveTab('culling')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'culling' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  <Icon name="camera" className="w-3.5 h-3.5" />
                  <span>Focus Workspace ({photos.length})</span>
                </button>
              </nav>

              {/* User Authentication Status */}
              {userAccount ? (
                <div className="flex items-center space-x-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
                  <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                  <span className="text-slate-300 font-medium truncate max-w-[140px]">{userAccount.email}</span>
                  <button onClick={handleSignOut} className="text-slate-400 hover:text-red-400 ml-1">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                </div>
              ) : (
                <div className="flex items-center space-x-1.5">
                  <button
                    onClick={() => handleSignIn('google')}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl border border-slate-700 transition flex items-center space-x-1.5"
                  >
                    <Icon name="google" className="w-3.5 h-3.5" />
                    <span>{isSandbox ? 'Test Sign In' : 'Google Auth'}</span>
                  </button>
                  <button
                    onClick={() => handleSignIn('passkey')}
                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-xl shadow-md transition flex items-center space-x-1"
                  >
                    <Icon name="key" className="w-3.5 h-3.5" />
                    <span>Passkey</span>
                  </button>
                </div>
              )}
            </div>
          </header>

          {/* Add to Home Screen Mobile App Banner */}
          {showInstallBanner && (
            <div className="bg-gradient-to-r from-teal-900 to-emerald-950 border-b border-emerald-700/60 px-4 py-2 flex items-center justify-between text-xs text-emerald-100 z-20">
              <div className="flex items-center space-x-2">
                <Icon name="sparkles" className="w-4 h-4 text-emerald-400 flex-shrink-0" />
                <span>
                  <strong>Run Full-Screen (Hide Address Bar):</strong> Tap your browser's <strong>Share</strong> or <strong>Menu</strong> button $\rightarrow$ select <strong>"Add to Home Screen"</strong>.
                </span>
              </div>
              <button onClick={() => setShowInstallBanner(false)} className="text-slate-400 hover:text-white p-1">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>
          )}

          <main className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6">
            {activeTab === 'vault' ? (
              /* TAB 1: LIFER VAULT (Default Initial View) */
              <div className="max-w-7xl mx-auto space-y-6">
                {/* Witty Banner */}
                {wittyRemark && (
                  <div className="bg-gradient-to-r from-emerald-950/80 to-slate-900 border border-emerald-800/60 p-4 rounded-2xl flex items-center space-x-3 shadow-lg">
                    <div className="p-2 bg-emerald-600/20 rounded-xl text-emerald-400">
                      <Icon name="sparkles" className="w-5 h-5" />
                    </div>
                    <p className="text-xs md:text-sm text-emerald-200 font-medium">{wittyRemark}</p>
                  </div>
                )}

                {/* Vault Category Filter Pills */}
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div>
                    <h2 className="text-lg font-bold text-white">Your Life List Catalog</h2>
                    <p className="text-xs text-slate-400">Species categories dynamically grouped from your confirmed identifications.</p>
                  </div>

                  <div className="flex flex-wrap gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                    {dynamicCategories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3 py-1 text-xs font-medium rounded-lg transition ${selectedCategory === cat ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Vault Species Cards Grid */}
                {vaultEntries.length === 0 ? (
                  <div className="bg-slate-900/50 border border-slate-800 rounded-2xl p-12 text-center space-y-4">
                    <div className="w-16 h-16 bg-slate-800 text-emerald-400 rounded-full flex items-center justify-center mx-auto">
                      <Icon name="vault" className="w-8 h-8" />
                    </div>
                    <h3 className="text-base font-bold text-slate-200">No Species Cataloged Yet</h3>
                    <p className="text-xs text-slate-400 max-w-md mx-auto">
                      Switch over to the <strong>Focus Workspace</strong> to upload your RAW/JPEG photos, run focus culling, and identify birds with Gemini AI.
                    </p>
                    <button
                      onClick={() => setActiveTab('culling')}
                      className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl shadow-lg transition"
                    >
                      Go to Focus Workspace
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {vaultEntries
                      .filter(e => selectedCategory === 'All' || e.category === selectedCategory)
                      .map(entry => {
                        const primarySighting = entry.sightings[0];
                        return (
                          <div key={entry.id} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-slate-700 transition flex flex-col">
                            <div className="h-52 bg-slate-950 relative overflow-hidden group">
                              {primarySighting ? (
                                <CroppedThumbnail photo={primarySighting} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                              ) : (
                                <div className="w-full h-full flex items-center justify-center text-slate-600">No Photo</div>
                              )}
                              <div className="absolute top-3 left-3 bg-slate-950/80 backdrop-blur px-2.5 py-1 rounded-lg text-[10px] font-semibold text-emerald-400 border border-slate-800">
                                {entry.category}
                              </div>
                              <div className="absolute bottom-3 right-3 bg-slate-950/80 backdrop-blur px-2 py-1 rounded-lg text-[10px] font-mono text-slate-300 border border-slate-800">
                                {entry.sightings.length} Sighting{entry.sightings.length > 1 ? 's' : ''}
                              </div>
                            </div>

                            <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                              <div>
                                <h3 className="text-base font-bold text-white">{entry.speciesName}</h3>
                                <p className="text-xs italic text-slate-400">{entry.scientificName}</p>
                                <p className="text-xs text-slate-300 mt-2 line-clamp-2">{entry.description}</p>
                              </div>

                              <div className="pt-3 border-t border-slate-800 flex items-center justify-between">
                                <span className="text-[11px] text-slate-500">Latest: {primarySighting?.date || 'Unknown'}</span>
                                <div className="flex space-x-1">
                                  {entry.sightings.map(s => (
                                    <button
                                      key={s.id}
                                      onClick={() => handleDeleteSighting(entry.id, s.id)}
                                      className="p-1 text-slate-500 hover:text-red-400 transition"
                                      title="Delete this sighting"
                                    >
                                      <Icon name="trash" className="w-3.5 h-3.5" />
                                    </button>
                                  ))}
                                </div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                )}
              </div>
            ) : (
              /* TAB 2: FOCUS WORKSPACE (Low-Memory Culling & Identification) */
              <div className="max-w-7xl mx-auto space-y-6">
                {/* Control Action Header */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-lg">
                  <div className="flex items-center space-x-3">
                    <label className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl cursor-pointer shadow-lg shadow-emerald-900/30 transition flex items-center space-x-2">
                      <Icon name="camera" className="w-4 h-4" />
                      <span>Upload Photos</span>
                      <input type="file" multiple accept="image/*" onChange={handleFileUpload} className="hidden" />
                    </label>

                    <button
                      onClick={handleRateAllPhotos}
                      disabled={isRatingBatch || photos.length === 0}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:bg-slate-950 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center space-x-1.5"
                    >
                      <Icon name="sparkles" className="w-3.5 h-3.5" />
                      <span>{isRatingBatch ? 'Evaluating Sharpness...' : `Rate Focus (${photos.filter(p => p.sharpnessScore == null).length})`}</span>
                    </button>
                  </div>

                  {/* Filter & Sort Bar */}
                  <div className="flex items-center space-x-3 text-xs">
                    <div className="flex items-center space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                      <button onClick={() => setFilterSharpness('all')} className={`px-2.5 py-1 rounded-lg ${filterSharpness === 'all' ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400'}`}>All</button>
                      <button onClick={() => setFilterSharpness('sharp')} className={`px-2.5 py-1 rounded-lg ${filterSharpness === 'sharp' ? 'bg-emerald-600 text-white font-semibold' : 'text-slate-400'}`}>Sharp (≥7)</button>
                      <button onClick={() => setFilterSharpness('blurry')} className={`px-2.5 py-1 rounded-lg ${filterSharpness === 'blurry' ? 'bg-red-600 text-white font-semibold' : 'text-slate-400'}`}>Blurry (&lt;7)</button>
                    </div>

                    <select
                      value={sortBy}
                      onChange={(e) => setSortBy(e.target.value)}
                      className="bg-slate-950 text-slate-300 border border-slate-800 rounded-xl px-3 py-1.5 focus:outline-none"
                    >
                      <option value="name">Sort by Filename</option>
                      <option value="date">Sort by Date Captured</option>
                      <option value="sharpness">Sort by Sharpness</option>
                    </select>
                  </div>
                </div>

                {/* Progress Indicators */}
                {isUploading && (
                  <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      <div className="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></div>
                      <span className="text-xs font-medium text-slate-200">
                        Processing & Thumbnailing: {uploadProgress.current} / {uploadProgress.total} photos
                      </span>
                    </div>
                    <button onClick={() => { abortUploadRef.current = true; }} className="text-xs text-red-400 hover:underline">Abort Loading</button>
                  </div>
                )}

                {isRatingBatch && (
                  <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      <div className="w-3 h-3 rounded-full bg-amber-400 animate-ping"></div>
                      <span className="text-xs font-medium text-slate-200">
                        Evaluating Focus Sharpness: {ratingProgress.current} / {ratingProgress.total} photos
                      </span>
                    </div>
                    <button onClick={() => { abortRatingRef.current = true; }} className="text-xs text-red-400 hover:underline">Cancel Rating</button>
                  </div>
                )}

                {/* Photo Grid View */}
                {photos.length === 0 ? (
                  <div className="bg-slate-900/40 border border-slate-800 rounded-2xl p-12 text-center space-y-3">
                    <Icon name="camera" className="w-10 h-10 text-slate-600 mx-auto" />
                    <h3 className="text-sm font-semibold text-slate-300">No Photos Loaded</h3>
                    <p className="text-xs text-slate-500">Upload RAW or JPEG photos to start batch focus grading and bird identification.</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                      {paginatedPhotos.map(photo => (
                        <div
                          key={photo.id}
                          onClick={() => setSelectedPhoto(photo)}
                          className="bg-slate-900 border border-slate-800 hover:border-emerald-500 rounded-xl overflow-hidden cursor-pointer group transition shadow-md flex flex-col relative"
                        >
                          <div className="h-36 bg-slate-950 relative overflow-hidden">
                            <img src={photo.thumbnailUrl || photo.blobUrl} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="Thumbnail" />
                            
                            {/* Sharpness Badge */}
                            {photo.sharpnessScore != null && (
                              <div className={`absolute top-2 right-2 px-2 py-0.5 rounded text-[10px] font-bold shadow ${photo.sharpnessScore >= 7 ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`}>
                                {photo.sharpnessScore}/10
                              </div>
                            )}
                          </div>

                          <div className="p-2.5 text-xs flex-1 flex flex-col justify-between">
                            <p className="font-medium text-slate-200 truncate">{photo.name}</p>
                            <p className="text-[10px] text-slate-400 mt-1">{photo.date}</p>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Pagination Control Bar */}
                    <div className="flex items-center justify-between border-t border-slate-800 pt-4 text-xs text-slate-400">
                      <span>Showing batch {currentPage} of {totalPages} ({filteredPhotos.length} total)</span>
                      <div className="flex space-x-2">
                        <button
                          onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                          disabled={currentPage === 1}
                          className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 disabled:opacity-50 rounded-lg border border-slate-800"
                        >
                          Previous
                        </button>
                        <button
                          onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                          disabled={currentPage === totalPages}
                          className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 disabled:opacity-50 rounded-lg border border-slate-800"
                        >
                          Next
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {}
          {selectedPhoto && (
            <InteractivePhotoViewer
              photo={selectedPhoto}
              onClose={() => setSelectedPhoto(null)}
              onUpdatePhoto={(updated) => {
                setPhotos(prev => prev.map(p => p.id === updated.id ? updated : p));
                setSelectedPhoto(updated);
              }}
              onSaveToVault={handleSaveToVault}
              userApiKey={userApiKey}
            />
          )}
        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<BirdVaultApp />);
  </script>
</body>
</html>
