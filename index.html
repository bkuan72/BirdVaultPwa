                    <div className="w-3.5 h-3.5 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                    <span className="truncate">
                      Loading files: <strong className="font-mono text-white">{uploadProgress.current}</strong>/{uploadProgress.total}
                    </span>
                    <button
                      onClick={() => { abortUploadRef.current = true; }}
                      className="px-2 py-0.5 bg-red-600/20 text-red-400 text-[10px] rounded font-semibold ml-2 touch-manipulation"
                    >
                      Abort
                    </button>
                  </div>
                ) : loadingThumbnails && !isPreviewOpen ? (
                  <div className="flex items-center space-x-2 truncate text-sky-400 font-medium">
                    <div className="w-3.5 h-3.5 border-2 border-sky-400 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                    <span className="truncate">
                      Rendering 20-Photo Page: <strong className="font-mono text-white">{thumbnailProgress.current}</strong>/{thumbnailProgress.total}
                    </span>
                  </div>
                ) : rating ? (
                  <div className="flex items-center space-x-2 truncate text-emerald-400 font-medium">
                    <div className="w-3.5 h-3.5 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                    <span className="truncate">
                      AI Focus Culling: <strong className="font-mono text-white">{ratingProgress.current}</strong>/{ratingProgress.total}
                    </span>
                    <button
                      onClick={() => { abortRatingRef.current = true; }}
                      className="px-2 py-0.5 bg-red-600/20 text-red-400 text-[10px] rounded font-semibold ml-2 touch-manipulation"
                    >
                      Abort
                    </button>
                  </div>
                ) : null}
              </div>
            </div>
          )}

          {showDeleteConfirmModal && (
            <div className="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-sm w-full shadow-2xl space-y-4">
                <div className="flex items-center space-x-3 text-red-400">
                  <div className="p-2 bg-red-500/10 border border-red-500/20 rounded-xl">
                    <Icon name="trash" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="font-bold text-white text-sm sm:text-base">
                      Delete Photos
                    </h3>
                    <p className="text-[11px] text-slate-400">Permanent deletion from disk</p>
                  </div>
                </div>
                
                <p className="text-xs text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800">
                  Are you sure you want to delete <strong className="text-white font-mono">{isSelectionActive ? selectedIds.size : processedPhotos.length}</strong> photo(s)?
                </p>

                <div className="flex flex-col-reverse sm:flex-row items-center justify-end sm:space-x-2 pt-2 border-t border-slate-800 gap-2 sm:gap-0">
                  <button
                    onClick={() => setShowDeleteConfirmModal(false)}
                    className="w-full sm:w-auto px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition touch-manipulation"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmAndDeleteFiltered}
                    className="w-full sm:w-auto px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-xl transition shadow-lg flex items-center justify-center space-x-1.5 touch-manipulation"
                  >
                    <Icon name="trash" className="w-3.5 h-3.5" />
                    <span>Delete Permanently</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function BirdVaultApp() {
      const [activeTab, setActiveTabState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_tab') || 'vault'; } catch(e) { return 'vault'; }
      });
      
      const [filterSharpness, setFilterSharpnessState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_filter') || 'all'; } catch(e) { return 'all'; }
      });

      const [sortBy, setSortByState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_sort') || 'default'; } catch(e) { return 'default'; }
      });

      const [photos, setPhotos] = useState([]);
      const [vaultEntries, setVaultEntries] = useState(() => getStoredVault());
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [selectedPhotoVaultRef, setSelectedPhotoVaultRef] = useState(null);
      const [selectedPhotoVaultItems, setSelectedPhotoVaultItems] = useState([]);
      const vaultNavigationUrlRef = useRef(null);
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showHeaderMenu, setShowHeaderMenu] = useState(false);
      const [isExportingVault, setIsExportingVault] = useState(false);
      const [isRestoringVault, setIsRestoringVault] = useState(false);
      const headerMenuRef = useRef(null);
      const vaultImportInputRef = useRef(null);
      const [userApiKey, setUserApiKey] = useState(() => localStorage.getItem('birdvault_gemini_token') || '');
      const [userLocation, setUserLocation] = useState('Auckland, New Zealand');
      const [currentPage, setCurrentPage] = useState(1);

      useEffect(() => {
        const photoMetadataByFingerprint = new Map();
        photos.forEach(photo => {
          const fingerprintId = photo.fingerprintId || photo.id;
          if (fingerprintId) photoMetadataByFingerprint.set(fingerprintId, photo);
        });
        if (!photoMetadataByFingerprint.size) return;

        let hasChanges = false;
        const updatedEntries = vaultEntries.map(entry => {
          let entryChanged = false;
          const sightings = entry.sightings.map(sighting => {
            const savedPhoto = sighting.photo || {};
            const fingerprintId = sighting.photoFingerprintId || savedPhoto.fingerprintId || savedPhoto.id;
            const workspacePhoto = photoMetadataByFingerprint.get(fingerprintId);
            if (!workspacePhoto) return sighting;

            const cameraExif = { ...(savedPhoto.cameraExif || {}) };
            let metadataChanged = false;
            Object.entries(workspacePhoto.cameraExif || {}).forEach(([key, value]) => {
              if (value !== null && value !== undefined && cameraExif[key] !== value) {
                cameraExif[key] = value;
                metadataChanged = true;
              }
            });
            const photoMetadata = { ...savedPhoto };
            if (metadataChanged) {
              photoMetadata.cameraExif = cameraExif;
              photoMetadata.focusSpot = savedPhoto.focusSpot || cameraExif.focusArea || null;
            }
            ['stars', 'userStars', 'sharpness', 'sharpnessSource'].forEach(key => {
              const value = workspacePhoto[key];
              if (value !== null && value !== undefined && photoMetadata[key] !== value) {
                photoMetadata[key] = value;
                metadataChanged = true;
              }
            });
            if (!metadataChanged) return sighting;

            entryChanged = true;
            hasChanges = true;
            return {
              ...sighting,
              photo: photoMetadata
            };
          });
          return entryChanged ? { ...entry, sightings } : entry;
        });

        if (hasChanges) {
          setVaultEntries(updatedEntries);
          saveVaultToStorage(updatedEntries);
        }
      }, [photos, vaultEntries]);

      useEffect(() => {
        window.birdvault_open_auth_modal = () => setShowAuthModal(true);
        return () => { delete window.birdvault_open_auth_modal; };
      }, []);

      useEffect(() => {
        if (!showHeaderMenu) return undefined;
        const handleOutsidePointerDown = (event) => {
          if (!headerMenuRef.current?.contains(event.target)) setShowHeaderMenu(false);
        };
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') setShowHeaderMenu(false);
        };
        document.addEventListener('pointerdown', handleOutsidePointerDown);
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('pointerdown', handleOutsidePointerDown);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, [showHeaderMenu]);

      const handleExportVaultZip = async () => {
        setIsExportingVault(true);
        try {
          const zipFile = await exportOpfsVaultToZip(vaultEntries);
          const zipBlobUrl = URL.createObjectURL(zipFile);

          let sharedSuccessfully = false;
          if (navigator.share && navigator.canShare) {
            try {
              if (navigator.canShare({ files: [zipFile] })) {
                await navigator.share({
                  title: 'BirdVault Lifer Catalog Backup',
                  text: 'Complete species catalog and photos.',
                  files: [zipFile]
                });
                sharedSuccessfully = true;
              }
            } catch (shareErr) {
              console.warn('Web Share API permission or gesture expiration error; falling back to direct download:', shareErr);
            }
          }

          if (!sharedSuccessfully) {
            const a = document.createElement('a');
            a.href = zipBlobUrl;
            a.download = zipFile.name;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(zipBlobUrl), 10000);
          }
        } catch (err) {
          console.error('Vault export error:', err);
          alert('Vault directory export failed: ' + (err.message || 'Permission or storage error'));
        } finally {
          setIsExportingVault(false);
        }
      };

      const handleImportVaultZip = async (event) => {
        const file = event.target.files?.[0];
        event.target.value = '';
        if (!file) return;

        setIsRestoringVault(true);
        try {
          const result = await importVaultArchive(file, vaultEntries);
          setVaultEntries(result.entries);
          setActiveTab('vault');
          const skippedMessage = result.skippedSightings
            ? ` ${result.skippedSightings} sighting(s) without available image files were skipped.`
            : '';
          const skippedVersionMessage = result.skippedVersionCount
            ? ` ${result.skippedVersionCount} version(s) absent from this older backup were omitted.`
            : '';
          alert(`Vault restore complete: ${result.restoredImageCount} image file(s) restored and records merged.${skippedMessage}${skippedVersionMessage}`);
        } catch (err) {
          console.error('Vault import error:', err);
          alert('Vault restore failed: ' + (err.message || 'Invalid archive or local storage error'));
        } finally {
          setIsRestoringVault(false);
        }
      };

      const setActiveTab = (tab) => {
        setActiveTabState(tab);
        try { localStorage.setItem('birdvault_pref_tab', tab); } catch(e){}
      };

      const setFilterSharpness = (val) => {
        setFilterSharpnessState(val);
        try { localStorage.setItem('birdvault_pref_filter', val); } catch(e){}
      };

      const setSortBy = (val) => {
        setSortByState(val);
        try { localStorage.setItem('birdvault_pref_sort', val); } catch(e){}
      };

      const handleSaveApiKey = (key) => {
        setUserApiKey(key);
        try {
          if (key) localStorage.setItem('birdvault_gemini_token', key);
          else localStorage.removeItem('birdvault_gemini_token');
        } catch(e){}
      };

      const processedPhotos = useMemo(() => {
        let result = [...photos];

        if (filterSharpness === '5star') {
          result = result.filter(p => getEffectiveStars(p) === 5);
        } else if (filterSharpness === '4star') {
          result = result.filter(p => getEffectiveStars(p) >= 4);
        } else if (filterSharpness === 'soft') {
          result = result.filter(p => getEffectiveStars(p) >= 1 && getEffectiveStars(p) <= 3);
        } else if (filterSharpness === 'unrated') {
          result = result.filter(p => getEffectiveStars(p) === 0);
        } else if (/^star-[1-5]$/.test(filterSharpness)) {
          const exactStars = Number(filterSharpness.slice(5));
          result = result.filter(p => getEffectiveStars(p) === exactStars);
        }

        if (sortBy === 'name') {
          result.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true, sensitivity: 'base' }));
        } else if (sortBy === 'date_asc') {
          result.sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));
        } else if (sortBy === 'date_desc') {
          result.sort((a, b) => (b.lastModified || 0) - (a.lastModified || 0));
        } else if (sortBy === 'sharpness') {
          result.sort((a, b) => (b.sharpness || 0) - (a.sharpness || 0));
        }

        return result;
      }, [photos, filterSharpness, sortBy]);

      const updatePhotos = (action) => {
        if (typeof action === 'function') {
          setPhotos(prev => action(prev));
        } else {
          setPhotos(action);
        }
      };

      const vaultSelectedIndex = selectedPhotoVaultRef
        ? selectedPhotoVaultItems.findIndex(({ entry, sighting }) =>
            entry.speciesName === selectedPhotoVaultRef.speciesName &&
            sighting.id === selectedPhotoVaultRef.sightingId
          )
        : -1;

      const openVaultNavigationItem = async (index) => {
        const item = selectedPhotoVaultItems[index];
        if (!item) return;

        const { entry, sighting } = item;
        const savedPhoto = sighting.photo || {};
        const fingerprintId = sighting.photoFingerprintId || savedPhoto.fingerprintId || savedPhoto.id;
        const livePhoto = photos.find(photo =>
          photo.id === fingerprintId || photo.fingerprintId === fingerprintId
        );
        let nextPhoto = livePhoto || {
          ...savedPhoto,
          id: savedPhoto.id || fingerprintId || sighting.id,
          fingerprintId: fingerprintId || savedPhoto.fingerprintId,
          cropBox: sighting.cropBox ?? savedPhoto.cropBox ?? null,
          opfsFileName: sighting.opfsFileName || savedPhoto.opfsFileName
        };
        let nextNavigationUrl = null;
        const hasImageSource = nextPhoto.file || nextPhoto.blobUrl || nextPhoto.thumbnailUrl || nextPhoto.url;

        if (!hasImageSource) {
          const opfsFileName = sighting.opfsFileName || savedPhoto.opfsFileName || savedPhoto.name;
          if (!opfsFileName) {
            console.warn(`Vault sighting "${sighting.id}" has no image file reference.`);
            return;
          }
          const blob = await getOpfsSightingFileBlob(entry.category || 'Other', entry.speciesName, opfsFileName);
          if (!blob) {
            console.warn(`Could not load vault image "${opfsFileName}" for ${entry.speciesName}.`);
            return;
          }
          nextNavigationUrl = URL.createObjectURL(blob);
          nextPhoto = {
            ...nextPhoto,
            blobUrl: nextNavigationUrl,
            thumbnailUrl: nextNavigationUrl,
            url: nextNavigationUrl
          };
        }

        const previousNavigationUrl = vaultNavigationUrlRef.current;
        vaultNavigationUrlRef.current = nextNavigationUrl;
        setSelectedPhoto({ ...nextPhoto, vaultSightingId: sighting.id });
        setSelectedPhotoVaultRef({ speciesName: entry.speciesName, sightingId: sighting.id });
        if (previousNavigationUrl && previousNavigationUrl !== nextNavigationUrl) {
          setTimeout(() => URL.revokeObjectURL(previousNavigationUrl), 0);
        }
      };


const handleDeletePhotoInViewer = async (photoId) => {
        const currentIndex = processedPhotos.findIndex(p => p.id === photoId);
        let nextPhoto = null;
        
        if (processedPhotos.length > 1) {
          // Move to the next photo, or fallback to the previous if deleting the last photo in the list
          if (currentIndex < processedPhotos.length - 1) {
            nextPhoto = processedPhotos[currentIndex + 1];
          } else {
            nextPhoto = processedPhotos[currentIndex - 1];
          }
        }

        const photo = photos.find(p => p.id === photoId);
        if (photo) {
          // NEW: Attempt to delete the physical file from disk via File System Access API
          if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
            try { 
              await photo.fileHandle.remove(); 
            } catch (err) {
              console.warn('Could not delete physical file from disk:', err);
            }
          }
          
          try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
          try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
          try { if (photo.cropThumbnailUrl) URL.revokeObjectURL(photo.cropThumbnailUrl); } catch (e) {}
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        }
        
        updatePhotos(prev => prev.filter(p => p.id !== photoId));
        setSelectedPhoto(nextPhoto);
      };


      const handleSaveToVault = async (photoWithAi) => {
        if (!photoWithAi.identification) return;
        const idInfo = photoWithAi.identification;
        const { speciesName, scientificName, category } = idInfo;

        const cameraExif = photoWithAi.cameraExif || (photoWithAi.file ? await extractCameraExif(photoWithAi.file) : null);
        const captureTimestamp = cameraExif?.captureTimestamp || photoWithAi.lastModified || Date.now();
        const fpId = photoWithAi.fingerprintId || photoWithAi.id;
        const sightingId = 'sighting_' + Math.random().toString(36).substring(2, 9);
        const fileName = `${new Date().toISOString().split('T')[0]}_${sightingId}_v1.jpg`;

        let liveBlobUrl = photoWithAi.blobUrl || photoWithAi.thumbnailUrl || photoWithAi.url;
        let blobToWrite = photoWithAi.file;

        if (!blobToWrite && liveBlobUrl) {
          try {
            const res = await fetch(liveBlobUrl);
            blobToWrite = await res.blob();
          } catch (err) {
            console.warn('Could not fetch blob for vault write:', err);
          }
        }

        if (blobToWrite) {
          await writeOpfsSightingFile(category, speciesName, fileName, blobToWrite);
          if (blobToWrite instanceof Blob || blobToWrite instanceof File) {
            liveBlobUrl = URL.createObjectURL(blobToWrite);
          }
        }

        const sanitizeUrl = (u) => (u && typeof u === 'string' && !u.startsWith('blob:')) ? u : null;

        const initialVersion = {
          versionId: 'v1',
          label: 'v1: Original Capture',
          opfsFileName: fileName,
          timestamp: captureTimestamp,
          isOriginal: true,
          cropBox: photoWithAi.cropBox || null
        };

        const cleanPhotoMeta = {
          id: fpId,
          fingerprintId: fpId,
          file: null,
          name: photoWithAi.name,
          size: photoWithAi.size,
          lastModified: photoWithAi.lastModified,
          thumbnailUrl: sanitizeUrl(photoWithAi.thumbnailUrl),
          sharpness: photoWithAi.sharpness,
          sharpnessSource: photoWithAi.sharpnessSource,
          stars: photoWithAi.stars,
          userStars: photoWithAi.userStars,
          focusSpot: photoWithAi.focusSpot || cameraExif?.focusArea,
          cameraExif,
          identification: photoWithAi.identification,
          cropBox: photoWithAi.cropBox,
          locationText: photoWithAi.locationText,
          opfsFileName: fileName,
          activeVersionId: 'v1',
          versions: [initialVersion]
        };

        saveFingerprintMetadata(cleanPhotoMeta);

        const statePhotoMeta = {
          ...cleanPhotoMeta,
          thumbnailUrl: liveBlobUrl,
          blobUrl: liveBlobUrl,
          url: liveBlobUrl
        };

        const newSightingForState = {
          id: sightingId,
          date: captureTimestamp,
          opfsFileName: fileName,
          photoFingerprintId: fpId,
          activeVersionId: 'v1',
          versions: [initialVersion],
          photo: statePhotoMeta
        };

        const newSightingForStorage = {
          id: sightingId,
          date: captureTimestamp,
          opfsFileName: fileName,
          photoFingerprintId: fpId,
          activeVersionId: 'v1',
          versions: [initialVersion],
          photo: cleanPhotoMeta
        };

        const existingIdx = vaultEntries.findIndex(e => e.speciesName.toLowerCase() === speciesName.toLowerCase());

        let stateEntries = [...vaultEntries];
        let storageEntries = [...vaultEntries];

        if (existingIdx >= 0) {
          stateEntries[existingIdx] = {
            ...stateEntries[existingIdx],
            description: idInfo.description || stateEntries[existingIdx].description || '',
            habitat: idInfo.habitat || stateEntries[existingIdx].habitat || '',
            conservationStatus: idInfo.conservationStatus || stateEntries[existingIdx].conservationStatus || '',
            diet: idInfo.diet || stateEntries[existingIdx].diet || '',
            keyTraits: idInfo.keyTraits || stateEntries[existingIdx].keyTraits || '',
            sightings: [newSightingForState, ...stateEntries[existingIdx].sightings]
          };
          storageEntries[existingIdx] = {
            ...storageEntries[existingIdx],
            description: idInfo.description || storageEntries[existingIdx].description || '',
            habitat: idInfo.habitat || storageEntries[existingIdx].habitat || '',
            conservationStatus: idInfo.conservationStatus || storageEntries[existingIdx].conservationStatus || '',
            diet: idInfo.diet || storageEntries[existingIdx].diet || '',
            keyTraits: idInfo.keyTraits || storageEntries[existingIdx].keyTraits || '',
            sightings: [newSightingForStorage, ...storageEntries[existingIdx].sightings]
          };
        } else {
          const newSpeciesState = {
            speciesName,
            scientificName,
            category,
            description: idInfo.description || '',
            habitat: idInfo.habitat || '',
            conservationStatus: idInfo.conservationStatus || '',
            diet: idInfo.diet || '',
            keyTraits: idInfo.keyTraits || '',
            sightings: [newSightingForState]
          };
          const newSpeciesStorage = {
            speciesName,
            scientificName,
            category,
            description: idInfo.description || '',
            habitat: idInfo.habitat || '',
            conservationStatus: idInfo.conservationStatus || '',
            diet: idInfo.diet || '',
            keyTraits: idInfo.keyTraits || '',
            sightings: [newSightingForStorage]
          };
          stateEntries.unshift(newSpeciesState);
          storageEntries.unshift(newSpeciesStorage);
        }

        saveVaultToStorage(storageEntries);
        setVaultEntries(stateEntries);

        await writeOpfsSightingFile(category, speciesName, 'species_info.json', {
          speciesName,
          scientificName,
          category,
          description: idInfo.description || '',
          habitat: idInfo.habitat || '',
          conservationStatus: idInfo.conservationStatus || '',
          diet: idInfo.diet || '',
          keyTraits: idInfo.keyTraits || '',
          updatedAt: Date.now(),
          lastSighting: cleanPhotoMeta
        });

        updatePhotos(prev => prev.filter(p => p.id !== fpId && p.fingerprintId !== fpId));

        setSelectedPhoto(null);
        setSelectedPhotoVaultRef(null);
        setActiveTab('vault');
      };

      const handleCommitNewVersion = async (photo, enhancedBlob, versionMeta) => {
        const idInfo = photo.identification || {};
        const vaultPreviewRef = selectedPhotoVaultRef;
        const vaultEntry = vaultPreviewRef
          ? vaultEntries.find(entry => entry.speciesName.toLowerCase() === vaultPreviewRef.speciesName.toLowerCase())
          : null;
        const vaultSighting = vaultEntry?.sightings.find(sighting => sighting.id === vaultPreviewRef.sightingId);
        if (vaultPreviewRef && !vaultSighting) {
          throw new Error('The vault sighting could not be found. The enhanced version was not saved.');
        }

        const category = vaultEntry?.category || idInfo.category || 'Other';
        const speciesName = vaultEntry?.speciesName || idInfo.speciesName || 'Uncategorized';
        const verId = versionMeta.versionId;
        const sightingSuffix = vaultSighting ? `_${vaultSighting.id}` : '';
        const verFileName = `${new Date().toISOString().split('T')[0]}_${photo.id}_${verId}${sightingSuffix}.jpg`;

        if (!enhancedBlob) {
          throw new Error('The enhanced image is empty. No version was saved.');
        }
        const writeSucceeded = await writeOpfsSightingFile(category, speciesName, verFileName, enhancedBlob);
        if (!writeSucceeded) {
          throw new Error('Could not save the enhanced image to vault storage. The active version was not changed.');
        }

        const freshBlobUrl = URL.createObjectURL(enhancedBlob);
        const fullVerMeta = {
          ...versionMeta,
          opfsFileName: verFileName,
          blobUrl: freshBlobUrl,
          thumbnailUrl: freshBlobUrl
        };

        const captureTimestampForVersion = photo.cameraExif?.captureTimestamp || photo.lastModified || Date.now();
        const existingVersions = (photo.versions || [
          {
            versionId: 'v1',
            label: 'v1: Original Capture',
            opfsFileName: photo.opfsFileName || photo.name,
            timestamp: captureTimestampForVersion,
            isOriginal: true,
            cropBox: photo.cropBox || null,
            blobUrl: photo.blobUrl,
            thumbnailUrl: photo.thumbnailUrl
          }
        ]).map(version => (
          version.isOriginal && version.cropBox === undefined
            ? { ...version, cropBox: photo.cropBox || null }
            : version
        ));

        const ratedVersions = existingVersions.map(version => version.versionId === photo.activeVersionId
          ? {
            ...version,
            sharpness: photo.sharpness,
            sharpnessSource: photo.sharpnessSource,
            stars: photo.stars,
            userStars: photo.userStars
          }
          : version
        );
        const updatedVersions = [...ratedVersions, fullVerMeta];

        const updatedPhoto = {
          ...photo,
          opfsFileName: verFileName,
          blobUrl: freshBlobUrl,
          thumbnailUrl: freshBlobUrl,
          activeVersionId: verId,
          cropBox: versionMeta.cropBox,
          sharpness: versionMeta.sharpness,
          sharpnessSource: versionMeta.sharpnessSource,
          stars: versionMeta.stars,
          userStars: null,
          versions: updatedVersions
        };

        let updatedVault = null;
        if (vaultPreviewRef || idInfo.speciesName) {
          let updatedSightingFound = false;
          updatedVault = vaultEntries.map(entry => {
            const matchesSpecies = vaultPreviewRef
              ? entry.speciesName.toLowerCase() === vaultPreviewRef.speciesName.toLowerCase()
              : entry.speciesName.toLowerCase() === idInfo.speciesName.toLowerCase();
            if (matchesSpecies) {
              const updatedSightings = entry.sightings.map(s => {
                const matchesSighting = vaultPreviewRef
                  ? s.id === vaultPreviewRef.sightingId
                  : s.photoFingerprintId === photo.id || s.photo?.id === photo.id;
                if (matchesSighting) {
                  updatedSightingFound = true;
                  return {
                    ...s,
                    activeVersionId: verId,
                    opfsFileName: verFileName,
                    cropBox: versionMeta.cropBox,
                    versions: updatedVersions,
                    photo: {
                      ...s.photo,
                      opfsFileName: verFileName,
                      activeVersionId: verId,
                      cropBox: versionMeta.cropBox,
                      sharpness: versionMeta.sharpness,
                      sharpnessSource: versionMeta.sharpnessSource,
                      stars: versionMeta.stars,
                      userStars: null,
                      versions: updatedVersions
                    }
                  };
                }
                return s;
              });
              return { ...entry, sightings: updatedSightings };
            }
            return entry;
          });
          if (vaultPreviewRef && !updatedSightingFound) {
            URL.revokeObjectURL(freshBlobUrl);
            throw new Error('The vault sighting could not be updated. The enhanced image was saved, but its version was not activated.');
          }
        }

        updatePhotos(prev => prev.map(p => p.id === photo.id ? updatedPhoto : p));
        saveFingerprintMetadata(updatedPhoto);
        setSelectedPhoto(updatedPhoto);

        if (updatedVault) {
          saveVaultToStorage(updatedVault);
          setVaultEntries(updatedVault);
        }
      };

      const handleDeleteSpecies = (speciesName) => {
        const updated = vaultEntries.filter(e => e.speciesName.toLowerCase() !== speciesName.toLowerCase());
        setVaultEntries(updated);
        saveVaultToStorage(updated);
      };

      const handleDeleteSighting = (speciesName, sightingId) => {
        const updated = vaultEntries.map(e => {
          if (e.speciesName.toLowerCase() === speciesName.toLowerCase()) {
            return {
              ...e,
              sightings: e.sightings.filter(s => s.id !== sightingId)
            };
          }
          return e;
        }).filter(e => e.sightings.length > 0);

        setVaultEntries(updated);
        saveVaultToStorage(updated);
      };

      const handleDeletePhotoVersion = async (photo, versionId) => {
        const version = photo.versions?.find(item => item.versionId === versionId);
        if (!version || version.isOriginal) {
          throw new Error('Only processed versions can be deleted.');
        }
        if (!version.opfsFileName) {
          throw new Error('The processed version has no saved file reference.');
        }

        const remainingVersions = photo.versions.filter(item => item.versionId !== versionId);
        const activeVersion = remainingVersions.find(item => item.versionId === photo.activeVersionId)
          || remainingVersions.find(item => item.isOriginal)
          || remainingVersions[0];
        if (!activeVersion) {
          throw new Error('Cannot delete the processed version because no image version would remain.');
        }

        const vaultRef = selectedPhotoVaultRef;
        const vaultEntry = vaultRef
          ? vaultEntries.find(entry => entry.speciesName.toLowerCase() === vaultRef.speciesName.toLowerCase())
          : null;
        await deleteOpfsSightingFile(
          vaultEntry?.category || photo.identification?.category || 'Other',
          vaultEntry?.speciesName || photo.identification?.speciesName || 'Uncategorized',
          version.opfsFileName
        );

        const updatedPhoto = {
          ...photo,
          versions: remainingVersions,
          activeVersionId: activeVersion.versionId,
          opfsFileName: activeVersion.opfsFileName || photo.opfsFileName,
          cropBox: activeVersion.cropBox !== undefined ? activeVersion.cropBox : photo.cropBox
        };
        handleUpdateSelectedPhoto(updatedPhoto);
      };

      const handleUpdateSelectedPhoto = (updatedPhoto) => {
        updatePhotos(prev => prev.map(p => p.id === updatedPhoto.id ? updatedPhoto : p));
        setSelectedPhoto(updatedPhoto);
        saveFingerprintMetadata(updatedPhoto);

        if (!selectedPhotoVaultRef) return;

        const updatedVault = vaultEntries.map(entry => {
          if (entry.speciesName !== selectedPhotoVaultRef.speciesName) return entry;
          return {
            ...entry,
            sightings: entry.sightings.map(sighting => {
              if (sighting.id !== selectedPhotoVaultRef.sightingId) return sighting;
              return {
                ...sighting,
                cropBox: updatedPhoto.cropBox ?? null,
                activeVersionId: updatedPhoto.activeVersionId || sighting.activeVersionId,
                opfsFileName: updatedPhoto.opfsFileName || sighting.opfsFileName,
                versions: updatedPhoto.versions
                  ? updatedPhoto.versions.map(version => ({ ...version, blobUrl: null, thumbnailUrl: null }))
                  : sighting.versions,
                photo: {
                  ...sighting.photo,
                  focusSpot: updatedPhoto.focusSpot || updatedPhoto.cameraExif?.focusArea || sighting.photo?.focusSpot || null,
                  cameraExif: updatedPhoto.cameraExif || sighting.photo?.cameraExif || null,
                  stars: updatedPhoto.stars ?? sighting.photo?.stars ?? null,
                  userStars: updatedPhoto.userStars ?? sighting.photo?.userStars ?? null,
                  sharpness: updatedPhoto.sharpness ?? sighting.photo?.sharpness ?? null,
                  sharpnessSource: updatedPhoto.sharpnessSource ?? sighting.photo?.sharpnessSource ?? null,
                  cropBox: updatedPhoto.cropBox ?? null,
                  activeVersionId: updatedPhoto.activeVersionId || sighting.photo?.activeVersionId,
                  opfsFileName: updatedPhoto.opfsFileName || sighting.photo?.opfsFileName,
                  versions: updatedPhoto.versions
                    ? updatedPhoto.versions.map(version => ({ ...version, blobUrl: null, thumbnailUrl: null }))
                    : sighting.photo?.versions,
                  file: null,
                  fileHandle: undefined,
                  sourceDirectoryHandle: undefined,
                  blobUrl: null,
                  thumbnailUrl: null,
                  url: null
                }
              };
            })
          };
        });
        setVaultEntries(updatedVault);
        saveVaultToStorage(updatedVault);
      };

      return (
        <div className="flex-1 flex flex-col overflow-hidden h-full">
          <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-30">
            <div className="flex items-center space-x-2.5">
              <div className="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center overflow-hidden">
                <img src="./resourse/BirdVault_100px.png" alt="" className="w-full h-full object-contain" />
              </div>
              <div>
                <h1 className="font-extrabold text-white text-base leading-tight">BirdVault Pro</h1>
                <p className="text-[10px] text-slate-400">Wildlife Photography & Culling Assistant</p>
              </div>
            </div>

            <div className="relative" ref={headerMenuRef}>
              <input
                ref={vaultImportInputRef}
                type="file"
                accept=".zip,application/zip"
                onChange={handleImportVaultZip}
                className="hidden"
                aria-label="Select BirdVault backup archive"
              />
              <button
                type="button"
                onClick={() => setShowHeaderMenu(open => !open)}
                aria-label={
                  isRestoringVault ? 'Restoring vault backup' :
                  isExportingVault ? 'Exporting vault backup' :
                  showHeaderMenu ? 'Close app actions' : 'Open app actions'
                }
                aria-expanded={showHeaderMenu}
                aria-haspopup="menu"
                title="App actions"
                className="min-w-10 min-h-10 p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 transition flex items-center justify-center touch-manipulation"
              >
                <Icon
                  name={isRestoringVault ? 'upload' : isExportingVault ? 'download' : 'more'}
                  className={`w-5 h-5 ${isRestoringVault || isExportingVault ? 'animate-pulse text-emerald-400' : ''}`}
                />
              </button>
              {showHeaderMenu && (
                <div role="menu" className="absolute right-0 top-full mt-2 w-56 p-1.5 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50">
                  {activeTab === 'vault' && (
                    <>
                      <button
                        type="button"
                        role="menuitem"
                        onClick={() => {
                          setShowHeaderMenu(false);
                          handleExportVaultZip();
                        }}
                        disabled={isExportingVault || isRestoringVault || vaultEntries.length === 0}
                        className="w-full px-3 py-2.5 text-left text-sm text-slate-200 hover:bg-slate-800 rounded-lg flex items-center gap-2.5 disabled:opacity-50 touch-manipulation"
                      >
                        <Icon name="download" className={`w-4 h-4 text-emerald-400 ${isExportingVault ? 'animate-bounce' : ''}`} />
                        <span>{isExportingVault ? 'Packaging vault...' : 'Export Vault (.zip)'}</span>
                      </button>
                      <button
                        type="button"
                        role="menuitem"
                        onClick={() => {
                          setShowHeaderMenu(false);
                          vaultImportInputRef.current?.click();
                        }}
                        disabled={isRestoringVault || isExportingVault}
                        className="w-full px-3 py-2.5 text-left text-sm text-slate-200 hover:bg-slate-800 rounded-lg flex items-center gap-2.5 disabled:opacity-50 touch-manipulation"
                      >
                        <Icon name="upload" className={`w-4 h-4 text-emerald-400 ${isRestoringVault ? 'animate-pulse' : ''}`} />
                        <span>{isRestoringVault ? 'Restoring vault...' : 'Merge backup into vault'}</span>
                      </button>
                    </>
                  )}
                  <button
                    type="button"
                    role="menuitem"
                    onClick={() => {
                      setShowHeaderMenu(false);
                      setShowTokenModal(true);
                    }}
                    className="w-full px-3 py-2.5 text-left text-sm text-slate-200 hover:bg-slate-800 rounded-lg flex items-center gap-2.5 touch-manipulation"
                  >
                    <Icon name="bolt" className="w-4 h-4 text-emerald-400" />
                    <span>API quotas</span>
                  </button>
                  <button
                    type="button"
                    role="menuitem"
                    onClick={() => {
                      setShowHeaderMenu(false);
                      setShowAuthModal(true);
                    }}
                    className="w-full px-3 py-2.5 text-left text-sm text-slate-200 hover:bg-slate-800 rounded-lg flex items-center gap-2.5 touch-manipulation"
                  >
                    <Icon name="key" className={`w-4 h-4 ${userApiKey ? 'text-emerald-400' : 'text-amber-400'}`} />
                    <span>{userApiKey ? 'API key settings' : 'Set Gemini API key'}</span>
                  </button>
                </div>
              )}
            </div>
          </header>

          <div className="bg-slate-900/60 border-b border-slate-800 px-4 py-1.5 flex items-center justify-center space-x-2 z-20">
            <button
              onClick={() => setActiveTab('vault')}
              className={`px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 touch-manipulation ${
                activeTab === 'vault' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="feather" className="w-4 h-4" />
              <span>Lifer Vault ({vaultEntries.length})</span>
            </button>

            <button
              onClick={() => setActiveTab('culling')}
              className={`px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 touch-manipulation ${
                activeTab === 'culling' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="camera" className="w-4 h-4" />
              <span>Culling Workspace ({photos.length})</span>
            </button>
          </div>

          <div className="flex-1 flex flex-col overflow-hidden relative">
            {activeTab === 'vault' ? (
              <LiferVaultView
                vaultEntries={vaultEntries}
                photos={photos}
                onDeleteSighting={handleDeleteSighting}
                onDeleteSpecies={handleDeleteSpecies}
                onSelectPhoto={(photo, vaultRef, navigationItems) => {
                  setSelectedPhoto(photo);
                  setSelectedPhotoVaultRef(vaultRef);
                  setSelectedPhotoVaultItems(navigationItems || []);
                }}
              />
            ) : (
              <CullingWorkspaceView
                photos={photos}
                onUpdatePhotos={updatePhotos}
                onSelectPhoto={(photo) => {
                  setSelectedPhoto(photo);
                  setSelectedPhotoVaultRef(null);
                  setSelectedPhotoVaultItems([]);
                }}
                userApiKey={userApiKey}
                filterSharpness={filterSharpness}
                setFilterSharpness={setFilterSharpness}
                sortBy={sortBy}
                setSortBy={setSortBy}
                currentPage={currentPage}
                setCurrentPage={setCurrentPage}
                processedPhotos={processedPhotos}
                isPreviewOpen={!!selectedPhoto}
                onClosePhotoPreview={() => {
                  if (selectedPhotoVaultRef) return;
                  setSelectedPhoto(null);
                  setSelectedPhotoVaultItems([]);
                }}
              />
            )}
          </div>

          {selectedPhoto && (() => {
            const selectedIndex = processedPhotos.findIndex(p => p.id === selectedPhoto.id);
            const isVaultPreview = !!selectedPhotoVaultRef;
            const hasPrev = isVaultPreview
              ? vaultSelectedIndex > 0
              : selectedIndex > 0;
            const hasNext = isVaultPreview
              ? vaultSelectedIndex >= 0 && vaultSelectedIndex < selectedPhotoVaultItems.length - 1
              : selectedIndex >= 0 && selectedIndex < processedPhotos.length - 1;

            return (
              <InteractivePhotoViewer
                key={isVaultPreview ? `vault-${selectedPhotoVaultRef.speciesName}-${selectedPhotoVaultRef.sightingId}` : selectedPhoto.id}
                photo={selectedPhoto}
                onClose={() => {
                  setSelectedPhoto(null);
                  setSelectedPhotoVaultRef(null);
                  setSelectedPhotoVaultItems([]);
                  if (vaultNavigationUrlRef.current) {
                    URL.revokeObjectURL(vaultNavigationUrlRef.current);
                    vaultNavigationUrlRef.current = null;
                  }
                }}
                onUpdatePhoto={handleUpdateSelectedPhoto}
                onSaveToVault={handleSaveToVault}
                onDeletePhoto={handleDeletePhotoInViewer}
                onDeleteVersion={handleDeletePhotoVersion}
                userApiKey={userApiKey}
                initialLocation={userLocation}
                vaultSpeciesName={isVaultPreview ? selectedPhotoVaultRef.speciesName : null}
                isVaultPreview={isVaultPreview}
                onUpdateLocation={setUserLocation}
                onNextPhoto={() => {
                  if (!hasNext) return;
                  if (isVaultPreview) {
                    void openVaultNavigationItem(vaultSelectedIndex + 1);
                    return;
                  }
                  setSelectedPhoto(processedPhotos[selectedIndex + 1]);
                  setSelectedPhotoVaultRef(null);
                }}
                onPrevPhoto={() => {
                  if (!hasPrev) return;
                  if (isVaultPreview) {
                    void openVaultNavigationItem(vaultSelectedIndex - 1);
                    return;
                  }
                  setSelectedPhoto(processedPhotos[selectedIndex - 1]);
                  setSelectedPhotoVaultRef(null);
                }}
                hasNext={hasNext}
                hasPrev={hasPrev}
                vaultEntries={vaultEntries}
                onCommitNewVersion={handleCommitNewVersion}
              />
            );
          })()}

          <TokenUsageMonitorModal
            isOpen={showTokenModal}
            onClose={() => setShowTokenModal(false)}
          />

          <GoogleAuthModal
            isOpen={showAuthModal}
            onClose={() => setShowAuthModal(false)}
            apiKey={userApiKey}
            onSaveKey={handleSaveApiKey}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BirdVaultApp />);
  </script>
</body>
</html>
