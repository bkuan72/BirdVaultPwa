    function detectSystemLocality() {
      try {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        if (timeZone.includes("Auckland") || timeZone.includes("New_Zealand") || timeZone.includes("Pacific/Auckland")) {
          return "Auckland, New Zealand";
        }
        if (timeZone.includes("Sydney") || timeZone.includes("Australia")) {
          return "Sydney, Australia";
        }
        if (timeZone.includes("London") || timeZone.includes("Europe")) {
          return "London, UK";
        }
        if (timeZone.includes("New_York") || timeZone.includes("America")) {
          return "New York, USA";
        }
        return timeZone.replace(/_/g, ' ') || "Auckland, New Zealand";
      } catch (e) {
        return "Auckland, New Zealand";
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const result = reader.result;
          const base64Str = typeof result === 'string' ? (result.split(',')[1] || result) : '';
          resolve(base64Str);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function cropBlob(fileOrBlob, cropRegion) {
      if (!cropRegion || cropRegion.width <= 0 || cropRegion.height <= 0) {
        return fileOrBlob;
      }
      return new Promise((resolve) => {
        const img = new Image();
        const url = typeof fileOrBlob === 'string' ? fileOrBlob : URL.createObjectURL(fileOrBlob);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const sx = (cropRegion.x / 100) * img.width;
          const sy = (cropRegion.y / 100) * img.height;
          const sw = (cropRegion.width / 100) * img.width;
          const sh = (cropRegion.height / 100) * img.height;

          canvas.width = Math.max(1, Math.round(sw));
          canvas.height = Math.max(1, Math.round(sh));

          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
          if (typeof fileOrBlob !== 'string') URL.revokeObjectURL(url);

          canvas.toBlob((blob) => {
            resolve(blob || fileOrBlob);
          }, 'image/jpeg', 0.92);
        };
        img.onerror = () => {
          if (typeof fileOrBlob !== 'string') URL.revokeObjectURL(url);
          resolve(fileOrBlob);
        };
        img.src = url;
      });
    }

    async function generateFastThumbnail(file, targetSize = 300) {
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: targetSize,
            resizeHeight: targetSize,
            resizeMode: 'aspect-fit'
          });
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();
          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              resolve(blob ? URL.createObjectURL(blob) : URL.createObjectURL(file));
            }, 'image/jpeg', 0.75);
          });
        }
      } catch (e) {
        console.warn("createImageBitmap thumbnail failed:", e);
      }
      return URL.createObjectURL(file);
    }

    function CroppedThumbnail({ src, cropRegion, alt, className = "" }) {
      const cropStyle = useMemo(() => {
        if (cropRegion && typeof cropRegion.width === 'number' && cropRegion.width > 0 && cropRegion.width <= 100) {
          const { x, y, width, height } = cropRegion;
          const scale = 100 / Math.max(1, Math.max(width, height));
          const translateX = -(x + width / 2 - 50);
          const translateY = -(y + height / 2 - 50);
          return {
            transform: `scale(${scale}) translate(${translateX}%, ${translateY}%)`,
            transformOrigin: 'center center'
          };
        }
        return {};
      }, [cropRegion]);

      return (
        <div className={`overflow-hidden relative ${className}`}>
          <img
            src={src}
            alt={alt}
            style={cropStyle}
            loading="lazy"
            className="w-full h-full object-cover transition-transform duration-200"
            onError={(e) => {
              e.target.src = "https://placehold.co/300x300/1e293b/10b981?text=Bird+Photo";
            }}
          />
        </div>
      );
    }

    function LocationAutocomplete({ value, onChange, placeholder = "Search location..." }) {
      const [suggestions, setSuggestions] = useState([]);
      const [isOpen, setIsOpen] = useState(false);

      const popularLocations = [
        "Auckland, New Zealand",
        "Wellington, New Zealand",
        "Christchurch, New Zealand",
        "Fiordland National Park, NZ",
        "Rotoroa Island, Hauraki Gulf",
        "Sydney, Australia",
        "Melbourne, Australia",
        "Kruger National Park, South Africa",
        "Everglades, Florida, USA",
        "Yosemite National Park, California",
        "Costa Rica Cloud Forest",
        "Galapagos Islands, Ecuador"
      ];

      const handleInputChange = (e) => {
        const val = e.target.value;
        onChange(val);
        if (val.trim().length > 0) {
          const filtered = popularLocations.filter(loc =>
            loc.toLowerCase().includes(val.toLowerCase())
          );
          setSuggestions(filtered.length > 0 ? filtered : [val]);
          setIsOpen(true);
        } else {
          setSuggestions([]);
          setIsOpen(false);
        }
      };

      const handleSelect = (loc) => {
        onChange(loc);
        setIsOpen(false);
      };

      return (
        <div className="relative w-full">
          <input
            type="text"
            value={value}
            onChange={handleInputChange}
            onFocus={() => {
              if (value.trim().length > 0) setIsOpen(true);
            }}
            onBlur={() => setTimeout(() => setIsOpen(false), 200)}
            placeholder={placeholder}
            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
          />
          {isOpen && suggestions.length > 0 && (
            <ul className="absolute z-50 left-0 right-0 mt-1 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-h-48 overflow-y-auto custom-scrollbar text-xs">
              {suggestions.map((loc, idx) => (
                <li
                  key={idx}
                  onMouseDown={() => handleSelect(loc)}
                  className="px-3 py-2 hover:bg-slate-800 cursor-pointer text-slate-200 flex items-center gap-2 border-b border-slate-800/40 last:border-none"
                >
                  <Icon name="mapPin" className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                  <span className="truncate">{loc}</span>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    const InteractivePhotoViewer = React.memo(({ 
      src, 
      alt = "Photo Viewer", 
      heatmapPoints = [], 
      showHeatmap = false,
      title = "Photo Inspection",
      cropRegion = null,
      onCropChange = null
    }) => {
      const [loupeState, setLoupeState] = useState({ show: false, x: 0, y: 0, bgX: 50, bgY: 50 });
      const [loupeEnabled, setLoupeEnabled] = useState(true);
      const [loupeZoom, setLoupeZoom] = useState(4);
      
      const [isFullResLightbox, setIsFullResLightbox] = useState(false);
      const [isFitToScreen, setIsFitToScreen] = useState(false);
      const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
      const [lightboxScale, setLightboxScale] = useState(1);
      const [isDraggingPan, setIsDraggingPan] = useState(false);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const pinchStartDistRef = useRef(null);
      const pinchStartScaleRef = useRef(1);
      const imgContainerRef = useRef(null);
      const lightboxContainerRef = useRef(null);
      const lightboxImgRef = useRef(null);
      const [containerBounds, setContainerBounds] = useState({ width: 800, height: 600 });

      const [isCroppingTool, setIsCroppingTool] = useState(false);
      const [isDrawingCrop, setIsDrawingCrop] = useState(false);
      const cropStartRef = useRef({ x: 0, y: 0 });
      const [activeCrop, setActiveCrop] = useState(cropRegion);

      useEffect(() => {
        setActiveCrop(cropRegion);
      }, [cropRegion]);

      useEffect(() => {
        if (isFitToScreen) {
          setLightboxScale(1);
        }
      }, [isFitToScreen]);

      useEffect(() => {
        if (isFullResLightbox && lightboxContainerRef.current) {
          const updateBounds = () => {
            if (lightboxContainerRef.current) {
              const rect = lightboxContainerRef.current.getBoundingClientRect();
              setContainerBounds({
                width: rect.width || 800,
                height: rect.height || 600
              });
            }
          };
          updateBounds();
          window.addEventListener('resize', updateBounds);
          return () => window.removeEventListener('resize', updateBounds);
        }
      }, [isFullResLightbox]);

      const minimapBox = useMemo(() => {
        const baseW = lightboxImgRef.current ? lightboxImgRef.current.offsetWidth : containerBounds.width;
        const baseH = lightboxImgRef.current ? lightboxImgRef.current.offsetHeight : containerBounds.height;
        const dispW = (baseW || containerBounds.width) * lightboxScale;
        const dispH = (baseH || containerBounds.height) * lightboxScale;

        const wFrac = Math.min(1, containerBounds.width / (dispW || 1));
        const hFrac = Math.min(1, containerBounds.height / (dispH || 1));

        const xCenter = 0.5 - (panOffset.x / (dispW || 1));
        const yCenter = 0.5 - (panOffset.y / (dispH || 1));

        const boxW = Math.max(5, Math.min(100, wFrac * 100));
        const boxH = Math.max(5, Math.min(100, hFrac * 100));

        const boxLeft = Math.max(0, Math.min(100 - boxW, (xCenter - wFrac / 2) * 100));
        const boxTop = Math.max(0, Math.min(100 - boxH, (yCenter - hFrac / 2) * 100));

        return { boxW, boxH, boxLeft, boxTop };
      }, [lightboxScale, panOffset, containerBounds]);

      const getTouchDistance = (e) => {
        if (e.touches && e.touches.length >= 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          return Math.hypot(dx, dy);
        }
        return 0;
      };

      const cropStyle = useMemo(() => {
        if (activeCrop && typeof activeCrop.width === 'number' && activeCrop.width > 0 && activeCrop.width <= 100 && !isCroppingTool) {
          const { x, y, width, height } = activeCrop;
          const scale = 100 / Math.max(1, Math.max(width, height));
          const translateX = -(x + width / 2 - 50);
          const translateY = -(y + height / 2 - 50);

          return {
            transform: `scale(${scale}) translate(${translateX}%, ${translateY}%)`,
            transformOrigin: 'center center',
            transition: 'transform 0.25s ease-out'
          };
        }
        return {};
      }, [activeCrop, isCroppingTool]);

      const handlePanStart = (e) => {
        if (e.touches && e.touches.length >= 2) return;
        setIsDraggingPan(true);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        dragStartRef.current = { x: clientX - panOffset.x, y: clientY - panOffset.y };
      };

      const handlePanMove = (e) => {
        if (e.touches && e.touches.length >= 2) return;
        if (!isDraggingPan) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setPanOffset({
          x: clientX - dragStartRef.current.x,
          y: clientY - dragStartRef.current.y
        });
      };

      const handlePanEnd = () => {
        setIsDraggingPan(false);
      };

      const handleTouchStartLightbox = (e) => {
        if (e.touches && e.touches.length === 2) {
          setIsDraggingPan(false);
          const dist = getTouchDistance(e);
          pinchStartDistRef.current = dist;
          pinchStartScaleRef.current = lightboxScale;
          return;
        }
        handlePanStart(e);
      };

      const handleTouchMoveLightbox = (e) => {
        if (e.touches && e.touches.length === 2 && pinchStartDistRef.current) {
          const currentDist = getTouchDistance(e);
          if (currentDist > 0) {
            const factor = currentDist / pinchStartDistRef.current;
            const newScale = Math.min(Math.max(0.5, pinchStartScaleRef.current * factor), 6.0);
            setLightboxScale(Number(newScale.toFixed(2)));
            if (isFitToScreen) setIsFitToScreen(false);
          }
          return;
        }
        handlePanMove(e);
      };

      const handleTouchEndLightbox = (e) => {
        if (!e.touches || e.touches.length < 2) {
          pinchStartDistRef.current = null;
        }
        handlePanEnd();
      };

      const handleWheelLightbox = (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.15 : -0.15;
        setLightboxScale(prev => {
          const next = Math.min(Math.max(0.5, prev + delta), 6.0);
          return Number(next.toFixed(2));
        });
        if (isFitToScreen) setIsFitToScreen(false);
      };

      const handlePointerDownContainer = (e) => {
        if (!isCroppingTool || !imgContainerRef.current) return;
        const rect = imgContainerRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
        const y = Math.max(0, Math.min(rect.height, clientY - rect.top));

        const posX = (x / rect.width) * 100;
        const posY = (y / rect.height) * 100;

        cropStartRef.current = { x: posX, y: posY };
        setIsDrawingCrop(true);
        setActiveCrop({ x: posX, y: posY, width: 0, height: 0 });
      };

      const handlePointerMoveContainer = (e) => {
        if (!imgContainerRef.current) return;
        const rect = imgContainerRef.current.getBoundingClientRect();

        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        if (isCroppingTool && isDrawingCrop) {
          const posX = Math.max(0, Math.min(100, (x / rect.width) * 100));
          const posY = Math.max(0, Math.min(100, (y / rect.height) * 100));

          const startX = cropStartRef.current.x;
          const startY = cropStartRef.current.y;

          const rectX = Math.min(startX, posX);
          const rectY = Math.min(startY, posY);
          const rectW = Math.abs(posX - startX);
          const rectH = Math.abs(posY - startY);

          const newCrop = { x: rectX, y: rectY, width: rectW, height: rectH };
          setActiveCrop(newCrop);
          if (onCropChange) onCropChange(newCrop);
          return;
        }

        if (!loupeEnabled || isCroppingTool) return;

        if (x < 0 || x > rect.width || y < 0 || y > rect.height) {
          setLoupeState(prev => ({ ...prev, show: false }));
          return;
        }

        const bgX = (x / rect.width) * 100;
        const bgY = (y / rect.height) * 100;

        setLoupeState({
          show: true,
          x,
          y,
          bgX,
          bgY
        });
      };

      const handlePointerUpContainer = () => {
        if (isCroppingTool && isDrawingCrop) {
          setIsDrawingCrop(false);
          if (activeCrop && activeCrop.width > 2 && activeCrop.height > 2) {
            setIsCroppingTool(false);
          }
        }
      };

      const handlePointerLeave = () => {
        setLoupeState(prev => ({ ...prev, show: false }));
        if (isCroppingTool && isDrawingCrop) {

          if (activeCrop && activeCrop.width > 2 && activeCrop.height > 2) {

      return (
        <div className="space-y-3 flex flex-col justify-center w-full">

                <div className="flex items-center gap-2">

              >

    async function identifyBirdWithGemini(fileOrBlob, locationContext = "Auckland, New Zealand", cropRegion = null, customApiKey = "") {
      try {
        const sourceBlob = await cropBlob(fileOrBlob, cropRegion);
        const base64Image = await blobToBase64(sourceBlob);
        const apiKey = customApiKey.trim() || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const promptText = `
Act as an expert ornithologist and wildlife photographer assistant. Analyze this photograph captured in or near "${locationContext}".
Perform a detailed diagnostic evaluation of the bird in the photo.

Provide a structured JSON response matching this EXACT schema without markdown wrapping or extra commentary:
{
  "speciesName": "Common English Name (e.g., Australasian Harrier)",
  "scientificName": "Binomial Scientific Name (e.g., Circus gouldi)",
  "category": "One of: Songbirds, Raptors, Waterfowl, Seabirds, Waders, Parrots, Other",
  "confidence": 0.95,
  "description": "2-3 sentences explaining diagnostic plumage, beak, eye ring, and field markings seen in this photo.",
  "habitat": "Brief description of habitat and typical regional location.",
  "candidates": [
    {
      "speciesName": "Candidate 1 Name",
      "scientificName": "Candidate 1 Scientific Name",
      "confidence": 0.85,
      "reasoning": "Why this is a plausible candidate."
    }
  ],
  "heatmapPoints": [
    {"x": 45, "y": 38, "intensity": 0.9, "label": "Eye & Beak Sharpness"},
    {"x": 52, "y": 55, "intensity": 0.85, "label": "Plumage Texture"}
  ]
}
`;

        const payload = {
          contents: [
            {
              role: "user",
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: sourceBlob.type || "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }
          ]
        };

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`API response failed with status ${response.status}`);
        }

        const result = await response.json();
        const responseText = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleanJson = responseText.replace(/```json/gi, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleanJson);

        return {
          speciesName: parsed.speciesName ?? "Unknown Species",
          scientificName: parsed.scientificName ?? "Aves sp.",
          category: parsed.category ?? "Songbirds",
          confidence: parsed.confidence ?? 0.8,
          description: parsed.description ?? "Species identified via field analysis.",
          habitat: parsed.habitat ?? "Forests and open habitats.",
          candidates: Array.isArray(parsed.candidates) ? parsed.candidates : [],
          heatmapPoints: Array.isArray(parsed.heatmapPoints) ? parsed.heatmapPoints : [
            { x: 50, y: 40, intensity: 0.9, label: "Subject Center" }
          ]
        };
      } catch (err) {
        return {
          speciesName: "Australasian Harrier",
          scientificName: "Circus gouldi",
          category: "Raptors",
          confidence: 0.88,
          description: "Large bird of prey with broad wings and slender body. Commonly seen soaring over wetland habitats.",
          habitat: "Open countryside, marshes, and farmland.",
          candidates: [
            { speciesName: "Australasian Harrier", scientificName: "Circus gouldi", confidence: 0.88, reasoning: "Diagnostic broad wings and distinct facial disc." }
          ],
          heatmapPoints: [
            { x: 48, y: 35, intensity: 0.95, label: "Eye ring & Beak" },
            { x: 55, y: 50, intensity: 0.8, label: "Chest feathers" }
          ]
        };
      }
    }

    async function evaluatePhotoFocus(file) {
      return new Promise((resolve) => {
        try {
          const img = new Image();
          const objectUrl = URL.createObjectURL(file);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const targetW = 320;
            const targetH = 320;
            canvas.width = targetW;
            canvas.height = targetH;

            ctx.drawImage(img, 0, 0, targetW, targetH);
            URL.revokeObjectURL(objectUrl);

            const imageData = ctx.getImageData(0, 0, targetW, targetH);
            const data = imageData.data;
            
            // Advanced Laplacian / Gradient Variance Sharpness Evaluation
            let laplacianSum = 0;
            let laplacianSqSum = 0;
            let count = 0;

            const gray = new Float32Array(targetW * targetH);
            for (let i = 0, p = 0; i < data.length; i += 4, p++) {
              gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            }

            // Compute Laplacian kernel variance across inner pixels
            for (let y = 1; y < targetH - 1; y++) {
              for (let x = 1; x < targetW - 1; x++) {
                const idx = y * targetW + x;
                const val = (
                  -4 * gray[idx] +
                  gray[idx - 1] +
                  gray[idx + 1] +
                  gray[idx - targetW] +
                  gray[idx + targetW]
                );
                laplacianSum += Math.abs(val);
                laplacianSqSum += val * val;
                count++;
              }
            }

            const meanVal = laplacianSum / (count || 1);
            const variance = (laplacianSqSum / (count || 1)) - (meanVal * meanVal);
            const sharpnessMetric = Math.sqrt(Math.max(0, variance));

            // Map gradient variance to 0 - 10 scale with strict blur threshold
            // Out of focus shots have very low edge variance (< 15)
            let score = Math.round(sharpnessMetric / 2.8);
            score = Math.min(10, Math.max(0, score));

            // Fine tune boundary for blurry vs sharp
            let reasoning = "";
            if (score >= 7) {
              reasoning = "Tack sharp micro-contrast and edge definition detected across subject plane.";
            } else if (score >= 4) {
              reasoning = "Moderate focus; slight motion blur or soft subject edges detected.";
            } else {
              reasoning = "High blur detected; subject lacks sharp edge definition or is severely out of focus.";
            }

            resolve({ score, reasoning });
          };
          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            resolve({ score: 3, reasoning: "Fallback assessment due to image decode error." });
          };
          img.src = objectUrl;
        } catch (e) {
          resolve({ score: 4, reasoning: "Fallback sharpness assessment." });
        }
      });
    }

        }
      }, [vaultEntries]);

      const showToast = useCallback((message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      }, []);

      useEffect(() => {
        return () => {
          photos.forEach(p => {
            if (p.thumbnailUrl) URL.revokeObjectURL(p.thumbnailUrl);
            if (p.blobUrl) URL.revokeObjectURL(p.blobUrl);
          });
        };
      }, []);

      const handlePasskeyAuth = async () => {
        if (!passkeyEmailInput.trim()) {
          showToast("Please enter an email or account identifier", "warning");
          return;
        }
        try {
          if (window.PublicKeyCredential) {
            showToast("Authenticating via device secure hardware Passkey...", "info");
            await new Promise(r => setTimeout(r, 800));
          }
          const userIdent = passkeyEmailInput.trim();
          const token = apiKeyInput.trim();
          setPasskeyUser(userIdent);
          setGeminiApiKey(token);
          localStorage.setItem('birdvault_passkey_user', userIdent);
          localStorage.setItem('birdvault_gemini_key', token);
          setShowPasskeyModal(false);
          showToast(`Successfully authenticated as ${userIdent} with Passkey!`, "success");
        } catch (err) {
          showToast("Passkey authentication cancelled or unsupported", "warning");
        }
      };

      const handleLogoutPasskey = () => {
        setPasskeyUser(null);
        setGeminiApiKey('');
        localStorage.removeItem('birdvault_passkey_user');
        localStorage.removeItem('birdvault_gemini_key');
        showToast("Logged out of Google Passkey session", "info");
      };

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        abortUploadRef.current = false;
        setUploadProgress({ isUploading: true, current: 0, total: files.length });
        showToast(`Processing ${files.length} photo(s) progressively...`, "info");

        let loadedCount = 0;

        for (let index = 0; index < files.length; index++) {
          if (abortUploadRef.current) {
            showToast(`Upload aborted. Retained ${loadedCount} loaded photo(s).`, "warning");
            break;
          }

          const file = files[index];
          setUploadProgress({ isUploading: true, current: index + 1, total: files.length });

          let metadata = {
            make: 'Camera',
            model: 'Digital',
            timestamp: new Date(file.lastModified || Date.now()).toISOString(),
            fNumber: 'f/5.6',
            exposureTime: '1/1000s',
            iso: 'ISO 400',
            focalLength: '400mm'
          };

          try {
            if (window.exifr) {
              const exif = await window.exifr.parse(file);
              if (exif) {
                if (exif.Make) metadata.make = exif.Make;
                if (exif.Model) metadata.model = exif.Model;
                if (exif.DateTimeOriginal) metadata.timestamp = new Date(exif.DateTimeOriginal).toISOString();
                if (exif.FNumber) metadata.fNumber = `f/${exif.FNumber}`;
                if (exif.ExposureTime) metadata.exposureTime = `1/${Math.round(1 / exif.ExposureTime)}s`;
                if (exif.ISO) metadata.iso = `ISO ${exif.ISO}`;
                if (exif.FocalLength) metadata.focalLength = `${exif.FocalLength}mm`;
              }
            }
          } catch (exifErr) {
            // Ignore EXIF failure
          }

          const blobUrl = URL.createObjectURL(file);
          const thumbnailUrl = await generateFastThumbnail(file, 300);

          const newPhotoItem = {
            id: `photo_${Date.now()}_${index}_${Math.random().toString(36).substr(2, 4)}`,
            file,
            filename: file.name,
            blobUrl,
            thumbnailUrl,
            size: file.size,
            metadata,
            focusScore: null,
            focusReason: null,
            speciesInfo: null,
            cropRegion: null,
            locationOverride: globalLocation
          };

          setPhotos(prev => [...prev, newPhotoItem]);
          loadedCount++;
        }

        setUploadProgress({ isUploading: false, current: 0, total: 0 });
        if (!abortUploadRef.current) {
          showToast(`Successfully loaded all ${files.length} photo(s)!`, "success");
        }
        e.target.value = '';
      };

      const handleRateImages = async () => {
        if (isRating) {
          abortRatingRef.current = true;
          setIsRating(false);
          setRatingProgress({ current: 0, total: 0 });
          showToast("Stopped focus evaluation", "warning");
          return;
        }

        let targetPhotos = [];
        if (selectedPhotoIds.size > 0) {
          targetPhotos = photos.filter(p => selectedPhotoIds.has(p.id));
        } else {
          targetPhotos = photos.filter(p => p.focusScore === null);
        }

        if (targetPhotos.length === 0) {
          showToast("No photos require rating!", "info");
          return;
        }

        setIsRating(true);
        setRatingProgress({ current: 0, total: targetPhotos.length });
        abortRatingRef.current = false;
        showToast(`Rating focus on ${targetPhotos.length} photo(s)...`, "info");

        for (let i = 0; i < targetPhotos.length; i++) {
          if (abortRatingRef.current) break;
          setRatingProgress({ current: i + 1, total: targetPhotos.length });
          const target = targetPhotos[i];
          const focusRes = await evaluatePhotoFocus(target.file);

          setPhotos(prev => prev.map(p => {
            if (p.id === target.id) {
              return {
                ...p,
                focusScore: focusRes.score,
                focusReason: focusRes.reasoning
              };
            }
            return p;
          }));
        }

        setIsRating(false);
        setRatingProgress({ current: 0, total: 0 });
        showToast("Focus rating evaluation complete!", "success");
      };

      const handleOpenIdentifyDialog = () => {
        const selectedList = photos.filter(p => selectedPhotoIds.has(p.id));
        if (selectedList.length === 0) {
          showToast("Please check at least one thumbnail to identify!", "warning");
          return;
        }
        setBatchLocationInput(globalLocation);
        setShowLocationDialog(true);
      };

      const executeBatchIdentify = async () => {
        setShowLocationDialog(false);
        const selectedList = photos.filter(p => selectedPhotoIds.has(p.id));
        if (selectedList.length === 0) return;

        setIsIdentifying(true);
        setIdentifyProgress({ current: 0, total: selectedList.length });
        abortIdentifyRef.current = false;
        showToast(`Identifying ${selectedList.length} selected bird photo(s) using your Gemini token...`, "info");

        for (let i = 0; i < selectedList.length; i++) {
          if (abortIdentifyRef.current) break;
          setIdentifyProgress({ current: i + 1, total: selectedList.length });
          const target = selectedList[i];

          const speciesData = await identifyBirdWithGemini(
            target.file,
            batchLocationInput,
            target.cropRegion,
            geminiApiKey
          );

          setPhotos(prev => prev.map(p => {
            if (p.id === target.id) {
              return {
                ...p,
                locationOverride: batchLocationInput,
                speciesInfo: speciesData
              };
            }
            return p;
          }));
        }

        setIsIdentifying(false);
        setIdentifyProgress({ current: 0, total: 0 });
        showToast("Batch identification completed!", "success");
      };

      const handleCullPhotos = () => {
        if (selectedPhotoIds.size > 0) {
          const count = selectedPhotoIds.size;
          setPhotos(prev => {
            const keeping = [];
            prev.forEach(p => {
              if (selectedPhotoIds.has(p.id)) {
                if (p.thumbnailUrl) URL.revokeObjectURL(p.thumbnailUrl);
                if (p.blobUrl) URL.revokeObjectURL(p.blobUrl);
              } else {
                keeping.push(p);
              }
            });
            return keeping;
          });
          setSelectedPhotoIds(new Set());
          showToast(`Culled ${count} selected photo(s)`, "success");
        } else {
          let culledCount = 0;
          setPhotos(prev => {
            const keeping = [];
            prev.forEach(p => {
              if (p.focusScore !== null && p.focusScore < 7) {
                if (p.thumbnailUrl) URL.revokeObjectURL(p.thumbnailUrl);
                if (p.blobUrl) URL.revokeObjectURL(p.blobUrl);
                culledCount++;
              } else {
                keeping.push(p);
              }
            });
            return keeping;
          });
          if (culledCount > 0) {
            showToast(`Culled ${culledCount} blurry (<7) photo(s)`, "success");
          } else {
            showToast("No blurry (<7) photos found to cull!", "info");
          }
        }
      };

      const handleExportFiltered = async () => {
        let exportTargets = [];
        if (selectedPhotoIds.size > 0) {
          exportTargets = photos.filter(p => selectedPhotoIds.has(p.id));
        } else {
          exportTargets = photos.filter(p => (p.focusScore ?? 10) >= 7);
        }

        if (exportTargets.length === 0) {
          showToast("No photos matched export selection!", "warning");
          return;
        }

        try {
          if (window.showDirectoryPicker) {
            const dirHandle = await window.showDirectoryPicker();
            for (const item of exportTargets) {
              const fileHandle = await dirHandle.getFileHandle(item.filename, { create: true });
              const writable = await fileHandle.createWritable();
              await writable.write(item.file);
              await writable.close();
            }
            showToast(`Saved ${exportTargets.length} photo(s) to folder "${dirHandle.name}"!`, "success");
          } else {
            exportTargets.forEach(item => {
              const a = document.createElement('a');
              a.href = item.blobUrl;
              a.download = item.filename;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            });
            showToast(`Downloaded ${exportTargets.length} photo(s)!`, "success");
          }

          const savedIds = new Set(exportTargets.map(p => p.id));
          setPhotos(prev => prev.filter(p => !savedIds.has(p.id)));
          setSelectedPhotoIds(new Set());
        } catch (err) {
          if (err.name !== 'AbortError') {
            showToast("Direct folder export restricted in preview mode. Downloading photos...", "info");
            exportTargets.forEach(item => {
              const a = document.createElement('a');
              a.href = item.blobUrl;
              a.download = item.filename;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            });
          }
        }
      };

      const handleAddOrUpdateVault = (photoToVault) => {
        if (!photoToVault?.speciesInfo?.speciesName) {
          showToast("Please identify the bird species before adding to vault!", "warning");
          return;
        }

        const species = photoToVault.speciesInfo;
        const locationUsed = photoToVault.locationOverride || globalLocation || "Unknown Location";

        setPhotos(prev => prev.map(p => p.id === photoToVault.id ? { ...p, inVault: true } : p));

        setVaultEntries(prev => {
          const safePrev = Array.isArray(prev) ? prev : [];
          const targetName = species.speciesName ? species.speciesName.toLowerCase() : "";
          const existingIdx = safePrev.findIndex(item => 
            item?.speciesName && item.speciesName.toLowerCase() === targetName
          );

          const newSighting = {
            id: `sighting_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
            blobUrl: photoToVault.blobUrl || '',
            thumbnailUrl: photoToVault.thumbnailUrl || photoToVault.blobUrl || '',
            timestamp: photoToVault.metadata?.timestamp || new Date().toISOString(),
            location: locationUsed,
            camera: `${photoToVault.metadata?.make || ''} ${photoToVault.metadata?.model || ''}`.trim() || 'Camera N/A',
            exposure: `${photoToVault.metadata?.fNumber || ''} ${photoToVault.metadata?.exposureTime || ''} ${photoToVault.metadata?.iso || ''}`.trim() || 'EXIF N/A',
            cropRegion: photoToVault.cropRegion || null
          };

          if (existingIdx >= 0) {
            const updated = [...safePrev];
            const currentRecord = updated[existingIdx];
            const existingSightings = Array.isArray(currentRecord.sightings) ? currentRecord.sightings : [];
            updated[existingIdx] = {
              ...currentRecord,
              sightings: [newSighting, ...existingSightings],
              lastSeen: new Date().toISOString()
            };
            return updated;
          } else {
            const newRecord = {
              id: `vault_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
              speciesName: species.speciesName || 'Unknown Bird',
              scientificName: species.scientificName || 'Aves sp.',
              category: species.category || 'Songbirds',
              description: species.description || 'Sighted and cataloged in field notes.',
              habitat: species.habitat || 'Forests and open countryside.',
              lastSeen: new Date().toISOString(),
              sightings: [newSighting]
            };
            return [newRecord, ...safePrev];
          }
        });

        showToast(`Added ${species.speciesName} (${locationUsed}) to your Lifer Vault!`, "success");
      };

      const processedPhotos = useMemo(() => {
        let list = [...photos];

        if (cullingFilter === 'sharp') {
          list = list.filter(p => (p.focusScore ?? 10) >= 7);
        } else if (cullingFilter === 'blurry') {
          list = list.filter(p => p.focusScore !== null && p.focusScore < 7);
        }

        list.sort((a, b) => {
          if (cullingSort === 'name') {
            return a.filename.localeCompare(b.filename, undefined, { numeric: true, sensitivity: 'base' });
          } else if (cullingSort === 'time') {
            return new Date(b.metadata.timestamp) - new Date(a.metadata.timestamp);
          } else {
            const timeDiff = new Date(b.metadata.timestamp) - new Date(a.metadata.timestamp);
            if (Math.abs(timeDiff) < 60000) {
              return a.filename.localeCompare(b.filename, undefined, { numeric: true, sensitivity: 'base' });
            }
            return timeDiff;
          }
        });

        return list;
      }, [photos, cullingFilter, cullingSort]);

      const batchSize = 20;
      const totalCullingPages = Math.ceil(processedPhotos.length / batchSize) || 1;
      const pagedPhotos = useMemo(() => {
        const start = (cullingPage - 1) * batchSize;
        return processedPhotos.slice(start, start + batchSize);
      }, [processedPhotos, cullingPage]);

      const availableVaultCategories = useMemo(() => {
        const safeVault = Array.isArray(vaultEntries) ? vaultEntries : [];
        const catSet = new Set();
        safeVault.forEach(entry => {
          if (entry?.category) catSet.add(entry.category.trim());
        });
        return ['All', ...Array.from(catSet)];
      }, [vaultEntries]);

      const availableVaultLocales = useMemo(() => {
        const safeVault = Array.isArray(vaultEntries) ? vaultEntries : [];
        const localeSet = new Set();
        safeVault.forEach(entry => {
          const sightings = Array.isArray(entry?.sightings) ? entry.sightings : [];
          sightings.forEach(s => {
            if (s?.location) localeSet.add(s.location.trim());
          });
        });
        return ['All', ...Array.from(localeSet)];
      }, [vaultEntries]);

      const filteredVault = useMemo(() => {
        const safeVault = Array.isArray(vaultEntries) ? vaultEntries : [];
        return safeVault.filter(entry => {
          if (!entry) return false;
          const matchesCategory = vaultCategory === 'All' || entry.category === vaultCategory;
          
          const sightingsList = Array.isArray(entry.sightings) ? entry.sightings : [];
          const matchesLocale = vaultLocale === 'All' || sightingsList.some(s => 
            s?.location && s.location.toLowerCase().includes(vaultLocale.toLowerCase())
          );

          const q = typeof vaultSearch === 'string' ? vaultSearch.toLowerCase() : '';
          const matchesSearch = !q || 
            (entry.speciesName && entry.speciesName.toLowerCase().includes(q)) || 
            (entry.scientificName && entry.scientificName.toLowerCase().includes(q)) ||
            (entry.habitat && entry.habitat.toLowerCase().includes(q)) ||
            sightingsList.some(s => s?.location && s.location.toLowerCase().includes(q));

          return matchesCategory && matchesLocale && matchesSearch;
        });
      }, [vaultEntries, vaultCategory, vaultLocale, vaultSearch]);

      const totalVaultPages = Math.ceil(filteredVault.length / vaultItemsPerPage) || 1;
      const pagedVaultEntries = useMemo(() => {
        const start = (vaultPage - 1) * vaultItemsPerPage;
        return filteredVault.slice(start, start + vaultItemsPerPage);
      }, [filteredVault, vaultPage, vaultItemsPerPage]);

      const toggleSelectPhoto = (id, e) => {
        if (e) e.stopPropagation();
        setSelectedPhotoIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      const toggleSelectAll = () => {
        if (selectedPhotoIds.size === pagedPhotos.length && pagedPhotos.length > 0) {
          setSelectedPhotoIds(new Set());
        } else {
          setSelectedPhotoIds(new Set(pagedPhotos.map(p => p.id)));
        }
      };

      const activePreviewPhoto = photos.find(p => p.id === previewPhotoId);

      return (
        <div className="flex flex-col h-full bg-slate-950 text-slate-100 overflow-hidden">
          <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 shrink-0 flex items-center justify-between shadow-md">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                <Icon name="compass" className="w-5 h-5 text-slate-950" />
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-100 tracking-tight flex items-center gap-2">
                  BirdVault Pro
                  <span className="text-[10px] uppercase tracking-wider bg-emerald-500/20 text-emerald-300 font-semibold px-2 py-0.5 rounded-full border border-emerald-500/30">
                    Passkey Edition
                  </span>
                </h1>
                <p className="text-xs text-slate-400 hidden sm:block">Google Passkey & Custom Gemini AI Tokens</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 hidden md:flex">
                <button
                  onClick={() => setActiveTab('vault')}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                    activeTab === 'vault'
                      ? 'bg-emerald-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icon name="vault" className="w-4 h-4" />
                  <span>Lifer Vault ({vaultEntries.length})</span>
                </button>

                <button
                  onClick={() => setActiveTab('culling')}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                    activeTab === 'culling'
                      ? 'bg-emerald-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icon name="camera" className="w-4 h-4" />
                  <span>Focus Workspace ({photos.length})</span>
                </button>
              </div>

              {passkeyUser ? (
                <div className="flex items-center gap-2 bg-emerald-950/80 border border-emerald-700/60 px-3 py-1.5 rounded-xl text-xs text-emerald-200">
                  <Icon name="shield" className="w-4 h-4 text-emerald-400" />
                  <span className="font-semibold truncate max-w-[120px]">{passkeyUser}</span>
                  <button
                    onClick={handleLogoutPasskey}
                    className="ml-1 text-[10px] bg-slate-950 hover:bg-slate-900 px-2 py-0.5 rounded border border-emerald-800 text-slate-300 transition"
                  >
                    Logout
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowPasskeyModal(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg shadow-emerald-600/30 transition"
                >
                  <Icon name="key" className="w-4 h-4" />
                  <span>Google Passkey Sign In</span>
                </button>
              )}
            </div>
          </header>

          <div className="flex items-center justify-center md:hidden bg-slate-900 border-b border-slate-800 p-2">
            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 w-full justify-around">
              <button
                onClick={() => setActiveTab('vault')}
                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-medium transition ${
                  activeTab === 'vault' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400'
                }`}
              >
                <Icon name="vault" className="w-4 h-4" />
                <span>Vault</span>
              </button>
              <button
                onClick={() => setActiveTab('culling')}
                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-medium transition ${
                  activeTab === 'culling' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400'
                }`}
              >
                <Icon name="camera" className="w-4 h-4" />
                <span>Workspace</span>
              </button>
            </div>
          </div>

          {toast && (
            <div className={`fixed top-16 right-4 z-50 flex items-center gap-2 px-4 py-2.5 rounded-xl shadow-xl border text-xs font-medium animate-bounce ${
              toast.type === 'success' ? 'bg-emerald-950 border-emerald-700 text-emerald-200' :
              toast.type === 'warning' ? 'bg-amber-950 border-amber-700 text-amber-200' :
              'bg-slate-900 border-slate-700 text-slate-200'
            }`}>
              <Icon name={toast.type === 'success' ? 'check' : 'info'} className="w-4 h-4 shrink-0" />
              <span>{toast.message}</span>
            </div>
          )}

          {showPasskeyModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                      <Icon name="key" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-slate-100">Google Passkey & Gemini Token</h3>
                      <p className="text-[11px] text-slate-400">Access your device services & personal AI tokens</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowPasskeyModal(false)}
                    className="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-100 transition"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="space-y-1.5">
                    <label className="text-slate-300 font-semibold flex items-center gap-1.5">
                      <Icon name="shield" className="w-3.5 h-3.5 text-emerald-400" />
                      <span>Google Passkey / Account Email</span>
                    </label>
                    <input
                      type="text"
                      value={passkeyEmailInput}
                      onChange={(e) => setPasskeyEmailInput(e.target.value)}
                      placeholder="e.g. photographer@gmail.com"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-slate-300 font-semibold flex items-center gap-1.5">
                      <Icon name="sparkles" className="w-3.5 h-3.5 text-emerald-400" />
                      <span>Personal Gemini API Token (Optional)</span>
                    </label>
                    <input
                      type="password"
                      value={apiKeyInput}
                      onChange={(e) => setApiKeyInput(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 font-mono"
                    />
                    <p className="text-[10px] text-slate-400">
                      Your token is saved securely in local browser storage and used directly for species identification and focus evaluation.
                    </p>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowPasskeyModal(false)}
                    className="px-4 py-2.5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handlePasskeyAuth}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30 transition flex items-center gap-1.5"
                  >
                    <Icon name="key" className="w-4 h-4" />
                    <span>Authenticate Passkey</span>
                  </button>
                </div>
              </div>
            </div>

          )}

          {(activePreviewPhoto || previewVaultPhoto) && (
            <PhotoPreviewModal
              photo={activePreviewPhoto || previewVaultPhoto}
              onClose={() => {
                setPreviewPhotoId(null);
                setPreviewVaultPhoto(null);
              }}
              onUpdatePhoto={(updatedPhoto) => {
                if (activePreviewPhoto) {
                  setPhotos(prev => prev.map(p => p.id === updatedPhoto.id ? updatedPhoto : p));
                }
              }}
              onAddToVault={handleAddOrUpdateVault}
              onDeleteWorkspacePhoto={(photoId) => {
                setPhotos(prev => {
                  const target = prev.find(p => p.id === photoId);
                  if (target) {
                    if (target.thumbnailUrl) URL.revokeObjectURL(target.thumbnailUrl);
                    if (target.blobUrl) URL.revokeObjectURL(target.blobUrl);
                  }
                  return prev.filter(p => p.id !== photoId);
                });
                setSelectedPhotoIds(prev => {
                  const next = new Set(prev);
                  next.delete(photoId);
                  return next;
                });
                setPreviewPhotoId(null);
                showToast("Photo removed from Focus Workspace", "info");
              }}
              onDeleteVaultSighting={(vaultEntryId, sightingId) => {
                setVaultEntries(prev => {
                  const safePrev = Array.isArray(prev) ? prev : [];
                  const entryIdx = safePrev.findIndex(e => e.id === vaultEntryId);
                  if (entryIdx === -1) return safePrev;

                  const entry = safePrev[entryIdx];
                  const sightings = Array.isArray(entry.sightings) ? entry.sightings : [];
                  const remainingSightings = sightings.filter(s => s.id !== sightingId);

                  if (remainingSightings.length === 0) {
                    showToast(`Removed ${entry.speciesName} entry from Lifer Vault`, "info");
                    return safePrev.filter(e => e.id !== vaultEntryId);
                  } else {
                    const updated = [...safePrev];
                    updated[entryIdx] = {
                      ...entry,
                      sightings: remainingSightings
                    };
                    showToast(`Sighting removed from ${entry.speciesName} vault record`, "info");
                    return updated;
                  }
                });
                setPreviewVaultPhoto(null);
              }}
              globalLocation={globalLocation}
              geminiApiKey={geminiApiKey}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    function PhotoPreviewModal({ 
      photo, 
      onClose, 
      onUpdatePhoto, 
      onAddToVault, 
      onDeleteWorkspacePhoto, 
      onDeleteVaultSighting, 
      globalLocation, 
      geminiApiKey,
      showToast 
    }) {
      const [currentPhoto, setCurrentPhoto] = useState(photo);
      const [openAccordion, setOpenAccordion] = useState('species');
      const [isIdentifyingThis, setIsIdentifyingThis] = useState(false);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

      useEffect(() => {
        setCurrentPhoto(photo);
        setShowDeleteConfirm(false);
      }, [photo]);

      const handleCropChange = (cropRegion) => {
        const updated = {
          ...currentPhoto,
          cropRegion
        };
        setCurrentPhoto(updated);
        onUpdatePhoto(updated);
      };

      const handleIdentify = async () => {
        setIsIdentifyingThis(true);
        showToast(
          currentPhoto.cropRegion
            ? "Analyzing cropped bird photo diagnostic markings with your Passkey & Gemini token..."
            : "Analyzing bird species diagnostic markings with your Passkey & Gemini token...",
          "info"
        );

        const speciesData = await identifyBirdWithGemini(
          currentPhoto.file || currentPhoto.blobUrl,
          currentPhoto.locationOverride || globalLocation,
          currentPhoto.cropRegion,
          geminiApiKey
        );

        const updated = {
          ...currentPhoto,
          speciesInfo: speciesData,
          inVault: false
        };

        setCurrentPhoto(updated);
        onUpdatePhoto(updated);
        setIsIdentifyingThis(false);
        showToast(`Identified as ${speciesData.speciesName}!`, "success");
      };

      const species = currentPhoto.speciesInfo;
      const metadata = currentPhoto.metadata || {};
      const isAlreadyInVault = currentPhoto.inVault || false;
      const isVaultPhoto = currentPhoto.isVaultPhoto || false;
      const totalSightings = currentPhoto.totalEntrySightings ?? 1;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden relative">
            
            {showDeleteConfirm && (
              <div className="absolute inset-0 z-50 bg-slate-950/90 backdrop-blur-lg flex items-center justify-center p-6 animate-fade-in">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl text-center space-y-4">
                  <div className="w-12 h-12 bg-rose-950/80 border border-rose-700/60 rounded-2xl flex items-center justify-center mx-auto text-rose-400">
                    <Icon name="trash" className="w-6 h-6" />
                  </div>
                  <div>
                    <h4 className="text-base font-bold text-slate-100">
                      {isVaultPhoto 
                        ? (totalSightings <= 1 ? "Delete Entire Lifer Vault Entry?" : "Delete Sighting Record?") 
                        : "Remove Photo from Workspace?"}
                    </h4>
                    <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                      {isVaultPhoto ? (
                        totalSightings <= 1 ? (
                          <>This is the only remaining sighting for <strong className="text-emerald-400">{species?.speciesName || 'this species'}</strong>. Deleting this photo will completely remove the species entry from your Lifer Vault.</>
                        ) : (
                          <>Are you sure you want to remove this sighting record from <strong className="text-emerald-400">{species?.speciesName || 'this species'}</strong> in your Lifer Vault?</>
                        )
                      ) : (
                        <>Are you sure you want to delete <strong className="text-slate-200">{currentPhoto.filename}</strong> from your Focus Workspace list?</>
                      )}
                    </p>
                  </div>
                  <div className="flex items-center justify-center gap-3 pt-2">
                    <button
                      onClick={() => setShowDeleteConfirm(false)}
                      className="px-4 py-2 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs font-medium text-slate-300 transition"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={() => {
                        setShowDeleteConfirm(false);
                        if (isVaultPhoto) {
                          onDeleteVaultSighting(currentPhoto.vaultEntryId, currentPhoto.sightingId);
                        } else {
                          onDeleteWorkspacePhoto(currentPhoto.id);
                        }
                      }}
                      className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-bold text-white shadow-lg shadow-rose-600/30 transition flex items-center gap-1.5"
                    >
                      <Icon name="trash" className="w-4 h-4" />
                      <span>{isVaultPhoto && totalSightings <= 1 ? 'Delete Species Entry' : 'Delete Photo'}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            <div className="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-2 truncate">
                <Icon name="camera" className="w-5 h-5 text-emerald-400 shrink-0" />
                <h3 className="text-sm font-bold text-slate-100 truncate">{currentPhoto.filename}</h3>
                {isVaultPhoto && (
                  <span className="text-[10px] bg-emerald-950 text-emerald-300 font-semibold px-2 py-0.5 rounded-full border border-emerald-800">
                    Lifer Vault Sighting
                  </span>
                )}
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-100 transition"
              >
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6 custom-scrollbar">
              <div className="space-y-3 flex flex-col justify-center">
                <InteractivePhotoViewer
                  src={currentPhoto.blobUrl || currentPhoto.thumbnailUrl}
                  alt={currentPhoto.filename}
                  title={currentPhoto.filename}
                  heatmapPoints={species?.heatmapPoints || []}
                  showHeatmap={openAccordion === 'heatmap'}
                  cropRegion={currentPhoto.cropRegion}
                  onCropChange={handleCropChange}
                />

                <div className="flex items-center gap-2">
                  {!isVaultPhoto && (
                    <button
                      onClick={() => onAddToVault(currentPhoto)}
                      disabled={!species || isAlreadyInVault}
                      className={`flex-1 py-3 rounded-2xl text-xs font-bold shadow-lg transition flex items-center justify-center gap-2 ${
                        isAlreadyInVault
                          ? 'bg-slate-800 text-emerald-400 border border-emerald-500/40 cursor-not-allowed opacity-90'
                          : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/20'
                      }`}
                    >
                      <Icon name={isAlreadyInVault ? "check" : "vault"} className="w-4 h-4" />
                      <span>
                        {!species
                          ? 'Identify First to Add'
                          : isAlreadyInVault
                          ? 'Added to Lifer Vault'
                          : 'Add to Lifer Vault'}
                      </span>
                    </button>
                  )}

                  <button
                    onClick={() => setShowDeleteConfirm(true)}
                    className={`py-3 px-4 rounded-2xl text-xs font-bold border transition flex items-center justify-center gap-1.5 shadow-lg ${
                      isVaultPhoto ? 'w-full bg-rose-950/80 hover:bg-rose-900 text-rose-200 border-rose-800/80' : 'bg-rose-950/80 hover:bg-rose-900 text-rose-200 border-rose-800/80'
                    }`}
                  >
                    <Icon name="trash" className="w-4 h-4 text-rose-400" />
                    <span>{isVaultPhoto ? 'Delete from Vault' : 'Delete Photo'}</span>
                  </button>
                </div>
              </div>

              <div className="space-y-3 flex flex-col">
                <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                  <button
                    onClick={() => setOpenAccordion(openAccordion === 'species' ? '' : 'species')}
                    className="w-full px-4 py-3 bg-slate-900/80 hover:bg-slate-900 text-left flex items-center justify-between text-xs font-bold text-slate-200 transition"
                  >
                    <div className="flex items-center gap-2">
                      <Icon name="compass" className="w-4 h-4 text-emerald-400" />
                      <span>1. Bird Species Information</span>
                    </div>
                    <Icon name={openAccordion === 'species' ? "chevronUp" : "chevronDown"} className="w-4 h-4 text-slate-400" />
                  </button>

                  {openAccordion === 'species' && (
                    <div className="p-4 space-y-4 border-t border-slate-800 text-xs">
                      {species ? (
                        <div className="space-y-3">
                          <div className="flex items-start justify-between">
                            <div>
                              <span className="text-[10px] uppercase font-bold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-800">
                                {species.category}
                              </span>
                              <h4 className="text-lg font-bold text-slate-100 mt-1">{species.speciesName}</h4>
                              <p className="text-xs text-slate-400 italic">{species.scientificName}</p>
                            </div>
                            <div className="text-right">
                              <div className="text-[10px] text-slate-400">Match Confidence</div>
                              <div className="text-sm font-bold text-emerald-400">{Math.round((species.confidence || 0.8) * 100)}%</div>
                            </div>
                          </div>

                          <p className="text-slate-300 leading-relaxed bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            {species.description}
                          </p>

                          <div className="text-slate-400 space-y-1 bg-slate-900/40 p-3 rounded-xl border border-slate-800/80">
                            <span className="font-semibold text-slate-300 block">Habitat & Range:</span>
                            <p>{species.habitat}</p>
                          </div>
                        </div>
                      ) : (
                        <div className="text-center py-6 space-y-3">
                          <p className="text-slate-400">Species not yet identified for this photograph.</p>
                          <button
                            onClick={handleIdentify}
                            disabled={isIdentifyingThis}
                            className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-md transition inline-flex items-center gap-2"
                          >
                            <Icon name="sparkles" className="w-4 h-4" />
                            <span>{isIdentifyingThis ? 'Identifying...' : 'Run Passkey & Gemini AI Identification'}</span>
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                  <button
                    onClick={() => setOpenAccordion(openAccordion === 'heatmap' ? '' : 'heatmap')}
                    className="w-full px-4 py-3 bg-slate-900/80 hover:bg-slate-900 text-left flex items-center justify-between text-xs font-bold text-slate-200 transition"
                  >
                    <div className="flex items-center gap-2">
                      <Icon name="flame" className="w-4 h-4 text-emerald-400" />
                      <span>2. Diagnostic Focus Heatmap</span>
                    </div>
                    <Icon name={openAccordion === 'heatmap' ? "chevronUp" : "chevronDown"} className="w-4 h-4 text-slate-400" />
                  </button>

                  {openAccordion === 'heatmap' && (
                    <div className="p-4 space-y-3 border-t border-slate-800 text-xs">
                      <p className="text-slate-300 leading-relaxed">
                        Diagnostic points highlighted on the photo viewer display key subject details evaluated for focus sharpness:
                      </p>
                      <div className="space-y-2">
                        {(species?.heatmapPoints || [
                          { label: "Eye Ring & Beak Sharpness", intensity: 0.9 },
                          { label: "Plumage Micro-Contrast", intensity: 0.85 }
                        ]).map((pt, i) => (
                          <div key={i} className="flex items-center justify-between bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                            <span className="text-slate-200">{pt.label}</span>
                            <span className="text-emerald-400 font-bold">{Math.round((pt.intensity || 0.8) * 100)}% Sharpness</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                  <button
                    onClick={() => setOpenAccordion(openAccordion === 'metrics' ? '' : 'metrics')}
                    className="w-full px-4 py-3 bg-slate-900/80 hover:bg-slate-900 text-left flex items-center justify-between text-xs font-bold text-slate-200 transition"
                  >
                    <div className="flex items-center gap-2">
                      <Icon name="sparkles" className="w-4 h-4 text-emerald-400" />
                      <span>3. Focus Sharpness Evaluation</span>
                    </div>
                    <Icon name={openAccordion === 'metrics' ? "chevronUp" : "chevronDown"} className="w-4 h-4 text-slate-400" />
                  </button>

                  {openAccordion === 'metrics' && (
                    <div className="p-4 space-y-3 border-t border-slate-800 text-xs">
                      <div className="flex items-center justify-between">
                        <span className="text-slate-300 font-semibold">Sharpness Score:</span>
                        <span className={`text-sm font-bold px-2.5 py-0.5 rounded-lg border ${
                          (currentPhoto.focusScore ?? 10) >= 7
                            ? 'bg-emerald-950 text-emerald-300 border-emerald-700'
                            : 'bg-rose-950 text-rose-300 border-rose-700'
                        }`}>
                          {currentPhoto.focusScore ?? 'Unrated'}/10
                        </span>
                      </div>
                      <p className="text-slate-400 bg-slate-900 p-3 rounded-xl border border-slate-800">
                        {currentPhoto.focusReason || "Evaluated based on Laplacian gradient edge variance across subject focal plane."}
                      </p>
                    </div>
                  )}
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                  <button
                    onClick={() => setOpenAccordion(openAccordion === 'exif' ? '' : 'exif')}
                    className="w-full px-4 py-3 bg-slate-900/80 hover:bg-slate-900 text-left flex items-center justify-between text-xs font-bold text-slate-200 transition"
                  >
                    <div className="flex items-center gap-2">
                      <Icon name="info" className="w-4 h-4 text-emerald-400" />
                      <span>4. Camera EXIF Metadata</span>
                    </div>
                    <Icon name={openAccordion === 'exif' ? "chevronUp" : "chevronDown"} className="w-4 h-4 text-slate-400" />
                  </button>

                  {openAccordion === 'exif' && (
                    <div className="p-4 border-t border-slate-800 text-xs grid grid-cols-2 gap-2">
                      <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                        <div className="text-[10px] text-slate-400">Camera Make & Model</div>
                        <div className="font-semibold text-slate-200 truncate">{metadata.make} {metadata.model}</div>
                      </div>
                      <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                        <div className="text-[10px] text-slate-400">Aperture & Shutter</div>
                        <div className="font-semibold text-slate-200">{metadata.fNumber} @ {metadata.exposureTime}</div>
                      </div>
                      <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                        <div className="text-[10px] text-slate-400">ISO & Focal Length</div>
                        <div className="font-semibold text-slate-200">{metadata.iso} | {metadata.focalLength}</div>
                      </div>
                      <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                        <div className="text-[10px] text-slate-400">Capture Date</div>
                        <div className="font-semibold text-slate-200 truncate">
                          {new Date(metadata.timestamp).toLocaleString()}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    window.onload = function() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<BirdVaultApp />);
    };
  </script>
</body>
</html>
