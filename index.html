    function LiferVaultView({ vaultEntries, photos = [], onDeleteSighting, onDeleteSpecies, onSelectPhoto }) {
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [expandedSpecies, setExpandedSpecies] = useState(null);
      const [vaultImageUrls, setVaultImageUrls] = useState({});
      const vaultImageUrlsRef = useRef(new Map());
      const vaultImageObjectUrlsRef = useRef(new Set());
      const vaultImageLoadsRef = useRef(new Map());
      const vaultImageQueueRef = useRef({ active: 0, pending: [] });
      const vaultImageMountedRef = useRef(true);
      const [vaultPage, setVaultPage] = useState(1);
      const vaultGridScrollRef = useRef(null);

      useEffect(() => {
        if (vaultGridScrollRef.current) vaultGridScrollRef.current.scrollTop = 0;
      }, [vaultPage]);

      useEffect(() => {
        vaultImageMountedRef.current = true;
        return () => {
          vaultImageMountedRef.current = false;
          vaultImageObjectUrlsRef.current.forEach(url => {
            try { URL.revokeObjectURL(url); } catch(e){}
          });
          vaultImageObjectUrlsRef.current.clear();
          vaultImageUrlsRef.current.clear();
        };
      }, []);

      const workspacePhotosMap = useMemo(() => {
        const map = new Map();
        (photos || []).forEach(p => {
          if (p.fingerprintId) map.set(p.fingerprintId, p);
          if (p.id) map.set(p.id, p);
        });
        return map;
      }, [photos]);

      const ensureVaultImage = useCallback((entry, sighting) => {
        if (!sighting?.id) return Promise.resolve(null);
        const key = `${entry.category}_${entry.speciesName}_${sighting.id}`;
        const savedPhoto = sighting.photo || {};
        const fingerprintId = sighting.photoFingerprintId || savedPhoto.fingerprintId || savedPhoto.id;
        const livePhoto = workspacePhotosMap.get(fingerprintId);
        const cropBox = sighting.cropBox ?? savedPhoto.cropBox ?? livePhoto?.cropBox ?? null;
        const thumbnailPhoto = {
          ...savedPhoto,
          ...livePhoto,
          id: livePhoto?.id || savedPhoto.id || fingerprintId || sighting.id,
          fingerprintId: fingerprintId || livePhoto?.fingerprintId,
          cropBox
        };
        const cropCacheKey = getCropThumbnailCacheKey(thumbnailPhoto);
        const liveCropCacheKey = getCropThumbnailCacheKey({ ...livePhoto, cropBox });
        if (livePhoto && (!cropBox || (livePhoto.cropThumbnailUrl && livePhoto.cropThumbnailCacheKey === liveCropCacheKey))) {
          return Promise.resolve(null);
        }
        const cachedUrl = vaultImageUrlsRef.current.get(key);
        if (cachedUrl && cachedUrl.cropThumbnailCacheKey === cropCacheKey) {
          return Promise.resolve(cachedUrl);
        }
        const existingLoad = vaultImageLoadsRef.current.get(key);
        if (existingLoad) return existingLoad;

        const opfsName = sighting.opfsFileName || savedPhoto.opfsFileName || savedPhoto.name;
        if (!livePhoto?.file && !opfsName) return Promise.resolve(null);

        const promise = new Promise(resolve => {
          const queue = vaultImageQueueRef.current;
          const runNext = () => {
            while (queue.active < 3 && queue.pending.length) {
              const task = queue.pending.shift();
              queue.active++;
              task().finally(() => {
                queue.active--;
                runNext();
              });
            }
          };

          queue.pending.push(async () => {
            if (!vaultImageMountedRef.current) {
              resolve(null);
              vaultImageLoadsRef.current.delete(key);
              return;
            }
            try {
              const sourceBlob = livePhoto?.file || await getOpfsSightingFileBlob(entry.category || 'Other', entry.speciesName, opfsName);
              if (!sourceBlob) {
                console.warn(`Could not load vault image "${opfsName}" for ${entry.speciesName}.`);
                resolve(null);
                return;
              }
              if (!vaultImageMountedRef.current) {
                resolve(null);
                return;
              }
              const generated = await generateFastThumbnail({ ...thumbnailPhoto, file: sourceBlob }, 320);
              if (!vaultImageMountedRef.current) {
                [generated.thumbUrl, generated.cropThumbUrl].forEach(url => {
                  if (url?.startsWith('blob:')) URL.revokeObjectURL(url);
                });
                resolve(null);
                return;
              }
              const ownsSourceUrl = !livePhoto?.blobUrl && !livePhoto?.url;
              const sourceUrl = livePhoto?.blobUrl || livePhoto?.url || URL.createObjectURL(sourceBlob);
              const image = {
                sourceUrl,
                thumbnailUrl: generated.thumbUrl,
                cropThumbnailUrl: generated.cropThumbUrl,
                cropThumbnailCacheKey: generated.cropCacheKey ?? cropCacheKey
              };
              [ownsSourceUrl ? sourceUrl : null, generated.thumbUrl, generated.cropThumbUrl].forEach(url => {
                if (url?.startsWith('blob:')) vaultImageObjectUrlsRef.current.add(url);
              });
              const previousImage = vaultImageUrlsRef.current.get(key);
              if (previousImage) {
                [previousImage.sourceUrl, previousImage.thumbnailUrl, previousImage.cropThumbnailUrl].forEach(url => {
                  if (url?.startsWith('blob:')) vaultImageObjectUrlsRef.current.add(url);
                });
              }
              vaultImageUrlsRef.current.set(key, image);
              setVaultImageUrls(prev => ({ ...prev, [key]: image }));
              resolve(image);
            } catch (err) {
              console.warn(`Could not load vault image "${opfsName}" for ${entry.speciesName}:`, err);
              resolve(null);
            } finally {
              vaultImageLoadsRef.current.delete(key);
            }
          });
          runNext();
        });
        vaultImageLoadsRef.current.set(key, promise);
        return promise;
      }, [workspacePhotosMap]);

      const categories = useMemo(() => {
        const cats = new Set(vaultEntries.map(e => e.category || 'Other'));
        return ['All', ...Array.from(cats)];
      }, [vaultEntries]);

      const filteredEntries = useMemo(() => {
        return vaultEntries.filter(entry => {
          const matchesCat = selectedCategory === 'All' || entry.category === selectedCategory;
          const matchesSearch = entry.speciesName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                entry.scientificName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                (entry.description && entry.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                (entry.habitat && entry.habitat.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCat && matchesSearch;
        });
      }, [vaultEntries, selectedCategory, searchQuery]);

      const vaultNavigationItems = useMemo(
        () => filteredEntries.flatMap(entry =>
          (entry.sightings || []).map(sighting => ({ entry, sighting }))
        ),
        [filteredEntries]
      );

      useEffect(() => {
        setVaultPage(1);
      }, [selectedCategory, searchQuery]);

      const totalVaultPages = Math.ceil(filteredEntries.length / VAULT_PAGE_SIZE) || 1;

      useEffect(() => {
        if (vaultPage > totalVaultPages) {
          setVaultPage(Math.max(1, totalVaultPages));
        }
      }, [filteredEntries.length, totalVaultPages, vaultPage]);

      const paginatedVaultEntries = useMemo(() => {
        const start = (vaultPage - 1) * VAULT_PAGE_SIZE;
        return filteredEntries.slice(start, start + VAULT_PAGE_SIZE);
      }, [filteredEntries, vaultPage]);

      return (
        <div className="flex-1 flex flex-col overflow-hidden min-h-0 p-3 sm:p-4 md:p-6 gap-3 sm:gap-4 pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-4">
          <div className="flex-shrink-0 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-3 bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-2xl shadow-xl">
              <div className="hidden sm:block">
                <h2 className="text-base sm:text-xl font-extrabold text-white flex items-center space-x-2">
                  <Icon name="feather" className="w-5 h-5 sm:w-6 sm:h-6 text-emerald-400" />
                  <span>Lifer Species List Vault</span>
                </h2>
                <p className="text-[11px] sm:text-xs text-slate-400">Master life-list species catalog displaying taxonomic records, species traits, and sighting timelines</p>
              </div>

              <div className="flex items-center space-x-2 w-full sm:w-auto">
                <div className="relative flex-1 sm:w-64">
                  <Icon name="search" className="w-3.5 h-3.5 sm:w-4 sm:h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                  <input
                    type="text"
                    placeholder="Search species, scientific name, or traits..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-slate-950 border border-slate-800 rounded-xl pl-8 sm:pl-9 pr-3 sm:pr-4 py-1.5 sm:py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full"
                  />
                </div>

              </div>
            </div>

            <div className="flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3.5 sm:px-4 py-1 sm:py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition flex-shrink-0 touch-manipulation ${selectedCategory === cat ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'}`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          <div ref={vaultGridScrollRef} className="flex-1 overflow-y-auto min-h-0 pr-1 pb-4">
            {filteredEntries.length > 0 ? (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                  {paginatedVaultEntries.map(entry => (
                    <SpeciesVaultCard
                      key={entry.speciesName}
                      entry={entry}
                      workspacePhotosMap={workspacePhotosMap}
                      vaultImageUrls={vaultImageUrls}
                      ensureVaultImage={ensureVaultImage}
                      isExpanded={expandedSpecies === entry.speciesName}
                      onToggleExpand={() => setExpandedSpecies(expandedSpecies === entry.speciesName ? null : entry.speciesName)}
                      onDeleteSpecies={onDeleteSpecies}
                      onDeleteSighting={onDeleteSighting}
                      onSelectPhoto={(photo, vaultRef) =>
                        onSelectPhoto(photo, vaultRef, vaultNavigationItems)
                      }
                    />
                  ))}
                </div>

                {totalVaultPages > 1 && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-2 sm:p-4 flex items-center justify-between gap-2 shadow-xl">
                    <span className="text-[10px] sm:text-xs font-semibold text-slate-300 whitespace-nowrap">
                      <span className="sm:hidden">
                        <strong className="text-white">{vaultPage}</strong> / <strong className="text-white">{totalVaultPages}</strong>
                      </span>
                      <span className="hidden sm:inline">
                        Page <strong className="text-white">{vaultPage}</strong> of <strong className="text-white">{totalVaultPages}</strong> ({filteredEntries.length} Species total)
                      </span>
                    </span>

                    <div className="flex items-center space-x-1.5 sm:space-x-2 flex-shrink-0">
                      <button
                        onClick={() => setVaultPage(p => Math.max(1, p - 1))}
                        disabled={vaultPage === 1}
                        aria-label="Previous vault page"
                        className="px-2 sm:px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-slate-200 rounded-xl text-[10px] sm:text-xs font-semibold transition touch-manipulation whitespace-nowrap"
                      >
                        <span className="hidden sm:inline">← Previous 5</span>
                        <span className="sm:hidden">← Prev</span>
                      </button>
                      <button
                        onClick={() => setVaultPage(p => Math.min(totalVaultPages, p + 1))}
                        disabled={vaultPage === totalVaultPages}
                        aria-label="Next vault page"
                        className="px-2 sm:px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-30 disabled:cursor-not-allowed text-white rounded-xl text-[10px] sm:text-xs font-semibold transition shadow touch-manipulation whitespace-nowrap"
                      >
                        <span className="hidden sm:inline">Next 5 →</span>
                        <span className="sm:hidden">Next →</span>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div className="p-8 sm:p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-3xl space-y-3">
                <Icon name="feather" className="w-10 h-10 sm:w-12 sm:h-12 text-slate-600 mx-auto" />
                <h3 className="text-sm sm:text-base font-bold text-slate-300">No Species Records Found</h3>
                <p className="text-[11px] sm:text-xs text-slate-500 max-w-sm mx-auto">Upload wildlife photos in the Culling workspace to run AI species identification and build your Lifer Vault.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function CullingWorkspaceView({
      photos,
      onUpdatePhotos,
      onSelectPhoto,
      userApiKey,
      filterSharpness,
      setFilterSharpness,
      sortBy,
      setSortBy,
      currentPage,
      setCurrentPage,
      processedPhotos,
      isPreviewOpen,
      onClosePhotoPreview
    }) {
      const pageSize = BATCH_PAGE_SIZE;

      const [selectedIds, setSelectedIds] = useState(new Set());
      const [showFilterBar, setShowFilterBar] = useState(false);
      const [showMobileActions, setShowMobileActions] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
      const [loadingThumbnails, setLoadingThumbnails] = useState(false);
      const [thumbnailProgress, setThumbnailProgress] = useState({ current: 0, total: 0 });
      const [rating, setRating] = useState(false);
      const [ratingProgress, setRatingProgress] = useState({ current: 0, total: 0 });
      const [showDeleteConfirmModal, setShowDeleteConfirmModal] = useState(false);
      const [showVideoGenerator, setShowVideoGenerator] = useState(false);
      
      const abortUploadRef = useRef(false);
      const abortRatingRef = useRef(false);
      const fileInputRef = useRef(null);
      const folderInputRef = useRef(null);
      const cullingGridScrollRef = useRef(null);
      const mobileActionsRef = useRef(null);

      useEffect(() => {
        if (cullingGridScrollRef.current) cullingGridScrollRef.current.scrollTop = 0;
      }, [currentPage]);

      useEffect(() => {
        if (!showMobileActions) return undefined;
        const handlePointerDown = (event) => {
          if (!mobileActionsRef.current?.contains(event.target)) setShowMobileActions(false);
        };
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') setShowMobileActions(false);
        };
        document.addEventListener('pointerdown', handlePointerDown);
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('pointerdown', handlePointerDown);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, [showMobileActions]);

      const toggleSelectPhoto = (photoId, e) => {
        if (e) e.stopPropagation();
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(photoId)) {
            next.delete(photoId);
          } else {
            next.add(photoId);
          }
          return next;
        });
      };

      const handleSelectAll = () => {
        if (selectedIds.size > 1) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(processedPhotos.map(p => p.id)));
        }
      };

      const handleCloseFolder = () => {
        abortUploadRef.current = true;
        abortRatingRef.current = true;

        const objectUrls = new Set();
        photos.forEach(photo => {
          [
            photo.url,
            photo.blobUrl,
            photo.thumbnailUrl,
            photo.cropThumbnailUrl,
            ...(photo.versions || []).flatMap(version => [version.blobUrl, version.thumbnailUrl])
          ].forEach(url => {
            if (typeof url === 'string' && url.startsWith('blob:')) objectUrls.add(url);
          });
        });
        objectUrls.forEach(url => {
          try {
            URL.revokeObjectURL(url);
          } catch (err) {
            console.warn('Could not release culling image URL:', err);
          }
        });

        onUpdatePhotos([]);
        onClosePhotoPreview();
        setSelectedIds(new Set());
        setCurrentPage(1);
        setUploading(false);
        setRating(false);
        setLoadingThumbnails(false);
        setShowVideoGenerator(false);
        setShowDeleteConfirmModal(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
        if (folderInputRef.current) folderInputRef.current.value = '';
      };

      const handleDeleteSinglePhoto = async (photoId, e) => {
        if (e) e.stopPropagation();
        const photo = photos.find(p => p.id === photoId);
        if (photo) {
          if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
            try {
              await photo.fileHandle.remove();
            } catch (err) {
              console.warn(`Could not delete "${photo.name}" from its source folder:`, err);
              alert(`Could not delete "${photo.name}" from its source folder. The photo remains in the culling list.`);
              return;
            }
          } else {
            alert(`"${photo.name}" will be removed from the culling list, but this browser cannot delete the source file without writable folder access.`);
          }
          try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (err) {}
          try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (err) {}
          try { if (photo.cropThumbnailUrl) URL.revokeObjectURL(photo.cropThumbnailUrl); } catch (err) {}
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        }
        
        onUpdatePhotos(prev => prev.filter(p => p.id !== photoId));
        setSelectedIds(prev => {
          const next = new Set(prev);
          next.delete(photoId);
          return next;
        });
      };

      const handleOpenFolderPicker = async (e) => {
        if (e) e.preventDefault();

        const isSandboxedIframe = typeof window !== 'undefined' && window.self !== window.top;

        if (!isSandboxedIframe && 'showDirectoryPicker' in window) {
          abortUploadRef.current = false;
          let directoryOpened = false;
          let importedFileCount = 0;
          let failedFileCount = 0;
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            directoryOpened = true;
            if (abortUploadRef.current) return;
            setUploading(true);
            setFilterSharpness('all');
            setSortBy('default');

            const fileEntries = [];
            const collectImageEntries = async (directoryHandle, parentPath = '') => {
              for await (const [name, handle] of directoryHandle.entries()) {
                if (abortUploadRef.current) return;
                const relativePath = parentPath ? `${parentPath}/${name}` : name;
                if (handle.kind === 'file' && /\.(jpe?g|png|webp|cr2|nef|arw|dng)$/i.test(name)) {
                  fileEntries.push({ name, handle, relativePath });
                } else if (handle.kind === 'directory') {
                  await collectImageEntries(handle, relativePath);
                }
              }
            };
            await collectImageEntries(dirHandle);
            if (abortUploadRef.current) {
              setUploading(false);
              return;
            }
            onUpdatePhotos([]);
            setSelectedIds(new Set());
            setCurrentPage(1);
            const fpDb = getStoredFingerprintDb();

            setUploadProgress({ current: 0, total: fileEntries.length });

            const total = fileEntries.length;
            const CHUNK_SIZE = 20;

            for (let i = 0; i < total; i += CHUNK_SIZE) {
              if (abortUploadRef.current) break;
              const chunkEntries = fileEntries.slice(i, i + CHUNK_SIZE);
              const fileResults = await Promise.allSettled(chunkEntries.map(async entry => {
                const file = await entry.handle.getFile();
                file.handle = entry.handle;
                file.relativePath = entry.relativePath;
                return file;
              }));
              if (abortUploadRef.current) break;
              failedFileCount += fileResults.filter(result => result.status === 'rejected').length;
              const chunkFiles = fileResults.flatMap((result, index) => {
                if (result.status === 'fulfilled') return [result.value];
                console.warn(`Could not read folder image "${chunkEntries[index].name}":`, result.reason);
                return [];
              });
              const chunkObjs = chunkFiles.map(file => {
                const relativePath = getFolderRelativePath(file, file.relativePath || '');
                const fpId = generateFingerprintId(file, relativePath);
                const savedMeta = fpDb[fpId] || {};
                const cameraExif = savedMeta.cameraExif || null;
                const photoObj = {
                  id: fpId,
                  fingerprintId: fpId,
                  file: file,
                  fileHandle: file.handle || null,
                  sourceDirectoryHandle: dirHandle,
                  relativePath,
                  name: file.name,
                  size: file.size,
                  lastModified: file.lastModified,
                  url: null,
                  blobUrl: null,
                  thumbnailUrl: null,
                  naturalWidth: 1000,
                  naturalHeight: 750,
                  sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
                  sharpnessSource: savedMeta.sharpnessSource || null,
                  stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
                  userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
                  focusSpot: savedMeta.focusSpot || savedMeta.cameraExif?.focusArea || null,
                  cameraExif,
                  identification: savedMeta.identification || null,
                  cropBox: savedMeta.cropBox || null,
                  locationText: savedMeta.locationText || null,
                  opfsFileName: savedMeta.opfsFileName || null,
                  activeVersionId: savedMeta.activeVersionId || null,
                  versions: savedMeta.versions || null
                };
                saveFingerprintMetadata(photoObj);
                return photoObj;
              });

              onUpdatePhotos(prev => {
                const existingIds = new Set(prev.map(p => p.id));
                const filteredNew = chunkObjs.filter(p => !existingIds.has(p.id));
                return [...prev, ...filteredNew];
              });
              importedFileCount += chunkFiles.length;

              setUploadProgress({ current: Math.min(i + CHUNK_SIZE, total), total });
            }

            setUploading(false);
            if (failedFileCount) {
              alert(`Loaded ${importedFileCount} photo(s), but could not read ${failedFileCount} file(s). Check the browser console for details.`);
            }
            return;
          } catch (err) {
            if (err.name === 'AbortError') {
              setUploading(false);
              return;
            }
            if (directoryOpened) {
              console.error('Folder import error:', err);
              setUploading(false);
              alert(`Folder import stopped after loading ${importedFileCount} photo(s): ${err.message || 'Could not read the selected folder.'}`);
              return;
            }
            console.warn('Native folder picker unavailable; using the browser folder picker instead:', err);
          }
        }

        if (folderInputRef.current) {
          folderInputRef.current.click();
        } else if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileUpload = async (e) => {
        const rawFiles = Array.from(e.target.files || []);
        const files = rawFiles.filter(file => /\.(jpe?g|png|webp|cr2|nef|arw|dng)$/i.test(file.name));
        if (!files.length) return;

        setUploading(true);
        abortUploadRef.current = false;

        onUpdatePhotos([]);
        setSelectedIds(new Set());
        setCurrentPage(1);

        setFilterSharpness('all');
        setSortBy('default');

        setUploadProgress({ current: 0, total: files.length });

        const fpDb = getStoredFingerprintDb();
        const total = files.length;
        const CHUNK_SIZE = 20;

        let isFirstChunk = true;
        for (let i = 0; i < total; i += CHUNK_SIZE) {
          if (abortUploadRef.current) break;
          const chunkFiles = files.slice(i, i + CHUNK_SIZE);
          const chunkObjs = chunkFiles.map(file => {
            const relativePath = getFolderRelativePath(file);
            const fpId = generateFingerprintId(file, relativePath);
            const savedMeta = fpDb[fpId] || {};
            const cameraExif = savedMeta.cameraExif || null;
            const photoObj = {
              id: fpId,
              fingerprintId: fpId,
              file: file,
              fileHandle: file.handle || null,
              relativePath,
              name: file.name,
              size: file.size,
              lastModified: file.lastModified,
              url: null,
              blobUrl: null,
              thumbnailUrl: null,
              naturalWidth: 1000,
              naturalHeight: 750,
              sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
              sharpnessSource: savedMeta.sharpnessSource || null,
              stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
              userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
              focusSpot: savedMeta.focusSpot || savedMeta.cameraExif?.focusArea || null,
              cameraExif,
              identification: savedMeta.identification || null,
              cropBox: savedMeta.cropBox || null,
              locationText: savedMeta.locationText || null,
              opfsFileName: savedMeta.opfsFileName || null,
              activeVersionId: savedMeta.activeVersionId || null,
              versions: savedMeta.versions || null
            };
            saveFingerprintMetadata(photoObj);
            return photoObj;
            });

        if (isFirstChunk) {
          onUpdatePhotos(chunkObjs);
          isFirstChunk = false;
        } else {
          onUpdatePhotos(prev => {
            const existingIds = new Set(prev.map(p => p.id));
            const filteredNew = chunkObjs.filter(p => !existingIds.has(p.id));
            return [...prev, ...filteredNew];
          });
        }

        setUploadProgress({ current: Math.min(i + CHUNK_SIZE, total), total });
        await new Promise(r => setTimeout(r, 10));
      }

      setUploading(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
      if (folderInputRef.current) folderInputRef.current.value = '';
    };

    const handleBatchRateFocus = async (photoIds = null) => {
        const selectedIdsToRate = photoIds ? new Set(photoIds) : null;
        const targetsToRate = photos.filter(photo =>
          selectedIdsToRate
            ? selectedIdsToRate.has(photo.id)
            : getEffectiveStars(photo) === 0
        );
        if (!targetsToRate.length || rating) return;

        setRating(true);
        abortRatingRef.current = false;
        setRatingProgress({ current: 0, total: targetsToRate.length });

        try {
          for (let i = 0; i < targetsToRate.length; i++) {
            if (abortRatingRef.current) break;

            const target = targetsToRate[i];
            let cameraExif = target.cameraExif;
            if (!cameraExif && target.file) {
              cameraExif = await extractCameraExif(target.file);
            }

            if (abortRatingRef.current) break;
            const evalResult = await evaluatePhotoFocus(
              target.file || target.blobUrl || target.thumbnailUrl || target.url,
              target.cropBox || null,
              cameraExif || target.cameraExif,
              { ignoreExifFocusArea: !target.cropBox }
            );
            if (abortRatingRef.current) break;
            if (evalResult.error) {
              setRatingProgress({ current: i + 1, total: targetsToRate.length });
              continue;
            }

            const ratingUpdate = {
              cameraExif: cameraExif || target.cameraExif,
              sharpness: evalResult.score,
              sharpnessSource: 'local',
              stars: evalResult.stars,
              ...(selectedIdsToRate ? { userStars: null } : {})
            };

            onUpdatePhotos(prev => prev.map(photo =>
              photo.id === target.id ? { ...photo, ...ratingUpdate } : photo
            ));
            saveFingerprintMetadata({ ...target, ...ratingUpdate });
            setRatingProgress({ current: i + 1, total: targetsToRate.length });
          }
        } finally {
          setRating(false);
        }

      };

      const handleCardStarClick = (photoId, newStars) => {
        onUpdatePhotos(prev => prev.map(p => {
          if (p.id === photoId) {
            const updated = {
              ...p,
              userStars: newStars,
              stars: newStars
            };
            saveFingerprintMetadata(updated);
            return updated;
          }
          return p;
        }));
      };

      const confirmAndDeleteFiltered = async () => {
        setShowDeleteConfirmModal(false);
        const selectedDelete = selectedIds.size > 0;
        const photosToDelete = selectedDelete
          ? photos.filter(photo => selectedIds.has(photo.id))
          : processedPhotos;
        if (!photosToDelete.length) return;

        const removedIds = new Set();
        const failedDeletions = [];
        let listOnlyRemovals = 0;

        for (const photo of photosToDelete) {
          if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
            try {
              await photo.fileHandle.remove();
            } catch (err) {
              console.warn(`Could not delete "${photo.name}" from its source folder:`, err);
              failedDeletions.push(photo.name);
              continue;
            }
          } else {
            listOnlyRemovals++;
          }
          try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (err) {}
          try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (err) {}
          try { if (photo.cropThumbnailUrl) URL.revokeObjectURL(photo.cropThumbnailUrl); } catch (err) {}
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
          removedIds.add(photo.id);
        }

        onUpdatePhotos(prev => prev.filter(photo => !removedIds.has(photo.id)));
        setSelectedIds(prev => new Set([...prev].filter(id => !removedIds.has(id))));
        setCurrentPage(1);

        const messages = [];
        if (failedDeletions.length) {
          messages.push(`Could not delete ${failedDeletions.length} source file(s); they remain in the culling list: ${failedDeletions.slice(0, 5).join(', ')}${failedDeletions.length > 5 ? ', …' : ''}.`);
        }
        if (listOnlyRemovals) {
          messages.push(`${listOnlyRemovals} photo(s) were removed from the culling list only because this browser has no writable source-folder handle; the files remain on disk.`);
        }
        if (messages.length) alert(messages.join('\n'));
      };

      const handleExportFiltered = async () => {
        const listToExport = selectedIds.size > 0 ? photos.filter(p => selectedIds.has(p.id)) : processedPhotos;
        if (!listToExport.length) return;

        let exportedIds = new Set();

        if ('showDirectoryPicker' in window) {
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            let exportedCount = 0;
            
            for (const photo of listToExport) {
              if (photo.file) {
                const newFileHandle = await dirHandle.getFileHandle(photo.name, { create: true });
                const writable = await newFileHandle.createWritable();
                await writable.write(photo.file);
                await writable.close();
                exportedCount++;
                exportedIds.add(photo.id);
                deleteFingerprintMetadata(photo.fingerprintId || photo.id);
              }
            }
            
            if (exportedIds.size > 0) {
              onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
              setSelectedIds(prev => {
                const next = new Set(prev);
                exportedIds.forEach(id => next.delete(id));
                return next;
              });
            }
            
            alert(`Successfully exported ${exportedCount} photo(s) to your selected directory folder and removed them from the main list!`);
            setCurrentPage(1);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
            console.warn('Directory Picker permission or support error, falling back to direct download:', err);
          }
        }

        listToExport.forEach((photo, i) => {
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = photo.blobUrl || photo.thumbnailUrl || photo.url;
            a.download = photo.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }, i * 200);
          exportedIds.add(photo.id);
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        });

        onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
        setSelectedIds(prev => {
          const next = new Set(prev);
          exportedIds.forEach(id => next.delete(id));
          return next;
        });
        setCurrentPage(1);
      };

      const totalPages = Math.ceil(processedPhotos.length / pageSize) || 1;

      useEffect(() => {
        if (currentPage > totalPages) setCurrentPage(totalPages);
      }, [currentPage, totalPages, setCurrentPage]);
      
      const paginatedPhotos = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedPhotos.slice(start, start + pageSize);
      }, [processedPhotos, currentPage, pageSize]);

      const bufferedPhotos = useMemo(() => {
        const total = processedPhotos.length;
        if (total === 0) return [];

        const pageStart = (currentPage - 1) * pageSize;
        const pageEnd = Math.min(total, currentPage * pageSize);
        return processedPhotos.slice(pageStart, pageEnd);
      }, [processedPhotos, currentPage, pageSize]);
      const bufferedThumbnailKey = bufferedPhotos
        .map(photo => `${photo.id}:${getCropThumbnailCacheKey(photo) || ''}`)
        .join('|');

      useEffect(() => {
        if (isPreviewOpen) {
          setLoadingThumbnails(false);
          return;
        }

        const abortController = new AbortController();
        let isMounted = true;

        if (!bufferedPhotos.length) {
          setLoadingThumbnails(false);
          return;
        }

        const bufferedIds = new Set(bufferedPhotos.map(p => p.id));
        const needed = bufferedPhotos.filter(p =>
          !p.thumbnailUrl ||
          (getCropThumbnailCacheKey(p) && (
            !p.cropThumbnailUrl ||
            p.cropThumbnailCacheKey !== getCropThumbnailCacheKey(p)
          ))
        );

        if (needed.length > 0) {
          setLoadingThumbnails(true);
          setThumbnailProgress({ current: 0, total: needed.length });

          processThumbnailQueue(
            needed,
            (batchUpdates) => {
              if (!isMounted) return;
              onUpdatePhotos(prev => {
                const mapUpdates = new Map(batchUpdates.map(u => [u.id, u]));
                return prev.map(p => {
                  const u = mapUpdates.get(p.id);
                  if (u) {
                    if (p.cropThumbnailUrl && p.cropThumbnailUrl !== u.cropThumbUrl) {
                      try { URL.revokeObjectURL(p.cropThumbnailUrl); } catch(e){}
                    }
                    return {
                      ...p,
                      thumbnailUrl: u.thumbUrl,
                      cropThumbnailUrl: u.cropThumbUrl,
                      cropThumbnailCacheKey: u.cropCacheKey,
                      naturalWidth: u.width,
                      naturalHeight: u.height
                    };
                  }
                  return p;
                });
              });
            },
            (completed, total) => {
              if (isMounted) setThumbnailProgress({ current: completed, total });
            },
            abortController.signal
          ).then(() => {
            if (isMounted) setLoadingThumbnails(false);
          });
        } else {
          setLoadingThumbnails(false);
        }

        onUpdatePhotos(prev => {
          let hasChanges = false;
          const updated = prev.map(p => {
            let updatedPhoto = p;
            let changed = false;

            // Strict Memory Cleanup: Free object URLs for off-page images to preserve memory
            if (!bufferedIds.has(p.id)) {
              if (p.thumbnailUrl && p.thumbnailUrl.startsWith('blob:')) {
                try { URL.revokeObjectURL(p.thumbnailUrl); } catch(e){}
                updatedPhoto = { ...updatedPhoto, thumbnailUrl: null };
                changed = true;
              }

              if (p.cropThumbnailUrl && p.cropThumbnailUrl.startsWith('blob:')) {
                try { URL.revokeObjectURL(p.cropThumbnailUrl); } catch(e){}
                updatedPhoto = { ...updatedPhoto, cropThumbnailUrl: null };
                changed = true;
              }

              if (p.blobUrl && p.blobUrl.startsWith('blob:')) {
                try { URL.revokeObjectURL(p.blobUrl); } catch(e){}
                updatedPhoto = { ...updatedPhoto, blobUrl: null };
                changed = true;
              }
            }

            if (changed) hasChanges = true;
            return updatedPhoto;
          });
          return hasChanges ? updated : prev;
        });

        return () => { 
          isMounted = false; 
          abortController.abort(); 
        };
      }, [currentPage, bufferedThumbnailKey, filterSharpness, sortBy, isPreviewOpen]);
      const isSelectionActive = selectedIds.size > 0;
      const canDeselectAll = selectedIds.size > 1;
      const selectedPhotosForVideo = useMemo(

                    <option value="sharpness">Sharpness Score</option>

                </div>

          </div>

          {isSelectionActive && (

          {showVideoGenerator && selectedPhotosForVideo.length > 1 && (

          <div ref={cullingGridScrollRef} className="flex-1 overflow-y-auto min-h-0 pr-1 pb-4">
            {paginatedPhotos.length > 0 ? (
              <div className="space-y-4">
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5 sm:gap-4">

                    return (
