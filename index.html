  <script>
    (function() {
      // Suppress Tailwind Play CDN production warnings in developer console
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        origWarn.apply(console, args);
      };

      // Inline vector SVG icon to prevent broken external assets
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><rect width="512" height="512" rx="128" fill="#040711"/><path d="M256 64C180 64 120 120 120 200C120 300 256 448 256 448C256 448 392 300 392 200C392 120 332 64 256 64ZM256 250C228.4 250 206 227.6 206 200C206 172.4 228.4 150 256 150C283.6 150 306 127.6 306 200C306 227.6 283.6 250 256 250Z" fill="#10b981"/><path d="M256 120C211.8 120 176 155.8 176 200C176 260 256 360 256 360C256 360 336 260 336 200C336 155.8 300.2 120 256 120ZM256 230C239.4 230 226 216.6 226 200C226 183.4 239.4 170 256 170C272.6 170 286 183.4 286 200C286 216.6 272.6 230 256 230Z" fill="#34d399"/></svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

      // Resolve valid absolute start_url for blob manifest
      let validStartUrl = window.location.origin + window.location.pathname;
      try {
        validStartUrl = new URL(window.location.pathname, window.location.origin).href;
      } catch (e) {
        validStartUrl = window.location.href || '.';
      }

      const manifest = {
        name: "BirdVault Pro",
        short_name: "BirdVault",
        start_url: validStartUrl,
        display: "standalone",
        background_color: "#040711",
        theme_color: "#040711",
        icons: [
          { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], {type: 'application/json'});
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);
    })();
  </script>

<body class="h-[100dvh] w-full overflow-hidden bg-slate-950 text-slate-100 flex flex-col">
  <div id="root" class="h-full w-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const GEMINI_QUOTAS = {
      MAX_RPM: 15,
      MAX_TPM: 1000000,
      MAX_RPD: 1500
    };

    const MIN_CROP_DIMENSION_PCT = 2.0;

    function scoreToStars(score) {
      if (score === null || score === undefined) return 0;
      return Math.max(1, Math.min(5, Math.ceil(score / 2)));
    }

    function generateFingerprintId(file) {
      if (!file) return null;
      const cleanName = (file.name || 'unnamed').replace(/[^a-zA-Z0-9._-]/g, '_');
      return `fp_${cleanName}_${file.size || 0}_${file.lastModified || 0}`;
    }

    // --- UNIVERSAL STORAGE & OPFS DIRECTORY ENGINE ---

    const OPFS_VAULT_ROOT = 'BirdVault_Lifer_Catalog';

    async function isOpfsSupported() {
      return typeof navigator !== 'undefined' && 
             navigator.storage && 
             typeof navigator.storage.getDirectory === 'function';
    }

    async function getOpfsRootHandle() {
      if (!(await isOpfsSupported())) return null;
      try {
        const root = await navigator.storage.getDirectory();
        return await root.getDirectoryHandle(OPFS_VAULT_ROOT, { create: true });
      } catch (err) {
        console.warn('OPFS Root Access Warning:', err);
        return null;
      }
    }

    async function sanitizeDirectoryName(name) {
      return (name || 'Uncategorized').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 60);
    }

    async function writeOpfsSightingFile(category, speciesName, fileName, blobOrFile) {
      try {
        const root = await getOpfsRootHandle();
        if (!root) return false;

        const catDirName = await sanitizeDirectoryName(category || 'Other');
        const speciesDirName = await sanitizeDirectoryName(speciesName);

        const catHandle = await root.getDirectoryHandle(catDirName, { create: true });
        const speciesHandle = await catHandle.getDirectoryHandle(speciesDirName, { create: true });

        const fileHandle = await speciesHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        
        if (blobOrFile instanceof File || blobOrFile instanceof Blob) {
          await writable.write(blobOrFile);
        } else if (typeof blobOrFile === 'string' && blobOrFile.startsWith('data:')) {
          const res = await fetch(blobOrFile);
          const blob = await res.blob();
          await writable.write(blob);
        } else {
          await writable.write(new Blob([JSON.stringify(blobOrFile, null, 2)], { type: 'application/json' }));
        }
        await writable.close();
        return true;
      } catch (err) {
        console.warn('OPFS File Write Error:', err);
        return false;
      }
    }

    async function updateOpfsMasterManifest(manifestData) {
      try {
        const root = await getOpfsRootHandle();
        if (!root) return false;
        const fileHandle = await root.getFileHandle('vault_manifest.json', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(manifestData, null, 2));
        await writable.close();
        return true;
      } catch (err) {
        console.warn('OPFS Manifest Update Error:', err);
        return false;
      }
    }

    async function exportOpfsVaultToZip() {
      if (typeof JSZip === 'undefined') {
        throw new Error('JSZip library is not loaded');
      }

      const root = await getOpfsRootHandle();
      if (!root) throw new Error('OPFS physical storage is not accessible on this device');

      const zip = new JSZip();
      const vaultFolder = zip.folder(OPFS_VAULT_ROOT);

      async function traverseDirectory(dirHandle, currentZipFolder) {
        for await (const [name, handle] of dirHandle.entries()) {
          if (handle.kind === 'file') {
            const file = await handle.getFile();
            currentZipFolder.file(name, file);
          } else if (handle.kind === 'directory') {
            const subFolder = currentZipFolder.folder(name);
            await traverseDirectory(handle, subFolder);
          }
        }
      }

      await traverseDirectory(root, vaultFolder);
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      return new File([zipBlob], `${OPFS_VAULT_ROOT}_Export.zip`, { type: 'application/zip' });
    }

    // --- STATE PERSISTENCE ACCESSOR FUNCTIONS ---

    function getStoredFingerprintDb() {
      try {
        const stored = localStorage.getItem('birdvault_fingerprints_v1');
        if (stored) return JSON.parse(stored);
      } catch (e) {
        console.warn('Fingerprint DB read error:', e);
      }
      return {};
    }

    function saveFingerprintMetadata(photoMeta) {
      if (!photoMeta || (!photoMeta.fingerprintId && !photoMeta.id)) return;
      const fpId = photoMeta.fingerprintId || photoMeta.id;
      
      try {
        const db = getStoredFingerprintDb();
        db[fpId] = {
          fingerprintId: fpId,
          name: photoMeta.name,
          size: photoMeta.size,
          lastModified: photoMeta.lastModified,
          sharpness: photoMeta.sharpness !== undefined ? photoMeta.sharpness : null,
          stars: photoMeta.stars !== undefined ? photoMeta.stars : null,
          userStars: photoMeta.userStars !== undefined ? photoMeta.userStars : null,
          focusSpot: photoMeta.focusSpot || null,
          cameraExif: photoMeta.cameraExif || null,
          identification: photoMeta.identification || null,
          cropBox: photoMeta.cropBox || null,
          locationText: photoMeta.locationText || null
        };
        localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
      } catch (e) {
        console.warn('Fingerprint DB save warning:', e);
      }
    }

    function deleteFingerprintMetadata(fpId) {
      if (!fpId) return;
      try {
        const db = getStoredFingerprintDb();
        if (db[fpId]) {
          delete db[fpId];
          localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
        }
      } catch (e) {
        console.warn('Fingerprint DB delete warning:', e);
      }
    }

    function syncFingerprintDbPrune(activePhotos) {
      try {
        const activeIds = new Set((activePhotos || []).map(p => p.fingerprintId || p.id));
        const db = getStoredFingerprintDb();
        let changed = false;
        Object.keys(db).forEach(fpId => {
          if (!activeIds.has(fpId)) {
            delete db[fpId];
            changed = true;
          }
        });
        if (changed) {
          localStorage.setItem('birdvault_fingerprints_v1', JSON.stringify(db));
        }
      } catch (e) {
        console.warn('Fingerprint DB sync prune error:', e);
      }
    }

    function getStoredTokenUsage() {
      try {
        const stored = localStorage.getItem('birdvault_gemini_usage');
        if (stored) {
          const parsed = JSON.parse(stored);
          const now = Date.now();
          if (now - parsed.minuteWindowStart > 60000) {
            parsed.minuteRequests = 0;
            parsed.minuteTokens = 0;
            parsed.minuteWindowStart = now;
          }
          const storedDate = new Date(parsed.dailyWindowStart).getUTCDate();
          const currentDate = new Date(now).getUTCDate();
          if (storedDate !== currentDate) {
            parsed.dailyRequests = 0;
            parsed.dailyWindowStart = now;
          }
          return parsed;
        }
      } catch (e) {}
      
      const now = Date.now();
      return {
        minuteRequests: 0,
        minuteTokens: 0,
        dailyRequests: 0,
        minuteWindowStart: now,
        dailyWindowStart: now
      };
    }

    function recordTokenUsage(estimatedTokens = 350) {
      const usage = getStoredTokenUsage();
      usage.minuteRequests += 1;
      usage.minuteTokens += estimatedTokens;
      usage.dailyRequests += 1;
      localStorage.setItem('birdvault_gemini_usage', JSON.stringify(usage));
      window.dispatchEvent(new Event('birdvault_token_update'));
      return usage;
    }

    async function extractCameraExif(file) {
      return new Promise((resolve) => {
        if (!file || !(file instanceof File)) return resolve(null);
        
        const reader = new FileReader();
        const slice = file.slice(0, 262144);
        
        reader.onload = (e) => {
          try {
            const view = new DataView(e.target.result);
            if (view.byteLength < 12) return resolve(null);
            if (view.getUint16(0, false) !== 0xFFD8) return resolve(null);

            let offset = 2;
            let app1Offset = -1;

            while (offset < view.byteLength - 4) {
              const marker = view.getUint16(offset, false);
              offset += 2;
              
              if (marker === 0xFFE1) {
                const length = view.getUint16(offset, false);
                const exifHeader = view.getUint32(offset + 2, false);
                if (exifHeader === 0x45786966) {
                  app1Offset = offset + 2;
                  break;
                }
                offset += length;
              } else if ((marker & 0xFF00) === 0xFF00 && marker !== 0xFF00) {
                const length = view.getUint16(offset, false);
                offset += length;
              } else {
                break;
              }
            }

            if (app1Offset === -1) return resolve(null);

            const tiffOffset = app1Offset + 6;
            if (tiffOffset + 8 > view.byteLength) return resolve(null);

            const endianCode = view.getUint16(tiffOffset, false);
            let littleEndian = false;
            if (endianCode === 0x4949) {
              littleEndian = true;
            } else if (endianCode === 0x4D4D) {
              littleEndian = false;
            } else {
              return resolve(null);
            }

            if (view.getUint16(tiffOffset + 2, littleEndian) !== 0x002A) return resolve(null);

            const firstIFDOffset = view.getUint32(tiffOffset + 4, littleEndian);
            if (!firstIFDOffset) return resolve(null);

            const getString = (start, length) => {
              let str = '';
              for (let i = 0; i < length; i++) {
                if (start + i >= view.byteLength) break;
                const charCode = view.getUint8(start + i);
                if (charCode === 0) break;
                str += String.fromCharCode(charCode);
              }
              return str.trim();
            };

            const getRational = (valueOffset) => {
              if (valueOffset + 8 > view.byteLength) return null;
              const num = view.getUint32(valueOffset, littleEndian);
              const den = view.getUint32(valueOffset + 4, littleEndian);
              if (den === 0) return null;
              return num / den;
            };

            const getValue = (type, count, valueOffset, entryOffset) => {
              if (type === 3) {
                return view.getUint16(entryOffset + 8, littleEndian);
              } else if (type === 4) {
                return view.getUint32(entryOffset + 8, littleEndian);
              } else if (type === 5 || type === 10) {
                return getRational(tiffOffset + valueOffset);
              } else if (type === 2) {
                const strOffset = count > 4 ? tiffOffset + valueOffset : entryOffset + 8;
                return getString(strOffset, count);
              }
              return null;
            };

            const readIFD = (ifdStart) => {
              const tags = {};
              if (ifdStart + 2 > view.byteLength) return tags;
              const numEntries = view.getUint16(ifdStart, littleEndian);
              let entryOffset = ifdStart + 2;

              for (let i = 0; i < numEntries; i++) {
                if (entryOffset + 12 > view.byteLength) break;
                const tag = view.getUint16(entryOffset, littleEndian);
                const type = view.getUint16(entryOffset + 2, littleEndian);
                const count = view.getUint32(entryOffset + 4, littleEndian);
                const valueOffset = view.getUint32(entryOffset + 8, littleEndian);

                const val = getValue(type, count, valueOffset, entryOffset);
                if (val !== null && val !== undefined) {
                  tags[tag] = val;
                }
                entryOffset += 12;
              }
              return tags;
            };

            const ifd0Tags = readIFD(tiffOffset + firstIFDOffset);

            let cameraData = {
              make: ifd0Tags[0x010F] || null,
              model: ifd0Tags[0x0110] || null,
              lens: null,
              shutterSpeed: null,
              aperture: null,
              iso: null,
              focalLength: null
            };

            const exifSubIFDOffset = ifd0Tags[0x8769];
            if (exifSubIFDOffset) {
              const exifTags = readIFD(tiffOffset + exifSubIFDOffset);

              if (exifTags[0x920A] !== undefined) {
                const fl = parseFloat(exifTags[0x920A]);
                if (!isNaN(fl) && fl > 0) {
                  cameraData.focalLength = `${Math.round(fl)}mm`;
                  if (exifTags[0xA405]) {
                    cameraData.focalLength += ` (${exifTags[0xA405]}mm eq)`;
                  }
                }
              }

              if (exifTags[0x829A] !== undefined) {
                const expTime = parseFloat(exifTags[0x829A]);
                if (!isNaN(expTime) && expTime > 0) {
                  if (expTime < 1) {
                    cameraData.shutterSpeed = `1/${Math.round(1 / expTime)}s`;
                  } else {
                    cameraData.shutterSpeed = `${expTime.toFixed(1)}s`;
                  }
                }
              }

              if (exifTags[0x829D] !== undefined) {
                const fnum = parseFloat(exifTags[0x829D]);
                if (!isNaN(fnum) && fnum > 0) {
                  cameraData.aperture = `f/${fnum.toFixed(1)}`;
                }
              }

              const isoVal = exifTags[0x8827] || exifTags[0x8833];
              if (isoVal !== undefined) {
                cameraData.iso = `ISO ${isoVal}`;
              }

              if (exifTags[0xA434]) {
                cameraData.lens = exifTags[0xA434];
              }
            }

            if (cameraData.make || cameraData.model || cameraData.focalLength || cameraData.shutterSpeed || cameraData.aperture || cameraData.iso || cameraData.lens) {
              resolve(cameraData);
            } else {
              resolve(null);
            }
          } catch (err) {
            console.warn('EXIF binary parse error:', err);
            resolve(null);
          }
        };
        reader.onerror = () => resolve(null);
        reader.readAsArrayBuffer(slice);
      });
    }

    async function generateFastThumbnail(file, targetSize = 240) {
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: targetSize,
            resizeHeight: targetSize,
            resizeMode: 'aspect-fit'
          });
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'medium';
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();

          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              canvas.width = 0; canvas.height = 0;
              if (blob) {
                resolve({
                  thumbUrl: URL.createObjectURL(blob),
                  width: canvas.width,
                  height: canvas.height
                });
              } else {
                resolve({ thumbUrl: URL.createObjectURL(file), width: 1000, height: 750 });
              }
            }, 'image/jpeg', 0.65);
          });
        }
      } catch (e) {
        console.warn('createImageBitmap fallback:', e);
      }
      return { thumbUrl: URL.createObjectURL(file), width: 1000, height: 750 };
    }

    async function createScreenProxy(file, maxDimension = 2048) {
      if (!file || !(file instanceof File)) return null;
      try {
        if ('createImageBitmap' in window) {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: maxDimension,
            resizeMode: 'aspect-fit'
          });

          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;

          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();

          return new Promise((resolve) => {
            canvas.toBlob((blob) => {
              canvas.width = 0; canvas.height = 0;
              if (blob) {
                resolve(URL.createObjectURL(blob));
              } else {
                resolve(URL.createObjectURL(file));
              }
            }, 'image/jpeg', 0.82);
          });
        }
      } catch (e) {
        console.warn('Screen Proxy creation fallback:', e);
      }
      return URL.createObjectURL(file);
    }

    async function processThumbnailQueue(neededPhotos, updateBatchCallback, progressCallback, signal) {
      let index = 0;
      let completed = 0;
      const total = neededPhotos.length;
      const concurrency = 2;

      let pendingBatch = [];
      let lastFlush = Date.now();

      const flush = () => {
        if (pendingBatch.length > 0) {
          if (!signal?.aborted) updateBatchCallback([...pendingBatch]);
          pendingBatch = [];
          lastFlush = Date.now();
        }
      };

      return new Promise((resolve) => {
        if (!total) return resolve();

        const worker = async () => {
          while (index < total) {
            if (signal?.aborted) break;
            const currentPhoto = neededPhotos[index++];
            let thumbUrl = null;
            try {
              const res = await generateFastThumbnail(currentPhoto.file, 240);
              thumbUrl = res.thumbUrl;
              pendingBatch.push({
                id: currentPhoto.id,
                thumbUrl: res.thumbUrl,
                thumbWidth: res.width,
                thumbHeight: res.height
              });

              if (pendingBatch.length >= 6 || Date.now() - lastFlush > 100) {
                flush();
                await new Promise(r => setTimeout(r, 0));
              }
            } catch (err) {
              console.warn('Thumbnail generation error:', err);
              if (thumbUrl) try { URL.revokeObjectURL(thumbUrl); } catch(e){}
            } finally {
              completed++;
              if (!signal?.aborted) progressCallback(completed, total);
            }
          }
          flush();
        };

        const workers = Array.from({ length: Math.min(concurrency, total) }, () => worker());
        Promise.all(workers).then(() => {
          flush();
          resolve();
        });
      });
    }

    async function evaluatePhotoFocus(fileOrBlobUrl, targetRoi = null) {
      return new Promise(async (resolve) => {
        let focusSpot = null;
        let cropBoxRoi = null;

        if (targetRoi) {
          if (targetRoi.width !== undefined && targetRoi.height !== undefined && targetRoi.x !== undefined) {
            cropBoxRoi = targetRoi;
          } else if (targetRoi.xPct !== undefined) {
            focusSpot = targetRoi;
          }
        }

        let srcToRevoke = null;
        const img = new Image();
        img.crossOrigin = 'anonymous';

        if (typeof fileOrBlobUrl === 'string') {
          img.src = fileOrBlobUrl;
        } else if (fileOrBlobUrl instanceof File || fileOrBlobUrl instanceof Blob) {
          srcToRevoke = URL.createObjectURL(fileOrBlobUrl);
          img.src = srcToRevoke;
        } else {
          return resolve({ score: 5, stars: 3, focusSpot: null });
        }

        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const sampleSize = 300;
            const scale = Math.min(1, sampleSize / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, w, h);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const gray = new Float32Array(w * h);
            for (let i = 0; i < data.length; i += 4) {
              gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            }

            let minX = 1, maxX = w - 1, minY = 1, maxY = h - 1;

            if (cropBoxRoi && cropBoxRoi.width > 0 && cropBoxRoi.height > 0) {
              minX = Math.max(1, Math.round((cropBoxRoi.x / 100) * w));
              maxX = Math.min(w - 1, Math.round(((cropBoxRoi.x + cropBoxRoi.width) / 100) * w));
              minY = Math.max(1, Math.round((cropBoxRoi.y / 100) * h));
              maxY = Math.min(h - 1, Math.round(((cropBoxRoi.y + cropBoxRoi.height) / 100) * h));
            } else if (focusSpot && focusSpot.xPct) {
              const cx = (focusSpot.xPct / 100) * w;
              const cy = (focusSpot.yPct / 100) * h;
              const rw = ((focusSpot.widthPct || 20) / 100) * w;
              const rh = ((focusSpot.heightPct || 20) / 100) * h;

              minX = Math.max(1, Math.round(cx - rw / 2));
              maxX = Math.min(w - 1, Math.round(cx + rw / 2));
              minY = Math.max(1, Math.round(cy - rh / 2));
              maxY = Math.min(h - 1, Math.round(cy + rh / 2));
            } else {
              let maxVar = -1;
              let bestX = 50, bestY = 50;
              const gridCols = 5, gridRows = 5;
              const tileW = Math.floor(w / gridCols);
              const tileH = Math.floor(h / gridRows);

              for (let gy = 0; gy < gridRows; gy++) {
                for (let gx = 0; gx < gridCols; gx++) {
                  let lSum = 0, lSqSum = 0, count = 0;
                  const startX = Math.max(1, gx * tileW);
                  const endX = Math.min(w - 1, (gx + 1) * tileW);
                  const startY = Math.max(1, gy * tileH);
                  const endY = Math.min(h - 1, (gy + 1) * tileH);

                  for (let y = startY; y < endY; y++) {
                    for (let x = startX; x < endX; x++) {
                      const idx = y * w + x;
                      const lap = (-4 * gray[idx] + gray[idx - 1] + gray[idx + 1] + gray[idx - w] + gray[idx + w]);
                      lSum += lap;
                      lSqSum += lap * lap;
                      count++;
                    }
                  }
                  const mean = count > 0 ? lSum / count : 0;
                  const v = count > 0 ? (lSqSum / count) - (mean * mean) : 0;
                  if (v > maxVar) {
                    maxVar = v;
                    bestX = Math.round(((gx + 0.5) / gridCols) * 100);
                    bestY = Math.round(((gy + 0.5) / gridRows) * 100);
                  }
                }
              }

              focusSpot = {
                xPct: bestX,
                yPct: bestY,
                widthPct: 20,
                heightPct: 20,
                source: 'Spatial Laplacian Micro-Contrast Peak'
              };

              const cx = (focusSpot.xPct / 100) * w;
              const cy = (focusSpot.yPct / 100) * h;
              const rw = ((focusSpot.widthPct || 20) / 100) * w;
              const rh = ((focusSpot.heightPct || 20) / 100) * h;

              minX = Math.max(1, Math.round(cx - rw / 2));
              maxX = Math.min(w - 1, Math.round(cx + rw / 2));
              minY = Math.max(1, Math.round(cy - rh / 2));
              maxY = Math.min(h - 1, Math.round(cy + rh / 2));
            }

            if (maxX <= minX) maxX = Math.min(w - 1, minX + 5);
            if (maxY <= minY) maxY = Math.min(h - 1, minY + 5);

            let laplacianSum = 0;
            let laplacianSqSum = 0;
            let count = 0;

            for (let y = minY; y < maxY; y++) {
              for (let x = minX; x < maxX; x++) {
                const idx = y * w + x;
                const lap = (
                  -4 * gray[idx] +
                  gray[idx - 1] + gray[idx + 1] +
                  gray[idx - w] + gray[idx + w]
                );
                laplacianSum += lap;
                laplacianSqSum += lap * lap;
                count++;
              }
            }

            const mean = count > 0 ? laplacianSum / count : 0;
            const variance = count > 0 ? (laplacianSqSum / count) - (mean * mean) : 0;

            let score = Math.min(10, Math.max(1, Math.round(Math.log2(Math.max(1, variance / 25)) * 2.2)));
            if (isNaN(score)) score = 5;

            const stars = scoreToStars(score);

            if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
            canvas.width = 0; canvas.height = 0;
            resolve({ score, stars, focusSpot });
          } catch (err) {
            if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
            resolve({ score: 5, stars: 3, focusSpot: null });
          }
        };

        img.onerror = () => {
          if (srcToRevoke) URL.revokeObjectURL(srcToRevoke);
          resolve({ score: 5, stars: 3, focusSpot: null });
        };
      });
    }

    function CroppedImage({ src, alt, cropBox, photo = null, className = "", imgClassName = "", innerRef = null, fitMode = "contain", children = null }) {
      const [imgError, setImgError] = useState(false);
      const [imgDims, setImgDims] = useState({
        w: (photo?.naturalWidth && photo.naturalWidth > 300) ? photo.naturalWidth : 1000,
        h: (photo?.naturalHeight && photo.naturalHeight > 300) ? photo.naturalHeight : 750
      });

      useEffect(() => {
        setImgError(false);
        if (src) {
          const img = new Image();
          img.onload = () => {
            if (img.naturalWidth > 0 && img.naturalHeight > 0) {
              setImgDims({ w: img.naturalWidth, h: img.naturalHeight });
            }
          };
          img.onerror = () => setImgError(true);
          img.src = src;
        }
      }, [src]);

      const naturalW = imgDims.w;
      const naturalH = imgDims.h;

      const aspect = useMemo(() => {
        const baseAspect = naturalW / naturalH;
        if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
          return (cropBox.width / cropBox.height) * baseAspect;
        }
        return baseAspect;
      }, [cropBox, naturalW, naturalH]);

      const frameStyle = useMemo(() => {
        if (!aspect || fitMode !== "contain") return {};
        return {
          aspectRatio: `${aspect}`,
          maxWidth: '100%',
          maxHeight: '100%',
          width: 'auto',
          height: 'auto'
        };
      }, [aspect, fitMode]);

      const preserveAspect = fitMode === "cover" ? "xMidYMid slice" : "xMidYMid meet";

      if (imgError || !src) {
        return (
          <div className={`relative overflow-hidden flex flex-col items-center justify-center bg-slate-950 p-4 text-center select-none ${className}`} style={frameStyle}>
            <Icon name="image" className="w-8 h-8 text-slate-600 mb-1" />
            <span className="text-[10px] text-emerald-400 font-semibold bg-emerald-950/80 px-2 py-1 rounded border border-emerald-500/30">
              📁 Re-select source folder for 1:1 preview
            </span>
          </div>
        );
      }

      if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
        const cropX = (cropBox.x / 100) * naturalW;
        const cropY = (cropBox.y / 100) * naturalH;
        const cropW = (cropBox.width / 100) * naturalW;
        const cropH = (cropBox.height / 100) * naturalH;

        const finalSrc = photo?.blobUrl || src;

        return (
          <div 
            className={`relative overflow-hidden flex items-center justify-center bg-slate-950 select-none ${className}`}
            style={frameStyle}
          >
            <svg
              ref={innerRef}
              viewBox={`${cropX} ${cropY} ${cropW} ${cropH}`}
              preserveAspectRatio={preserveAspect}
              className={`w-full h-full block ${imgClassName}`}
              draggable="false"
              onDragStart={(e) => e.preventDefault()}
            >
              <image
                href={finalSrc}
                x="0"
                y="0"
                width={naturalW}
                height={naturalH}
                onError={() => setImgError(true)}
              />
            </svg>
            {children}
          </div>
        );
      }

      return (
        <div 
          className={`relative overflow-hidden flex items-center justify-center bg-slate-950 select-none ${className}`}
          style={frameStyle}
        >
          <img
            ref={innerRef}
            src={src}
            alt={alt}
            decoding="async"
            draggable="false"
            onDragStart={(e) => e.preventDefault()}
            onError={() => setImgError(true)}
            className={`${fitMode === 'cover' ? 'w-full h-full object-cover' : 'w-full h-full object-contain'} ${imgClassName}`}
          />
          {children}
        </div>
      );
    }

    async function identifyBirdWithGemini(photo, customApiKey = '', cropBox = null, locationText = 'Global') {
      const rawKey = customApiKey || localStorage.getItem('birdvault_gemini_token') || '';
      const apiKey = rawKey.trim().replace(/[\r\n\t]/g, '');

      if (!apiKey) {
        return { 
          error: 'MISSING_KEY', 
          message: 'A Google Gemini API key is required to identify bird species.' 
        };
      }

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

      try {
        const base64Data = await new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let sx = 0, sy = 0, sw = img.width, sh = img.height;
            if (cropBox && cropBox.width > 0 && cropBox.height > 0) {
              sx = (cropBox.x / 100) * img.width;
              sy = (cropBox.y / 100) * img.height;
              sw = (cropBox.width / 100) * img.width;
              sh = (cropBox.height / 100) * img.height;
            }
            
            const maxDim = 2048;
            let targetW = sw;
            let targetH = sh;
            if (targetW > maxDim || targetH > maxDim) {
              const r = Math.min(maxDim / targetW, maxDim / targetH);
              targetW *= r;
              targetH *= r;
            }

            canvas.width = Math.max(10, Math.round(targetW));
            canvas.height = Math.max(10, Math.round(targetH));
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            canvas.width = 0; canvas.height = 0;
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = reject;
          img.src = photo.blobUrl || photo.thumbnailUrl || photo.url;
        });

        const systemPrompt = `You are a world-class ornithologist and computer vision expert. Identify the bird species in the full-resolution cropped image provided.
GEOGRAPHIC CONTEXT: The photo was taken in or near "${locationText}".
CRITICAL: Restrict your identification and candidates strictly to species native, introduced, or vagrant to "${locationText}". Do NOT identify species from incorrect continents or incompatible biomes.

UNIDENTIFIED / LOW QUALITY RULE:
If the image does NOT contain a bird, or the subject is too blurry/unclear/obscured to identify with reasonable confidence, return a JSON object with an "error" property set to "UNIDENTIFIED" and a "message" explaining the optical or visual reason why species identification is not possible.

Return STRICT JSON ONLY without markdown fences.
JSON Schema:
{
  "speciesName": "Common Name",
  "scientificName": "Scientific Name",
  "category": "Songbirds" | "Raptors" | "Waterfowl" | "Seabirds" | "Waders" | "Parrots" | "Other",
  "confidence": 0.95,
  "description": "Short diagnostic description of key visual identification traits.",
  "habitat": "Primary habitat preferences.",
  "candidates": [
    { "name": "Alternative Species 1", "confidence": 0.4 },
    { "name": "Alternative Species 2", "confidence": 0.2 }
  ],
  "heatmapPoints": [
    { "x": 45, "y": 30, "intensity": 0.9, "label": "Sharp Eye Contrast" },
    { "x": 52, "y": 42, "intensity": 0.8, "label": "Beak Morphology" }
  ]
}`;

        const userPrompt = `Geographic Location Context: ${locationText}. Identify this bird photo, analyze regional species distributions for location "${locationText}", analyze focus points for heatmap, and return strict JSON.`;

        const payload = {
          contents: [{
            parts: [
              { text: userPrompt },
              { inlineData: { mimeType: "image/jpeg", data: base64Data } }
            ]
          }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        recordTokenUsage(320);

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let serverMessage = `HTTP ${response.status}`;
          try {
            const errData = await response.json();
            if (errData.error && errData.error.message) {
              serverMessage = errData.error.message;
            }
          } catch (e) {}

          if (response.status === 402) {
            return {
              error: 'PAYMENT_REQUIRED',
              message: 'Payment Required (HTTP 402): Your Gemini API project has run out of prepaid credits or requires active billing setup in Google AI Studio.'
            };
          }

          if (response.status === 429) {
            return {
              error: 'RATE_LIMIT_EXCEEDED',
              message: 'Gemini API Rate Limit reached (15 Requests/Min or Daily Quota). Allowance resets automatically on minute/daily schedule.'
            };
          }
          if (response.status === 400 || response.status === 401 || response.status === 403) {
            return { 
              error: 'INVALID_KEY', 
              message: `Gemini API Key rejected (${serverMessage}). Please verify your key at Google AI Studio and ensure there are no trailing space characters.` 
            };
          }
          return {
            error: 'API_ERROR',
            message: `Gemini API returned an error: ${serverMessage}`
          };
        }

        const result = await response.json();
        const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleanJson = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();

        let parsed;
        try {
          parsed = JSON.parse(cleanJson);
        } catch (jsonErr) {
          return {
            error: 'UNPARSABLE_RESPONSE',
            message: 'AI returned an unparseable response structure. Please adjust the crop framing or try again.'
          };
        }

        if (parsed.error) {
          return parsed;
        }

        if (parsed.confidence && parsed.confidence < 0.35) {
          return {
            error: 'LOW_CONFIDENCE',
            message: `Identification confidence is too low (${Math.round(parsed.confidence * 100)}%). Try drawing a tighter crop box around diagnostic features like the head or plumage.`
          };
        }

        return parsed;
      } catch (err) {
        return {
          error: 'API_ERROR',
          message: err.message || 'An unexpected error occurred while communicating with Gemini.'
        };
      }
    }

    function InteractivePhotoViewer({ photo, onClose, onUpdatePhoto, onSaveToVault, onDeletePhoto, userApiKey, initialLocation = '', onUpdateLocation, onNextPhoto, onPrevPhoto, hasNext = false, hasPrev = false }) {
      const [loupeImgPos, setLoupeImgPos] = useState({ xPct: 50, yPct: 50 });

      const [isLoupeActive, setIsLoupeActive] = useState(false);
      const [isCropToolActive, setIsCropToolActive] = useState(false);

      const loupeCanvasRef = useRef(null);
      const cachedLoupeImgRef = useRef(null);
      const [loupeImgLoaded, setLoupeImgLoaded] = useState(false);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft' && hasPrev && onPrevPhoto) {
            onPrevPhoto();
          } else if (e.key === 'ArrowRight' && hasNext && onNextPhoto) {
            onNextPhoto();
          } else if (e.key === 'Escape' && onClose) {
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [hasPrev, hasNext, onPrevPhoto, onNextPhoto, onClose]);

      const activeBlobUrl = useMemo(() => {
        if (photo.blobUrl) return photo.blobUrl;
        if (photo.file) return URL.createObjectURL(photo.file);
        if (photo.thumbnailUrl) return photo.thumbnailUrl;
        if (photo.url) return photo.url;
        return null;
      }, [photo.id, photo.blobUrl, photo.file, photo.thumbnailUrl, photo.url]);

      useEffect(() => {
        setLoupeImgLoaded(false);
        if (!activeBlobUrl) return;

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          cachedLoupeImgRef.current = img;
          setLoupeImgLoaded(true);
        };
        img.onerror = () => {
          setLoupeImgLoaded(false);
        };
        img.src = activeBlobUrl;
      }, [activeBlobUrl]);

      useEffect(() => {
        if (!photo.blobUrl && photo.file) {
          createScreenProxy(photo.file, 2048).then((proxyUrl) => {
            if (proxyUrl) onUpdatePhoto({ ...photo, blobUrl: proxyUrl });
          });
        }
      }, [photo.id]);

      const [panZoom, setPanZoom] = useState({ scale: 1, x: 0, y: 0 });

      const [cropBox, setCropBox] = useState(photo.cropBox || null);
      const [showCroppedPreview, setShowCroppedPreview] = useState(!!(photo.cropBox && photo.cropBox.width > 0));
      const [isDrawingCrop, setIsDrawingCrop] = useState(false);
      const cropStartRef = useRef(null);
      const currentCropBoxRef = useRef(photo.cropBox || null);
      const containerRef = useRef(null);
      const imgRef = useRef(null);

      const [identifying, setIdentifying] = useState(false);
      const [aiResult, setAiResult] = useState(photo.identification || null);
      const [locationInput, setLocationInput] = useState(photo.locationText || initialLocation || 'Auckland, New Zealand');

      const [evaluatingFocus, setEvaluatingFocus] = useState(false);
      const [cameraExif, setCameraExif] = useState(photo.cameraExif || null);

      const activeStars = photo.userStars || photo.stars || scoreToStars(photo.sharpness);
      const isZoomedOrCropped = showCroppedPreview || panZoom.scale > 1 || isLoupeActive;

      useEffect(() => {
        setCropBox(photo.cropBox || null);
        currentCropBoxRef.current = photo.cropBox || null;
        setShowCroppedPreview(!!(photo.cropBox && photo.cropBox.width > 0));
      }, [photo.id]);

      useEffect(() => {
        if (photo.sharpness === null && !evaluatingFocus) {
          setEvaluatingFocus(true);
          evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl || photo.url, photo.cropBox || photo.focusSpot).then((res) => {
            const updated = {
              ...photo,
              sharpness: res.score,

              focusSpot: res.focusSpot
            };
            onUpdatePhoto(updated);
            saveFingerprintMetadata(updated);
            setEvaluatingFocus(false);
          });
        }
      }, [photo]);

      useEffect(() => {
        if (!cameraExif && photo.file) {
          extractCameraExif(photo.file).then((data) => {
            if (data) {
              setCameraExif(data);
              const updated = { ...photo, cameraExif: data };
              onUpdatePhoto(updated);
              saveFingerprintMetadata(updated);
            }
          });
        }
      }, [photo.file]);

      const handleLocationChange = (newLoc) => {

        if (onUpdateLocation) {
          onUpdateLocation(newLoc);

          localStorage.setItem('birdvault_user_location', newLoc);

        const updatedPhoto = {
          ...photo,
          userStars: newStars,
          stars: newStars
        };
        onUpdatePhoto(updatedPhoto);
        saveFingerprintMetadata(updatedPhoto);
      };

      const getImagePointerPos = useCallback((e) => {
        if (!imgRef.current) return { pctX: 50, pctY: 50 };
        const rect = imgRef.current.getBoundingClientRect();
        if (!rect.width || !rect.height) return { pctX: 50, pctY: 50 };

        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

        const pctX = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const pctY = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
        return { pctX, pctY, clientX, clientY };
      }, []);

      const getContainerPointerPos = useCallback((e) => {
        if (!containerRef.current) return { x: 0, y: 0, pctX: 50, pctY: 50 };
        const rect = containerRef.current.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        const pctX = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const pctY = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
        return { x: clientX - rect.left, y: clientY - rect.top, pctX, pctY, clientX, clientY };
      }, []);

      const getTouchDistance = (e) => {
        if (!e.touches || e.touches.length < 2) return null;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      };

      const handleTouchStart = (e) => {
        if (e.touches.length === 2 && !isCropToolActive) {
          const dist = getTouchDistance(e);
          initialTouchDistanceRef.current = dist;
          setIsDraggingPan(false);
        } else if (e.touches.length === 1 && !isCropToolActive) {
          const now = Date.now();
          if (now - lastTapRef.current < 300) {
            setPanZoom(p => p.scale > 1 ? { scale: 1, x: 0, y: 0 } : { scale: 2.5, x: 0, y: 0 });
            lastTapRef.current = 0;
            return;
          }
          lastTapRef.current = now;

          if (panZoom.scale > 1) {
            setIsDraggingPan(true);
            const touch = e.touches[0];
            dragStartRef.current = { x: touch.clientX - panZoom.x, y: touch.clientY - panZoom.y };
          }
        }
      };

      const handleTouchMove = (e) => {
        if (e.touches.length === 2 && !isCropToolActive) {
          if (e.cancelable) e.preventDefault();
          const newDist = getTouchDistance(e);
          if (newDist && initialTouchDistanceRef.current) {
            const scaleFactor = newDist / initialTouchDistanceRef.current;
            setPanZoom((p) => {
              const targetScale = Math.min(8, Math.max(1, p.scale * (scaleFactor > 1 ? 1.04 : 0.96)));
              return {
                ...p,
                scale: targetScale,
                x: targetScale === 1 ? 0 : p.x,
                y: targetScale === 1 ? 0 : p.y
              };
            });
            initialTouchDistanceRef.current = newDist;
          }
        } else if (e.touches.length === 1 && isDraggingPan && panZoom.scale > 1 && !isCropToolActive) {
          const touch = e.touches[0];
          setPanZoom(p => ({
            ...p,
            x: touch.clientX - dragStartRef.current.x,
            y: touch.clientY - dragStartRef.current.y
          }));
        }
      };

      const renderLoupeCanvasTile = useCallback(() => {
        if (!isLoupeActive || !loupeCanvasRef.current) return;

        const canvas = loupeCanvasRef.current;
        const ctx = canvas.getContext('2d', { alpha: false });
        const canvasSize = canvas.width || 192;

        const img = cachedLoupeImgRef.current;

        if (!img || !img.complete || img.naturalWidth === 0) {
          ctx.fillStyle = '#090d16';
          ctx.fillRect(0, 0, canvasSize, canvasSize);
          ctx.fillStyle = '#10b981';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Decoding image...', canvasSize / 2, canvasSize / 2);
          return;
        }

        const naturalW = img.naturalWidth;
        const naturalH = img.naturalHeight;

        let normX = (loupeImgPos.xPct !== undefined ? loupeImgPos.xPct : 50) / 100;
        let normY = (loupeImgPos.yPct !== undefined ? loupeImgPos.yPct : 50) / 100;

        if (showCroppedPreview && cropBox && cropBox.width > 0) {
          normX = (cropBox.x / 100) + (normX * (cropBox.width / 100));
          normY = (cropBox.y / 100) + (normY * (cropBox.height / 100));
        }

        const cx = normX * naturalW;
        const cy = normY * naturalH;

        let screenWidth = 800;
        if (imgRef.current) {
          const rect = imgRef.current.getBoundingClientRect();
          if (rect.width > 0) screenWidth = rect.width;
        }
        const displayScale = naturalW / screenWidth;

        const sourceW = (canvasSize / Math.max(0.5, zoomLevel)) * displayScale;
        const sourceH = (canvasSize / Math.max(0.5, zoomLevel)) * displayScale;

        const sx = Math.max(0, Math.min(naturalW - sourceW, cx - sourceW / 2));
        const sy = Math.max(0, Math.min(naturalH - sourceH, cy - sourceH / 2));

        ctx.fillStyle = '#040711';
        ctx.fillRect(0, 0, canvasSize, canvasSize);

        ctx.drawImage(
          img,
          sx,
          sy,
          Math.min(sourceW, naturalW - sx),
          Math.min(sourceH, naturalH - sy),
          0,
          0,
          canvasSize,
          canvasSize
        );
      }, [isLoupeActive, loupeImgPos, zoomLevel, showCroppedPreview, cropBox, loupeImgLoaded]);

      useEffect(() => {
        if (isLoupeActive) {
          requestAnimationFrame(renderLoupeCanvasTile);
        }
      }, [isLoupeActive, loupeImgPos, zoomLevel, loupeImgLoaded, renderLoupeCanvasTile]);

      const handlePointerMove = (e) => {
        const containerPos = getContainerPointerPos(e);
        const imgPos = getImagePointerPos(e);

        if (isLoupeActive) {
          setLoupeImgPos({ xPct: imgPos.pctX, yPct: imgPos.pctY });
          setLoupeScreenPos({ x: containerPos.x, y: containerPos.y });
        }

        if (isCropToolActive && isDrawingCrop && cropStartRef.current) {
          const startX = cropStartRef.current.x;
          const startY = cropStartRef.current.y;
          const left = Math.min(startX, imgPos.pctX);
          const top = Math.min(startY, imgPos.pctY);
          const width = Math.abs(imgPos.pctX - startX);
          const height = Math.abs(imgPos.pctY - startY);

          const updatedCrop = { x: left, y: top, width, height };
          currentCropBoxRef.current = updatedCrop;
          setCropBox(updatedCrop);
        } else if (isDraggingPan && panZoom.scale > 1) {
          setPanZoom(p => ({
            ...p,
            x: containerPos.clientX - dragStartRef.current.x,
            y: containerPos.clientY - dragStartRef.current.y
          }));
        }
      };

      const handlePointerDown = (e) => {
        if (e.target && e.target.setPointerCapture && e.pointerId !== undefined) {
          try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
        }

        const containerPos = getContainerPointerPos(e);
        const imgPos = getImagePointerPos(e);

        if (isLoupeActive) {
          setLoupeImgPos({ xPct: imgPos.pctX, yPct: imgPos.pctY });
          setLoupeScreenPos({ x: containerPos.x, y: containerPos.y });
        }
        
        if (isCropToolActive) {
          setShowCroppedPreview(false);
          cropStartRef.current = { x: imgPos.pctX, y: imgPos.pctY };
          const initialBox = { x: imgPos.pctX, y: imgPos.pctY, width: 0, height: 0 };
          currentCropBoxRef.current = initialBox;
          setCropBox(initialBox);
          setIsDrawingCrop(true);
        } else if (panZoom.scale > 1) {
          setIsDraggingPan(true);
          dragStartRef.current = { x: containerPos.clientX - panZoom.x, y: containerPos.clientY - panZoom.y };
        }
      };

      const handlePointerUp = async (e) => {
        if (isDrawingCrop) {
          const finalCrop = currentCropBoxRef.current;
          
          if (finalCrop && finalCrop.width >= MIN_CROP_DIMENSION_PCT && finalCrop.height >= MIN_CROP_DIMENSION_PCT) {
            setEvaluatingFocus(true);
            const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl || photo.url, finalCrop);
            
            const updated = {
              ...photo,
              cropBox: finalCrop,
              sharpness: evalRes.score,
              stars: evalRes.stars
            };
            onUpdatePhoto(updated);
            saveFingerprintMetadata(updated);
            setEvaluatingFocus(false);
          } else {
            setCropBox(photo.cropBox || null);
            currentCropBoxRef.current = photo.cropBox || null;
            if (!photo.cropBox) {
              setShowCroppedPreview(false);
            }
          }
          setIsDrawingCrop(false);
        }
        setIsDraggingPan(false);
      };

      const handleWheelZoom = (e) => {
        if (isCropToolActive) return;
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.3 : -0.3;
        setPanZoom(p => {
          const targetScale = Math.min(8, Math.max(1, p.scale + zoomDelta));
          return {
            ...p,
            scale: targetScale,
            x: targetScale === 1 ? 0 : p.x,
            y: targetScale === 1 ? 0 : p.y
          };
        });
      };

      const handleRunAiIdentification = async () => {
        let currentPhoto = photo;
        if (currentPhoto.sharpness === null) {
          setEvaluatingFocus(true);
          const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl || photo.url, photo.cropBox || photo.focusSpot);
          currentPhoto = { ...photo, sharpness: evalRes.score, stars: evalRes.stars, focusSpot: evalRes.focusSpot };
          onUpdatePhoto(currentPhoto);
          saveFingerprintMetadata(currentPhoto);
          setEvaluatingFocus(false);
        }

        setIdentifying(true);
        const result = await identifyBirdWithGemini(currentPhoto, userApiKey, cropBox, locationInput);
        
        if (result && (result.error === 'MISSING_KEY' || result.error === 'INVALID_KEY')) {
          if (window.birdvault_open_auth_modal) {
            window.birdvault_open_auth_modal();
          }
        }

        setAiResult(result);
        setIdentifying(false);
        setShowMobileSidebar(true);
        
        const updated = { ...currentPhoto, identification: result, cropBox: cropBox, locationText: locationInput };
        onUpdatePhoto(updated);
        saveFingerprintMetadata(updated);
      };

      const handleClearCrop = async () => {
        setCropBox(null);
        currentCropBoxRef.current = null;
        setShowCroppedPreview(false);

        setEvaluatingFocus(true);
        const evalRes = await evaluatePhotoFocus(photo.file || photo.blobUrl || photo.thumbnailUrl || photo.url, null);
        
        const updated = {
          ...photo,
          cropBox: null,
          sharpness: evalRes.score,
          stars: evalRes.stars,
          focusSpot: evalRes.focusSpot
        };
        onUpdatePhoto(updated);
        saveFingerprintMetadata(updated);
        setEvaluatingFocus(false);
      };

      const formattedDate = useMemo(() => {
        if (!photo.lastModified) return 'Unknown Date';
        return new Date(photo.lastModified).toLocaleString();
      }, [photo.lastModified]);

      const formattedFileSize = useMemo(() => {
        if (!photo.size) return 'Unknown Size';
        return (photo.size / (1024 * 1024)).toFixed(2) + ' MB';
      }, [photo.size]);

      const loupeRadius = window.innerWidth < 640 ? 72 : 96;
      const loupeDiameter = loupeRadius * 2;

      const hasValidCropBox = cropBox && cropBox.width >= MIN_CROP_DIMENSION_PCT && cropBox.height >= MIN_CROP_DIMENSION_PCT;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col md:flex-row overflow-hidden select-none">
          <div className="flex-1 flex flex-col relative bg-black/80 overflow-hidden h-full">
            
            <div className="h-14 sm:h-16 px-3 sm:px-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 gap-2">
              <div className="flex items-center space-x-2 truncate min-w-0">
                <span className="text-xs sm:text-sm font-semibold text-slate-300 truncate max-w-[120px] sm:max-w-[180px]">{photo.name}</span>
                {evaluatingFocus && (
                  <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full flex items-center space-x-1">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Rating...</span>
                  </span>
                )}
              </div>

              {/* UNIFIED LIGHTBOX TOOLBAR OVERVIEW */}
              <div className="flex items-center space-x-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                <button
                  onClick={() => setIsCropToolActive(!isCropToolActive)}
                  className={`px-3 py-1.5 rounded-lg transition font-medium flex items-center space-x-1.5 ${isCropToolActive ? 'bg-emerald-600 text-white shadow-lg border border-emerald-400/50' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'}`}
                  title="Toggle Crop Box ROI Selector"
                >
                  <Icon name="crop" className="w-3.5 h-3.5" />
                  <span>Crop Box {isCropToolActive ? '(ON)' : '(OFF)'}</span>
                </button>
                
                <button
                  onClick={() => setIsLoupeActive(!isLoupeActive)}
                  className={`px-3 py-1.5 rounded-lg transition font-medium flex items-center space-x-1.5 ${isLoupeActive ? 'bg-emerald-600 text-white shadow-lg border border-emerald-400/50' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'}`}
                  title="Toggle 1:1 Loupe Magnifier Tool"
                >
                  <Icon name="search" className="w-3.5 h-3.5" />
                  <span>Loupe Tool {isLoupeActive ? '(ON)' : '(OFF)'}</span>
                </button>
              </div>

              <div className="flex items-center space-x-1">
                <button
                  onClick={() => setShowMobileSidebar(!showMobileSidebar)}
                  className="md:hidden p-2 text-slate-300 hover:text-white rounded-lg bg-slate-800 flex items-center justify-center touch-manipulation"
                >
                  <Icon name="info" className="w-5 h-5 text-emerald-400" />
                </button>
                <button onClick={onClose} className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 touch-manipulation">
                  <Icon name="x" className="w-6 h-6" />
                </button>
              </div>
            </div>

            <div
              ref={containerRef}
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerCancel={handlePointerUp}
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onWheel={handleWheelZoom}
              className={`flex-1 relative flex items-center justify-center p-2 sm:p-4 overflow-hidden select-none ${isCropToolActive ? 'cursor-crosshair' : 'cursor-default'} touch-canvas`}
            >
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (onDeletePhoto) onDeletePhoto(photo.id);
                }}
                onPointerDown={(e) => e.stopPropagation()}
                onMouseDown={(e) => e.stopPropagation()}
                onTouchStart={(e) => e.stopPropagation()}
                className="absolute top-3 left-3 sm:top-4 sm:left-4 z-30 p-2 sm:p-2.5 bg-slate-900/80 hover:bg-red-600 text-slate-300 hover:text-white rounded-full border border-slate-700/80 shadow-xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center touch-manipulation"
                title="Delete photo"
              >
                <Icon name="trash" className="w-4 h-4 sm:w-5 sm:h-5 text-red-400 hover:text-white" />
              </button>

              <div 
                onClick={(e) => e.stopPropagation()}
                onPointerDown={(e) => e.stopPropagation()}
                onMouseDown={(e) => e.stopPropagation()}
                onTouchStart={(e) => e.stopPropagation()}
                className="absolute bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-30 px-3.5 py-1.5 sm:px-4 sm:py-2 bg-slate-900/90 hover:bg-slate-900 backdrop-blur-md border border-slate-700/80 rounded-full shadow-2xl flex items-center space-x-2 transition-all"
              >
                <span className="text-[10px] sm:text-xs font-bold text-slate-300">Rating:</span>
                <StarRating
                  rating={activeStars}
                  onChange={handleRatingChange}
                  size="w-4 h-4 sm:w-5 sm:h-5"
                />
              </div>

              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (hasPrev && onPrevPhoto) onPrevPhoto();
                }}
                onPointerDown={(e) => e.stopPropagation()}
                onMouseDown={(e) => e.stopPropagation()}
                onTouchStart={(e) => e.stopPropagation()}
                disabled={!hasPrev}
                className={`absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 z-30 p-2 sm:p-3 rounded-full border shadow-2xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center touch-manipulation ${
                  hasPrev
                    ? 'bg-slate-900/80 hover:bg-emerald-600 text-slate-200 hover:text-white border-slate-700/80 cursor-pointer'
                    : 'bg-slate-900/40 text-slate-600 border-slate-800/40 cursor-not-allowed opacity-40'
                }`}
                title={hasPrev ? "Previous photo (Left Arrow)" : "No previous photo"}
              >
                <Icon name="chevronLeft" className="w-5 h-5 sm:w-6 sm:h-6" />
              </button>

              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (hasNext && onNextPhoto) onNextPhoto();
                }}
                onPointerDown={(e) => e.stopPropagation()}
                onMouseDown={(e) => e.stopPropagation()}
                onTouchStart={(e) => e.stopPropagation()}
                disabled={!hasNext}
                className={`absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 z-30 p-2 sm:p-3 rounded-full border shadow-2xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center touch-manipulation ${
                  hasNext
                    ? 'bg-slate-900/80 hover:bg-emerald-600 text-slate-200 hover:text-white border-slate-700/80 cursor-pointer'
                    : 'bg-slate-900/40 text-slate-600 border-slate-800/40 cursor-not-allowed opacity-40'
                }`}
                title={hasNext ? "Next photo (Right Arrow)" : "No next photo"}
              >
                <Icon name="chevronRight" className="w-5 h-5 sm:w-6 sm:h-6" />
              </button>

              {showCroppedPreview && hasValidCropBox && !isDrawingCrop ? (
                <div 
                  className="relative flex items-center justify-center max-h-[calc(100vh-8rem)] max-w-full"
                  style={{ transform: `translate(${panZoom.x}px, ${panZoom.y}px) scale(${panZoom.scale})` }}
                >
                  <CroppedImage
                    innerRef={imgRef}
                    src={activeBlobUrl}
                    alt={photo.name}
                    cropBox={cropBox}
                    photo={photo}
                    fitMode="contain"
                    className="rounded-2xl border border-slate-700 shadow-2xl overflow-hidden"
                  />
                </div>
              ) : (
                <div 
                  className="relative flex items-center justify-center w-full h-full max-w-full max-h-full"
                  style={{ transform: `translate(${panZoom.x}px, ${panZoom.y}px) scale(${panZoom.scale})` }}
                >
                  <CroppedImage
                    innerRef={imgRef}
                    src={activeBlobUrl}
                    alt={photo.name}
                    cropBox={null}
                    photo={photo}
                    fitMode="contain"
                    className="rounded-2xl border border-slate-800 shadow-2xl overflow-hidden"
                  >
                    {cropBox && cropBox.width > 0 && (
                      <div
                        className="absolute border-2 border-emerald-400 bg-emerald-500/20 pointer-events-none z-20 shadow-[0_0_0_9999px_rgba(0,0,0,0.6)]"
                        style={{
                          left: `${cropBox.x}%`,
                          top: `${cropBox.y}%`,
                          width: `${cropBox.width}%`,
                          height: `${cropBox.height}%`
                        }}
                      >
                        <div className="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none opacity-40">
                          <div className="border-r border-b border-emerald-300"></div>
                          <div className="border-r border-b border-emerald-300"></div>
                          <div className="border-b border-emerald-300"></div>
                          <div className="border-r border-b border-emerald-300"></div>
                          <div className="border-r border-b border-emerald-300"></div>
                          <div className="border-b border-emerald-300"></div>
                          <div className="border-r border-emerald-300"></div>
                          <div className="border-r border-emerald-300"></div>
                          <div></div>
                        </div>
                        <span className="absolute -top-6 left-0 bg-emerald-600 text-white text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap shadow flex items-center space-x-1">
                          <span>Crop ROI ({cropBox.width.toFixed(0)}% × {cropBox.height.toFixed(0)}%)</span>
                        </span>
                      </div>
                    )}
                  </CroppedImage>

                  {photo.focusSpot && !isCropToolActive && !isZoomedOrCropped && (
                    <div
                      className="absolute w-12 h-12 -ml-6 -mt-6 border-2 border-sky-400/80 bg-sky-500/10 rounded-full pointer-events-none flex items-center justify-center shadow-lg animate-pulse"
                      style={{ left: `${photo.focusSpot.xPct}%`, top: `${photo.focusSpot.yPct}%` }}
                    >
                      <span className="w-1.5 h-1.5 rounded-full bg-sky-300"></span>
                    </div>
                  )}
                </div>
              )}

              {isLoupeActive && (
                <div
                  className="absolute pointer-events-none z-30"
                  style={{
                    left: `${loupeScreenPos.x}px`,
                    top: `${loupeScreenPos.y}px`,
                    transform: 'translate(-50%, -50%)'
                  }}
                >
                  <canvas
                    ref={loupeCanvasRef}
                    width={loupeDiameter}
                    height={loupeDiameter}
                    className="loupe-lens-canvas w-36 h-36 sm:w-48 sm:h-48 rounded-full border-2 border-emerald-400 bg-slate-950"
                  />
                </div>
              )}

              {aiResult && aiResult.heatmapPoints && showHeatmapOverlay && (
                <div className="absolute inset-0 pointer-events-none">
                  {aiResult.heatmapPoints.map((pt, i) => (
                    <div
                      key={i}
                      className="absolute w-6 h-6 -ml-3 -mt-3 rounded-full bg-emerald-500/40 border-2 border-emerald-400 animate-ping flex items-center justify-center"
                      style={{ left: `${pt.x}%`, top: `${pt.y}%` }}
                      title={pt.label || "Key Feature"}
                    >
                      <span className="w-2 h-2 rounded-full bg-emerald-300"></span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="h-14 bg-slate-900/90 border-t border-slate-800 px-3 sm:px-4 flex items-center justify-between z-20 gap-2 pb-safe sm:pb-0">
              <div className="flex items-center space-x-2">
                {isLoupeActive && (
                  <div className="flex items-center space-x-1.5 sm:space-x-2 border-r border-slate-800 pr-3 mr-1">
                    <span className="text-[10px] sm:text-xs font-semibold text-emerald-400 flex-shrink-0">
                      Loupe:
                    </span>
                    <input
                      type="range"
                      min="1"
                      max="20"
                      step="0.5"
                      value={zoomLevel}
                      onChange={(e) => setZoomLevel(parseFloat(e.target.value))}
                      className="w-20 sm:w-28 accent-emerald-500 h-1.5 cursor-pointer min-w-0"
                    />
                    <span className="text-[11px] sm:text-xs font-bold text-emerald-400 font-mono">
                      {zoomLevel.toFixed(1)}x
                    </span>
                  </div>
                )}

                <div className="flex items-center space-x-1 sm:space-x-2">
                  <button onClick={() => setPanZoom(p => ({ ...p, scale: Math.max(1, p.scale - 0.5), x: p.scale <= 1.5 ? 0 : p.x, y: p.scale <= 1.5 ? 0 : p.y }))} className="p-2 bg-slate-800 rounded text-slate-300 touch-manipulation">
                    <Icon name="zoomOut" className="w-4 h-4" />
                  </button>
                  <span className="text-xs font-semibold text-slate-300 px-1">{(panZoom.scale * 100).toFixed(0)}%</span>
                  <button onClick={() => setPanZoom(p => ({ ...p, scale: Math.min(8, p.scale + 0.5) }))} className="p-2 bg-slate-800 rounded text-slate-300 touch-manipulation">
                    <Icon name="zoomIn" className="w-4 h-4" />
                  </button>
                  <button onClick={() => setPanZoom({ scale: 1, x: 0, y: 0 })} className="text-[10px] sm:text-[11px] bg-slate-800 px-3 py-2 rounded text-slate-400 ml-1 touch-manipulation">
                    Reset
                  </button>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setShowCroppedPreview(!showCroppedPreview)}
                  disabled={!hasValidCropBox}
                  className={`text-[10px] sm:text-xs px-3 py-2 rounded-xl font-semibold transition flex items-center space-x-1.5 touch-manipulation ${
                    !hasValidCropBox 
                      ? 'bg-slate-800/50 text-slate-600 border border-slate-800/80 cursor-not-allowed' 
                      : showCroppedPreview 
                        ? 'bg-emerald-600 text-white shadow-lg' 
                        : 'bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700'
                  }`}

        return map;

          const matchesCat = selectedCategory === 'All' || entry.category === selectedCategory;

                                entry.scientificName.toLowerCase().includes(searchQuery.toLowerCase());

            await navigator.share({
              title: 'BirdVault Lifer Catalog Backup',
              text: 'Complete physical directory export of BirdVault Pro species catalog and photos.',
              files: [zipFile]
            });

            const downloadUrl = URL.createObjectURL(zipFile);

            a.href = downloadUrl;
            a.download = zipFile.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
