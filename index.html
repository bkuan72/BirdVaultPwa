                    <span><span className="sm:hidden">Save Version</span><span className="hidden sm:inline">Commit & Save as Version v{activeVersions.length + 1}</span></span>
                  </button>
                </div>
              </div>
            </Accordion>

            <Accordion 
              title="AI Identification & Species Traits" 
              mobileTitle="Identify"
              icon="sparkles" 
              defaultOpen={true}
              badge={
                aiResult && !aiResult.error ? (
                  <span className="text-[9px] font-bold bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded">
                    {(aiResult.confidence * 100).toFixed(0)}%
                  </span>
                ) : null
              }
            >
              <div className="space-y-3">
                <LocationAutocomplete
                  value={locationInput}
                  onChange={handleLocationChange}
                />

                {aiResult && aiResult.heatmapPoints && (
                  <div className="flex items-center justify-between pt-1">
                    <span className="text-[11px] font-medium text-slate-400">Heatmap Overlay:</span>
                    <button
                      type="button"
                      onClick={() => setShowHeatmapOverlay(!showHeatmapOverlay)}
                      className={`text-[10px] px-3 py-1.5 rounded-lg font-semibold transition touch-manipulation ${showHeatmapOverlay ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                    >
                      {showHeatmapOverlay ? 'Active' : 'Hidden'}
                    </button>
                  </div>
                )}

                {aiResult && !aiResult.error ? (
                  <div className="space-y-2 bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-emerald-400">{aiResult.category}</span>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded font-semibold">
                        {(aiResult.confidence * 100).toFixed(0)}% Match
                      </span>
                    </div>
                    <div>
                      <h4 className="text-sm font-extrabold text-white">{aiResult.speciesName}</h4>
                      <p className="text-[11px] text-slate-400 italic font-mono">{aiResult.scientificName}</p>
                    </div>

                    {aiResult.conservationStatus && (
                      <div className="inline-block bg-emerald-950/80 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded">
                        Status: {aiResult.conservationStatus}
                      </div>
                    )}

                    <p className="text-[11px] text-slate-300 leading-relaxed border-t border-slate-800/80 pt-2">
                      {aiResult.description}
                    </p>

                    {aiResult.habitat && (
                      <div className="text-[10px] text-slate-400 pt-1">
                        <strong className="text-slate-300">Habitat:</strong> {aiResult.habitat}
                      </div>
                    )}

                    {aiResult.diet && (
                      <div className="text-[10px] text-slate-400 pt-0.5">
                        <strong className="text-slate-300">Diet & Foraging:</strong> {aiResult.diet}
                      </div>
                    )}

                    {aiResult.keyTraits && (
                      <div className="text-[10px] text-slate-400 pt-0.5">
                        <strong className="text-slate-300">Field Marks:</strong> {aiResult.keyTraits}
                      </div>
                    )}
                  </div>
                ) : aiResult && aiResult.error ? (
                  <div className="space-y-2 bg-red-950/40 border border-red-500/40 p-3 rounded-xl text-xs">
                    <div className="flex items-center space-x-1.5 text-red-400 font-bold">
                      <Icon name="shield" className="w-4 h-4" />
                      <span>{aiResult.error}</span>
                    </div>
                    <p className="text-slate-300 text-[11px] leading-relaxed">{aiResult.message}</p>
                  </div>
                ) : (
                  <button
                    type="button"
                    onClick={handleRunAiIdentification}
                    disabled={identifying}
                    aria-label={identifying ? 'Identifying species' : 'Identify species with AI'}
                    className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center space-x-1.5 touch-manipulation"
                  >
                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                    <span>{identifying ? <><span className="sm:hidden">Working...</span><span className="hidden sm:inline">Identifying species...</span></> : <><span className="sm:hidden">Identify</span><span className="hidden sm:inline">Run AI Species Identification</span></>}</span>
                  </button>
                )}
              </div>
            </Accordion>

            <Accordion title="Lifer List Vault Sync" mobileTitle="Vault" icon="feather" defaultOpen={!!aiResult}>
              <div className="space-y-2">
                <p className="hidden sm:block text-[11px] text-slate-400 leading-relaxed">
                  Save this sighting & species record into your permanent master life-list catalog.
                </p>
                {isVaultPreview && (
                  <p className="text-[10px] text-slate-400">This image is already saved in the Lifer Vault.</p>
                )}
                <button
                  type="button"
                  disabled={!aiResult || !!aiResult.error || isVaultPreview}
                  aria-label={isVaultPreview ? 'Already viewing a Lifer Vault sighting' : 'Save or update this sighting in the Lifer Vault'}
                  title={isVaultPreview ? 'This photo is already in the Lifer Vault' : 'Save or update this sighting in the Lifer Vault'}
                  onClick={() => onSaveToVault({ ...photo, identification: aiResult, cropBox, focusSpot: photo.focusSpot || cameraExif?.focusArea, locationText: locationInput, stars: activeStars })}
                  className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center space-x-1 touch-manipulation"
                >
                  <Icon name="check" className="w-4 h-4" />
                  <span><span className="sm:hidden">Save to Vault</span><span className="hidden sm:inline">Save / Update Lifer Vault</span></span>
                </button>
              </div>
            </Accordion>
          </div>

          {showCongratModal && congratData && (
            <div className="fixed inset-0 z-[70] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-slate-900 border border-emerald-500/40 rounded-3xl p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4 text-center relative overflow-hidden">
                <div className="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
                
                <div className="w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-3xl mx-auto shadow-lg">
                  🎉
                </div>

                <div className="space-y-1">
                  <span className="text-[10px] uppercase font-extrabold tracking-wider text-emerald-400 bg-emerald-950/80 border border-emerald-500/30 px-2.5 py-1 rounded-full inline-block">
                    New Lifer Species Discovered!
                  </span>
                  <h3 className="text-lg sm:text-xl font-extrabold text-white pt-1">
                    {congratData.result.speciesName}
                  </h3>
                  <p className="text-xs text-slate-400 italic font-mono">
                    {congratData.result.scientificName}
                  </p>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 text-left">
                  Congratulations! This bird species is not currently in your Lifer Vault catalog. Would you like to add this sighting to your permanent master life-list?
                </p>

                <div className="flex flex-col sm:flex-row items-center gap-2 pt-2 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={() => setShowCongratModal(false)}
                    aria-label="Do not add this species to the vault"
                    className="w-full sm:w-1/2 py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl transition touch-manipulation"
                  >
                    <span className="sm:hidden">Not now</span><span className="hidden sm:inline">Do Not Add</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setShowCongratModal(false);
                      onSaveToVault(congratData.photoMeta);
                    }}
                    aria-label="Add sighting to Lifer Vault"
                    title={isVaultPreview ? 'This image is already in the Lifer Vault' : 'Add sighting to Lifer Vault'}
                    disabled={isVaultPreview}
                    className="w-full sm:w-1/2 py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center space-x-1.5 touch-manipulation"
                  >
                    <Icon name="check" className="w-4 h-4" />
                    <span><span className="sm:hidden">Add to Vault</span><span className="hidden sm:inline">Add to Lifer Vault</span></span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SpeciesVaultCard({ entry, workspacePhotosMap, vaultImageUrls, ensureVaultImage, isExpanded, onToggleExpand, onDeleteSpecies, onDeleteSighting, onSelectPhoto }) {
      const [selectedSightingId, setSelectedSightingId] = useState(entry.sightings[0]?.id || null);
      const [timelinePage, setTimelinePage] = useState(1);

      const totalTimelinePages = Math.ceil(entry.sightings.length / TIMELINE_PAGE_SIZE) || 1;

      useEffect(() => {
        if (timelinePage > totalTimelinePages) {
          setTimelinePage(Math.max(1, totalTimelinePages));
        }
      }, [entry.sightings.length, totalTimelinePages, timelinePage]);

      const paginatedSightings = useMemo(() => {
        const start = (timelinePage - 1) * TIMELINE_PAGE_SIZE;
        return entry.sightings.slice(start, start + TIMELINE_PAGE_SIZE);
      }, [entry.sightings, timelinePage]);

      const activeSighting = useMemo(() => {
        return entry.sightings.find(s => s.id === selectedSightingId) || entry.sightings[0] || {};
      }, [entry.sightings, selectedSightingId]);

      const savedPhoto = activeSighting.photo || {};
      const fpId = activeSighting.photoFingerprintId || savedPhoto.fingerprintId || savedPhoto.id;

      const livePhoto = workspacePhotosMap.get(fpId);
      const sightingKey = `${entry.category}_${entry.speciesName}_${activeSighting.id}`;
      const hydratedImage = vaultImageUrls[sightingKey];
      const photoCropBox = activeSighting.cropBox ?? savedPhoto.cropBox ?? livePhoto?.cropBox ?? null;
      const cropCacheKey = getCropThumbnailCacheKey({
        ...savedPhoto,
        fingerprintId: fpId || savedPhoto.fingerprintId,
        cropBox: photoCropBox
      });
      const hydratedCropKeyMatches = hydratedImage?.cropThumbnailCacheKey === cropCacheKey;
      const hasHydratedCrop = !!(
        hydratedImage?.cropThumbnailUrl &&
        hydratedCropKeyMatches
      );

      const photoObj = useMemo(() => {
        if (livePhoto) return { ...livePhoto, cropBox: photoCropBox };
        if (hydratedImage) {
          return {
            ...savedPhoto,
            cropBox: photoCropBox,
            blobUrl: hydratedImage.sourceUrl,
            thumbnailUrl: hydratedImage.thumbnailUrl || hydratedImage.sourceUrl,
            url: hydratedImage.sourceUrl || hydratedImage.thumbnailUrl
          };
        }
        return { ...savedPhoto, cropBox: photoCropBox };
      }, [livePhoto, hydratedImage, savedPhoto, photoCropBox]);

      let activeSrc = null;
      const liveCropCacheKey = getCropThumbnailCacheKey({ ...livePhoto, cropBox: photoCropBox });
      if (livePhoto?.cropThumbnailUrl && livePhoto.cropThumbnailCacheKey === liveCropCacheKey) {
        activeSrc = livePhoto.cropThumbnailUrl;
      } else if (hasHydratedCrop) {
        activeSrc = hydratedImage.cropThumbnailUrl;
      } else if (livePhoto && (livePhoto.thumbnailUrl || livePhoto.blobUrl || livePhoto.url)) {
        activeSrc = livePhoto.thumbnailUrl || livePhoto.blobUrl || livePhoto.url;
      } else if (hydratedImage) {
        activeSrc = hydratedImage.thumbnailUrl || hydratedImage.sourceUrl;
      } else if (savedPhoto && (savedPhoto.thumbnailUrl || savedPhoto.blobUrl || savedPhoto.url)) {
        activeSrc = savedPhoto.thumbnailUrl || savedPhoto.blobUrl || savedPhoto.url;
      }

      useEffect(() => {
        if (!activeSrc || (photoCropBox && !hydratedCropKeyMatches && livePhoto?.cropThumbnailCacheKey !== cropCacheKey)) {
          ensureVaultImage(entry, activeSighting);
        }
      }, [activeSrc, entry, activeSighting, ensureVaultImage, photoCropBox, hydratedCropKeyMatches, livePhoto, cropCacheKey]);

      const hasActiveFile = !!(photoObj && (photoObj.file || activeSrc));

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-slate-700 transition flex flex-col justify-between">
          <div>
            <div 
              className="h-44 sm:h-52 relative bg-slate-950 overflow-hidden cursor-pointer flex items-center justify-center p-1 touch-manipulation group" 
              onClick={() => hasActiveFile && onSelectPhoto(photoObj, {
                speciesName: entry.speciesName,
                sightingId: activeSighting.id
              })}
            >
              {activeSrc ? (
                <CroppedImage
                  src={activeSrc}
                  alt={entry.speciesName}
                  cropBox={hasHydratedCrop || (livePhoto?.cropThumbnailUrl && livePhoto.cropThumbnailCacheKey === liveCropCacheKey) ? null : photoObj.cropBox}
                  photo={photoObj}
                  fitMode="contain"
                  className="w-full h-full"
                  imgClassName="transition-transform duration-500 group-hover:scale-105"
                />
              ) : (
                <div className="flex flex-col items-center justify-center p-4 text-center space-y-2 h-full w-full bg-slate-950">
                  <Icon name="image" className="w-8 h-8 text-slate-600" />
                  <span className="text-[10px] text-emerald-400 font-semibold bg-emerald-950/80 px-2 py-1 rounded border border-emerald-500/30">
                    Species Record
                  </span>
                </div>
              )}

              <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent pointer-events-none"></div>
              
              <div className="absolute top-2.5 right-2.5 flex items-center space-x-1.5">
                {entry.conservationStatus && (
                  <span className="bg-emerald-950/90 border border-emerald-500/40 text-emerald-300 font-bold text-[10px] px-2 py-0.5 rounded-full shadow">
                    {entry.conservationStatus}
                  </span>
                )}
                <span className="bg-emerald-600/90 backdrop-blur-md text-white font-bold text-[10px] px-2 py-0.5 rounded-full shadow">
                  {entry.category}
                </span>
              </div>

              <span className="absolute bottom-2.5 left-2.5 text-xs font-semibold text-slate-300 pointer-events-none bg-slate-950/80 px-2 py-0.5 rounded-md border border-slate-800">
                {entry.sightings.length} Sighting{entry.sightings.length > 1 ? 's' : ''}
              </span>
            </div>

            <div className="p-3.5 sm:p-4 space-y-3">
              <div className="flex items-start justify-between">
                <div>
                  <h3 className="font-extrabold text-white text-base leading-snug">{entry.speciesName}</h3>
                  <p className="text-xs text-slate-400 italic font-mono">{entry.scientificName}</p>
                </div>
                <button
                  onClick={() => onDeleteSpecies(entry.speciesName)}
                  className="text-slate-500 hover:text-red-400 p-2 -m-2 touch-manipulation"
                  title="Delete Species Record"
                >
                  <Icon name="trash" className="w-4 h-4" />
                </button>
              </div>

              <div className="space-y-2 text-xs bg-slate-950/80 border border-slate-800 p-3 rounded-xl">
                <div className="flex items-center justify-between text-[11px] border-b border-slate-800/80 pb-1.5">
                  <span className="text-slate-400 font-semibold flex items-center space-x-1">
                    <Icon name="book" className="w-3.5 h-3.5 text-emerald-400" />
                    <span>Species Profile</span>
                  </span>
                  <button
                    onClick={onToggleExpand}
                    className="text-emerald-400 hover:underline font-semibold text-[10px] touch-manipulation"
                  >
                    {isExpanded ? 'Show Less' : 'Full Species Details'}
                  </button>
                </div>

                {entry.description && (
                  <p className={`text-[11px] text-slate-300 leading-relaxed ${isExpanded ? '' : 'line-clamp-2'}`}>
                    {entry.description}
                  </p>
                )}

                {isExpanded && (
                  <div className="space-y-2 pt-1 animate-fadeIn">
                    {entry.habitat && (
                      <div className="text-[11px] text-slate-300 bg-slate-900 p-2 rounded-lg border border-slate-800/80">
                        <strong className="text-emerald-400 block mb-0.5">Habitat & Distribution:</strong>
                        {entry.habitat}
                      </div>
                    )}

                    {entry.diet && (
                      <div className="text-[11px] text-slate-300 bg-slate-900 p-2 rounded-lg border border-slate-800/80">
                        <strong className="text-emerald-400 block mb-0.5">Diet & Foraging:</strong>
                        {entry.diet}
                      </div>
                    )}

                    {entry.keyTraits && (
                      <div className="text-[11px] text-slate-300 bg-slate-900 p-2 rounded-lg border border-slate-800/80">
                        <strong className="text-emerald-400 block mb-0.5">Field Marks & Traits:</strong>
                        {entry.keyTraits}
                      </div>
                    )}
                  </div>
                )}
              </div>

              <div className="space-y-1.5 border-t border-slate-800 pt-3">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sightings Timeline</span>
                  <span className="text-[10px] font-mono text-emerald-400">{entry.sightings.length} Logged</span>
                </div>
                <div className="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                  {paginatedSightings.map(s => {
                    const sPhoto = s.photo || {};
                    const cameraExif = sPhoto.cameraExif;
                    const isSelected = s.id === activeSighting.id;
                    const sKey = `${entry.category}_${entry.speciesName}_${s.id}`;
                    const sHydratedImage = vaultImageUrls[sKey];
                    const sFpId = s.photoFingerprintId || sPhoto.fingerprintId || sPhoto.id;
                    const sLivePhoto = workspacePhotosMap.get(sFpId);
                    const sCropBox = s.cropBox ?? sPhoto.cropBox ?? sLivePhoto?.cropBox ?? null;
                    const sCropCacheKey = getCropThumbnailCacheKey({
                      ...sPhoto,
                      fingerprintId: sFpId || sPhoto.fingerprintId,
                      cropBox: sCropBox
                    });
                    const sHydratedCropKeyMatches = sHydratedImage?.cropThumbnailCacheKey === sCropCacheKey;
                    const sHasHydratedCrop = !!(
                      sHydratedImage?.cropThumbnailUrl &&
                      sHydratedCropKeyMatches
                    );

                    let sSrc = null;
                    const sLiveCropCacheKey = getCropThumbnailCacheKey({ ...sLivePhoto, cropBox: sCropBox });
                    if (sLivePhoto?.cropThumbnailUrl && sLivePhoto.cropThumbnailCacheKey === sLiveCropCacheKey) {
                      sSrc = sLivePhoto.cropThumbnailUrl;
                    } else if (sHasHydratedCrop) {
                      sSrc = sHydratedImage.cropThumbnailUrl;
                    } else if (sLivePhoto && (sLivePhoto.thumbnailUrl || sLivePhoto.blobUrl || sLivePhoto.url)) {
                      sSrc = sLivePhoto.thumbnailUrl || sLivePhoto.blobUrl || sLivePhoto.url;
                    } else if (sHydratedImage) {
                      sSrc = sHydratedImage.thumbnailUrl || sHydratedImage.sourceUrl;
                    } else if (sPhoto && (sPhoto.thumbnailUrl || sPhoto.blobUrl || sPhoto.url)) {
                      sSrc = sPhoto.thumbnailUrl || sPhoto.blobUrl || sPhoto.url;
                    }

                    const sPhotoObj = sLivePhoto ? { ...sLivePhoto, cropBox: sCropBox } : (sHydratedImage ? {
                      ...sPhoto,
                      cropBox: sCropBox,
                      blobUrl: sHydratedImage.sourceUrl,
                      thumbnailUrl: sHydratedImage.thumbnailUrl || sHydratedImage.sourceUrl,
                      url: sHydratedImage.sourceUrl || sHydratedImage.thumbnailUrl
                    } : { ...sPhoto, cropBox: sCropBox });

                    return (
                      <div 
                        key={s.id} 
                        onClick={() => {
                          setSelectedSightingId(s.id);
                          ensureVaultImage(entry, s);
                        }}
                        className={`p-2 rounded-xl text-xs border cursor-pointer transition-all flex items-center space-x-2.5 touch-manipulation ${
                          isSelected 
                            ? 'bg-emerald-950/60 border-emerald-500/60 ring-1 ring-emerald-500/30' 
                            : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-slate-900 overflow-hidden flex-shrink-0 border border-slate-800 flex items-center justify-center relative">
                          {sSrc ? (
                            <CroppedImage
                              src={sSrc}
                              alt={sPhoto.name || 'Sighting'}
                              cropBox={sHasHydratedCrop || (sLivePhoto?.cropThumbnailUrl && sLivePhoto.cropThumbnailCacheKey === sLiveCropCacheKey) ? null : sPhotoObj.cropBox}
                              photo={sPhotoObj}
                              fitMode="cover"
                              className="w-full h-full"
                            />
                          ) : (
                            <Icon name="image" className="w-4 h-4 text-slate-600" />
                          )}
                        </div>

                        <div className="flex-1 min-w-0 space-y-0.5">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-1.5 truncate">
                              <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${isSelected ? 'bg-emerald-400' : 'bg-slate-600'}`}></span>
                              <span className={`font-mono text-[11px] font-bold truncate ${isSelected ? 'text-emerald-300' : 'text-slate-200'}`}>
                                {new Date(s.date).toLocaleDateString()}
                              </span>
                            </div>
                            <div className="flex items-center space-x-1 flex-shrink-0">
                              <StarRating
                                rating={sPhoto.userStars || sPhoto.stars || scoreToStars(sPhoto.sharpness)}
                                readOnly={true}
                                size="w-3 h-3"
                              />
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  onDeleteSighting(entry.speciesName, s.id);
                                }}
                                className="text-slate-500 hover:text-red-400 ml-1 p-0.5 touch-manipulation"
                                title="Delete Sighting"
                              >
                                <Icon name="x" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>

                          {sPhoto.locationText && (
                            <div className="text-[10px] text-slate-400 flex items-center space-x-1 truncate pl-3">
                              <Icon name="mapPin" className="w-3 h-3 text-emerald-400 flex-shrink-0" />
                              <span className="truncate">{sPhoto.locationText}</span>
                            </div>
                          )}

                          {cameraExif && (
                            <div className="flex items-center space-x-1.5 text-[9px] font-mono text-slate-500 pt-0.5 pl-3 truncate">
                              {cameraExif.shutterSpeed && <span>{cameraExif.shutterSpeed}</span>}
                              {cameraExif.aperture && <span>• {cameraExif.aperture}</span>}
                              {cameraExif.iso && <span>• {cameraExif.iso}</span>}
                              {cameraExif.focalLength && <span>• {cameraExif.focalLength}</span>}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {totalTimelinePages > 1 && (
                  <div className="flex items-center justify-between pt-1.5 text-[10px] border-t border-slate-800/80">
                    <button
                      type="button"
                      disabled={timelinePage === 1}
                      onClick={(e) => {
                        e.stopPropagation();
                        setTimelinePage(p => Math.max(1, p - 1));
                      }}
                      className="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-slate-300 rounded font-semibold transition touch-manipulation"
                    >
                      ← Prev
                    </button>
                    <span className="text-slate-400 font-mono">
                      Page <strong className="text-slate-200">{timelinePage}</strong> / {totalTimelinePages}
                    </span>
                    <button
                      type="button"
                      disabled={timelinePage === totalTimelinePages}
                      onClick={(e) => {
                        e.stopPropagation();
                        setTimelinePage(p => Math.min(totalTimelinePages, p + 1));
                      }}
                      className="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-slate-300 rounded font-semibold transition touch-manipulation"
                    >
                      Next →
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function LiferVaultView({ vaultEntries, photos = [], onDeleteSighting, onDeleteSpecies, onSelectPhoto }) {
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [expandedSpecies, setExpandedSpecies] = useState(null);
      const [vaultImageUrls, setVaultImageUrls] = useState({});
      const vaultImageUrlsRef = useRef(new Map());
      const vaultImageObjectUrlsRef = useRef(new Set());
      const vaultImageLoadsRef = useRef(new Map());
      const vaultImageQueueRef = useRef({ active: 0, pending: [] });
      const vaultImageMountedRef = useRef(true);
      const [vaultPage, setVaultPage] = useState(1);
      const vaultGridScrollRef = useRef(null);

      useEffect(() => {
        if (vaultGridScrollRef.current) vaultGridScrollRef.current.scrollTop = 0;
      }, [vaultPage]);

      useEffect(() => {
        vaultImageMountedRef.current = true;
        return () => {
          vaultImageMountedRef.current = false;
          vaultImageObjectUrlsRef.current.forEach(url => {
            try { URL.revokeObjectURL(url); } catch(e){}
          });
          vaultImageObjectUrlsRef.current.clear();
          vaultImageUrlsRef.current.clear();
        };
      }, []);

      const workspacePhotosMap = useMemo(() => {
        const map = new Map();
        (photos || []).forEach(p => {
          if (p.fingerprintId) map.set(p.fingerprintId, p);
          if (p.id) map.set(p.id, p);
        });
        return map;
      }, [photos]);

      const ensureVaultImage = useCallback((entry, sighting) => {
        if (!sighting?.id) return Promise.resolve(null);
        const key = `${entry.category}_${entry.speciesName}_${sighting.id}`;
        const savedPhoto = sighting.photo || {};
        const fingerprintId = sighting.photoFingerprintId || savedPhoto.fingerprintId || savedPhoto.id;
        const livePhoto = workspacePhotosMap.get(fingerprintId);
        const cropBox = sighting.cropBox ?? savedPhoto.cropBox ?? livePhoto?.cropBox ?? null;
        const thumbnailPhoto = {
          ...savedPhoto,
          ...livePhoto,
          id: livePhoto?.id || savedPhoto.id || fingerprintId || sighting.id,
          fingerprintId: fingerprintId || livePhoto?.fingerprintId,
          cropBox
        };
        const cropCacheKey = getCropThumbnailCacheKey(thumbnailPhoto);
        const liveCropCacheKey = getCropThumbnailCacheKey({ ...livePhoto, cropBox });
        if (livePhoto && (!cropBox || (livePhoto.cropThumbnailUrl && livePhoto.cropThumbnailCacheKey === liveCropCacheKey))) {
          return Promise.resolve(null);
        }
        const cachedUrl = vaultImageUrlsRef.current.get(key);
        if (cachedUrl && cachedUrl.cropThumbnailCacheKey === cropCacheKey) {
          return Promise.resolve(cachedUrl);
        }
        const existingLoad = vaultImageLoadsRef.current.get(key);
        if (existingLoad) return existingLoad;

        const opfsName = sighting.opfsFileName || savedPhoto.opfsFileName || savedPhoto.name;
        if (!livePhoto?.file && !opfsName) return Promise.resolve(null);

        const promise = new Promise(resolve => {
          const queue = vaultImageQueueRef.current;
          const runNext = () => {
            while (queue.active < 3 && queue.pending.length) {
              const task = queue.pending.shift();
              queue.active++;
              task().finally(() => {
                queue.active--;
                runNext();
              });
            }
          };

          queue.pending.push(async () => {
            if (!vaultImageMountedRef.current) {
              resolve(null);
              vaultImageLoadsRef.current.delete(key);
              return;
            }
            try {
              const sourceBlob = livePhoto?.file || await getOpfsSightingFileBlob(entry.category || 'Other', entry.speciesName, opfsName);
              if (!sourceBlob) {
                console.warn(`Could not load vault image "${opfsName}" for ${entry.speciesName}.`);
                resolve(null);
                return;
              }
              if (!vaultImageMountedRef.current) {
                resolve(null);
                return;
              }
              const generated = await generateFastThumbnail({ ...thumbnailPhoto, file: sourceBlob }, 320);
              if (!vaultImageMountedRef.current) {
                [generated.thumbUrl, generated.cropThumbUrl].forEach(url => {
                  if (url?.startsWith('blob:')) URL.revokeObjectURL(url);
                });
                resolve(null);
                return;
              }
              const ownsSourceUrl = !livePhoto?.blobUrl && !livePhoto?.url;
              const sourceUrl = livePhoto?.blobUrl || livePhoto?.url || URL.createObjectURL(sourceBlob);
              const image = {
                sourceUrl,
                thumbnailUrl: generated.thumbUrl,
                cropThumbnailUrl: generated.cropThumbUrl,
                cropThumbnailCacheKey: generated.cropCacheKey ?? cropCacheKey
              };
              [ownsSourceUrl ? sourceUrl : null, generated.thumbUrl, generated.cropThumbUrl].forEach(url => {
                if (url?.startsWith('blob:')) vaultImageObjectUrlsRef.current.add(url);
              });
              const previousImage = vaultImageUrlsRef.current.get(key);
              if (previousImage) {
                [previousImage.sourceUrl, previousImage.thumbnailUrl, previousImage.cropThumbnailUrl].forEach(url => {
                  if (url?.startsWith('blob:')) vaultImageObjectUrlsRef.current.add(url);
                });
              }
              vaultImageUrlsRef.current.set(key, image);
              setVaultImageUrls(prev => ({ ...prev, [key]: image }));
              resolve(image);
            } catch (err) {
              console.warn(`Could not load vault image "${opfsName}" for ${entry.speciesName}:`, err);
              resolve(null);
            } finally {
              vaultImageLoadsRef.current.delete(key);
            }
          });
          runNext();
        });
        vaultImageLoadsRef.current.set(key, promise);
        return promise;
      }, [workspacePhotosMap]);

      const categories = useMemo(() => {
        const cats = new Set(vaultEntries.map(e => e.category || 'Other'));
        return ['All', ...Array.from(cats)];
      }, [vaultEntries]);

      const filteredEntries = useMemo(() => {
        return vaultEntries.filter(entry => {
          const matchesCat = selectedCategory === 'All' || entry.category === selectedCategory;
          const matchesSearch = entry.speciesName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                entry.scientificName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                (entry.description && entry.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                (entry.habitat && entry.habitat.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCat && matchesSearch;
        });
      }, [vaultEntries, selectedCategory, searchQuery]);

      const vaultNavigationItems = useMemo(
        () => filteredEntries.flatMap(entry =>
          (entry.sightings || []).map(sighting => ({ entry, sighting }))
        ),
        [filteredEntries]
      );

      useEffect(() => {
        setVaultPage(1);
      }, [selectedCategory, searchQuery]);

      const totalVaultPages = Math.ceil(filteredEntries.length / VAULT_PAGE_SIZE) || 1;

      useEffect(() => {
        if (vaultPage > totalVaultPages) {
          setVaultPage(Math.max(1, totalVaultPages));
        }
      }, [filteredEntries.length, totalVaultPages, vaultPage]);

      const paginatedVaultEntries = useMemo(() => {
        const start = (vaultPage - 1) * VAULT_PAGE_SIZE;
        return filteredEntries.slice(start, start + VAULT_PAGE_SIZE);
      }, [filteredEntries, vaultPage]);

      return (
        <div className="flex-1 flex flex-col overflow-hidden min-h-0 p-3 sm:p-4 md:p-6 gap-3 sm:gap-4 pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-4">
          <div className="flex-shrink-0 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-3 bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-2xl shadow-xl">
              <div>
                <h2 className="text-base sm:text-xl font-extrabold text-white flex items-center space-x-2">
                  <Icon name="feather" className="w-5 h-5 sm:w-6 sm:h-6 text-emerald-400" />
                  <span>Lifer Species List Vault</span>
                </h2>
                <p className="hidden sm:block text-[11px] sm:text-xs text-slate-400">Master life-list species catalog displaying taxonomic records, species traits, and sighting timelines</p>
              </div>

              <div className="flex items-center space-x-2 w-full sm:w-auto">
                <div className="relative flex-1 sm:w-64">
                  <Icon name="search" className="w-3.5 h-3.5 sm:w-4 sm:h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                  <input
                    type="text"
                    placeholder="Search species, scientific name, or traits..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-slate-950 border border-slate-800 rounded-xl pl-8 sm:pl-9 pr-3 sm:pr-4 py-1.5 sm:py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full"
                  />
                </div>

              </div>
            </div>

            <div className="flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3.5 sm:px-4 py-1 sm:py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition flex-shrink-0 touch-manipulation ${selectedCategory === cat ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'}`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          <div ref={vaultGridScrollRef} className="flex-1 overflow-y-auto min-h-0 pr-1 pb-4">
            {filteredEntries.length > 0 ? (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                  {paginatedVaultEntries.map(entry => (
                    <SpeciesVaultCard
                      key={entry.speciesName}
                      entry={entry}
                      workspacePhotosMap={workspacePhotosMap}
                      vaultImageUrls={vaultImageUrls}
                      ensureVaultImage={ensureVaultImage}
                      isExpanded={expandedSpecies === entry.speciesName}
                      onToggleExpand={() => setExpandedSpecies(expandedSpecies === entry.speciesName ? null : entry.speciesName)}
                      onDeleteSpecies={onDeleteSpecies}
                      onDeleteSighting={onDeleteSighting}
                      onSelectPhoto={(photo, vaultRef) =>
                        onSelectPhoto(photo, vaultRef, vaultNavigationItems)
                      }
                    />
                  ))}
                </div>

                {totalVaultPages > 1 && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-2 sm:p-4 flex items-center justify-between gap-2 shadow-xl">
                    <span className="text-[10px] sm:text-xs font-semibold text-slate-300 whitespace-nowrap">
                      <span className="sm:hidden">
                        <strong className="text-white">{vaultPage}</strong> / <strong className="text-white">{totalVaultPages}</strong>
                      </span>
                      <span className="hidden sm:inline">
                        Page <strong className="text-white">{vaultPage}</strong> of <strong className="text-white">{totalVaultPages}</strong> ({filteredEntries.length} Species total)
                      </span>
                    </span>

                    <div className="flex items-center space-x-1.5 sm:space-x-2 flex-shrink-0">
                      <button
                        onClick={() => setVaultPage(p => Math.max(1, p - 1))}
                        disabled={vaultPage === 1}
                        aria-label="Previous vault page"
                        className="px-2 sm:px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-slate-200 rounded-xl text-[10px] sm:text-xs font-semibold transition touch-manipulation whitespace-nowrap"
                      >
                        <span className="hidden sm:inline">← Previous 5</span>
                        <span className="sm:hidden">← Prev</span>
                      </button>
                      <button
                        onClick={() => setVaultPage(p => Math.min(totalVaultPages, p + 1))}
                        disabled={vaultPage === totalVaultPages}
                        aria-label="Next vault page"
                        className="px-2 sm:px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-30 disabled:cursor-not-allowed text-white rounded-xl text-[10px] sm:text-xs font-semibold transition shadow touch-manipulation whitespace-nowrap"
                      >
                        <span className="hidden sm:inline">Next 5 →</span>
                        <span className="sm:hidden">Next →</span>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div className="p-8 sm:p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-3xl space-y-3">
                <Icon name="feather" className="w-10 h-10 sm:w-12 sm:h-12 text-slate-600 mx-auto" />
                <h3 className="text-sm sm:text-base font-bold text-slate-300">No Species Records Found</h3>
                <p className="text-[11px] sm:text-xs text-slate-500 max-w-sm mx-auto">Upload wildlife photos in the Culling workspace to run AI species identification and build your Lifer Vault.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function CullingWorkspaceView({
      photos,
      onUpdatePhotos,
      onSelectPhoto,
      userApiKey,
      filterSharpness,
      setFilterSharpness,
      sortBy,
      setSortBy,
      currentPage,
      setCurrentPage,
      processedPhotos,
      isPreviewOpen
    }) {
      const pageSize = BATCH_PAGE_SIZE;

      const [selectedIds, setSelectedIds] = useState(new Set());
      const [showFilterBar, setShowFilterBar] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
      const [loadingThumbnails, setLoadingThumbnails] = useState(false);
      const [thumbnailProgress, setThumbnailProgress] = useState({ current: 0, total: 0 });
      const [rating, setRating] = useState(false);
      const [ratingProgress, setRatingProgress] = useState({ current: 0, total: 0 });
      const [showDeleteConfirmModal, setShowDeleteConfirmModal] = useState(false);
      
      const abortUploadRef = useRef(false);
      const abortRatingRef = useRef(false);
      const fileInputRef = useRef(null);
      const folderInputRef = useRef(null);
      const cullingGridScrollRef = useRef(null);

      useEffect(() => {
        if (cullingGridScrollRef.current) cullingGridScrollRef.current.scrollTop = 0;
      }, [currentPage]);

      const toggleSelectPhoto = (photoId, e) => {
        if (e) e.stopPropagation();
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(photoId)) {
            next.delete(photoId);
          } else {
            next.add(photoId);
          }
          return next;
        });
      };

      const handleSelectAll = () => {
        if (selectedIds.size === processedPhotos.length && processedPhotos.length > 0) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(processedPhotos.map(p => p.id)));
        }
      };

      const handleDeleteSinglePhoto = async (photoId, e) => {
        if (e) e.stopPropagation();
        const photo = photos.find(p => p.id === photoId);
        if (photo) {
          if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
            try {
              await photo.fileHandle.remove();
            } catch (err) {}
          }
          try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (err) {}
          try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (err) {}
          try { if (photo.cropThumbnailUrl) URL.revokeObjectURL(photo.cropThumbnailUrl); } catch (err) {}
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        }
        
        onUpdatePhotos(prev => prev.filter(p => p.id !== photoId));
        setSelectedIds(prev => {
          const next = new Set(prev);
          next.delete(photoId);
          return next;
        });
      };

      const handleOpenFolderPicker = async (e) => {
        if (e) e.preventDefault();

        const isSandboxedIframe = typeof window !== 'undefined' && window.self !== window.top;

        if (!isSandboxedIframe && 'showDirectoryPicker' in window) {
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            setUploading(true);
            setSortBy('default');
            onUpdatePhotos([]);
            setSelectedIds(new Set());
            setCurrentPage(1);
            const fpDb = getStoredFingerprintDb();

            const fileEntries = [];
            for await (const [name, handle] of dirHandle.entries()) {
              if (handle.kind === 'file' && /\.(jpe?g|png|webp|cr2|nef|arw|dng)$/i.test(name)) {
                fileEntries.push({ name, handle });
              }
            }

            setUploadProgress({ current: 0, total: fileEntries.length });

            const total = fileEntries.length;
            const CHUNK_SIZE = 20;

            for (let i = 0; i < total; i += CHUNK_SIZE) {
              const chunkEntries = fileEntries.slice(i, i + CHUNK_SIZE);
              const fileResults = await Promise.allSettled(chunkEntries.map(async entry => {
                const file = await entry.handle.getFile();
                file.handle = entry.handle;
                return file;
              }));
              const chunkFiles = fileResults.flatMap((result, index) => {
                if (result.status === 'fulfilled') return [result.value];
                console.warn(`Could not read folder image "${chunkEntries[index].name}":`, result.reason);
                return [];
              });
              const chunkObjs = chunkFiles.map(file => {
                const fpId = generateFingerprintId(file);
                const savedMeta = fpDb[fpId] || {};
                const photoObj = {
                  id: fpId,
                  fingerprintId: fpId,
                  file: file,
                  fileHandle: file.handle || null,
                  sourceDirectoryHandle: dirHandle,
                  name: file.name,
                  size: file.size,
                  lastModified: file.lastModified,
                  url: null,
                  blobUrl: null,
                  thumbnailUrl: null,
                  naturalWidth: 1000,
                  naturalHeight: 750,
                  sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
                  stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
                  userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
                  focusSpot: savedMeta.focusSpot || savedMeta.cameraExif?.focusArea || null,
                  cameraExif: savedMeta.cameraExif || null,
                  identification: savedMeta.identification || null,
                  cropBox: savedMeta.cropBox || null,
                  locationText: savedMeta.locationText || null,
                  opfsFileName: savedMeta.opfsFileName || null,
                  activeVersionId: savedMeta.activeVersionId || null,
                  versions: savedMeta.versions || null
                };
                saveFingerprintMetadata(photoObj);
                return photoObj;
              });

              onUpdatePhotos(prev => {
                const existingIds = new Set(prev.map(p => p.id));
                const filteredNew = chunkObjs.filter(p => !existingIds.has(p.id));
                return [...prev, ...filteredNew];
              });

              setUploadProgress({ current: Math.min(i + CHUNK_SIZE, total), total });
            }

            setUploading(false);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        if (folderInputRef.current) {
          folderInputRef.current.click();
        } else if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileUpload = async (e) => {
        const rawFiles = Array.from(e.target.files || []);
        const files = rawFiles.filter(file => /\.(jpe?g|png|webp|cr2|nef|arw|dng)$/i.test(file.name));
        if (!files.length) return;

        setUploading(true);
        abortUploadRef.current = false;

        onUpdatePhotos([]);
        setSelectedIds(new Set());
        setCurrentPage(1);

        setSortBy('default');

        setUploadProgress({ current: 0, total: files.length });

        const fpDb = getStoredFingerprintDb();
        const total = files.length;
        const CHUNK_SIZE = 20;

        let isFirstChunk = true;
        for (let i = 0; i < total; i += CHUNK_SIZE) {
          if (abortUploadRef.current) break;
          const chunkFiles = files.slice(i, i + CHUNK_SIZE);
          const chunkObjs = chunkFiles.map(file => {
            const fpId = generateFingerprintId(file);
            const savedMeta = fpDb[fpId] || {};
            const photoObj = {
              id: fpId,
              fingerprintId: fpId,
              file: file,
              fileHandle: file.handle || null,
              name: file.name,
              size: file.size,
              lastModified: file.lastModified,
              url: null,
              blobUrl: null,
              thumbnailUrl: null,
              naturalWidth: 1000,
              naturalHeight: 750,
              sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
              stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
              userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
              focusSpot: savedMeta.focusSpot || savedMeta.cameraExif?.focusArea || null,
              cameraExif: savedMeta.cameraExif || null,
              identification: savedMeta.identification || null,
              cropBox: savedMeta.cropBox || null,
              locationText: savedMeta.locationText || null,
            opfsFileName: savedMeta.opfsFileName || null,
            activeVersionId: savedMeta.activeVersionId || null,
            versions: savedMeta.versions || null
          };
          saveFingerprintMetadata(photoObj);
          return photoObj;
        });

        if (isFirstChunk) {
          onUpdatePhotos(chunkObjs);
          isFirstChunk = false;
        } else {
          onUpdatePhotos(prev => {
            const existingIds = new Set(prev.map(p => p.id));
            const filteredNew = chunkObjs.filter(p => !existingIds.has(p.id));
            return [...prev, ...filteredNew];
          });
        }

        setUploadProgress({ current: Math.min(i + CHUNK_SIZE, total), total });
        await new Promise(r => setTimeout(r, 10));
      }

      setUploading(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
      if (folderInputRef.current) folderInputRef.current.value = '';
    };

    const handleBatchRateFocus = async () => {
        const unrated = photos.filter(p => p.sharpness === null && p.userStars === null);
        if (!unrated.length) return;

        setRating(true);
        abortRatingRef.current = false;
        setRatingProgress({ current: 0, total: unrated.length });

        for (let i = 0; i < unrated.length; i++) {
          if (abortRatingRef.current) break;

          const target = unrated[i];
          let cameraExif = target.cameraExif;
          if (!cameraExif && target.file) {
            cameraExif = await extractCameraExif(target.file);
          }

          const evalResult = await evaluatePhotoFocus(target.file || target.url, target.cropBox || target.focusSpot, cameraExif || target.cameraExif);

          const updated = { 
            ...target, 
            cameraExif: cameraExif || target.cameraExif,
            sharpness: evalResult.score,
            stars: evalResult.stars,
            focusSpot: evalResult.focusSpot 
          };

          saveFingerprintMetadata(updated);

          onUpdatePhotos(prev => prev.map(p => p.id === target.id ? updated : p));
          setRatingProgress({ current: i + 1, total: unrated.length });
        }

        setRating(false);
      };

      const handleCardStarClick = (photoId, newStars) => {
        onUpdatePhotos(prev => prev.map(p => {
          if (p.id === photoId) {
            const updated = {
              ...p,
              userStars: newStars,
              stars: newStars
            };
            saveFingerprintMetadata(updated);
            return updated;
          }
          return p;
        }));
      };

      const confirmAndDeleteFiltered = async () => {
        setShowDeleteConfirmModal(false);

        if (selectedIds.size > 0) {
          const toDelete = photos.filter(p => selectedIds.has(p.id));
          for (const photo of toDelete) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
            try { if (photo.cropThumbnailUrl) URL.revokeObjectURL(photo.cropThumbnailUrl); } catch (e) {}
            deleteFingerprintMetadata(photo.fingerprintId || photo.id);
          }
          onUpdatePhotos(prev => prev.filter(p => !selectedIds.has(p.id)));
          setSelectedIds(new Set());
        } else {
          if (!processedPhotos.length) return;
          const idsToRemove = new Set(processedPhotos.map(p => p.id));
          
          for (const photo of processedPhotos) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
            try { if (photo.cropThumbnailUrl) URL.revokeObjectURL(photo.cropThumbnailUrl); } catch (e) {}
            deleteFingerprintMetadata(photo.fingerprintId || photo.id);
          }

          onUpdatePhotos(prev => prev.filter(p => !idsToRemove.has(p.id)));
        }
        setCurrentPage(1);
      };

      const handleExportFiltered = async () => {
        const listToExport = selectedIds.size > 0 ? photos.filter(p => selectedIds.has(p.id)) : processedPhotos;
        if (!listToExport.length) return;

        let exportedIds = new Set();

        if ('showDirectoryPicker' in window) {
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            let exportedCount = 0;
            
            for (const photo of listToExport) {
              if (photo.file) {
                const newFileHandle = await dirHandle.getFileHandle(photo.name, { create: true });
                const writable = await newFileHandle.createWritable();
                await writable.write(photo.file);
                await writable.close();
                exportedCount++;
                exportedIds.add(photo.id);
                deleteFingerprintMetadata(photo.fingerprintId || photo.id);
              }
            }
            
            if (exportedIds.size > 0) {
              onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
              setSelectedIds(prev => {
                const next = new Set(prev);
                exportedIds.forEach(id => next.delete(id));
                return next;
              });
            }
            
            alert(`Successfully exported ${exportedCount} photo(s) to your selected directory folder and removed them from the main list!`);
            setCurrentPage(1);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
            console.warn('Directory Picker permission or support error, falling back to direct download:', err);
          }
        }

        listToExport.forEach((photo, i) => {
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = photo.blobUrl || photo.thumbnailUrl || photo.url;
            a.download = photo.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }, i * 200);
          exportedIds.add(photo.id);
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        });

        onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
        setSelectedIds(prev => {
          const next = new Set(prev);
          exportedIds.forEach(id => next.delete(id));
          return next;
        });
        setCurrentPage(1);
      };

      const totalPages = Math.ceil(processedPhotos.length / pageSize) || 1;
      
      const paginatedPhotos = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedPhotos.slice(start, start + pageSize);
      }, [processedPhotos, currentPage, pageSize]);

      const bufferedPhotos = useMemo(() => {
        const total = processedPhotos.length;
        if (total === 0) return [];

        const pageStart = (currentPage - 1) * pageSize;
        const pageEnd = Math.min(total, currentPage * pageSize);
        return processedPhotos.slice(pageStart, pageEnd);
      }, [processedPhotos, currentPage, pageSize]);
      const bufferedThumbnailKey = bufferedPhotos
        .map(photo => `${photo.id}:${getCropThumbnailCacheKey(photo) || ''}`)
        .join('|');

      useEffect(() => {
        if (isPreviewOpen) {
          setLoadingThumbnails(false);
          return;
        }

        const abortController = new AbortController();
        let isMounted = true;

        if (!bufferedPhotos.length) {
          setLoadingThumbnails(false);
          return;
        }

        const bufferedIds = new Set(bufferedPhotos.map(p => p.id));
        const needed = bufferedPhotos.filter(p =>
          !p.thumbnailUrl ||
          (getCropThumbnailCacheKey(p) && (
            !p.cropThumbnailUrl ||
            p.cropThumbnailCacheKey !== getCropThumbnailCacheKey(p)
          ))
        );

        if (needed.length > 0) {
          setLoadingThumbnails(true);
          setThumbnailProgress({ current: 0, total: needed.length });

          processThumbnailQueue(
            needed,
            (batchUpdates) => {
              if (!isMounted) return;
              onUpdatePhotos(prev => {
                const mapUpdates = new Map(batchUpdates.map(u => [u.id, u]));
                return prev.map(p => {
                  const u = mapUpdates.get(p.id);
                  if (u) {
                    if (p.cropThumbnailUrl && p.cropThumbnailUrl !== u.cropThumbUrl) {
                      try { URL.revokeObjectURL(p.cropThumbnailUrl); } catch(e){}
                    }
                    return {
                      ...p,
                      thumbnailUrl: u.thumbUrl,
                      cropThumbnailUrl: u.cropThumbUrl,
                      cropThumbnailCacheKey: u.cropCacheKey,
                      naturalWidth: u.width,
                      naturalHeight: u.height
                    };
                  }
                  return p;
                });
              });
            },
            (completed, total) => {
              if (isMounted) setThumbnailProgress({ current: completed, total });
            },
            abortController.signal
          ).then(() => {
            if (isMounted) setLoadingThumbnails(false);
          });
        } else {
          setLoadingThumbnails(false);
        }

        onUpdatePhotos(prev => {
          let hasChanges = false;
          const updated = prev.map(p => {
            let updatedPhoto = p;
            let changed = false;

            // Strict Memory Cleanup: Free object URLs for off-page images to preserve memory
            if (!bufferedIds.has(p.id)) {
              if (p.thumbnailUrl && p.thumbnailUrl.startsWith('blob:')) {
                try { URL.revokeObjectURL(p.thumbnailUrl); } catch(e){}
                updatedPhoto = { ...updatedPhoto, thumbnailUrl: null };
                changed = true;
              }

              if (p.cropThumbnailUrl && p.cropThumbnailUrl.startsWith('blob:')) {
                try { URL.revokeObjectURL(p.cropThumbnailUrl); } catch(e){}
                updatedPhoto = { ...updatedPhoto, cropThumbnailUrl: null };
                changed = true;
              }

              if (p.blobUrl && p.blobUrl.startsWith('blob:')) {
                try { URL.revokeObjectURL(p.blobUrl); } catch(e){}
                updatedPhoto = { ...updatedPhoto, blobUrl: null };
                changed = true;
              }
            }

            if (changed) hasChanges = true;
            return updatedPhoto;
          });
          return hasChanges ? updated : prev;
        });

        return () => { 
          isMounted = false; 
          abortController.abort(); 
        };
      }, [currentPage, bufferedThumbnailKey, filterSharpness, sortBy, isPreviewOpen]);

                  </div>
