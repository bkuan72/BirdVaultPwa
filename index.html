    function CullingWorkspaceView({
      photos,
      onUpdatePhotos,
      onSelectPhoto,
      userApiKey,
      filterSharpness,
      setFilterSharpness,
      sortBy,
      setSortBy,
      currentPage,
      setCurrentPage,
      processedPhotos,
      isPreviewOpen
    }) {
      const pageSize = 20;

      const [selectedIds, setSelectedIds] = useState(new Set());
      const [showFilterBar, setShowFilterBar] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
      const [loadingThumbnails, setLoadingThumbnails] = useState(false);
      const [thumbnailProgress, setThumbnailProgress] = useState({ current: 0, total: 0 });
      const [rating, setRating] = useState(false);
      const [ratingProgress, setRatingProgress] = useState({ current: 0, total: 0 });
      const [showDeleteConfirmModal, setShowDeleteConfirmModal] = useState(false);
      const abortUploadRef = useRef(false);
      const abortRatingRef = useRef(false);
      const fileInputRef = useRef(null);

      const toggleSelectPhoto = (photoId, e) => {
        if (e) e.stopPropagation();
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(photoId)) {
            next.delete(photoId);
          } else {
            next.add(photoId);
          }
          return next;
        });
      };

      const handleSelectAll = () => {
        if (selectedIds.size === processedPhotos.length && processedPhotos.length > 0) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(processedPhotos.map(p => p.id)));
        }
      };

      const handleDeleteSinglePhoto = (photoId, e) => {
        if (e) e.stopPropagation();
        const photo = photos.find(p => p.id === photoId);
        if (photo) {
          try { if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') photo.fileHandle.remove(); } catch (err) {}
          try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (err) {}
          try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (err) {}
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        }
        
        onUpdatePhotos(prev => prev.filter(p => p.id !== photoId));
        setSelectedIds(prev => {
          const next = new Set(prev);
          next.delete(photoId);
          return next;
        });
      };

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        setUploading(true);
        abortUploadRef.current = false;
        setUploadProgress({ current: 0, total: files.length });

        const fpDb = getStoredFingerprintDb();
        const newPhotoObjs = [];

        for (let i = 0; i < files.length; i++) {
          if (abortUploadRef.current) break;
          const file = files[i];

          const fpId = generateFingerprintId(file);
          const savedMeta = fpDb[fpId] || {};

          let cameraExif = savedMeta.cameraExif || null;
          if (!cameraExif) {
            cameraExif = await extractCameraExif(file);
          }

          const photoObj = {
            id: fpId,
            fingerprintId: fpId,
            file: file,
            fileHandle: file.handle || null,
            name: file.name,
            size: file.size,
            lastModified: file.lastModified,
            url: null,
            blobUrl: null,
            thumbnailUrl: null,
            naturalWidth: 1000,
            naturalHeight: 750,
            sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
            stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
            userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
            focusSpot: savedMeta.focusSpot || null,
            cameraExif: cameraExif,
            identification: savedMeta.identification || null,
            cropBox: savedMeta.cropBox || null,
            locationText: savedMeta.locationText || null
          };

          saveFingerprintMetadata(photoObj);
          newPhotoObjs.push(photoObj);

          setUploadProgress({ current: i + 1, total: files.length });
          if (i % 20 === 0) await new Promise(r => setTimeout(r, 0));
        }

        onUpdatePhotos(prev => {
          const existingIds = new Set(prev.map(p => p.id));
          const filteredNew = newPhotoObjs.filter(p => !existingIds.has(p.id));
          return [...filteredNew, ...prev];
        });

        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleBatchRateFocus = async () => {
        const unrated = photos.filter(p => p.sharpness === null && p.userStars === null);
        if (!unrated.length) return;

        setRating(true);
        abortRatingRef.current = false;
        setRatingProgress({ current: 0, total: unrated.length });

        for (let i = 0; i < unrated.length; i++) {
          if (abortRatingRef.current) break;

          const target = unrated[i];
          const evalResult = await evaluatePhotoFocus(target.file || target.url, target.cropBox || target.focusSpot);

          const updated = { 
            ...target, 
            sharpness: evalResult.score,
            stars: evalResult.stars,
            focusSpot: evalResult.focusSpot 
          };

          saveFingerprintMetadata(updated);

          onUpdatePhotos(prev => prev.map(p => p.id === target.id ? updated : p));
          setRatingProgress({ current: i + 1, total: unrated.length });
        }

        setRating(false);
      };

      const handleCardStarClick = (photoId, newStars) => {
        onUpdatePhotos(prev => prev.map(p => {
          if (p.id === photoId) {
            const updated = {
              ...p,
              userStars: newStars,
              stars: newStars
            };
            saveFingerprintMetadata(updated);
            return updated;
          }
          return p;
        }));
      };

      const confirmAndDeleteFiltered = async () => {
        setShowDeleteConfirmModal(false);

        if (selectedIds.size > 0) {
          const toDelete = photos.filter(p => selectedIds.has(p.id));
          for (const photo of toDelete) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
            deleteFingerprintMetadata(photo.fingerprintId || photo.id);
          }
          onUpdatePhotos(prev => prev.filter(p => !selectedIds.has(p.id)));
          setSelectedIds(new Set());
        } else {
          if (!processedPhotos.length) return;
          const idsToRemove = new Set(processedPhotos.map(p => p.id));
          
          for (const photo of processedPhotos) {
            if (photo.fileHandle && typeof photo.fileHandle.remove === 'function') {
              try { await photo.fileHandle.remove(); } catch (e) {}
            }
            try { if (photo.blobUrl) URL.revokeObjectURL(photo.blobUrl); } catch (e) {}
            try { if (photo.thumbnailUrl) URL.revokeObjectURL(photo.thumbnailUrl); } catch (e) {}
            deleteFingerprintMetadata(photo.fingerprintId || photo.id);
          }

          onUpdatePhotos(prev => prev.filter(p => !idsToRemove.has(p.id)));
        }
        setCurrentPage(1);
      };

      const handleExportFiltered = async () => {
        const listToExport = selectedIds.size > 0 ? photos.filter(p => selectedIds.has(p.id)) : processedPhotos;
        if (!listToExport.length) return;

        let exportedIds = new Set();

        if ('showDirectoryPicker' in window) {
          try {
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            let exportedCount = 0;
            
            for (const photo of listToExport) {
              if (photo.file) {
                const newFileHandle = await dirHandle.getFileHandle(photo.name, { create: true });
                const writable = await newFileHandle.createWritable();
                await writable.write(photo.file);
                await writable.close();
                exportedCount++;
                exportedIds.add(photo.id);
                deleteFingerprintMetadata(photo.fingerprintId || photo.id);
              }
            }
            
            if (exportedIds.size > 0) {
              onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
              setSelectedIds(prev => {
                const next = new Set(prev);
                exportedIds.forEach(id => next.delete(id));
                return next;
              });
            }
            
            alert(`Successfully exported ${exportedCount} photo(s) to your selected folder and removed them from the workspace!`);
            setCurrentPage(1);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
            console.warn('showDirectoryPicker export fallback:', err);
          }
        }

        listToExport.forEach((photo, i) => {
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = photo.blobUrl || photo.thumbnailUrl || photo.url;
            a.download = photo.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }, i * 200);
          exportedIds.add(photo.id);
          deleteFingerprintMetadata(photo.fingerprintId || photo.id);
        });

        onUpdatePhotos(prev => prev.filter(p => !exportedIds.has(p.id)));
        setSelectedIds(prev => {
          const next = new Set(prev);
          exportedIds.forEach(id => next.delete(id));
          return next;
        });
        setCurrentPage(1);
      };

      const totalPages = Math.ceil(processedPhotos.length / pageSize) || 1;
      
      const paginatedPhotos = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedPhotos.slice(start, start + pageSize);
      }, [processedPhotos, currentPage]);

      const bufferedPhotos = useMemo(() => {
        const total = processedPhotos.length;
        if (total === 0) return [];

        const targetBufferSize = 100;
        const pageStart = (currentPage - 1) * pageSize;
        const pageEnd = Math.min(total, currentPage * pageSize);
        const pageCenter = Math.floor((pageStart + pageEnd) / 2);

        let bufStart = pageCenter - Math.floor(targetBufferSize / 2);
        let bufEnd = pageCenter + Math.ceil(targetBufferSize / 2);

        if (bufStart < 0) {
          bufEnd = Math.min(total, bufEnd + Math.abs(bufStart));
          bufStart = 0;
        }
        if (bufEnd > total) {
          bufStart = Math.max(0, bufStart - (bufEnd - total));
          bufEnd = total;
        }

        return processedPhotos.slice(bufStart, bufEnd);
      }, [processedPhotos, currentPage, pageSize]);

      useEffect(() => {
        if (isPreviewOpen) {
          setLoadingThumbnails(false);
          return;
        }

        const abortController = new AbortController();
        let isMounted = true;

        if (!bufferedPhotos.length) {
          setLoadingThumbnails(false);
          return;
        }

        const bufferedIds = new Set(bufferedPhotos.map(p => p.id));
        const needed = bufferedPhotos.filter(p => !p.thumbnailUrl && p.file);

        if (needed.length > 0) {
          setLoadingThumbnails(true);
          setThumbnailProgress({ current: 0, total: needed.length });

          processThumbnailQueue(
            needed,
            (batchUpdates) => {
              if (!isMounted) return;
              onUpdatePhotos(prev => {
                const mapUpdates = new Map(batchUpdates.map(u => [u.id, u]));
                return prev.map(p => {
                  const u = mapUpdates.get(p.id);
                  if (u) {
                    return {
                      ...p,
                      thumbnailUrl: u.thumbUrl,
                      naturalWidth: u.width,
                      naturalHeight: u.height
                    };
                  }
                  return p;
                });
              });
            },
            (completed, total) => {
              if (isMounted) setThumbnailProgress({ current: completed, total });
            },
            abortController.signal
          ).then(() => {
            if (isMounted) setLoadingThumbnails(false);
          });
        } else {
          setLoadingThumbnails(false);
        }

        onUpdatePhotos(prev => {
          let hasChanges = false;
          const updated = prev.map(p => {
            let updatedPhoto = p;
            let changed = false;

            if (!bufferedIds.has(p.id) && p.thumbnailUrl) {
              try { URL.revokeObjectURL(p.thumbnailUrl); } catch(e){}
              updatedPhoto = { ...updatedPhoto, thumbnailUrl: null };
              changed = true;
            }

            if (p.blobUrl) {
              try { URL.revokeObjectURL(p.blobUrl); } catch(e){}
              updatedPhoto = { ...updatedPhoto, blobUrl: null };
              changed = true;
            }

            if (changed) hasChanges = true;
            return updatedPhoto;
          });
          return hasChanges ? updated : prev;
        });

        return () => { 
          isMounted = false; 
          abortController.abort(); 
        };
      }, [currentPage, processedPhotos.length, filterSharpness, sortBy, isPreviewOpen]);

      const isSelectionActive = selectedIds.size > 0;
      const filterLabel = filterSharpness === '5star' ? '5 Stars' : filterSharpness === '4star' ? '4+ Stars' : filterSharpness === 'soft' ? '1-3 Stars' : filterSharpness === 'unrated' ? 'Unrated' : 'All Photos';

      return (
        <div className="flex-1 flex flex-col overflow-hidden min-h-0 p-3 sm:p-4 md:p-6 gap-3 sm:gap-4 pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-4 relative">
          
          <div className="flex-shrink-0 bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-2xl shadow-xl space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 className="text-lg sm:text-xl font-extrabold text-white flex items-center space-x-2">
                  <Icon name="camera" className="w-5 h-5 sm:w-6 sm:h-6 text-emerald-400" />
                  <span>Focus Culling Workspace</span>
                </h2>
                <p className="hidden sm:block text-[11px] sm:text-xs text-slate-400">Grade focus sharpness from 0 (blurry) to 10 (tack sharp) automatically or adjust manually.</p>
              </div>

              <div className="flex items-center space-x-2 overflow-x-auto no-scrollbar py-0.5">
                <button
                  onClick={() => setShowFilterBar(!showFilterBar)}
                  className={`font-semibold text-xs px-3.5 py-2.5 rounded-xl border transition flex items-center space-x-1.5 touch-manipulation ${
                    showFilterBar || filterSharpness !== 'all' 
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' 
                      : 'bg-slate-800 text-slate-300 border-slate-700 hover:text-white'
                  }`}
                  title="Toggle Filter & Sort Controls"
                >
                  <Icon name="filter" className="w-4 h-4 text-emerald-400" />
                  <span>Filter & Sort</span>
                  {filterSharpness !== 'all' && (
                    <span className="ml-1 bg-emerald-600 text-white font-bold text-[9px] px-1.5 py-0.5 rounded-full">
                      {filterLabel}
                    </span>
                  )}
                </button>

                <label className="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-1.5 active:scale-95 touch-manipulation flex-shrink-0">
                  <Icon name="upload" className="w-4 h-4" />
                  <span>Upload Photos</span>
                  <input
                    ref={fileInputRef}
                    type="file"
                    multiple
                    accept="image/*"
                    onChange={handleFileUpload}
                    className="hidden"
                  />
                </label>

                <button
                  onClick={handleBatchRateFocus}
                  disabled={rating || !photos.some(p => p.sharpness === null && p.userStars === null)}
                  className="bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 font-semibold text-xs px-3.5 py-2.5 rounded-xl border border-slate-700 transition flex items-center justify-center space-x-1.5 active:scale-95 touch-manipulation flex-shrink-0"
                >
                  <Icon name="sparkles" className="w-4 h-4 text-emerald-400" />
                  <span>Rate photos ({photos.filter(p => p.sharpness === null).length})</span>
                </button>
              </div>
            </div>

            {showFilterBar && (
              <div className="flex flex-nowrap items-center overflow-x-auto no-scrollbar gap-2 sm:gap-3 pt-3 border-t border-slate-800 text-xs animate-fadeIn">
                <div className="flex items-center space-x-1.5 flex-shrink-0">
                  <span className="text-slate-400 font-medium text-[11px] sm:text-xs">Filter:</span>
                  <select
                    value={filterSharpness}
                    onChange={(e) => { setFilterSharpness(e.target.value); setCurrentPage(1); }}
                    className="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-emerald-500 text-[11px] sm:text-xs min-w-[130px] touch-manipulation"
                  >
                    <option value="all">All Photos ({photos.length})</option>
                    <option value="5star">5 Stars (Tack Sharp)</option>
                    <option value="4star">4+ Stars (Sharp)</option>
                    <option value="soft">1-3 Stars (Blurry / Soft)</option>
                    <option value="unrated">Unrated</option>
                  </select>
                </div>

                <div className="flex items-center space-x-1.5 flex-shrink-0">
                  <span className="text-slate-400 font-medium text-[11px] sm:text-xs">Sort:</span>
                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-emerald-500 text-[11px] sm:text-xs touch-manipulation"
                  >
                    <option value="name">File Name</option>
                    <option value="date">Date Captured</option>
                    <option value="sharpness">Star Rating</option>
                  </select>
                </div>

                <div className="w-px h-5 bg-slate-800 flex-shrink-0 mx-1 hidden sm:block"></div>

                <button
                  onClick={handleSelectAll}
                  disabled={!processedPhotos.length}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold rounded-lg transition flex items-center space-x-1 disabled:opacity-50 text-[11px] sm:text-xs flex-shrink-0 touch-manipulation"
                >
                  <Icon name="check" className="w-3.5 h-3.5 text-emerald-400" />
                  <span>{selectedIds.size === processedPhotos.length && processedPhotos.length > 0 ? "Deselect All" : `Select All (${processedPhotos.length})`}</span>
                </button>
              </div>
            )}
          </div>

          {isSelectionActive && (
            <div className="bg-emerald-950/90 border border-emerald-500/50 p-2.5 sm:p-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center justify-between gap-2 z-30 animate-slideUp">
              <div className="flex items-center space-x-2 text-xs font-bold text-emerald-300 pl-1">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>{selectedIds.size} Photo{selectedIds.size > 1 ? 's' : ''} Selected</span>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={handleSelectAll}
                  className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold rounded-xl text-xs transition border border-slate-700/80 touch-manipulation"
                >
                  Deselect
                </button>

                <button
                  onClick={handleExportFiltered}
                  className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-xs transition shadow flex items-center space-x-1 touch-manipulation"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>Save Folder ({selectedIds.size})</span>
                </button>

                <button
                  onClick={() => setShowDeleteConfirmModal(true)}
                  className="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-xl text-xs transition shadow flex items-center space-x-1 touch-manipulation"
                >
                  <Icon name="trash" className="w-3.5 h-3.5" />
                  <span>Delete Selected ({selectedIds.size})</span>
                </button>
              </div>
            </div>
          )}

          <div className="flex-1 overflow-y-auto min-h-0 pr-1 pb-4">
            {paginatedPhotos.length > 0 ? (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
                {paginatedPhotos.map(photo => {
                  const currentStars = photo.userStars || photo.stars || scoreToStars(photo.sharpness);
                  const isChecked = selectedIds.has(photo.id);
                  const activeSrc = photo.thumbnailUrl || photo.blobUrl || photo.url;
                  
                  return (
                    <div
                      key={photo.id}
                      onClick={() => photo.file && onSelectPhoto(photo)}
                      className={`group relative aspect-square bg-slate-900 border rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:border-emerald-500 transition flex items-center justify-center p-1 touch-manipulation ${isChecked ? 'border-emerald-500 ring-2 ring-emerald-500/50' : 'border-slate-800'}`}
                    >
                      {activeSrc ? (
                        <CroppedImage
                          src={activeSrc}
                          alt={photo.name}
                          cropBox={photo.cropBox}
                          photo={photo}
                          fitMode="contain"
                          className="w-full h-full"
                          imgClassName="group-hover:scale-105 transition-transform duration-300"
                        />
                      ) : (
                        <div className="flex flex-col items-center justify-center p-2 text-center space-y-1">
                          <Icon name="image" className="w-6 h-6 text-slate-600" />
                          <span className="text-[9px] text-emerald-400 font-semibold bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-500/30">
                            Re-select folder
                          </span>
                        </div>
                      )}

                      <div 
                        onClick={(e) => toggleSelectPhoto(photo.id, e)}
                        className="absolute top-2 left-2 z-20 p-2 sm:p-1 rounded-md bg-slate-950/80 border border-slate-700/80 hover:border-emerald-400 transition touch-manipulation"
                        title="Select photo"
                      >
                        <input
                          type="checkbox"
                          checked={isChecked}
                          onChange={() => {}}
                          className="w-5 h-5 sm:w-4 sm:h-4 accent-emerald-500 rounded cursor-pointer pointer-events-none block"
                        />
                      </div>

                      <div className="absolute top-2 right-2 z-20 flex items-center space-x-1">
                        {photo.sharpness !== null && (
                          <span className="bg-emerald-950/90 border border-emerald-500/50 text-emerald-300 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md shadow-md backdrop-blur-md hidden sm:inline-block">
                            {photo.sharpness}/10
                          </span>
                        )}
                        <button
                          onClick={(e) => handleDeleteSinglePhoto(photo.id, e)}
                          className="p-1.5 sm:p-1 bg-slate-950/80 hover:bg-red-600 text-slate-300 hover:text-white rounded-full shadow-md backdrop-blur-md transition touch-manipulation"
                          title="Delete photo"
                        >
                          <Icon name="trash" className="w-3 h-3 sm:w-3 sm:h-3" />
                        </button>
                      </div>

                      <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent p-2 flex flex-col justify-end space-y-1 z-10 pointer-events-none">
                        <div className="flex items-center justify-between pointer-events-auto">
                          <span className="text-[9px] sm:text-[10px] text-slate-300 font-mono truncate max-w-[70px] sm:max-w-[90px]">
                            {photo.name}
                          </span>
                          <div onClick={(e) => e.stopPropagation()}>
                            <StarRating
                              rating={currentStars}
                              onChange={(newRating) => handleCardStarClick(photo.id, newRating)}
                              size="w-2.5 h-2.5 sm:w-3 sm:h-3"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="p-8 sm:p-12 text-center bg-slate-900/40 border border-dashed border-slate-800 rounded-3xl space-y-3">
                <Icon name="image" className="w-10 h-10 sm:w-12 sm:h-12 text-slate-600 mx-auto" />
                <h3 className="text-sm sm:text-base font-bold text-slate-300">No Photos Loaded in Workspace</h3>
                <p className="text-[11px] sm:text-xs text-slate-500 max-w-sm mx-auto">Click Upload Photos to ingest high-res wildlife photos and run focus sharpness culling.</p>
              </div>
            )}
          </div>

          <div className="flex-shrink-0 flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900 border border-slate-800 p-2.5 sm:p-3 rounded-2xl text-[11px] sm:text-xs gap-2 shadow-xl">
            <div className="flex items-center justify-center sm:justify-start space-x-3 min-w-0 flex-1 px-1">
              {uploading ? (
                <div className="flex items-center space-x-2 truncate text-emerald-400 font-medium">
                  <div className="w-3.5 h-3.5 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                  <span className="truncate">
                    Reading & Fingerprinting files: <strong className="font-mono text-white">{uploadProgress.current}</strong>/{uploadProgress.total}
                  </span>
                  <button
                    onClick={() => { abortUploadRef.current = true; }}
                    className="px-2 py-0.5 bg-red-600/20 text-red-400 hover:bg-red-600/30 text-[10px] rounded font-semibold ml-2 flex-shrink-0 touch-manipulation"
                  >
                    Abort
                  </button>
                </div>
              ) : loadingThumbnails && !isPreviewOpen ? (
                <div className="flex items-center space-x-2 truncate text-sky-400 font-medium">
                  <div className="w-3.5 h-3.5 border-2 border-sky-400 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                  <span className="truncate">
                    Buffer Thumbnails: <strong className="font-mono text-white">{thumbnailProgress.current}</strong>/{thumbnailProgress.total}
                  </span>
                </div>
              ) : rating ? (
                <div className="flex items-center space-x-2 truncate text-emerald-400 font-medium">
                  <div className="w-3.5 h-3.5 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                  <span className="truncate">
                    Culling Focus: <strong className="font-mono text-white">{ratingProgress.current}</strong>/{ratingProgress.total}
                  </span>
                  <button
                    onClick={() => { abortRatingRef.current = true; }}
                    className="px-2 py-0.5 bg-red-600/20 text-red-400 hover:bg-red-600/30 text-[10px] rounded font-semibold ml-2 flex-shrink-0 touch-manipulation"
                  >
                    Abort
                  </button>
                </div>
              ) : (
                <span className="text-slate-400 truncate text-center w-full sm:w-auto">
                  Page <strong>{currentPage}</strong> of {totalPages} ({processedPhotos.length} total)
                </span>
              )}
            </div>

            <div className="flex items-center justify-between sm:justify-end space-x-2 flex-shrink-0 w-full sm:w-auto mt-1 sm:mt-0">
              <button
                onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                disabled={currentPage === 1}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-300 rounded-lg font-medium transition touch-manipulation w-full sm:w-auto"
              >
                Previous
              </button>
              <button
                onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                disabled={currentPage === totalPages}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-300 rounded-lg font-medium transition touch-manipulation w-full sm:w-auto"
              >
                Next
              </button>
            </div>
          </div>

          {showDeleteConfirmModal && (
            <div className="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={(e) => e.stopPropagation()}>
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-sm w-full shadow-2xl space-y-4">
                <div className="flex items-center space-x-3 text-red-400">
                  <div className="p-2 bg-red-500/10 border border-red-500/20 rounded-xl">
                    <Icon name="trash" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="font-bold text-white text-sm sm:text-base">
                      {isSelectionActive ? "Delete Selected Photos" : "Delete Filtered Photos"}
                    </h3>
                    <p className="text-[11px] text-slate-400">Remove from workspace list</p>
                  </div>
                </div>
                
                <p className="text-xs text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800">
                  Are you sure you want to delete <strong className="text-white font-mono">{isSelectionActive ? selectedIds.size : processedPhotos.length}</strong> photo(s) {isSelectionActive ? "currently checked" : "matching your filter"}?
                </p>

                <div className="flex flex-col-reverse sm:flex-row items-center justify-end sm:space-x-2 pt-2 border-t border-slate-800 gap-2 sm:gap-0">
                  <button
                    onClick={() => setShowDeleteConfirmModal(false)}
                    className="w-full sm:w-auto px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition touch-manipulation"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmAndDeleteFiltered}
                    className="w-full sm:w-auto px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-xl transition shadow-lg flex items-center justify-center space-x-1.5 touch-manipulation"
                  >
                    <Icon name="trash" className="w-3.5 h-3.5" />
                    <span>Delete {isSelectionActive ? selectedIds.size : processedPhotos.length} Photo{(isSelectionActive ? selectedIds.size : processedPhotos.length) > 1 ? 's' : ''}</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function BirdVaultApp() {
      const [activeTab, setActiveTabState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_tab') || 'vault'; } catch(e) { return 'vault'; }
      });
      
      const [filterSharpness, setFilterSharpnessState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_filter') || 'all'; } catch(e) { return 'all'; }
      });

      const [sortBy, setSortByState] = useState(() => {
        try { return localStorage.getItem('birdvault_pref_sort') || 'name'; } catch(e) { return 'name'; }
      });

      const [userLocation, setUserLocationState] = useState(() => {
        try { return localStorage.getItem('birdvault_user_location') || 'Auckland, New Zealand'; } catch(e) { return 'Auckland, New Zealand'; }
      });

      const [photos, setPhotos] = useState([]);
      const [vaultEntries, setVaultEntries] = useState([]);
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [currentPage, setCurrentPage] = useState(1);

      const [userApiKey, setUserApiKey] = useState((localStorage.getItem('birdvault_gemini_token') || '').trim());
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);

      const [tokenUsageState, setTokenUsageState] = useState(getStoredTokenUsage());

      const setActiveTab = (tab) => {
        setActiveTabState(tab);
        try { localStorage.setItem('birdvault_pref_tab', tab); } catch(e){}
      };

      const setFilterSharpness = (filter) => {
        setFilterSharpnessState(filter);
        try { localStorage.setItem('birdvault_pref_filter', filter); } catch(e){}
      };

      const setSortBy = (sort) => {
        setSortByState(sort);
        try { localStorage.setItem('birdvault_pref_sort', sort); } catch(e){}
      };

      const setUserLocation = (loc) => {
        setUserLocationState(loc);
        try {
          if (loc) localStorage.setItem('birdvault_user_location', loc);
          else localStorage.removeItem('birdvault_user_location');
        } catch(e){}
      };

      const updatePhotos = (action) => {
        setPhotos(prev => {
          const nextPhotos = typeof action === 'function' ? action(prev) : action;
          syncFingerprintDbPrune(nextPhotos);
          return nextPhotos;
        });
      };

      useEffect(() => {
        window.birdvault_open_auth_modal = () => setShowAuthModal(true);
        return () => { delete window.birdvault_open_auth_modal; };
      }, []);

      useEffect(() => {
        const fpDb = getStoredFingerprintDb();
        const fingerprintKeys = Object.keys(fpDb);

        if (fingerprintKeys.length > 0) {
          const restoredWorkspace = fingerprintKeys.map(fpId => {
            const savedMeta = fpDb[fpId];
            return {
              id: fpId,
              fingerprintId: fpId,
              file: null,
              fileHandle: null,
              name: savedMeta.name || 'Photo',
              size: savedMeta.size || 0,
              lastModified: savedMeta.lastModified || 0,
              url: null,
              blobUrl: null,
              thumbnailUrl: null,
              naturalWidth: 1000,
              naturalHeight: 750,
              sharpness: savedMeta.sharpness !== undefined ? savedMeta.sharpness : null,
              stars: savedMeta.stars !== undefined ? savedMeta.stars : null,
              userStars: savedMeta.userStars !== undefined ? savedMeta.userStars : null,
              focusSpot: savedMeta.focusSpot || null,
              cameraExif: savedMeta.cameraExif || null,
              identification: savedMeta.identification || null,
              cropBox: savedMeta.cropBox || null,
              locationText: savedMeta.locationText || null
            };
          });
          setPhotos(restoredWorkspace);
        }
      }, []);

      const handleSaveApiKey = (newKey) => {
        setUserApiKey(newKey);
        if (newKey) {
          localStorage.setItem('birdvault_gemini_token', newKey);
        } else {
          localStorage.removeItem('birdvault_gemini_token');
        }
      };

      const processedPhotos = useMemo(() => {
        let list = [...photos];
        
        if (filterSharpness === '5star') {
          list = list.filter(p => (p.userStars || p.stars || scoreToStars(p.sharpness)) === 5);
        } else if (filterSharpness === '4star') {
          list = list.filter(p => (p.userStars || p.stars || scoreToStars(p.sharpness)) >= 4);
        } else if (filterSharpness === 'soft') {
          list = list.filter(p => {
            const stars = p.userStars || p.stars || scoreToStars(p.sharpness);
            return stars >= 1 && stars <= 3;
          });
        } else if (filterSharpness === 'unrated') {
          list = list.filter(p => p.sharpness === null && p.userStars === null);
        }

        if (sortBy === 'name') {
          list.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'date') {
          list.sort((a, b) => b.lastModified - a.lastModified);
        } else if (sortBy === 'sharpness') {
          list.sort((a, b) => {
            const starsA = a.userStars || a.stars || scoreToStars(a.sharpness);
            const starsB = b.userStars || b.stars || scoreToStars(b.sharpness);
            return starsB - starsA;
          });
        }

        return list;
      }, [photos, filterSharpness, sortBy]);

      useEffect(() => {
        if (!selectedPhoto) return;
        const indexInProcessed = processedPhotos.findIndex(p => p.id === selectedPhoto.id);
        if (indexInProcessed !== -1) {
          const targetPage = Math.floor(indexInProcessed / 20) + 1;
          if (targetPage !== currentPage) {
            setCurrentPage(targetPage);
          }
        }
      }, [selectedPhoto, processedPhotos]);

      useEffect(() => {
        if (!selectedPhoto) return;
        const index = processedPhotos.findIndex(p => p.id === selectedPhoto.id);
        if (index === -1) return;

        const total = processedPhotos.length;
        const lruWindow = new Set();
        if (index > 0) lruWindow.add(processedPhotos[index - 1].id);
        lruWindow.add(processedPhotos[index].id);
        if (index < total - 1) lruWindow.add(processedPhotos[index + 1].id);

        setPhotos(prev => {
          let hasChanges = false;
          const updated = prev.map(p => {
            const isInLruWindow = lruWindow.has(p.id);
            
            if (isInLruWindow && !p.blobUrl && p.file) {
              hasChanges = true;
              return { ...p, blobUrl: URL.createObjectURL(p.file) };
            }
            
            if (!isInLruWindow && p.blobUrl) {
              try { URL.revokeObjectURL(p.blobUrl); } catch(e){}
              hasChanges = true;
              return { ...p, blobUrl: null };
            }
            
            return p;
          });
          return hasChanges ? updated : prev;
        });
      }, [selectedPhoto, processedPhotos]);

      useEffect(() => {
        const handleTokenUpdate = () => setTokenUsageState(getStoredTokenUsage());
        window.addEventListener('birdvault_token_update', handleTokenUpdate);
        return () => window.removeEventListener('birdvault_token_update', handleTokenUpdate);
      }, []);

      useEffect(() => {
        const savedVault = localStorage.getItem('birdvault_entries_v5');
        if (savedVault) {
          try {
            const parsed = JSON.parse(savedVault);
            const sanitized = (parsed || []).map(entry => ({
              ...entry,
              sightings: (entry.sightings || []).map(s => ({
                ...s,
                photo: s.photo ? {
                  ...s.photo,
                  thumbnailUrl: (s.photo.thumbnailUrl && !s.photo.thumbnailUrl.startsWith('blob:')) ? s.photo.thumbnailUrl : null,
                  blobUrl: null,
                  url: (s.photo.url && !s.photo.url.startsWith('blob:')) ? s.photo.url : null
                } : s.photo
              }))
            }));
            setVaultEntries(sanitized);
          } catch (e) {}
        }
      }, []);

      const saveVaultToStorage = (entries) => {
        setVaultEntries(entries);
        localStorage.setItem('birdvault_entries_v5', JSON.stringify(entries));
        updateOpfsMasterManifest(entries);
      };

      const handleSaveToVault = async (photoWithAi) => {
        if (!photoWithAi.identification) return;
        const { speciesName, scientificName, category } = photoWithAi.identification;

        const fpId = photoWithAi.fingerprintId || photoWithAi.id;
        const sanitizeUrl = (u) => (u && typeof u === 'string' && !u.startsWith('blob:')) ? u : null;

        const cleanPhotoMeta = {
          id: fpId,
          fingerprintId: fpId,
          file: null,
          name: photoWithAi.name,
          size: photoWithAi.size,
          lastModified: photoWithAi.lastModified,
          thumbnailUrl: sanitizeUrl(photoWithAi.thumbnailUrl),
          sharpness: photoWithAi.sharpness,
          stars: photoWithAi.stars,
          userStars: photoWithAi.userStars,
          focusSpot: photoWithAi.focusSpot,
          cameraExif: photoWithAi.cameraExif,
          identification: photoWithAi.identification,
          cropBox: photoWithAi.cropBox,
          locationText: photoWithAi.locationText
        };

        saveFingerprintMetadata(cleanPhotoMeta);

        const sightingId = 'sighting_' + Math.random().toString(36).substring(2, 9);
        const newSighting = {
          id: sightingId,
          date: Date.now(),
          photoFingerprintId: fpId,
          photo: cleanPhotoMeta
        };

        const existingIdx = vaultEntries.findIndex(e => e.speciesName.toLowerCase() === speciesName.toLowerCase());

        let updatedEntries = [...vaultEntries];
        if (existingIdx >= 0) {
          updatedEntries[existingIdx].sightings.unshift(newSighting);
        } else {
          updatedEntries.unshift({
            speciesName,
            scientificName,
            category,
            sightings: [newSighting]
          });
        }

        saveVaultToStorage(updatedEntries);

        // Write physical files to OPFS directory
        if (photoWithAi.file) {
          const fileName = `${new Date().toISOString().split('T')[0]}_${sightingId}.jpg`;
          await writeOpfsSightingFile(category, speciesName, fileName, photoWithAi.file);
        }
        await writeOpfsSightingFile(category, speciesName, 'species_info.json', {
          speciesName,
          scientificName,
          category,
          updatedAt: Date.now(),
          lastSighting: cleanPhotoMeta
        });

        setSelectedPhoto(null);
        setActiveTab('vault');
      };

      const handleDeleteSighting = (speciesName, sightingId) => {
        const updated = vaultEntries.map(e => {
          if (e.speciesName === speciesName) {
            return {
              ...e,
              sightings: e.sightings.filter(s => s.id !== sightingId)
            };
          }
          return e;
        }).filter(e => e.sightings.length > 0);

        saveVaultToStorage(updated);
      };

      const handleDeleteSpecies = (speciesName) => {
        const updated = vaultEntries.filter(e => e.speciesName !== speciesName);
        saveVaultToStorage(updated);
      };

      const handleDeletePhotoInViewer = (photoId) => {
        const currentIndex = photos.findIndex(p => p.id === photoId);
        const photoToDelete = photos.find(p => p.id === photoId);
        
        if (photoToDelete) {
          try { if (photoToDelete.fileHandle && typeof photoToDelete.fileHandle.remove === 'function') photoToDelete.fileHandle.remove(); } catch (e) {}
          try { if (photoToDelete.blobUrl) URL.revokeObjectURL(photoToDelete.blobUrl); } catch (e) {}
          try { if (photoToDelete.thumbnailUrl) URL.revokeObjectURL(photoToDelete.thumbnailUrl); } catch (e) {}
          deleteFingerprintMetadata(photoToDelete.fingerprintId || photoToDelete.id);
        }

        const updatedPhotos = photos.filter(p => p.id !== photoId);
        updatePhotos(updatedPhotos);

        if (updatedPhotos.length > 0) {
          const nextIndex = currentIndex < updatedPhotos.length ? currentIndex : updatedPhotos.length - 1;
          setSelectedPhoto(updatedPhotos[nextIndex]);
        } else {
          setSelectedPhoto(null);
        }
      };

      const rpmUsedPct = Math.round((tokenUsageState.minuteRequests / GEMINI_QUOTAS.MAX_RPM) * 100);

      return (
        <div className="h-full w-full flex flex-col bg-slate-950 text-slate-100 overflow-hidden select-none">
          <header className="h-14 sm:h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-3 sm:px-6 flex items-center justify-between z-30 flex-shrink-0">
            <div className="flex items-center space-x-2.5">
              <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-lg flex-shrink-0">
                <Icon name="feather" className="w-5 h-5 sm:w-6 sm:h-6" />
              </div>
              <div className="truncate">
                <h1 className="font-extrabold text-white text-sm sm:text-base tracking-tight leading-none">BirdVault <span className="text-emerald-400 font-mono text-[10px] sm:text-xs font-normal">PRO</span></h1>
                <p className="text-[9px] sm:text-[10px] text-slate-400 truncate">Wildlife AI Assistant</p>
              </div>
            </div>

            <div className="hidden md:flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
              <button
                onClick={() => setActiveTab('vault')}
                className={`px-4 py-1.5 rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'vault' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <Icon name="feather" className="w-4 h-4" />
                <span>Lifer Vault</span>
              </button>
              <button
                onClick={() => setActiveTab('culling')}
                className={`px-4 py-1.5 rounded-lg transition flex items-center space-x-1.5 ${activeTab === 'culling' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <Icon name="camera" className="w-4 h-4" />
                <span>Focus Culling</span>
              </button>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setShowAuthModal(true)}
                className={`px-2.5 py-1.5 rounded-xl border text-xs font-semibold flex items-center space-x-1.5 transition touch-manipulation ${userApiKey ? 'bg-slate-950 text-slate-300 border-slate-800 hover:border-emerald-500/50' : 'bg-emerald-600/20 text-emerald-300 border-emerald-500/40 animate-pulse'}`}
                title="Configure Google Gemini API Key"
              >
                <Icon name="google" className="w-3.5 h-3.5 text-emerald-400" />
                <span className="text-[11px] font-medium hidden sm:inline">{userApiKey ? 'AI Connected' : 'Connect AI'}</span>
              </button>

              <button
                onClick={() => setShowTokenModal(true)}
                className={`px-2.5 py-1.5 rounded-xl border text-xs font-semibold flex items-center space-x-1.5 transition touch-manipulation ${rpmUsedPct > 80 ? 'bg-amber-500/20 text-amber-400 border-amber-500/40 animate-pulse' : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-700'}`}
                title="View Gemini AI Token & Quota Status"
              >
                <Icon name="bolt" className={`w-3.5 h-3.5 ${rpmUsedPct > 80 ? 'text-amber-400' : 'text-emerald-400'}`} />
                <span className="text-[11px] font-mono hidden sm:inline">{100 - rpmUsedPct}% Quota</span>
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-hidden flex flex-col relative z-20">
            {activeTab === 'vault' ? (
              <LiferVaultView
                vaultEntries={vaultEntries}
                photos={photos}
                onDeleteSighting={handleDeleteSighting}
                onDeleteSpecies={handleDeleteSpecies}
                onSelectPhoto={(photo) => setSelectedPhoto(photo)}
              />
            ) : (
              <CullingWorkspaceView
                photos={photos}
                onUpdatePhotos={updatePhotos}
                onSelectPhoto={(photo) => setSelectedPhoto(photo)}
                userApiKey={userApiKey}
                filterSharpness={filterSharpness}
                setFilterSharpness={setFilterSharpness}
                sortBy={sortBy}
                setSortBy={setSortBy}
                currentPage={currentPage}
                setCurrentPage={setCurrentPage}
                processedPhotos={processedPhotos}
                isPreviewOpen={selectedPhoto !== null}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg flex items-center justify-around z-40 px-2 pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.3)] min-h-[4rem]">
            <button
              onClick={() => setActiveTab('vault')}
              className={`flex flex-col items-center justify-center w-full h-full py-2 space-y-1 transition touch-manipulation ${activeTab === 'vault' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-300'}`}
            >
              <Icon name="feather" className="w-5 h-5" />
              <span className="text-[10px]">Lifer Vault</span>
            </button>
            <div className="w-px h-8 bg-slate-800"></div>
            <button
              onClick={() => setActiveTab('culling')}
              className={`flex flex-col items-center justify-center w-full h-full py-2 space-y-1 transition touch-manipulation ${activeTab === 'culling' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-300'}`}
            >
              <Icon name="camera" className="w-5 h-5" />
              <span className="text-[10px]">Focus Culling</span>
            </button>
          </nav>

          {selectedPhoto && (() => {
            const selectedIndex = processedPhotos.findIndex(p => p.id === selectedPhoto.id);
            const hasPrev = selectedIndex > 0;
            const hasNext = selectedIndex >= 0 && selectedIndex < processedPhotos.length - 1;

            return (
              <InteractivePhotoViewer
                key={selectedPhoto.id}
                photo={selectedPhoto}
                onClose={() => setSelectedPhoto(null)}
                onUpdatePhoto={(updated) => {
                  updatePhotos(prev => prev.map(p => p.id === updated.id ? updated : p));
                  setSelectedPhoto(updated);
                  saveFingerprintMetadata(updated);
                }}
                onSaveToVault={handleSaveToVault}
                onDeletePhoto={handleDeletePhotoInViewer}
                userApiKey={userApiKey}
                initialLocation={userLocation}
                onUpdateLocation={setUserLocation}
                onNextPhoto={() => hasNext && setSelectedPhoto(processedPhotos[selectedIndex + 1])}
                onPrevPhoto={() => hasPrev && setSelectedPhoto(processedPhotos[selectedIndex - 1])}
                hasNext={hasNext}
                hasPrev={hasPrev}
              />
            );
          })()}

          <TokenUsageMonitorModal
            isOpen={showTokenModal}
            onClose={() => setShowTokenModal(false)}
          />

          <GoogleAuthModal
            isOpen={showAuthModal}
            onClose={() => setShowAuthModal(false)}
            apiKey={userApiKey}
            onSaveKey={handleSaveApiKey}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BirdVaultApp />);
  </script>
</body>
</html>
